# One Node app process, external PostgreSQL or a qualified domain Broker.
services:
  app:
    build: .
    image: ty-hr:local
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      NODE_ENV: production
      PORT: "8787"
      HOST: "0.0.0.0"
      TYHR_DATA_MODE: "${TYHR_DATA_MODE:-postgres}"
      DATABASE_URL: "${DATABASE_URL:-}"
      TYHR_BROKER_CAPABILITIES_URL: "${TYHR_BROKER_CAPABILITIES_URL:-}"
      TYHR_BROKER_QUERY_URL: "${TYHR_BROKER_QUERY_URL:-}"
      TYHR_BROKER_COMMAND_URL: "${TYHR_BROKER_COMMAND_URL:-}"
      TYHR_BROKER_TOKEN: "${TYHR_BROKER_TOKEN:-}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/livez').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
