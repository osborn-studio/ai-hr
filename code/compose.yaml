# One Node app process, external PostgreSQL or a qualified domain Broker.
services:
  app:
    build: .
    image: ty-hr:local
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      NODE_ENV: production
      PORT: "8787"
      HOST: "0.0.0.0"
      TYHR_DATA_MODE: "${TYHR_DATA_MODE:-postgres}"
      DATABASE_URL: "${DATABASE_URL:-}"
      TYHR_BROKER_CAPABILITIES_URL: "${TYHR_BROKER_CAPABILITIES_URL:-}"
      TYHR_BROKER_QUERY_URL: "${TYHR_BROKER_QUERY_URL:-}"
      TYHR_BROKER_COMMAND_URL: "${TYHR_BROKER_COMMAND_URL:-}"
      TYHR_BROKER_TOKEN: "${TYHR_BROKER_TOKEN:-}"
      # In PostgreSQL mode supply persistent 32-byte base64 keys locally.
      # Keep the original keys with encrypted backups; never commit values.
      TYHR_INTEGRATION_VAULT_KEY: "${TYHR_INTEGRATION_VAULT_KEY:-}"
      TYHR_DATA_VAULT_KEY: "${TYHR_DATA_VAULT_KEY:-}"
      # Opt in only after reviewing and enabling the bounded WASM engine.
      TYHR_SSO_ALLOWED_ORIGINS: "${TYHR_SSO_ALLOWED_ORIGINS:-}"
      TYHR_NOTIFICATION_ALLOWED_ORIGINS: "${TYHR_NOTIFICATION_ALLOWED_ORIGINS:-}"
      # Only the explicit empty-demo factory reads this; startup never seeds.
      TYHR_NOTIFICATION_DEMO_ORIGIN: "${TYHR_NOTIFICATION_DEMO_ORIGIN:-}"
      TYHR_ESIGN_ALLOW_LIVE: "${TYHR_ESIGN_ALLOW_LIVE:-0}"
      TYHR_PAYROLL_SCRIPT_SANDBOX: "${TYHR_PAYROLL_SCRIPT_SANDBOX:-}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/livez').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
