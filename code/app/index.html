      const q = new URLSearchParams({ years, rate: v.trim(), reason });
      const w = await call('/api/payroll/sick-tier?' + q.toString(), { method: 'POST' });
      if (w.status !== 200) return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
      toast('ok', `工龄满 ${years} 年档已改为 <b>${(Number(w.body.rate) * 100).toFixed(0)}%</b>`);
      viewPayPolicy();
    };
  });

  document.querySelectorAll('[data-lt]').forEach(b => {
    b.onclick = async () => {
      const ratio = prompt(`「${b.dataset.name}」的带薪比例（0–1，留空 = 按工龄）`, b.dataset.ratio);
      if (ratio === null) return;
      const q = new URLSearchParams({ code: b.dataset.lt, name: b.dataset.name, ratio: ratio.trim() });
      const w = await call('/api/leave/type?' + q.toString(), { method: 'POST' });
      if (w.status !== 200) return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
      toast('ok', `「${esc(b.dataset.name)}」带薪比例已改为 ${ratio.trim() === '' ? '按工龄' : ratio}`);
      viewPayPolicy();
    };
  });

  document.querySelectorAll('[data-ltact]').forEach(b => {
    b.onclick = async () => {
      const w = await call(`/api/leave/type/active?code=${encodeURIComponent(b.dataset.ltact)}`
        + `&active=${b.dataset.active}`, { method: 'POST' });
      if (w.status !== 200) return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
      toast('ok', `已${b.dataset.active === '1' ? '启用' : '停用'}「${esc(b.dataset.ltact)}」`);
      viewPayPolicy();
    };
  });

  const holSave = $('#holSave');
  if (holSave) holSave.onclick = async () => {
    const q = new URLSearchParams({
      date: $('#holDate').value, name: $('#holName').value.trim(), type: $('#holType').value,
    });
    if (!q.get('date')) return toast('bad', '<b>E_ARG</b> 要选日期');
    const w = await call('/api/att/holiday?' + q.toString(), { method: 'POST' });
    if (w.status !== 200) return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
    toast('ok', `已登记 <b>${esc(q.get('date'))}</b> ${esc(q.get('name'))}`);
    viewPayPolicy();
  };

  document.querySelectorAll('[data-hol]').forEach(b => {
    b.onclick = async () => {
      if (!confirm(`删除 ${b.dataset.hol}？删掉之后这天会按普通日/周末算。`)) return;
      const w = await call(`/api/att/holiday/delete?date=${b.dataset.hol}`, { method: 'POST' });
      if (w.status !== 200) return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
      toast('ok', `已删除 ${esc(b.dataset.hol)}`);
      viewPayPolicy();
    };
  });

  const sidInput = $('#sidYear');
  if (sidInput) sidInput.onchange = () => {
    const v = Number(sidInput.value);
    if (v >= 2000 && v <= 2100) { SID_YEAR = v; viewPayPolicy(); }
  };

  const sidBuild = $('#sidBuild');
  if (sidBuild) sidBuild.onclick = async () => {
    const w = await call(`/api/si/declare/build?year=${sidYear}`, { method: 'POST' });
    if (w.status !== 200) {
      return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
    }
    toast(w.body.generated > 0 ? 'ok' : 'bad',
      w.body.generated > 0
        ? `${sidYear} 年度已生成 <b>${w.body.generated}</b> 人的申报基数 —— 逐条核一遍，改过的会标"手工"`
        : `一条都没生成：上年度（${sidYear - 1}）没有已封账的工资条。
           申报基数只按已封账的月平均算，draft 批次的数还会变。`);
    viewPayPolicy();
  };

  document.querySelectorAll('[data-sidset]').forEach(b => {
    b.onclick = async () => {
      const base = prompt(`这个人的申报基数（当前 ${b.dataset.sidbase}）`, b.dataset.sidbase);
      if (base === null) return;
      const why = prompt('为什么改（至少 4 个字）', '');
      if (why === null) return;
      const q = new URLSearchParams({
        employee: b.dataset.sidset, year: sidYear, base: base.trim(), why: why.trim(),
      });
      const w = await call('/api/si/declare/set?' + q.toString(), { method: 'POST' });
      if (w.status !== 200) {
        return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
      }
      toast('ok', `已改为 <b>${fmt(w.body.base_amount)}</b>，标为手工`);
      viewPayPolicy();
    };
  });

  const wtsSave = $('#wtsSave');
  if (wtsSave) wtsSave.onclick = async () => {
    const emp = $('#wtsEmp').value;
    const sys = $('#wtsSys').value;
    const appr = $('#wtsAppr').value;
    const why = $('#wtsWhy').value.trim();
    if (!emp) return toast('bad', '<b>E_ARG</b> 先选一个人');
    const q = new URLSearchParams({ employment: emp, sys, reason: why });
    if (appr) q.set('approved_until', appr);
    const w = await call('/api/work-time/set?' + q.toString(), { method: 'POST' });
    if (w.status !== 200) {
      return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
    }
    toast('ok', `已把工时制度从 <b>${esc(w.body.before)}</b> 改为 <b>${esc(w.body.after)}</b>`
      + (sys === 'standard' ? '（回到逐日算加班）' : `，备案至 ${esc(w.body.approved_until || '')}`));
    viewPayPolicy();
  };

  // 表格里的"改"：把该行的人带进下面的表单，不另开弹窗
  document.querySelectorAll('[data-wts]').forEach(b => {
    b.onclick = () => {
      const sel = $('#wtsEmp');
      if (sel && b.dataset.emp) sel.value = b.dataset.emp;
      $('#wtsSys')?.focus();
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    };
  });

  const hsk = $('#holSk');
  if (hsk) hsk.onclick = async () => {
    const y = holYear + 1;
    const w = await call(`/api/att/holidays/skeleton?year=${y}`, { method: 'POST' });
    if (w.status !== 200) {
      return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
    }
    toast('ok', `${y} 年骨架已生成 <b>${w.body.created}</b> 条（元旦/劳动/国庆）——
      春节、端午、中秋按农历，等公告出来再补，别猜`);
    viewPayPolicy();
  };

  const hcf = $('#holCf');
  if (hcf) hcf.onclick = async () => {
    const w = await call(`/api/att/holidays/confirm?year=${holYear}`, { method: 'POST' });
    if (w.status !== 200) {
      return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
    }
    toast('ok', `${holYear} 年有 <b>${w.body.confirmed}</b> 条标为已确认`);
    viewPayPolicy();
  };

  const holBulk = $('#holBulk');
  if (holBulk) holBulk.onclick = async () => {
    const text = prompt('每行「日期,名称,类型」，例如：\n2027-01-01,元旦,legal\n2027-02-06,春节,legal');
    if (!text) return;
    const res = await fetch('/api/att/holiday/bulk', {
      method: 'POST',
      headers: { 'content-type': 'text/plain',
                 ...(token ? { authorization: `Bearer ${token}`, 'x-aihr-token': token } : {}) },
      body: text,
    });
    const w = await res.json().catch(() => ({}));
    if (res.status !== 200) return toast('bad', `<b>${esc(w.error || res.status)}</b> ${esc(w.message || '')}`);
    toast(w.fail ? 'bad' : 'ok', `导入 ${w.total} 行：成功 <b>${w.ok}</b> 失败 ${w.fail}`);
    viewPayPolicy();
  };

  const ltSave = $('#ltSave');
  if (ltSave) ltSave.onclick = async () => {
    const q = new URLSearchParams({
      code: $('#ltCode').value.trim().toUpperCase(), name: $('#ltName').value.trim(),
      ratio: $('#ltRatio').value.trim(), note: $('#ltNote').value.trim(),
    });
    if (!q.get('code')) return toast('bad', '<b>E_ARG</b> 代码不能为空');
    const w = await call('/api/leave/type?' + q.toString(), { method: 'POST' });
    if (w.status !== 200) return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
    toast('ok', `假种 <b>${esc(q.get('code'))}</b> 已保存`);
    viewPayPolicy();
  };

  const mw = $('#mwSave');
  if (mw) mw.onclick = async () => {
    const q = new URLSearchParams({
      city: $('#mwCity').value.trim(), from: $('#mwFrom').value,
      monthly: $('#mwAmt').value, reason: $('#mwNote').value.trim() || '按当地人社公布更新',
    });
    if (!q.get('from')) return toast('bad', '<b>E_ARG</b> 要填生效日');
    const w = await call('/api/payroll/min-wage?' + q.toString(), { method: 'POST' });
    if (w.status !== 200) return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
    toast('ok', `已更新 ${esc(q.get('city'))} 最低工资 <b>${fmt(w.body.monthly)}</b>`);
    viewPayPolicy();
  };
}

// ============================================================================
// 离职结算：经济补偿金 + 代通知金 + 年假折现
// ----------------------------------------------------------------------------
// 这一页只解决一个问题：**离职那天到底该付多少钱**，以及为什么是这个数。
//
// 三个数各有各的算法，混在一起就是灾难：
//   · 经济补偿金：按本单位年限 × 前 12 个月平均工资，超三倍社平要封顶且年限封 12；
//   · 代通知金：只有第 40 条情形才给，按上月工资（不是 12 个月平均）；
//   · 年假折现：已经在 129 里登记过，这里只取数合计。
//
// 而且补偿金的个税是**单独计税**的（3 倍社平以内免征、超过部分按年表单独算），
// 绝不能并进当月工资 —— 并进去那个月的累计预扣就乱了，而且改不回来。
// ============================================================================
async function viewSeverance() {
  const r = await call('/api/severance');
  if (r.status !== 200) return fail(r);
  const { rows, reasons, people, wages, canWrite } = r.body;

  const fmt = (n) => Number(n ?? 0).toLocaleString('zh-CN',
    { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const lockTip = canWrite ? '' : ' disabled title="需要 HR 主管以上：这是发钱"';
  const open = people.filter(p => !p.settled);
  const stTag = (st) => st === 'confirmed' ? '<span class="tag ok">已确认</span>'
    : st === 'void' ? '<span class="tag">已作废</span>' : '<span class="tag warn">草稿</span>';
  const avg = wages[0] || null;

  $('#view').innerHTML = `
    <div class="card">
      <h2>离职结算 <span class="sub" style="font-weight:400">经济补偿金 · 代通知金 · 年假折现</span></h2>
      <p class="note">
        <b>经济补偿金</b>（劳动合同法第 47 条）：每满一年一个月工资；六个月以上不满一年按一年、
        不满六个月付半个月。月工资 = 解除前 <b>12 个月平均应发</b>（含奖金/津贴/加班费）。
        月工资高于当地上年度职工月平均工资 <b>三倍</b>的，按三倍计，且年限<b>最高 12 年</b>。
        <br><b>代通知金</b>（第 40 条）：只有"无过失性辞退"且未提前 30 日通知才给，一个月工资。
        <b>违法解除</b>（第 87 条）按 <b>2N</b>。
        <br><b>个税</b>：一次性补偿金在当地上年职工平均工资 <b>3 倍以内免征</b>，超过部分
        <b>单独</b>适用综合所得税率表 —— 不并入当月工资，也不并进当年综合所得（财税〔2018〕164 号）。
      </p>
      <div class="tier-grid kpi4" style="margin:10px 0 4px">
        <div class="tier"><div class="k">当地职工月平均工资${avg ? `（${avg.wage_year} 年 · ${esc(avg.city)}）` : ''}</div>
          <div class="v" style="font-size:18px">${avg ? fmt(avg.monthly) : '未录入'}</div></div>
        <div class="tier"><div class="k">三倍封顶 / 免税额</div>
          <div class="v" style="font-size:18px">${avg ? fmt(Number(avg.monthly) * 3) : '—'}</div></div>
        <div class="tier"><div class="k">结算单</div><div class="v">${rows.length}<span>张</span></div></div>
        <div class="tier"><div class="k">待结算的人（含已离职未结算）</div>
          <div class="v">${open.length}<span>人</span></div></div>
      </div>
      ${avg ? '' : '<p class="note" style="color:var(--bad,#b4261d)"><b>还没有社平工资</b>：三倍封顶与免税额都按它算，先去薪酬政策页录入。</p>'}
    </div>

    <div class="card">
      <h2>试算与落单 <span class="sub" style="font-weight:400">先看数，再落单</span></h2>
      <p class="note">
        结算单<b>确认之后不能作废</b>（钱发了只能红冲），所以先试算 ——
        试算会把"年限怎么进位、月工资取了多少、有没有封顶"全部摊开。
      </p>
      <div class="form">
        <label>人员<select id="sevEmp" style="width:300px"${lockTip}>
          ${open.map(p => `<option value="${p.employment_id}">
            ${esc(p.person_name)}${p.employee_no ? '（' + esc(p.employee_no) + '）' : ''}
            · 入职 ${esc(p.hire_date)}${p.leave_date ? ` · 已离职 ${esc(p.leave_date)}` : ''}</option>`).join('')
            || '<option value="">没有待结算的人</option>'}
        </select></label>
        <label>离职日<input id="sevLeave" type="date" value="${esc(TODAY)}" style="width:150px"${lockTip}></label>
        <label>情形<select id="sevReason" style="width:210px"${lockTip}>
          ${reasons.map(x => `<option value="${esc(x.code)}">${esc(x.name)}
            ${Number(x.n_multiple) === 0 ? '（无补偿）' : `（${Number(x.n_multiple)}N）`}</option>`).join('')}
        </select></label>
        <label style="flex-direction:row;align-items:center;gap:5px">
          <input id="sevNotice" type="checkbox"${lockTip}>
          <span>未提前 30 天通知（付代通知金）</span></label>
        <button id="sevQuote"${lockTip}>试算</button>
        <button class="ghost" id="sevGo"${lockTip}>落单</button>
      </div>
      <div id="sevBox" class="sub" style="margin-top:10px">选一个人点「试算」——年限进位与三倍封顶会自动算好。</div>
    </div>

    <div class="card">
      <h2>结算单 <span class="sub" style="font-weight:400">最近 ${rows.length} 张</span></h2>
      <p class="note">
        <b>draft</b> 草稿（可作废）｜<b>confirmed</b> 已确认（不能作废，只能红冲）｜<b>void</b> 已作废。
        补偿金的税是单独算的，所以这张单的合计<b>不进当月工资条</b>。
      </p>
      <!-- ★ 「代通知 / 年假折现 / 税」这三列原来挂着 hide-sm（原本想的是手机上列太多、收掉），
           但这一页存在的理由就是把这三个数分开算给人看 —— 收掉等于把答案收掉。
           而且卡片化之后（stack2）根本没有列太多的问题：每格自己占一行、带标签。
           顺带修一个笔误：三个 th 的 class 属性各写了两次，HTML 只认第一个，
           所以 th 上的 hide-sm 一直是静默失效的；td 上的是对的，手机上这三列真的被藏掉了。
           现在 th 与 td 两边都撤干净。
           ★ 这段注释位于 JS 模板字符串内，禁止出现反引号和美元大括号，否则会把模板截断。 -->
      <table class="stack2"><thead><tr>
        <th style="width:170px">员工</th><th style="width:100px">离职日</th><th style="width:160px">情形</th>
        <th class="num" style="width:70px">年限</th><th class="num" style="width:64px">N</th>
        <th class="num" style="width:100px">月工资</th><th class="num" style="width:110px">补偿金</th>
        <th class="num" style="width:96px">代通知</th>
        <th class="num" style="width:96px">年假折现</th>
        <th class="num" style="width:96px">税</th>
        <th class="num" style="width:110px">税后合计</th>
        <th style="width:80px">状态</th><th style="width:90px"></th>
      </tr></thead><tbody>
        ${rows.map(x => `<tr>
          <td><b>${esc(x.person_name)}</b>
            <div class="sub">${esc(x.employee_no || '无工号')}${x.cap_applied
              ? ' · <span class="tag warn">已封顶</span>' : ''}${Number(x.pre2008_months) > 0
              ? ' · <span class="tag">分段</span>' : ''}</div></td>
          <td class="sub" data-label="离职日">${esc(x.leave_date)}</td>
          <td data-label="情形">${esc(x.reason_name)}</td>
          <td class="num sub" data-label="年限">${Math.floor(Number(x.service_months) / 12)}年${Number(x.service_months) % 12}月</td>
          <td class="num" data-label="N"><b>${Number(x.n_months)}</b></td>
          <td class="num sub" data-label="月工资">${fmt(x.base_wage)}</td>
          <td class="num" data-label="补偿金"><b>${fmt(x.severance_amount)}</b></td>
          <td class="num sub" data-label="代通知">${fmt(x.notice_amount)}</td>
          <td class="num sub" data-label="年假折现">${fmt(x.annual_leave_amount)}</td>
          <td class="num sub" data-label="税">${fmt(x.tax_amount)}</td>
          <td class="num" data-label="税后合计"><b>${fmt(x.net_amount)}</b></td>
          <td data-label="状态">${stTag(x.status)}</td>
          <td data-label="">${x.status === 'draft' ? `
            <button class="ghost" data-sevok="${x.id}"${lockTip}>确认</button>
            <button class="ghost" data-sevvoid="${x.id}"${lockTip}>作废</button>` : ''}</td>
        </tr>`).join('') || '<tr><td colspan="13" class="sub">还没有结算单。离职时先在这里试算，再落单。</td></tr>'}
      </tbody></table>
    </div>`;

  const doQuote = async () => {
    const emp = $('#sevEmp').value;
    if (!emp) return toast('bad', '<b>E_ARG</b> 先选一个人');
    const q = new URLSearchParams({
      employment: emp, leave: $('#sevLeave').value, reason: $('#sevReason').value,
      notice: $('#sevNotice').checked ? '1' : '0',
    });
    const w = await call('/api/severance/quote?' + q.toString());
    const box = $('#sevBox');
    if (w.status !== 200) {
      box.innerHTML = `<b style="color:var(--bad,#b4261d)">${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`;
      return;
    }
    const b = w.body;
    const yrs = Math.floor(b.service_months / 12), ms = b.service_months % 12;
    box.innerHTML = `<div class="tier-grid kpi5">
      <div class="tier"><div class="k">本单位年限</div>
        <div class="v" style="font-size:17px">${yrs}年${ms}月</div>
        <div class="k">${b.service_days_rest > 0 ? `另 ${b.service_days_rest} 天` : ''}</div></div>
      <div class="tier"><div class="k">补偿月数 N</div>
        <div class="v">${b.n_months}</div>
        <div class="k">年限进位前 ${b.raw_n}</div></div>
      <div class="tier"><div class="k">计算用月工资</div>
        <div class="v" style="font-size:17px">${fmt(b.base_wage)}</div>
        <div class="k">前 12 月均 ${fmt(b.avg_wage)}</div></div>
      <div class="tier"><div class="k">经济补偿金</div>
        <div class="v" style="font-size:17px">${fmt(b.severance)}</div>
        <div class="k">${b.cap_applied ? `已按三倍 ${fmt(b.local_avg * b.cap_multiple)} 封顶` : '未触封顶'}</div></div>
      <div class="tier" style="border-color:#bfe3c8"><div class="k">税后合计</div>
        <div class="v" style="font-size:17px">${fmt(b.net)}</div>
        <div class="k">税前 ${fmt(b.total)}</div></div>
    </div>
    ${b.split ? `<div style="margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)">
      <b>这一段要分两段算</b>（2008-01-01 前后）：前段按老办法、后段按新法。
      <table style="margin-top:6px"><thead><tr>
        <th style="width:150px">期间</th><th class="num" style="width:110px">月数</th>
        <th class="num" style="width:90px">N</th><th class="num" style="width:110px">月工资</th>
        <th class="num" style="width:120px">补偿金</th><th>说明</th>
      </tr></thead><tbody>
        <tr><td>2008-01-01 前</td>
          <td class="num">${b.pre2008_months}</td>
          <td class="num"><b>${b.n_old}</b></td>
          <td class="num">${fmt(b.old_wage)}</td>
          <td class="num"><b>${fmt(b.severance_old)}</b></td>
          <td class="sub">老办法：不封顶（那时没有三倍社平）</td></tr>
        <tr><td>2008-01-01 起</td>
          <td class="num">${b.post2008_months}</td>
          <td class="num"><b>${b.n_new}</b></td>
          <td class="num">${fmt(b.base_wage)}</td>
          <td class="num"><b>${fmt(b.severance_new)}</b></td>
          <td class="sub">新法第 47 条：封顶时年限最多 12 年</td></tr>
      </tbody></table>
      <div class="sub" style="margin-top:4px">
        两段相加才是应付金额。全按新法算会把前段也封在 12 年 —— 高薪老员工因此少拿一大截。
      </div>
    </div>` : ''}
    <div style="margin-top:8px">
      代通知金 <b>${fmt(b.notice)}</b> ｜ 年假折现 <b>${fmt(b.annual_leave)}</b> ｜
      免税额 <b>${fmt(b.exempt)}</b>（三倍社平）｜ 应税 <b>${fmt(b.taxable)}</b> ｜
      补偿金个税 <b>${fmt(b.tax)}</b>${b.cap_years_applied ? ' ｜ <span class="tag warn">年限已按 12 年封顶</span>' : ''}
    </div>`;
  };
  const qb = $('#sevQuote'); if (qb) qb.onclick = doQuote;

  const gb = $('#sevGo');
  if (gb) gb.onclick = async () => {
    const emp = $('#sevEmp').value;
    if (!emp) return toast('bad', '<b>E_ARG</b> 先选一个人');
    const note = prompt('这张结算单的说明（至少 4 个字，会留在单子上）', '');
    if (note === null) return;
    const q = new URLSearchParams({
      employment: emp, leave: $('#sevLeave').value, reason: $('#sevReason').value,
      note: note.trim(), notice: $('#sevNotice').checked ? '1' : '0',
    });
    const w = await call('/api/severance?' + q.toString(), { method: 'POST' });
    if (w.status !== 200) {
      return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
    }
    toast('ok', `已落单：补偿金 <b>${fmt(w.body.severance)}</b> + 代通知 <b>${fmt(w.body.notice)}</b>
      + 年假折现 <b>${fmt(w.body.annual_leave)}</b>，税后 <b>${fmt(w.body.net)}</b>`);
    viewSeverance();
  };

  document.querySelectorAll('[data-sevok]').forEach(b => {
    b.onclick = async () => {
      const w = await call(`/api/severance/confirm?id=${b.dataset.sevok}`, { method: 'POST' });
      if (w.status !== 200) {
        return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
      }
      toast('ok', '已确认。确认后不能作废 —— 钱发了只能红冲');
      viewSeverance();
    };
  });

  document.querySelectorAll('[data-sevvoid]').forEach(b => {
    b.onclick = async () => {
      const why = prompt('作废原因（至少 4 个字）', '');
      if (why === null) return;
      const q = new URLSearchParams({ id: b.dataset.sevvoid, why: why.trim() });
      const w = await call('/api/severance/void?' + q.toString(), { method: 'POST' });
      if (w.status !== 200) {
        return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
      }
      toast('ok', '已作废');
      viewSeverance();
    };
  });
}

// ============================================================================
// 假期额度：谁还有多少假
// ----------------------------------------------------------------------------
// 店长最常问的一句是"我这人还能不能批三天"。答案不在考勤表里，也不在工资条里，
// 而在三张表的差：leave_grant（授予）− leave_usage（已用/冻结）− leave_cashout（已折现）。
//
// 这一页只做一件事：把一个假种下**花名册里所有人**的额度摆平。
// 不做"全部假种一张大表"—— 5 个假种 × 31 人 = 155 行，滚起来找不到人。
// 所以按假种切，一次只看一种。
// ============================================================================
async function viewLeave() {
  const t = await call('/api/leave/types-board');
  if (t.status !== 200) return fail(t);
  const types = t.body || [];
  if (!types.length) {
    $('#view').innerHTML = `<div class="card"><h2>假期额度</h2>
      <div class="empty">还没有启用任何假种。</div></div>`;
    return;
  }

  // 默认看年假（有余额概念、也最常被问），没有年假就取第一个
  const cur = LEAVE_TYPE || (types.find(x => x.code === 'ANNUAL') || types[0]).id;
  const r = await call(`/api/leave/board?type=${cur}`);
  if (r.status !== 200) return fail(r);
  const { rows, sum, headcount } = r.body;
  const ty = types.find(x => Number(x.id) === Number(cur)) || types[0];

  const num = (n) => {
    const v = Number(n || 0);
    return Number.isInteger(v) ? String(v) : v.toFixed(1);
  };
  const fmt = (n) => Number(n || 0).toLocaleString('zh-CN',
    { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  // 可用为负 = 已经透支（休的比授予的多），必须红出来
  const tone = (n) => Number(n) < 0 ? 'color:var(--bad,#b4261d)' : '';

  $('#view').innerHTML = `
    <div class="card">
      <h2>假期额度 <span class="sub" style="font-weight:400">${esc(ty.name)} · 在册 ${headcount} 人</span></h2>
      <p class="note">
        可用 = <b>授予</b> − 已用 − 冻结 − 已折现 − 过期作废。四个减项分开列，是因为
        "少了 3 天"有四种完全不同的原因，合成一个"已扣减"就再也查不清是哪一种。
        <br>冻结 = 单子提交了还没批；已折现 = 年底折成钱的那部分（不再算"能休"）。
      </p>
      <div class="seg" style="margin:0 0 10px">
        ${types.map(x => `<button data-lt="${Number(x.id)}"
          title="该假种本年已批准天数"
          class="${Number(x.id) === Number(cur) ? 'on' : ''}">${esc(x.name)}
          <span class="sub">${num(x.used_this_year)}</span></button>`).join('')}
      </div>
      <p class="sub" style="margin:-4px 0 10px">
        按钮上的小数字 = 该假种<b>本年已批准</b>的天数（换假种时不用重新加一遍）。
      </p>
      <div class="tier-grid kpi4" style="margin:0 0 10px">
        <div class="tier"><div class="k">授予合计</div>
          <div class="v">${num(sum.granted)}<span>天</span></div>
          <div class="k">${types.find(x => Number(x.id) === Number(cur))?.is_system ? '官方假种' : '公司自定义'}</div></div>
        <div class="tier"><div class="k">已用合计</div>
          <div class="v">${num(sum.used)}<span>天</span></div>
          <div class="k">已批准并扣减</div></div>
        <div class="tier"><div class="k">冻结合计</div>
          <div class="v">${num(sum.frozen)}<span>天</span></div>
          <div class="k">提交未审的部分</div></div>
        <div class="tier"><div class="k">可用合计</div>
          <div class="v" style="${tone(sum.available)}">${num(sum.available)}<span>天</span></div>
          <div class="k">${Number(sum.cashed) > 0 ? `已折现 ${num(sum.cashed)} 天` : '还没折现过'}</div></div>
      </div>
      <table class="stack2"><thead><tr>
        <th style="width:190px">员工</th><th style="width:160px">部门</th>
        <th class="num" style="width:80px">授予</th><th class="num" style="width:80px">已用</th>
        <th class="num" style="width:80px">冻结</th><th class="num" style="width:90px">已折现</th>
        <th class="num" style="width:90px">可用</th><th style="width:130px">用量</th>
      </tr></thead><tbody>
        ${rows.map(x => {
          const g = Number(x.granted) || 0;
          const used = Number(x.used) + Number(x.frozen);
          const pct = g > 0 ? Math.min(100, Math.round(used / g * 100)) : 0;
          return `<tr>
            <td><b>${esc(x.full_name)}</b><div class="sub">#${x.employee_id}</div></td>
            <td class="sub" data-label="部门">${esc(x.org_name || '—')}</td>
            <td class="num" data-label="授予">${num(x.granted)}</td>
            <td class="num" data-label="已用">${num(x.used)}</td>
            <td class="num" data-label="冻结">${num(x.frozen)}</td>
            <td class="num sub" data-label="已折现">${num(x.cashed)}</td>
            <td class="num" data-label="可用"><b style="${tone(x.available)}">${num(x.available)}</b></td>
            <td data-label="用量">
              <div style="height:6px;background:#eef1f6;border-radius:99px;overflow:hidden">
                <div style="height:100%;width:${pct}%;background:${pct >= 100 ? '#e0857c' : '#7aa2f7'}"></div>
              </div>
              <div class="sub">${pct}%</div>
            </td>
          </tr>`;
        }).join('') || '<tr><td colspan="8" class="sub">花名册里没有在职人员。</td></tr>'}
      </tbody></table>
      <p class="sub" style="margin-top:8px">
        假种的增删改在 <b>薪酬政策 → 假种</b>（病假档位与假种放在一起，因为它们决定扣多少钱）。
        这一页只管"还剩几天"。
      </p>
    </div>`;

  document.querySelectorAll('[data-lt]').forEach(b => {
    b.onclick = () => { LEAVE_TYPE = Number(b.dataset.lt); viewLeave(); };
  });

  // ---- 假种规则（152）：按月发放 / 单次最大时长 / 请假证明门槛 ----
  // 照功能比对 Excel 的三条高级版专有项。这三条都挂在假种上（不是全局），
  // 因为"病假要证明"与"年假不用证明"必须能分开配。
  {
    const lr = await call('/api/leave/rules');
    if (lr.status === 200) {
      const T = lr.body.types || [];
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <h2>假种规则 <span class="sub" style="font-weight:400">
          发放方式 / 单次最大时长 / 请假证明门槛</span></h2>
        <p class="note">
          <b>按月平均发放</b>：年假按 12 个月摊开，每月一条额度。取整只取"每月那份"，
          <b>尾差补到 12 月</b> —— 12 个月加起来必须等于总额，否则 HR 一对账就发现。
          <br><b>证明门槛</b>按假种配：病假超过 4 小时要交病假条，年假不用 —— 合成一个全局开关就做不到。
        </p>
        <table class="stack"><thead><tr>
          <th style="width:150px">假种</th>
          <th style="width:112px">发放方式</th>
          <th class="num" style="width:88px">取整步长</th>
          <th style="width:96px">取整方向</th>
          <th class="num" style="width:120px">单次最大(时)</th>
          <th class="num" style="width:130px">证明门槛(时)</th>
          <th style="width:60px"></th>
        </tr></thead><tbody>
          ${T.map(t => `<tr data-ltr="${t.id}">
            <td><b>${esc(t.name)}</b><div class="sub"><code>${esc(t.code)}</code></div></td>
            <td data-label="发放方式">
              <select data-f="grant_mode" style="width:100%">
                <option value="once" ${t.grant_mode !== 'monthly' ? 'selected' : ''}>一次性</option>
                <option value="monthly" ${t.grant_mode === 'monthly' ? 'selected' : ''}>按月平均</option>
              </select></td>
            <td class="num" data-label="取整步长">
              <input data-f="round_step" value="${t.round_step ?? 0.5}" style="width:64px;text-align:right"></td>
            <td data-label="取整方向">
              <select data-f="round_dir" style="width:100%">
                <option value="half" ${t.round_dir === 'half' ? 'selected' : ''}>四舍五入</option>
                <option value="down" ${t.round_dir === 'down' ? 'selected' : ''}>向下</option>
                <option value="up" ${t.round_dir === 'up' ? 'selected' : ''}>向上</option>
              </select></td>
            <td class="num" data-label="单次最大(时)">
              <input data-f="max_hours" value="${t.max_hours_per_request ?? ''}"
                placeholder="不限" style="width:82px;text-align:right"></td>
            <td class="num" data-label="证明门槛(时)">
              <input data-f="proof_after" value="${t.proof_after_hours ?? ''}"
                placeholder="不需要" style="width:88px;text-align:right"></td>
            <td data-label=""><button class="ghost" data-ltr-save="${t.id}" ${lr.body.canWrite ? '' : 'disabled'}>存</button></td>
          </tr>`).join('') || '<tr><td colspan="7" class="sub">还没有假种</td></tr>'}
        </tbody></table>
        <p class="sub" style="margin-top:8px">
          改完立刻生效；已经发出去的额度不会变（历史不动）。
          「按月平均」要重新发放才看得到效果 —— 单独的年假发放入口在「年假与折现」页。
        </p>`;
      document.querySelector('#view').appendChild(card);

      document.querySelectorAll('[data-ltr-save]').forEach(btn => {
        btn.onclick = async () => {
          const tr = btn.closest('tr');
          const id = btn.dataset.ltrSave;
          const val = (f) => (tr.querySelector(`[data-f="${f}"]`) || {}).value;
          const q = new URLSearchParams({
            type: id,
            grant_mode: val('grant_mode'),
            round_step: val('round_step'),
            round_dir: val('round_dir'),
            max_hours: String(val('max_hours') ?? '').trim(),
            proof_after: String(val('proof_after') ?? '').trim(),
            reason: '假种规则调整',
          });
          const w = await call('/api/leave/rules/set?' + q.toString(), { method: 'POST' });
          if (w.status !== 200) {
            return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
          }
          toast('ok', '已保存');
        };
      });
    }
  }
}

// ============================================================================
// 请假单：有哪些单子挂着，以及谁该批
// ----------------------------------------------------------------------------
// 待审的单子**不受时间窗限制**：挂了一个月没人批的那张，正是最该被看见的。
// 审批走库里同一条路（fn_leave_decide_by），自审会被拒 —— 所以这里不做前端判断。
// ============================================================================
async function viewLeaveReq() {
  const r = await call('/api/leave/requests?days=90');
  if (r.status !== 200) return fail(r);
  const { rows, pending, canWrite } = r.body;

  const approved = rows.filter(x => x.status === 'approved');
  const rejected = rows.filter(x => x.status === 'rejected');
  const days = (arr) => arr.reduce((a, x) => a + Number(x.qty), 0);
  const who = new Set(rows.map(x => x.employee_id)).size;
  const lockTip = canWrite ? '' : ' disabled title="需要请假审批权限"';

  const stTag = (st) => st === 'approved' ? '<span class="tag ok">已批准</span>'
    : st === 'rejected' ? '<span class="tag bad">已驳回</span>'
    : st === 'cancelled' ? '<span class="tag">已撤销</span>'
    : '<span class="tag warn">待审批</span>';

  const eligCard = `<div class="card">
    <h2>先查资格 <span class="sub" style="font-weight:400">额度够 ≠ 有资格</span></h2>
    <p class="note">
      年假有两条硬门槛：<b>连续工作满 12 个月</b>（法定第三条）、
      <b>入职当年按剩余日历天数折算</b>（实施办法第五条，不足 1 整天不享受）。
      病假则要能说出<b>医疗期</b>（3–24 个月，按总工龄与本单位工龄分档）——
      医疗期内不得依第四十条解除，超过医疗期才是"可以解除"的条件。
      <br><span class="sub">资格与额度要分开看：两者都不通过时长得一样，但处置完全不同 ——
      一个是"再等等"，一个是"去加额度"。</span>
    </p>
    <div class="form">
      <label>员工 id<input id="lgEmp" placeholder="person_id" style="width:110px"></label>
      <label>假种<select id="lgType" style="width:150px">
        <option value="ANNUAL">年假</option>
        <option value="SICK">病假</option>
        <option value="MARRIAGE">婚假</option>
        <option value="MATERNITY">产假</option>
        <option value="PATERNITY">陪产假</option>
        <option value="BEREAVEMENT">丧假</option>
      </select></label>
      <label>起<input id="lgFrom" type="date" style="width:150px"></label>
      <label>止<input id="lgTo" type="date" style="width:150px"></label>
      <button id="lgGo">查资格</button>
    </div>
    <div id="lgMsg" class="kv"></div>
  </div>`;

  $('#view').innerHTML = eligCard + `
    <div class="card">
      <h2>请假单 <span class="sub" style="font-weight:400">待审 ${pending} 张 · 近 90 天 ${rows.length} 张</span></h2>
      <p class="note">
        <b>待审批的单子不受 90 天窗口限制</b> —— 挂了一个月没人处理的，正是最该被看见的那些。
        <br>批准后额度从「冻结」转「已用」，同时进考勤月报的请假天数；驳回则释放冻结。
        审批走库里同一条函数，<b>自审会被直接拒绝</b>（不是前端藏按钮）。
      </p>
      <div class="tier-grid kpi4" style="margin:0 0 10px">
        <div class="tier${pending > 0 ? ' hot' : ''}"><div class="k">待审批</div>
          <div class="v" style="${pending > 0 ? 'color:var(--bad,#b4261d)' : ''}">${pending}<span>张</span></div>
          <div class="k">越早批，额度越早解冻</div></div>
        <div class="tier"><div class="k">已批准</div>
          <div class="v">${approved.length}<span>张</span></div>
          <div class="k">合计 ${days(approved)} 天</div></div>
        <div class="tier"><div class="k">已驳回</div>
          <div class="v">${rejected.length}<span>张</span></div>
          <div class="k">额度已释放</div></div>
        <div class="tier"><div class="k">涉及人数</div>
          <div class="v">${who}<span>人</span></div>
          <div class="k">近 90 天有请假记录</div></div>
      </div>
      <table class="stack2"><thead><tr>
        <th style="width:180px">员工</th><th style="width:150px">假种</th>
        <th class="num" style="width:80px">天数</th><th style="width:200px">起止</th>
        <th style="width:110px">状态</th><th style="width:170px">审批时间</th>
        <th style="width:150px"></th><th></th>
      </tr></thead><tbody>
        ${rows.map(x => `<tr>
          <td><b>${esc(x.full_name)}</b><div class="sub">${esc(x.org_name || '—')}</div></td>
          <td data-label="假种">${esc(x.type_name)}</td>
          <td class="num" data-label="天数"><b>${Number(x.qty)}</b></td>
          <td class="sub" data-label="起止">${esc(String(x.date_from).slice(0, 10))} ~ ${esc(String(x.date_to).slice(0, 10))}</td>
          <td data-label="状态">${stTag(x.status)}${x.status === 'pending' && Number(x.days_since_start) > 0
            ? `<div class="sub">已过 ${x.days_since_start} 天</div>` : ''}</td>
          <td class="sub" data-label="审批时间">${x.decided_at
            ? esc(String(x.decided_at).replace('T', ' ').slice(0, 16)) : '—'}</td>
          <td style="white-space:nowrap">${x.status === 'pending' ? `
            <button data-lr="${x.id}" data-ok="1"${lockTip}>批准</button>
            <button class="ghost" data-lr="${x.id}" data-ok="0"${lockTip}>驳回</button>` : ''}</td>
          <td></td>
        </tr>`).join('') || `<tr><td colspan="7" class="sub">
          近 90 天没有请假单。单子由员工端提交，这里只负责批。</td></tr>`}
      </tbody></table>
    </div>`;

  const lg = $('#lgGo');
  if (lg) {
    const iso = (d) => d.toISOString().slice(0, 10);
    if ($('#lgFrom')) { $('#lgFrom').value = iso(new Date()); $('#lgTo').value = iso(new Date()); }
    lg.onclick = async () => {
      const q = new URLSearchParams({
        employee: $('#lgEmp').value.trim(), type: $('#lgType').value,
        from: $('#lgFrom').value, to: $('#lgTo').value,
      });
      const res = await call('/api/leave/eligibility?' + q);
      if (res.status !== 200) {
        return toast('bad', `<b>${esc(res.body.error || res.status)}</b> ${esc(res.body.message || '')}`);
      }
      const E = res.body;
      const tag = E.ok ? '<span class="tag ok">有资格</span>' : '<span class="tag bad">没资格</span>';
      $('#lgMsg').innerHTML = `${tag}
        <span>今年应享年假 <b>${E.entitled_days}</b> 天</span>
        <span>累计工龄 <b>${E.service_years}</b> 年</span>
        <span>${E.qualified ? '已满 12 个月' : '<b style="color:var(--bad)">未满 12 个月</b>'}</span>
        <span>医疗期 <b>${E.medical_months}</b> 个月</span>
        ${(E.blocks || []).map((b) => `<div class="sub" style="color:var(--bad,#b4261d)">
          <b>${esc(b.code)}</b> ${esc(b.message)}</div>`).join('')}
        ${(E.warns || []).map((w) => `<div class="sub" style="color:var(--warn,#a15c00)">
          ${esc(w.message)}</div>`).join('')}`;
    };
  }

  document.querySelectorAll('[data-lr]').forEach(b => {
    b.onclick = async () => {
      const ok = b.dataset.ok === '1';
      if (!ok && !confirm('确认驳回这张请假单？驳回后冻结的额度会释放。')) return;
      const w = await call(`/api/leave/decide?id=${b.dataset.lr}&approve=${ok ? 1 : 0}`,
        { method: 'POST' });
      if (w.status !== 200) {
        return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
      }
      toast('ok', ok ? '已批准，额度从冻结转已用' : '已驳回，额度已释放');
      viewLeaveReq();
    };
  });
}

// ============================================================================
// 年假折现：先试算，再登记
// ----------------------------------------------------------------------------
// 这一页要回答三个问题，缺一个 HR 就用不下去：
//   ① 现在是什么口径（默认 off = 不折）—— 否则不知道自己该不该点"登记"；
//   ② 他到底能折几天、折多少钱 —— 天数按工龄折算还要向下取整，没人愿意手算；
//   ③ 折完之后余额还剩多少 —— 折了却不减余额，下个月会再折一次。
//
// 页面刻意把「试算」和「登记」分成两个按钮：折现是发钱，登记即留痕。
// 只能登记着看金额的界面，会在台账上留下一串作废单，然后审计来问为什么作废。
// ============================================================================
const CASH_MODE_CN = {
  off: { name: '不折现', day: '未休年假一律不折，也不发钱（默认 = 上线前的行为）' },
  extra_200: { name: '额外补 200%', day: '法定口径：300% 里含已照发的正常工资，所以在职折现只再补 2 倍' },
  total_300: { name: '一次性 300%', day: '不再另发那几天工资（离职已结清的情形）。在职用它会多付一倍' },
};

async function viewCashout() {
  const r = await call('/api/leave/cashout');
  if (r.status !== 200) return fail(r);
  const { policy, tiers, rows, candidates, canWrite, year, carry, carryDeadline } = r.body;

  const fmt = (n) => Number(n ?? 0).toLocaleString('zh-CN',
    { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const mode = CASH_MODE_CN[policy] || CASH_MODE_CN.off;
  const lockTip = canWrite ? '' : ' disabled title="需要 HR 主管以上：折现是发钱"';

  const alive = rows.filter(x => x.status !== 'void');
  const sumDays = alive.reduce((a, x) => a + Number(x.days), 0);
  const sumAmt = alive.reduce((a, x) => a + Number(x.amount), 0);
  const pendAmt = rows.filter(x => x.status === 'pending').reduce((a, x) => a + Number(x.amount), 0);
  const candDays = candidates.reduce((a, x) => a + Number(x.unused), 0);

  $('#view').innerHTML = `
    <div class="card">
      <h2>未休年假折现 <span class="sub" style="font-weight:400">${year} 年 · 法定 300% 含已发工资</span></h2>
      <p class="note">
        法定：应休未休的年假按日工资收入的 <b>300%</b> 支付，而这 300% <b>已经包含正常工作的工资</b>。
        所以员工还在职、工资照发时，折现<b>只能再补 200%</b>；按 300% 再发一遍就是付了 400%。
        <br>天数按「累计工龄」取档（含入司前年限），折算后<b>不足 1 整天不支付</b> —— 所以是向下取整，不是四舍五入。
      </p>
      <div class="tier-grid kpi4">
        <div class="tier"><div class="k">当前口径</div>
          <div class="v" style="font-size:18px">${esc(mode.name)}</div></div>
        <div class="tier"><div class="k">还有可折年假的人（合计 ${candDays} 天）</div>
          <div class="v">${candidates.length}<span>人</span></div></div>
        <div class="tier"><div class="k">本年已登记（${alive.length} 张有效单）</div>
          <div class="v">${sumDays}<span>天</span></div></div>
        <div class="tier"${pendAmt > 0 ? ' style="border-color:#f3c6c6"' : ''}>
          <div class="k">待发（还没进工资条，算薪时落账）</div>
          <div class="v"${pendAmt > 0 ? ' style="color:var(--bad,#b4261d)"' : ''}>¥${fmt(pendAmt)}</div></div>
      </div>
      <p class="sub" style="margin:0 0 8px">${esc(mode.day)}</p>
      <div class="form">
        <label style="min-width:0">口径
          <span style="display:inline-flex;gap:6px">
            ${Object.entries(CASH_MODE_CN).map(([k, v]) => `<button class="${k === policy ? '' : 'ghost'}"
              data-mode="${k}"${lockTip}>${esc(v.name)}</button>`).join('')}
          </span>
        </label>
        <span class="sub" style="align-self:center">
          ${canWrite ? '改口径要有原因，并记生效日 —— 上个月的工资条不会跟着变'
                     : '你是只读：能看台账与试算，改口径需要 HR 主管以上'}
        </span>
      </div>

      <div class="form" style="margin:10px 0 0; padding-top:10px; border-top:1px dashed var(--line)">
        <label style="min-width:0">往年结转
          <span style="display:inline-flex;gap:6px">
            <button class="${carry === 'void' ? '' : 'ghost'}" data-carry="void"${lockTip}>不结转（法定）</button>
            <button class="${carry === 'carry_1y' ? '' : 'ghost'}" data-carry="carry_1y"${lockTip}>结转一年</button>
          </span>
        </label>
        <label>最晚休到<input id="carryDl" value="${esc(carryDeadline || '03-31')}" style="width:76px"${lockTip}></label>
        <span class="sub" style="align-self:center">
          ${carry === 'void'
            ? '法定是「一般不跨年度安排」：往年剩下的额度<b>不折现</b>，只算当年'
            : `往年额度可参与折现，但必须在次年 <b>${esc(carryDeadline)}</b> 前休完，过期不再算`}
        </span>
      </div>
    </div>

    <div class="card">
      <h2>年假天数档位 <span class="sub" style="font-weight:400">法定 5 / 10 / 15 天 · 只能多给</span></h2>
      <p class="note">
        按<b>累计工作年限</b>取档（入司前年限要录在人员档案上，系统看不到别家公司）。
        法定下限<b>不进界面</b>：满 20 年只给 3 天，保存时会被直接拒。
      </p>
      <div class="tier-grid kpi3">
        ${tiers.map(t => `<div class="tier">
          <div class="k">累计工龄满 ${Number(t.years_from)} 年</div>
          <div class="v">${Number(t.days)}<span>天</span></div>
          <div class="k" style="margin-top:2px">${esc(t.note || '')}</div>
          <button class="ghost" style="margin-top:6px" data-tieryears="${Number(t.years_from)}"
            data-tierdays="${Number(t.days)}"${lockTip}>改</button>
        </div>`).join('')}
      </div>
    </div>

    <div class="card">
      <h2>试算与登记 <span class="sub" style="font-weight:400">先看要付多少，再决定登不登</span></h2>
      <p class="note">
        基数 = 前 12 个月应发剔除加班费后的月平均（不足 12 个月按实际月数），日薪 = 基数 ÷ 21.75。
        <b>试算不落账</b>；登记之后才会在这个月的工资条上多出一行「未休年假折现」。
      </p>
      <div class="form">
        <label>员工<select id="coEmp" style="width:340px"${lockTip}>
          ${candidates.map(c => `<option value="${c.person_id}">
            ${esc(c.person_name)}${c.employee_no ? '（' + esc(c.employee_no) + '）' : ''}
            · 工龄 ${Number(c.years)} 年 · 可折 ${Number(c.unused)} 天</option>`).join('')
            || '<option value="">没有可折年假的人</option>'}
        </select></label>
        <label>截至日<input id="coOn" type="date" value="${esc(TODAY)}" style="width:150px"${lockTip}></label>
        <label>落到哪个月<input id="coPeriod" type="month" value="${esc(String(TODAY).slice(0, 7))}"
          style="width:150px"${lockTip}></label>
        <button id="coQuote"${lockTip}>试算</button>
        <button class="ghost" id="coGo"${lockTip}>登记折现</button>
      </div>
      <div id="coBox" class="sub" style="margin-top:10px">选一个人点「试算」——天数是按工龄折算的，不是把额度直接全折。</div>
    </div>

    <div class="card">
      <h2>折现台账 <span class="sub" style="font-weight:400">${rows.length} 张 · 已登记 ¥${fmt(sumAmt)}</span></h2>
      <p class="note">
        <b>pending</b> 已登记待发（算薪时才落账）｜<b>paid</b> 已经进工资条｜<b>void</b> 作废（额度自动加回）。
        进了工资条的单不能作废 —— 钱发了只能红冲，否则账上会凭空少一笔。
      </p>
      <table class="stack"><thead><tr>
        <th style="width:150px">员工</th><th class="num" style="width:62px">天数</th>
        <th class="num" style="width:88px">日薪</th><th class="num" style="width:56px">费率</th>
        <th class="num" style="width:100px">金额</th><th style="width:78px" class="hide-sm">落到月</th>
        <th style="width:84px">状态</th><th>原因</th><th style="width:52px"></th>
      </tr></thead><tbody>
        ${rows.map(x => `<tr>
          <td><b>${esc(x.person_name)}</b>
            <div class="sub">${esc(x.employee_no || '无工号')} · ${x.leave_year}</div></td>
          <td class="num" data-label="天数"><b>${Number(x.days)}</b></td>
          <td class="num sub" data-label="日薪">${fmt(x.daily_wage)}</td>
          <td class="num sub" data-label="费率">×${Number(x.rate)}</td>
          <td class="num" data-label="金额"><b>${fmt(x.amount)}</b></td>
          <td class="sub hide-sm" data-label="落到月">${esc(x.settle_period)}</td>
          <td data-label="状态">${x.status === 'paid' ? '<span class="tag ok">已进工资条</span>'
            : x.status === 'void' ? '<span class="tag">已作废</span>'
            : '<span class="tag warn">待发</span>'}</td>
          <td class="sub" data-label="原因">${esc(x.reason)}</td>
          <td data-label="">${x.status === 'pending'
            ? `<button class="ghost" data-void="${x.id}"${lockTip}>作废</button>` : ''}</td>
        </tr>`).join('') || `<tr><td colspan="9" class="sub">
          这一年还没有折现单。当前口径是「${esc(mode.name)}」${
            policy === 'off' ? ' —— 要折现先把口径改掉，否则登记会被拒（E_ALC_OFF）' : ''}。</td></tr>`}
      </tbody></table>
    </div>

    <div class="card">
      <h2>谁还有可折的年假 <span class="sub" style="font-weight:400">合计 ${candDays} 天</span></h2>
      <p class="note">
        这里是<b>按工龄折算后</b>还剩的天数，不是台账余额 —— 两者常常不一样：
        台账余额可能含往年结转，而折算只算当年度、且不足 1 天不付。
      </p>
      <table class="stack"><thead><tr>
        <th style="width:200px">员工</th><th class="num" style="width:96px">累计工龄</th>
        <th class="num" style="width:96px">全年应享</th><th class="num" style="width:96px">可折天数</th>
        <th>说明</th><th style="width:110px"></th>
      </tr></thead><tbody>
        ${candidates.map(c => `<tr>
          <td><b>${esc(c.person_name)}</b>
            <div class="sub">${esc(c.employee_no || '无工号')}</div></td>
          <td class="num sub" data-label="累计工龄">${Number(c.years)} 年</td>
          <td class="num sub" data-label="全年应享">${Number(c.entitled)} 天</td>
          <td class="num" data-label="可折天数"><b>${Number(c.unused)}</b> 天</td>
          <td class="sub" data-label="说明">按累计工龄取档，折算后向下取整</td>
          <td data-label=""><button class="ghost" data-pick="${c.person_id}">去试算</button></td>
        </tr>`).join('') || '<tr><td colspan="6" class="sub">没有可折的年假 —— 要么都休完了，要么都折过了</td></tr>'}
      </tbody></table>
    </div>`;

  const askReason = (what) => {
    const v = prompt(`「${what}」的原因（至少 4 个字）：`);
    return v === null ? null : v.trim();
  };

  // 口径切换
  document.querySelectorAll('[data-mode]').forEach(b => {
    b.onclick = async () => {
      const m = b.dataset.mode;
      if (m === policy) return;
      const reason = askReason(`把口径改成「${CASH_MODE_CN[m].name}」`);
      if (reason === null) return;
      const q = new URLSearchParams({ mode: m, reason });
      const w = await call('/api/leave/cashout/policy?' + q.toString(), { method: 'POST' });
      if (w.status !== 200) {
        return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
      }
      toast('ok', `口径已改为 <b>${esc(CASH_MODE_CN[m].name)}</b>，从 ${esc(w.body.effective_from)} 起生效`);
      viewCashout();
    };
  });

  // 档位
  document.querySelectorAll('[data-tieryears]').forEach(b => {
    b.onclick = async () => {
      const y = b.dataset.tieryears;
      const v = prompt(`累计工龄满 ${y} 年的年假天数（法定 5/10/15，只能多给）`, b.dataset.tierdays);
      if (v === null) return;
      const reason = askReason(`工龄满 ${y} 年档`);
      if (reason === null) return;
      const q = new URLSearchParams({ years: y, days: v.trim(), reason });
      const w = await call('/api/leave/annual-tier?' + q.toString(), { method: 'POST' });
      if (w.status !== 200) {
        return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
      }
      toast('ok', `工龄满 ${y} 年档已改为 <b>${Number(w.body.days)} 天</b>`);
      viewCashout();
    };
  });

  // 往年结转政策
  document.querySelectorAll('[data-carry]').forEach(b => {
    b.onclick = async () => {
      const pol = b.dataset.carry;
      if (pol === carry) return;
      const reason = askReason(pol === 'void' ? '往年余额不再结转' : '允许往年余额结转一年');
      if (reason === null) return;
      const dl = $('#carryDl')?.value.trim() || '03-31';
      const q = new URLSearchParams({ policy: pol, deadline: dl, reason });
      const w = await call('/api/leave/carry-policy?' + q.toString(), { method: 'POST' });
      if (w.status !== 200) {
        return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
      }
      toast('ok', pol === 'void'
        ? '已改为不结转：往年余额不再参与折现'
        : `已允许结转一年，最晚休到次年 <b>${esc(w.body.deadline)}</b>`);
      viewCashout();
    };
  });

  // 试算：只渲染结果，不重绘整页（重绘会把刚选的日期冲掉）
  const doQuote = async () => {
    const emp = $('#coEmp').value;
    const on = $('#coOn').value;
    if (!emp) return toast('bad', '<b>E_ARG</b> 先选一个人');
    const q = await call(`/api/leave/cashout/quote?employee=${emp}&on=${on}`);
    const box = $('#coBox');
    if (q.status !== 200) {
      box.innerHTML = `<b style="color:var(--bad,#dc2626)">${esc(q.body.error || q.status)}</b> ${esc(q.body.message || '')}`;
      return;
    }
    const b = q.body;
    box.innerHTML = `<div class="tier-grid kpi5">
      <div class="tier"><div class="k">可折天数</div><div class="v">${b.days}<span>天</span></div></div>
      <div class="tier"><div class="k">基数（月平均）</div><div class="v" style="font-size:17px">${fmt(b.monthly_wage)}</div></div>
      <div class="tier"><div class="k">日薪（÷21.75）</div><div class="v" style="font-size:17px">${fmt(b.daily_wage)}</div></div>
      <div class="tier"><div class="k">费率</div><div class="v">×${b.rate}</div></div>
      <div class="tier"${b.amount > 0 ? ' style="border-color:#bfe3c8"' : ''}>
        <div class="k">应折金额</div>
        <div class="v" style="font-size:17px">¥${fmt(b.amount)}</div></div>
    </div>
    <div style="margin-top:8px">${esc(b.explain)}。累计工龄 ${Number(b.years)} 年。</div>
    ${Number(b.amount) === 0 ? '<div style="margin-top:4px">当前口径下这笔是 0 —— 改成「额外补 200%」之后才有数。</div>' : ''}
    ${(b.breakdown && b.breakdown.length) ? `
      <table style="margin-top:10px"><thead><tr>
        <th style="width:90px">年度</th><th class="num" style="width:90px">授予</th>
        <th class="num" style="width:90px">已用</th><th class="num" style="width:90px">已折现</th>
        <th class="num" style="width:90px">剩余</th><th>状态</th></tr></thead><tbody>
        ${b.breakdown.map(x => `<tr>
          <td><b>${x.year}</b></td>
          <td class="num">${x.granted}</td>
          <td class="num">${x.used}</td>
          <td class="num">${x.cashed || 0}</td>
          <td class="num"><b>${x.remaining}</b></td>
          <td>${x.state === 'current' ? '<span class="tag ok">当年</span>'
            : x.state === 'carried' ? '<span class="tag warn">结转中</span>'
            : x.state === 'expired' ? '<span class="tag bad">已过截止日</span>'
            : '<span class="tag">不结转</span>'}</td>
        </tr>`).join('')}
      </tbody></table>
      <div class="sub" style="margin-top:4px">
        已休按 <b>先用最早年度</b> 的顺序分摊 —— 结转额度有截止日，先扣旧的才用得掉。
      </div>` : ''}`;
  };
  const qb = $('#coQuote'); if (qb) qb.onclick = doQuote;

  // 登记
  const gb = $('#coGo');
  if (gb) gb.onclick = async () => {
    const emp = $('#coEmp').value;
    const on = $('#coOn').value;
    const period = $('#coPeriod').value;
    if (!emp) return toast('bad', '<b>E_ARG</b> 先选一个人');
    if (!period) return toast('bad', '<b>E_ARG</b> 要选落到哪个月');
    const reason = askReason('登记这张折现单');
    if (reason === null) return;
    const q = new URLSearchParams({ employee: emp, on, period, reason });
    const w = await call('/api/leave/cashout?' + q.toString(), { method: 'POST' });
    if (w.status !== 200) {
      return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
    }
    toast('ok', `已登记 <b>${Number(w.body.days)} 天</b> 折现 <b>¥${fmt(w.body.amount)}</b>，
      落到 ${esc(w.body.settle_period)} 工资条`);
    viewCashout();
  };

  // 作废
  document.querySelectorAll('[data-void]').forEach(b => {
    b.onclick = async () => {
      const why = askReason('作废这张折现单');
      if (why === null) return;
      const q = new URLSearchParams({ id: b.dataset.void, why });
      const w = await call('/api/leave/cashout/void?' + q.toString(), { method: 'POST' });
      if (w.status !== 200) {
        return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
      }
      toast('ok', '已作废，额度已加回（不会留下悬挂额度）');
      viewCashout();
    };
  });

  // 从"谁还有可折的假"跳过去试算
  document.querySelectorAll('[data-pick]').forEach(b => {
    b.onclick = () => {
      const sel = $('#coEmp');
      if (sel) { sel.value = b.dataset.pick; doQuote(); }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
  });
}

// ============================================================================
// 工资项：新建项目、配公式、当场试算
// ----------------------------------------------------------------------------
// 这一页回答三个问题：
//   ① 有哪些工资项（固定 / 浮动 / 公式 / 统计）；
//   ② 公式怎么写 —— 可用变量与函数直接从后端取（不另抄一份说明）；
//   ③ 写完对不对 —— 填一组变量立刻试算，不用等算薪那天。
//
// ★ 公式是**数据**，不是代码：存进 salary_item.formula，算薪时由库编译执行。
//   所以这里只需要一个普通文本框 + 校验，不需要（也不该有）任何 eval。
// ============================================================================
// ============================================================================
// 考勤报表：日报汇总成月报 → HR 调整 → 提交 → 主管审批 → 薪资只认这个
// ----------------------------------------------------------------------------
// 这一页存在的理由：让"这个月该发多少钱"这件事有一个**能落笔的地方**。
// 之前算薪直接读打卡与请假，HR 发现某天错了只能改打卡记录 —— 而打卡是设备/手机写进来的。
//
// 三件必须一眼看清的事：
//   ① 每行是 draft / pending / confirmed —— 因为薪资只认 confirmed；
//   ② 加班分了平日/休息日/法定三档 —— 混成一个数就没法按 1.5/2/3 算；
//   ③ 版本在下面 —— "我上周调过一版"要能翻出来对比。
// ============================================================================
const ATT_SOURCE_CN = {
  build: '生成', manual: '手调', import: '导入',
  submit: '提交', approve: '审批通过', reject: '驳回', confirm: '确认', reopen: '重开',
};

async function viewAttReport() {
  const period = $('#attPeriod')?.value || TODAY.slice(0, 7);
  const r = await call(`/api/att/report?period=${period}`);
  if (r.status !== 200) return fail(r);
  const rows = r.body.rows || [];
  const versions = r.body.versions || [];
  const closedStores = Number(r.body.closed_stores || 0);

  const fmt = (n) => Number(n ?? 0).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const num = (n) => (Number(n) === 0 ? '<span class="sub">0</span>' : fmt(n));
  const stTag = (st) => st === 'confirmed' ? '<span class="tag ok">已确认</span>'
    : st === 'pending' ? '<span class="tag warn">待审批</span>'
    : '<span class="tag">草稿</span>';

  const pending = rows.filter(x => x.status === 'pending').length;
  const draft = rows.filter(x => x.status === 'draft').length;
  const confirmed = rows.filter(x => x.status === 'confirmed').length;
  const otSum = rows.reduce((a, x) => ({
    wd: a.wd + Number(x.ot?.weekday_ot || 0),
    rd: a.rd + Number(x.ot?.restday_ot || 0),
    hd: a.hd + Number(x.ot?.holiday_ot || 0),
  }), { wd: 0, rd: 0, hd: 0 });

  $('#view').innerHTML = `
    <div class="card">
      <div class="org-head">
        <h2 style="margin:0">考勤报表 <span class="sub" style="font-weight:400">${esc(period)} · 一人一行</span></h2>
        <span style="flex:1"></span>
        <label class="sub">期间 <input id="attPeriod" type="month" value="${esc(period)}" style="width:150px"></label>
        <button id="attBuild">生成/刷新</button>
        ${draft ? '<button class="ghost" id="attSubmit">提交审批</button>' : ''}
        ${pending ? '<button id="attApprove">通过</button><button class="ghost" id="attReject">驳回</button>' : ''}
        ${confirmed && !pending && !draft ? '<button class="ghost" id="attReopen">重开</button>' : ''}
        <button class="ghost" id="attImport">导入覆盖</button>
      </div>
      <p class="note">
        <b>薪资只认「已确认」的这一版。</b>流程是：生成（从日报/打卡/请假汇总）→ HR 调整 →
        提交 → 部门主管（餐饮门店即店长）审批 → 生效。
        确认后改不动，要改先重开；重开时会留一版，之后能对比。
      </p>
      ${closedStores === 0 ? `<p class="note" style="color:var(--warn,#b45309)">
        <b>提示</b>：${esc(period)} 还没有门店封账，这时候生成的月报可能还缺数据。</p>` : ''}
      <div class="kv" style="margin:8px 0">
        <span>草稿 <b>${draft}</b></span>
        <span>待审批 <b style="color:var(--warn,#b45309)">${pending}</b></span>
        <span>已确认 <b style="color:var(--ok)">${confirmed}</b></span>
        <span>加班（平日/休息日/法定）<b>${otSum.wd}h / ${otSum.rd}h / ${otSum.hd}h</b></span>
      </div>
      <table class="stack2"><thead><tr>
        <th>姓名</th><th>部门</th><th>应出勤</th><th>出勤</th><th>请假</th><th>其中事假</th>
        <th>旷工</th><th>工时</th><th>加班（平日/休/法）</th><th>计薪</th><th>状态</th><th></th>
      </tr></thead><tbody>
        ${rows.map(x => `<tr>
          <td><b>${esc(x.full_name)}</b> <span class="sub">#${x.person_id}</span></td>
          <td class="sub" data-label="部门">${esc(x.dept_name || '—')}</td>
          <td class="num" data-label="应出勤">${fmt(x.work_days)} <span class="sub">/ 日历${Math.round(Number(x.calendar_days))}</span></td>
          <td class="num" data-label="出勤">${num(x.present_days)}</td>
          <td class="num" data-label="请假">${num(x.leave_days)}</td>
          <td class="num hide-sm" data-label="其中事假">${num(x.personal_leave_days)}</td>
          <td class="num" data-label="旷工">${num(x.absent_days)}</td>
          <td class="num" data-label="工时">${num(x.work_hours)}</td>
          <td class="num sub" data-label="加班 平日/休/法">${fmt(x.ot?.weekday_ot)}/${fmt(x.ot?.restday_ot)}/${fmt(x.ot?.holiday_ot)}</td>
          <td class="hide-sm" data-label="计薪">${x.pay_basis === 'hour' ? '<span class="tag">工时</span>' : '<span class="tag ok">人天</span>'}</td>
          <td data-label="状态">${stTag(x.status)}${x.rejected_reason ? `<div class="sub" style="color:var(--bad)">驳回：${esc(x.rejected_reason)}</div>` : ''}
            ${x.approver_name && x.status === 'pending' ? `<div class="sub">待 ${esc(x.approver_name)} 审批</div>` : ''}</td>
          <td style="white-space:nowrap">
            <button class="ghost" data-daily="${x.person_id}">明细</button>
            ${x.status === 'draft' ? `<button class="ghost" data-set="${x.id}">调整</button>` : ''}
          </td>
        </tr>`).join('') || '<tr><td colspan="12" class="empty">这一期还没有月报，点右上角「生成/刷新」</td></tr>'}
      </tbody></table>
      <p class="sub">应出勤后面跟的「日历 N」是当月日历工作日；改了应出勤之后，日历值仍留着，方便看出原来多少。</p>
    </div>

    <div class="card" id="attForm" hidden></div>
    <div class="card" id="attDaily" hidden></div>

    <div class="card">
      <h2>版本 <span class="sub" style="font-weight:400">最近 ${versions.length} 版 · 生成/手调/导入/提交/审批各留一版</span></h2>
      <p class="note">
        每次动作自动留一版，不靠人记得点。要对比挑两版：摘要相同就是没变。
      </p>
      ${versions.length ? `<table class="stack2"><thead><tr>
        <th style="width:70px">版本</th><th style="width:110px">来源</th>
        <th class="num" style="width:60px">人数</th><th style="width:90px">摘要</th>
        <th>说明</th><th style="width:70px">谁</th>
        <th style="width:140px" class="hide-sm">时间</th><th style="width:70px"></th>
      </tr></thead><tbody>${versions.map(v => `<tr>
        <td><b>v${v.version_no}</b></td>
        <td data-label="来源"><span class="tag">${ATT_SOURCE_CN[v.source] || v.source}</span></td>
        <td class="num" data-label="人数">${v.row_count}</td>
        <td class="sub" data-label="摘要"><code>${esc(String(v.digest).slice(0, 8))}</code></td>
        <td class="sub" data-label="说明">${esc(v.note || '—')}</td>
        <td class="sub" data-label="谁">${esc(v.created_by || '')}</td>
        <td class="sub hide-sm" data-label="时间">${esc(String(v.created_at).replace('T', ' ').slice(0, 16))}</td>
        <td data-label="选两版对比"><input type="radio" name="attv" value="${v.id}" style="margin-right:2px"></td>
      </tr>`).join('')}</tbody></table>
      <div class="form" style="margin-top:10px">
        <button class="ghost" id="attDiff">对比选中的两版</button>
        <span id="attDiffOut" class="sub" style="align-self:center"></span>
      </div>` : '<div class="empty">还没有版本。生成一次月报就会自动留下第一版。</div>'}
    </div>`;

  const reload = () => viewAttReport();
  $('#attPeriod').onchange = reload;

  const act = async (path, okMsg) => {
    const w = await call(path, { method: 'POST' });
    if (w.status !== 200) return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
    toast('ok', okMsg(w.body));
    reload();
  };

  $('#attBuild').onclick = () => act(`/api/att/report/build?period=${period}`,
    (b) => `已汇总 <b>${b.built}</b> 人${Number(b.skipped_confirmed) ? `（${b.skipped_confirmed} 人已确认，跳过不动）` : ''}`);

  const sb = $('#attSubmit');
  if (sb) sb.onclick = () => act(`/api/att/report/submit?period=${period}`,
    (b) => `已提交 <b>${b.submitted}</b> 人待审批`);

  const ap = $('#attApprove');
  if (ap) ap.onclick = () => act(`/api/att/report/approve?period=${period}&approve=1`,
    (b) => `审批通过 <b>${b.approved}</b> 人，薪资从此按这一版算`);

  const rj = $('#attReject');
  if (rj) rj.onclick = async () => {
    const reason = prompt('驳回原因（至少 4 个字，HR 要照着改）：');
    if (reason === null) return;
    await act(`/api/att/report/approve?period=${period}&approve=0&reason=${encodeURIComponent(reason)}`,
      (b) => `已驳回 <b>${b.approved}</b> 人`);
  };

  const ro = $('#attReopen');
  if (ro) ro.onclick = async () => {
    const reason = prompt('重开原因（会留一版，并把已确认的数字变成待改）：');
    if (reason === null) return;
    await act(`/api/att/report/reopen?period=${period}&reason=${encodeURIComponent(reason)}`,
      (b) => `已重开 <b>${b.reopened}</b> 人`);
  };

  // 导入覆盖
  const imp = $('#attImport');
  if (imp) imp.onclick = () => {
    const box = $('#attForm');
    box.hidden = false;
    box.innerHTML = `<h2>导入覆盖 <span class="sub" style="font-weight:400">Excel / CSV · 两阶段</span></h2>
      <p class="note">
        <b>月报表</b>：工号、应出勤、出勤、请假、事假、旷工、工时、加班（有几列写几列，
        留空表示这一列不改）。<b>日报表</b>：工号、日期、工时。
        先解析出逐行结论，确认没问题再点应用 —— 一次导几十人，最怕"看起来导进去了"。
      </p>
      <div class="form">
        <label>类型<select id="attImpKind">
          <option value="monthly">月报（覆盖各项天数/工时）</option>
          <option value="daily">日报（覆盖每天工时）</option>
        </select></label>
        <label>文件<input type="file" id="attImpFile" accept=".csv,.tsv,.txt,.xlsx"></label>
        <button id="attImpGo">上传并校验</button>
      </div>
      <div id="attImpOut"></div>`;

    $('#attImpGo').onclick = async () => {
      const f = $('#attImpFile')?.files?.[0];
      if (!f) return toast('bad', '<b>E_FILE</b> 先选一个文件');
      const kind = $('#attImpKind').value;
      const out = $('#attImpOut');
      out.innerHTML = '<div class="empty">正在解析…</div>';
      const buf = await f.arrayBuffer().catch(() => null);
      if (!buf) { out.innerHTML = '<div class="empty">读不出这个文件</div>'; return; }
      const res = await fetch(`/api/att/import?kind=${kind}&period=${period}`
        + `&filename=${encodeURIComponent(f.name)}`, {
        method: 'POST',
        headers: { 'content-type': 'application/octet-stream',
                   ...(token ? { authorization: `Bearer ${token}`, 'x-aihr-token': token } : {}) },
        body: buf,
      });
      let w = {};
      try { w = await res.json(); } catch { w = {}; }
      if (res.status !== 200) {
        out.innerHTML = `<div class="empty">导入被拒：<b>${esc(w.error || res.status)}</b> ${esc(w.message || '')}</div>`;
        return;
      }
      const bad = (w.rows || []).filter(x => !x.ok);
      out.innerHTML = `
        <div class="kv" style="margin:10px 0 6px">
          <span>批次 <b>#${w.batch_id}</b></span><span>共 <b>${w.total}</b> 行</span>
          <span>通过 <b style="color:var(--ok)">${w.ok}</b></span>
          <span>未通过 <b style="color:${bad.length ? 'var(--bad)' : 'var(--fg-2)'}">${w.fail}</b></span>
        </div>
        <table><thead><tr><th>行</th><th>结论</th><th>内容</th></tr></thead><tbody>
          ${(w.rows || []).map(x => `<tr>
            <td class="num">${x.row_no}</td>
            <td>${x.ok ? '<span class="tag ok">通过</span>'
                      : `<span class="tag bad">未通过</span> <span class="sub">${esc(x.error)}</span>`}</td>
            <td class="sub">${esc(Object.entries(x.payload || {}).map(([k, v]) => `${k}=${v}`).join('  '))}</td>
          </tr>`).join('')}</tbody></table>
        ${w.ok > 0 ? `<div class="form" style="margin-top:10px">
            <button id="attImpApply">应用（覆盖月报）</button>
            <span class="sub" style="align-self:center">只覆盖表里给了值的列；已确认的期间会被拒</span>
          </div>` : ''}`;

      const btn = $('#attImpApply');
      if (btn) btn.onclick = async () => {
        btn.disabled = true;
        const a = await call(`/api/att/import/apply?batch=${w.batch_id}&period=${period}`, { method: 'POST' });
        btn.disabled = false;
        if (a.status !== 200) return toast('bad', `<b>${esc(a.body.error || a.status)}</b> ${esc(a.body.message || '')}`);
        toast('ok', `已应用：<b>${a.body.applied}</b> 行（失败 ${a.body.failed}）`);
        reload();
      };
    };
  };

  // 调整：一个字段一个原因
  document.querySelectorAll('[data-set]').forEach(b => {
    b.onclick = () => {
      const row = rows.find(x => String(x.id) === b.dataset.set);
      const box = $('#attForm');
      box.hidden = false;
      const fields = [
        ['work_days', '应出勤', row.work_days],
        ['present_days', '出勤', row.present_days],
        ['leave_days', '请假合计', row.leave_days],
        ['personal_leave_days', '其中事假', row.personal_leave_days],
        ['absent_days', '旷工', row.absent_days],
        ['work_hours', '工时', row.work_hours],
        ['ot_hours', '加班工时', row.ot_hours],
      ];
      box.innerHTML = `<h2>调整 ${esc(row.full_name)}（${esc(period)}）
          <span class="sub" style="font-weight:400">当前 ${row.status === 'draft' ? '草稿' : row.status}</span>
          <span style="float:right;font-weight:400"><button class="ghost" id="attClose">收起</button></span></h2>
        <p class="note">一次改一个字段，必须写原因 —— 改完会留一版并记一条痕迹。
          要改多列就改多次：合并会把"改了三次"写成一次。</p>
        <div class="form">
          <label>字段<select id="attField">
            ${fields.map(([k, n, v]) => `<option value="${k}" data-v="${Number(v)}">${n}（当前 ${fmt(v)}）</option>`).join('')}
          </select></label>
          <label>新值<input id="attValue" type="number" step="0.01" min="0" style="width:120px"></label>
          <label>原因<input id="attReason" placeholder="门店报 11-03 漏打卡，已核对监控" style="width:320px"></label>
          <button id="attSave">保存</button>
        </div>
        <p class="sub">应出勤不能改成 0：它是折算的分母。</p>`;
      $('#attClose').onclick = () => { box.hidden = true; };
      const sel = $('#attField'), val = $('#attValue');
      val.value = sel.selectedOptions[0].dataset.v;
      sel.onchange = () => { val.value = sel.selectedOptions[0].dataset.v; };
      $('#attSave').onclick = async () => {
        const q = new URLSearchParams({
          report: row.id, field: sel.value,
          value: String(Number(val.value)), reason: $('#attReason').value.trim(),
        });
        const w = await call('/api/att/report/set?' + q.toString(), { method: 'POST' });
        if (w.status !== 200) return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
        toast('ok', `已改 <b>${sel.value}</b> → ${w.body.value}，留了一版`);
        reload();
      };
    };
  });

  // 日报明细
  document.querySelectorAll('[data-daily]').forEach(b => {
    b.onclick = async () => {
      const person = b.dataset.daily;
      const row = rows.find(x => String(x.person_id) === person);
      const w = await call(`/api/att/daily?period=${period}&person=${person}`);
      if (w.status !== 200) return toast('bad', `<b>${esc(w.body.error || w.status)}</b>`);
      const box = $('#attDaily');
      box.hidden = false;
      const d = w.body.rows || [];
      box.innerHTML = `<h2>${esc(row?.full_name || person)} · 日报明细
          <span class="sub" style="font-weight:400">${esc(period)} · 加班 平日 ${fmt(w.body.ot?.weekday_ot)}h / 休息日 ${fmt(w.body.ot?.restday_ot)}h / 法定 ${fmt(w.body.ot?.holiday_ot)}h</span>
          <span style="float:right;font-weight:400"><button class="ghost" id="attDailyClose">收起</button></span></h2>
        ${d.length ? `<table><thead><tr>
          <th>日期</th><th>班次</th><th>性质</th><th>工时</th><th>跨度</th><th>调过</th><th></th>
        </tr></thead><tbody>${d.map(x => `<tr>
          <td>${esc(String(x.work_date).slice(0, 10))}</td>
          <td class="sub">${esc(x.shift_name || '—')}</td>
          <td>${x.is_holiday ? '<span class="tag bad">法定节假日</span>'
               : x.is_rest ? '<span class="tag warn">休息日</span>' : '<span class="sub">工作日</span>'}</td>
          <td class="num">${fmt(x.work_hours)}</td>
          <td class="num sub">${fmt(x.span_hours)}</td>
          <td>${x.adjusts ? `<span class="tag">${x.adjusts} 次</span>` : '<span class="sub">—</span>'}</td>
          <td><button class="ghost" data-dset="${esc(String(x.work_date).slice(0, 10))}"
                data-h="${Number(x.work_hours)}">改工时</button></td>
        </tr>`).join('')}</tbody></table>` : '<div class="empty">这一期没有考勤人日记录（可能还没封账或还没导考勤机数据）</div>'}
        <p class="sub">改工时只能改已有的那一天；没有记录说明"这天他没来"，要补请走补勤或考勤机导入 ——
          直接新建一条等于替门店决定他来了。</p>`;
      $('#attDailyClose').onclick = () => { box.hidden = true; };
      box.querySelectorAll('[data-dset]').forEach(x => {
        x.onclick = async () => {
          const v = prompt(`${x.dataset.dset} 的工时（当前 ${x.dataset.h}）：`, x.dataset.h);
          if (v === null) return;
          const reason = prompt('调整原因（至少 4 个字）：');
          if (reason === null) return;
          const q = new URLSearchParams({ person, date: x.dataset.dset, hours: v, reason });
          const w2 = await call('/api/att/daily/set?' + q.toString(), { method: 'POST' });
          if (w2.status !== 200) return toast('bad', `<b>${esc(w2.body.error || w2.status)}</b> ${esc(w2.body.message || '')}`);
          toast('ok', `已改 ${x.dataset.dset} 工时 → ${w2.body.hours}`);
          viewAttReport();
        };
      });
    };
  });

  // 版本对比
  const dbtn = $('#attDiff');
  if (dbtn) dbtn.onclick = async () => {
    const picked = [...document.querySelectorAll('input[name="attv"]:checked')].map(x => x.value);
    const out = $('#attDiffOut');
    if (picked.length !== 2) return toast('bad', '选两版才能对比');
    const w = await call(`/api/att/report/diff?v1=${picked[0]}&v2=${picked[1]}`);
    if (w.status !== 200) return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
    const d = w.body.rows || [];
    out.innerHTML = d.length
      ? `差异 <b>${d.length}</b> 处：` + d.slice(0, 6).map(x =>
          `#${x.person_id} ${x.field_name} ${x.v1 ?? '—'}→${x.v2 ?? '—'}`).join('；')
        + (d.length > 6 ? ' …' : '')
      : '两版数字完全一致（摘要相同则必然一致）';
  };
}

// ============================================================================
// 工资调整单
// ----------------------------------------------------------------------------
// "这个月给谁调多少"在现实里是一张单据，不是一次 UPDATE：
// 谁调的、从多少调到多少、为什么、什么时候生效 —— 四件事缺一件，
// 一个月后就没人说得清"他这 14500 是怎么来的"。
//
// 所以这一页只做三件事：看每人当前薪资、开一张调整单、应用它。
// 调整单是**变更记录**，当前值仍在 salary_standard / structure（按生效日带版本）。
// ============================================================================
async function viewAdjust() {
  const period = $('#adjPeriod')?.value || TODAY.slice(0, 7);
  const year = Number(period.slice(0, 4));
  const [r, bonus, emps, comm] = await Promise.all([
    call(`/api/salary/adjustments?period=${period}`),
    call(`/api/payroll/bonus?year=${year}`),
    call('/api/employees'),
    call(`/api/commission/rules?period=${period}`),
  ]);
  if (r.status !== 200) return fail(r);
  const rows = r.body.rows || [];
  const history = r.body.history || [];
  const bonuses = (bonus.status === 200 ? bonus.body.rows : []) || [];
  const staff = (emps.status === 200 ? emps.body.rows : []) || [];
  const commRules = (comm.status === 200 ? comm.body.rules : []) || [];
  const commBasis = (comm.status === 200 ? comm.body.basis : []) || [];
  const fmt = (n) => Number(n ?? 0).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const pending = rows.filter(x => x.adj_status === 'draft').length;
  // 演示库里 374 人：卡片化后单行 157px，整页 62,910px。前 100 行 + 「显示全部」。

  const cmSave = $('#cmSave');

    };
  }
  const bnRun = $('#bnRun');
  if (bnRun) {

      toast('ok', `年终奖已算：<b>${w.body.calculated}</b> 人，税额合计 ${fmt(w.body.tax_total)}`);
      viewAdjust();
    };
  }

  document.querySelectorAll('[data-adjust]').forEach(b => {
    b.onclick = () => openAdjustForm(rows.find(x => String(x.person_id) === b.dataset.adjust), period);
  });

  document.querySelectorAll('[data-apply]').forEach(b => {
    b.onclick = async () => {
      const w = await call(`/api/salary/adjustment/apply?code=${encodeURIComponent(b.dataset.apply)}`, { method: 'POST' });
      if (w.status !== 200) return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
      toast('ok', `已应用 <b>${esc(b.dataset.apply)}</b>，月薪 <b>${fmt(w.body.monthly)}</b>`);
      reload();
    };
  });

  document.querySelectorAll('[data-cancel]').forEach(b => {
    b.onclick = async () => {
      const w = await call(`/api/salary/adjustment/cancel?code=${encodeURIComponent(b.dataset.cancel)}`, { method: 'POST' });
      if (w.status !== 200) return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
      toast('ok', `已作废 <b>${esc(b.dataset.cancel)}</b>`);
      reload();
    };
  });
}

/** 单人调整表单：以当前结构为模板，改哪项填哪项 */
function openAdjustForm(row, period) {
  const box = $('#adjForm');
  if (!box || !row) return;
  const fmt = (n) => Number(n ?? 0).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const items = (row.items && row.items.length) ? row.items : [{ item_code: 'BASE', name: '基本工资', amount: 0 }];

  box.hidden = false;
  box.innerHTML = `<h2>${esc(row.full_name)} · 调整（${esc(period)}）
      <span class="sub" style="font-weight:400">当前月薪 ${fmt(row.monthly)}</span>
      <span style="float:right;font-weight:400"><button class="ghost" id="adjClose">收起</button></span></h2>
    <p class="note">只填<b>固定工资项</b>（基本工资/岗位津贴/餐补/通讯）。合计就是新的月薪标准；
      结构与月薪必须相等，否则服务端会拒。</p>
    <div class="form" id="adjItems" style="flex-wrap:wrap">
      ${items.map((it, i) => `<label>${esc(it.name || it.item_code)}
        <input class="adj-amt" data-code="${esc(it.item_code)}" type="number" min="0" step="0.01"
          value="${Number(it.amount)}" style="width:130px"></label>`).join('')}
      <label>原因（≥4 字）<input id="adjReason" value="年度调薪" style="width:200px"></label>
      <button id="adjSave">存为调整单</button>
    </div>
    <div class="kv"><span>调整后合计 <b id="adjTotal">${fmt(row.monthly)}</b></span>
      <span class="sub">保存后是草稿，还要点「应用」才会生效</span></div>`;

  const total = () => {
    const sum = [...box.querySelectorAll('.adj-amt')].reduce((a, el) => a + (Number(el.value) || 0), 0);
    $('#adjTotal').textContent = fmt(sum);
    return sum;
  };
  box.querySelectorAll('.adj-amt').forEach(el => { el.oninput = total; });
  total();

  $('#adjClose').onclick = () => { box.hidden = true; };
  $('#adjSave').onclick = async () => {
    const arr = [...box.querySelectorAll('.adj-amt')]
      .map(el => ({ item_code: el.dataset.code, amount: Number(el.value) || 0 }));
    const reason = ($('#adjReason').value || '').trim();
    if (reason.length < 4) return toast('bad', '<b>E_ARG_INVALID</b> 原因至少 4 个字');
    const q = new URLSearchParams({
      person: row.person_id, period, reason, items: JSON.stringify(arr),
    });
    const w = await call('/api/salary/adjustment?' + q.toString(), { method: 'POST' });
    if (w.status !== 200) return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
    toast('ok', `已建调整单 <b>${esc(w.body.code)}</b>（草稿），点「应用」生效`);
    viewAdjust();
  };
}

const KIND_CN = { fixed: '固定', variable: '浮动', formula: '公式', statistic: '统计' };
