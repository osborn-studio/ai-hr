      toast('ok', `已生效，变更协议 <b>${esc(res.body.contract_no)}</b>（草稿，待面签）`);
      load();
    };
  });
  document.querySelectorAll('[data-chgprev]').forEach((b) => {
    b.onclick = () => openPrint(`/api/hr/contract.html?id=${b.dataset.chgprev}`);
  });

  const ob = $('#obGo');
  if (ob) ob.onclick = async () => {
    ob.disabled = true;
    const res = await postJson('/api/hr/onboard', {
      offer: Number($('#obOffer').value.trim()),
      hireDate: $('#obDate').value || null,
      legalEntityId: Number($('#obEnt').value),
      contract: { employee_address: $('#obAddr').value.trim() },

    if (res.status !== 200) {
      // 违法条款（试用期超限等）与参数错都到这里，但文案不同：
      // 前者要说清是哪条法定限制，后者要说清哪个字段
      $('#obMsg').innerHTML = `<span class="tag bad">${esc(res.body.error || res.status)}</span>
        <span>${esc(res.body.message || '')}</span>`;
      return toast('bad', `<b>${esc(res.body.error || res.status)}</b><br>${esc(res.body.message || '')}`);
    }
    const w = res.body.warnings || [];
    $('#obMsg').innerHTML = `<span class="tag ok">已入职</span>
      <span>人 <b>#${res.body.person_id}</b> · 合同 <b>${esc(res.body.contract_no)}</b>（草稿，待面签）</span>
      ${w.length ? `<br>${w.map((x) => `<span class="tag warn">提醒</span> ${esc(x)}`).join('<br>')}` : ''}`;
    toast('ok', `已入职并生成合同 <b>${esc(res.body.contract_no)}</b>，下一步：面签后点「签署」`);
    load();
  };

  const save = $('#ctSave');
  if (save) save.onclick = async () => {
    save.disabled = true;
    const body = {
      employeeId: Number($('#ctEmp').value.trim()),
      legalEntityId: Number($('#ctEnt').value),
      kind: $('#ctKind').value,
      startDate: $('#ctStart').value || null,
      endDate: $('#ctEnd').value || null,
      probationFrom: $('#ctPf').value || null,
      probationTo: $('#ctPt').value || null,
      jobTitle: $('#ctJob').value.trim(),
      workplace: $('#ctPlace').value.trim(),
      employeeAddress: $('#ctAddr').value.trim(),
      hoursSystem: $('#ctHours').value,
      wageAmount: Number($('#ctWage').value.trim()),
      wageUnit: $('#ctUnit').value,
      payDay: Number($('#ctDay').value.trim() || 15),
    };
    const res = await postJson('/api/hr/contract', body);
    save.disabled = false;
    if (res.status !== 200) {
      // block（违法条款）与"参数写错"都走这里，但**文案不同**：
      // 前者要说清是哪条法定限制，后者要说清哪个字段
      $('#ctMsg').innerHTML = `<span class="tag bad">${esc(res.body.error || res.status)}</span>
        <span>${esc(res.body.message || '')}</span>`;
      return toast('bad', `<b>${esc(res.body.error || res.status)}</b><br>${esc(res.body.message || '')}`);
    }
    const warns = res.body.warnings || [];
    if (warns.length) {
      $('#ctMsg').innerHTML = warns.map((w) =>
        `<span class="tag warn">${esc(w.code)}</span> <span>${esc(w.message)}</span>`).join('<br>');
      toast('ok', `已存草稿 <b>${esc(res.body.contract_no)}</b>，但有 ${warns.length} 条提醒`);
    } else {
      toast('ok', `已存草稿 <b>${esc(res.body.contract_no)}</b>（未签署）`);
    }
    load();
  };

  // 预览 / 签署 / 续签
  document.querySelectorAll('[data-ctprev]').forEach((b) => {
    b.onclick = () => openPrint(`/api/hr/contract.html?id=${b.dataset.ctprev}`);
  });
  document.querySelectorAll('[data-ctsign]').forEach((b) => {
    b.onclick = async () => {
      if (!confirm('确认已与员工面签完毕？签署后这份合同不能再改（要变更就签新的）。')) return;
      b.disabled = true;
      const res = await call(`/api/hr/contract/sign?id=${b.dataset.ctsign}`, { method: 'POST' });
      if (res.status !== 200) {
        toast('bad', `<b>${esc(res.body.error || res.status)}</b> ${esc(res.body.message || '')}`);
        b.disabled = false; return;
      }
      toast('ok', `已签署，正文快照 ${res.body.body_length} 字`);
      load();
    };
  });
  document.querySelectorAll('[data-ctrenew]').forEach((b) => {
    b.onclick = async () => {
      const start = prompt('续签的起始日（YYYY-MM-DD）',
        iso(new Date(Date.parse(new Date()) + 86400000)));
      if (!start) return;
      const end = prompt('续签的终止日（无固定期限留空）', '');
      const qs = new URLSearchParams({ id: b.dataset.ctrenew, start });
      if (end) qs.set('end', end);
      const res = await call(`/api/hr/contract/renew?${qs}`, { method: 'POST' });
      if (res.status !== 200) {
        return toast('bad', `<b>${esc(res.body.error || res.status)}</b> ${esc(res.body.message || '')}`);
      }
      toast('ok', `已生成续签草稿 <b>${esc(res.body.contract_no)}</b>（续签不带试用期）`);
      load();
    };
  });
}

// 香港合规两块：证照 90 天内到期 + MPF 该建未建。
// ★ 单独取、失败只写一句"读不到"，不拖累花名册（花名册是主路）。
async function loadHkCompliance() {
  const box = document.querySelector('#hkBody');
  if (!box) return;
  const [doc, mpf] = await Promise.all([
    call('/api/hr/documents/expiring?days=90'),
    call('/api/hr/mpf/missing'),
  ]);
  const dRows = doc.status === 200 ? (doc.body.rows || doc.body || []) : null;
  const mRows = mpf.status === 200 ? (mpf.body.rows || mpf.body || []) : null;
  const line = (label, st, rows, fmt) => {
    if (st !== 200) return `<p class="sub" style="color:var(--bad)">${esc(label)}：读不到（${esc(st)}）</p>`;
    if (!rows.length) return `<p class="sub">${esc(label)}：没有需要处理的</p>`;
    return `<p class="sub">${esc(label)}：<b>${rows.length}</b> 人 —— `
      + rows.slice(0, 6).map(fmt).join('、')
      + (rows.length > 6 ? ` …等 ${rows.length} 人` : '') + '</p>';
  };
  box.innerHTML = line('证照 90 天内到期', doc.status, dRows || [],
      (x) => `${esc(x.full_name || ('#' + x.person_id))}（${esc(x.doc_type)} ${esc(x.expiry_date || '')}）`)
    + line('MPF 该建未建', mpf.status, mRows || [],
      (x) => `${esc(x.full_name || ('#' + x.person_id))}`)
    + `<p class="sub">418·468（连续雇佣判定）：<b>未判定</b> —— 仓库资料里只有"468"这个列名，
         没有计算式，口径待 HR 确认（见迁移 190 文件头）。这里不显示一个看起来像结论的值。</p>`;
}

async function viewHome() {
  const r = await call('/api/home?period=2026-06');
  if (r.status !== 200) return fail(r);
  const h = r.body;

  // 每一块只放"数字 + 名字"：解释放在下面单独一段。
  // 把说明塞进小方块里，字会被挤成三行再被边框切掉 —— 那比不写更难看。
  // ★ n === null 是"你的角色看不到这一块"（服务端 blocked），不是 0。
  //   两者必须分开：0 表示"真的没有待办"，null 表示"没权限看"——
  //   把 null 画成 0，等于替系统回答"你没有待办"，那是错的。
  const items = [
    { n: h.todos, label: '等我审批', go: 'approval' },
    { n: h.ccs, label: '抄送我的（未读）', go: 'approval' },
    { n: h.overdue_exceptions, label: '逾期未关闭的例外', go: 'exceptions' },
    { n: h.unclosed_stores, label: '本期未封账门店', go: 'close' },
    // 「未跑过」不再算「未通过」（服务端已分开）：195 条从没跑过的判据
    // 一条条报红，等于把"还没验"说成"验不过"，首页常驻一条假的警报。
    { n: h.checks_not_pass, label: '判据组异常（红/黄）', go: 'health' },
  ];
  const blocked = new Set(h.blocked || []);

  $('#view').innerHTML = `
    <div class="card">
      <h2>今天要做什么</h2>
      <p class="note">
        这一页只做汇总，<b>每个数字都能点进去</b>，且都来自各自服务的同一个函数 ——
        首页自己写一遍 count，就会出现「首页说 3、点进去 4」这种两个都像对的差。
        权限不同，数字也不同：看不见的门店不计入，也不显示。
      </p>
      <div class="grid">
        ${items.map(x => `<button class="tile ${Number(x.n) > 0 ? 'hot' : ''}"
            data-go="${x.go}" title="${x.n === null ? '你的角色看不到这一块（没有「审批」读权限）' : ''}">
          <span class="n">${x.n === null ? '—' : x.n}</span>
          <span class="l">${esc(x.label)}</span>
        </button>`).join('')}
      </div>
      ${Number(h.checks_unknown) > 0 ? `<p class="sub">
        ${h.checks_unknown} 条判据**从没跑过**（不是失败）—— 点「判据组异常」看清单，
        或在「体系自证」里跑一遍。</p>` : ''}
      ${blocked.size ? `<p class="sub" style="color:var(--bad)">
        「—」表示你的角色看不到这一块（缺 <code>${[...blocked].join('/')}</code> 的读权限），
        不是"没有待办"。要看得换一个有该权限的账号。</p>` : ''}
      <ul class="defs">
        <li><b>等我审批</b>　只算<b>当前步</b>且属于我（或我代理的人）的待办；后面步骤已落行，但还不到你办。</li>
        <li><b>抄送我的</b>　抄送不产生待办，也就不产生权力 —— 被抄送的人去审批会得到 403。</li>
        <li><b>逾期例外</b>　例外必须有退出条件；逾期就是「改了规矩还没改回来」。</li>
        <li><b>本期未封账</b>　期间 ${esc(h.period)}；未封账 → 算薪门禁不放行（不是「提醒你一下」）。</li>
        <li><b>判据组未通过</b>　含 <code>never_run</code> —— 没跑过不等于通过。</li>
      </ul>
      ${h.checks_not_pass_sample?.length ? `<div class="kv">
        <span>未通过示例：${h.checks_not_pass_sample.map(c => `<code>${esc(c)}</code>`).join(' ')}</span>
        <span class="sub">完整清单在「自检」页</span>
      </div>` : ''}
    </div>

    <div class="card">
      <h2>怎么读这一页</h2>
      <div class="kv">
        <span><b>0 不代表正常</b>，只代表「这个判据查了、结果是没有」。没查过的在「自检」页是 <code>never_run</code>。</span>
      </div>
      <div class="kv">
        <span>数字来自四处：审批（待办 / 抄送）、例外（逾期）、考勤（未封账）、判据覆盖率。</span>
      </div>
      <div class="kv">
        <span>这一页没有趋势图：切片里是演示数据，画趋势只会画出一个好看的假象。</span>
      </div>
    </div>`;

  $('#view').querySelectorAll('button[data-go]').forEach(b => {
    b.onclick = () => {
      tab = b.dataset.go;
      history.replaceState(null, '', '#' + tab);
      render(); load();
    };
  });
}

        而"招 1 个人面 8 个"不该先写下 8 份承诺；且同一候选人只能有一个在途 offer，

  const acLoad = $('#acLoad');

    const [iv, bg, ap] = await Promise.all([
      call(`/api/recruit/interview?rq=${rq}&candidate=${encodeURIComponent(key)}`),
      call(`/api/recruit/bg?candidate=${encodeURIComponent(key)}`),
      (async () => {
        const off = offers.find((x) => String(x.candidate_key) === key);

      })(),
    ]);

    const checks = bg.status === 200 ? (bg.body.rows || []) : [];

          <td class="num">${x.score === null ? '—' : esc(x.score)}</td>
          <td><span class="tag ${x.conclusion === 'reject' ? 'bad'

          <td class="sub">${esc(x.comment || '')}</td>
        </tr>`).join('')}</tbody></table>`}

        <label>第几轮<input id="acNo" value="${rounds.length + 1}" style="width:70px"></label>
        <label>面试人<input id="acBy" placeholder="面试官" style="width:110px"></label>
        <label>方式<select id="acWay" style="width:100px">
          <option value="onsite">现场</option><option value="video">视频</option>
          <option value="phone">电话</option></select></label>
        <label>结论<select id="acCon" style="width:100px">
          <option value="pass">通过</option><option value="hold">待定</option>
          <option value="reject">淘汰</option></select></label>
      </div>
      <div class="form" style="margin-top:6px">
        <label style="flex:1">评语<input id="acCmt"
          placeholder="淘汰必填（≥10 字），例：冷库作业经验不足，通勤单程两小时" style="width:100%"></label>
        <button id="acAdd">记一轮</button>
      </div>

      <h4 style="margin:14px 0 4px">背调（${checks.length} 条）</h4>
      ${checks.length === 0 ? '<div class="empty">还没查过</div>' : `
      <table><thead><tr><th>类型</th><th>授权时间</th><th>调查时间</th>
        <th>结论</th><th>说明</th></tr></thead>
        <tbody>${checks.map((x) => `<tr>
          <td class="sub">${esc(B[x.kind] || x.kind)}</td>
          <td class="sub">${esc(String(x.consent_at || '—').slice(0, 10))}</td>
          <td class="sub">${esc(String(x.checked_at || '—').slice(0, 10))}</td>
          <td><span class="tag ${x.result === 'risk' ? 'bad' : (x.result === 'clear' ? 'ok' : 'warn')}">
            ${esc(R[x.result] || x.result || '—')}</span></td>
          <td class="sub">${esc(x.detail || '')}</td>
        </tr>`).join('')}</tbody></table>`}
      <div class="form" style="margin-top:6px">
        <label>类型<select id="bgKind" style="width:110px">
          <option value="education">学历</option><option value="employment">前雇主</option>
          <option value="credit">征信</option><option value="criminal">无犯罪</option></select></label>
        <label>授权时间<input id="bgConsent" type="date" style="width:150px"></label>
        <label>调查时间<input id="bgAt" type="date" style="width:150px"></label>
        <label>结论<select id="bgRes" style="width:110px">
          <option value="clear">无异常</option><option value="risk">有风险</option>
          <option value="unknown">未确认</option></select></label>
      </div>
      <div class="form" style="margin-top:6px">
        <label style="flex:1">说明<input id="bgDetail"
          placeholder="结论是「有风险」时必须写清是什么风险（≥10 字）" style="width:100%"></label>
        <button id="bgAdd">登记背调</button>
      </div>
      ${ap && ap.status === 200 ? `<div class="kv" style="margin-top:10px">
        <span>offer 审批：${ap.body.issuable
          ? '<span class="tag ok">三步已批，可发</span>'
          : `<span class="tag warn">还差 ${(ap.body.missing_steps || []).length} 步</span>`}</span>
      </div>` : ''}`;

    const acAdd = $('#acAdd');
    if (acAdd) acAdd.onclick = async () => {
      acAdd.disabled = true;
      const res = await postJson('/api/recruit/interview', {
        rq: Number(rq), candidateKey: key,
        candidateName: key, roundNo: Number($('#acNo').value),
        interviewer: $('#acBy').value.trim(), method: $('#acWay').value,
        conclusion: $('#acCon').value, comment: $('#acCmt').value.trim(),
        scheduledAt: new Date().toISOString(),
      });
      acAdd.disabled = false;
      if (res.status !== 200) {
        return toast('bad', `<b>${esc(res.body.error || res.status)}</b> ${esc(res.body.message || '')}`);
      }
      toast('ok', '已记一轮面试');
      acLoad.click();
    };
    const bgAdd = $('#bgAdd');
    if (bgAdd) bgAdd.onclick = async () => {
      bgAdd.disabled = true;
      const res = await postJson('/api/recruit/bg', {
        candidateKey: key, kind: $('#bgKind').value,
        consentAt: $('#bgConsent').value || null,
        checkedAt: $('#bgAt').value || null,
        result: $('#bgRes').value, detail: $('#bgDetail').value.trim() || null,
      });
      bgAdd.disabled = false;
      if (res.status !== 200) {
        return toast('bad', `<b>${esc(res.body.error || res.status)}</b> ${esc(res.body.message || '')}`);
      }
      toast('ok', '已登记背调');
      acLoad.click();
    };
  };

  const rqBtn = $('#rqOpen');
  if (rqBtn) rqBtn.onclick = () => {
    rqBtn.disabled = true;
    post('/api/recruit/requisition?' + new URLSearchParams({
      org: $('#rqOrg').value, position: $('#rqPos').value.trim(),
      headcount: $('#rqNum').value, opened_at: '2026-03-05',
      reason: $('#rqReason').value.trim(),
    }), '需求已开', rqBtn);
  };

  const hiBtn = $('#hiGo');
  if (hiBtn) hiBtn.onclick = () => {
    hiBtn.disabled = true;
    post('/api/recruit/hire?' + new URLSearchParams({
      offer: $('#hiOffer').value, date: $('#hiDate').value.trim(), entity: $('#hiEntity').value,
    }), '已入职：任职 / 归属 / 月薪都按 offer 落好了', hiBtn);
  };

  const ofBtn = $('#ofIssue');
  if (ofBtn) ofBtn.onclick = () => {
    ofBtn.disabled = true;
    post('/api/recruit/offer?' + new URLSearchParams({
      rq: $('#ofRq').value, key: $('#ofKey').value.trim(), name: $('#ofName').value.trim(),
      position: '店员', amount: $('#ofAmt').value, valid_until: $('#ofUntil').value.trim(),
      on: $('#ofOn').value.trim(), reason: $('#ofReason').value.trim(),
    }), 'offer 已签发（v1）', ofBtn);
  };
}


async function viewMcp() {
  const [tl, au] = await Promise.all([
    call('/api/mcp/tools'),
    call('/api/mcp/audit'),
  ]);
  const tools = tl.body.tools || [];
  const rows = au.body.rows || [];
  const usage = au.body.usage || [];

  $('#view').innerHTML = `
    <div class="card">
      <h2>开放层工具（${tools.length}）</h2>
      <p class="note">
        <b>AI 不能直接改数据。</b>写工具必须先 <code>plan</code>（预览影响面）再 <code>execute</code>：
        参数摘要一致、一个 plan 只能用一次、5 分钟过期、影响面超阈值直接转人工。
        目录里只列<b>真的接上了</b>的工具——放一个没实现的进去，AI 会拿到「成功」而数据没变。
      </p>
      ${tools.length === 0 ? '<div class="empty">没有工具。</div>'
        : `<table><thead><tr><th>工具</th><th>说明</th><th>性质</th><th>参数</th></tr></thead>
           <tbody>${tools.map(t => `<tr>
             <td><code>${esc(t.name)}</code></td>
             <td>${esc(t.title)}</td>
             <td><span class="tag ${t.write ? 'warn' : 'ok'}">${t.write ? '写入（需 plan）' : '只读'}</span></td>
             <td class="sub">${esc((t.args || []).join(', '))}</td>
           </tr>`).join('')}</tbody></table>`}
    </div>

    <div class="card">
      <h2>最近调用（${rows.length}）</h2>
      <p class="note">
        写入的每一次都落一条审计；<b>只读也记</b>——泄露是通过读发生的。
        「影响」对写是影响行数，对读是<b>返回了多少行</b>：一个只该看 2 行的人读到 200 行，
        这个数字会说话。
      </p>
      ${rows.length === 0 ? '<div class="empty">还没有调用记录。</div>'
        : `<table><thead><tr><th>时间</th><th>工具</th><th>调用者</th><th>性质</th><th>影响行数</th></tr></thead>
           <tbody>${rows.map(x => `<tr>
             <td class="num">${esc(String(x.called_at).slice(11,19))}</td>
             <td><code>${esc(x.tool_name)}</code></td>
             <td class="num">${esc(x.actor)}</td>
             <td><span class="tag ${x.shift_run ? 'warn' : 'ok'}">${x.shift_run ? '写入' : '只读'}</span></td>
             <td class="num">${esc(x.affected ?? '—')}</td>
           </tr>`).join('')}</tbody></table>`}
    </div>

    <div class="card">
      <h2>按调用者用量（${usage.length}）</h2>
      <p class="note">
        读多写少是正常的；<b>一个人读了上千行</b>要看一眼。这张表是限流之外的另一面：
        限流挡的是频率，这张表看的是<b>形态</b>。
      </p>
      ${usage.length === 0 ? '<div class="empty">还没有调用记录。</div>'
        : `<table><thead><tr><th>调用者</th><th>读</th><th>写</th><th>最后调用</th></tr></thead>
           <tbody>${usage.map(x => `<tr>
             <td class="num">${esc(x.actor)}</td>
             <td class="num">${x.reads}</td>
             <td class="num">${x.writes}</td>
             <td class="num">${esc(String(x.last_call_at).slice(0,19).replace('T',' '))}</td>
           </tr>`).join('')}</tbody></table>`}
    </div>`;
}

async function viewApproval() {
  const [r, cc] = await Promise.all([
    call('/api/approval/tasks'),
    call('/api/approval/cc'),
  ]);
  if (r.status !== 200) return fail(r);
  const rows = r.body.rows || [];
  const ccs = cc.body.rows || [];

  $('#view').innerHTML = `
    <div class="card">
      <h2>我的待办（${rows.length}）</h2>
      <p class="note">
        待办是<b>人</b>的，不是角色的：启动时把审批人解析成行（组织授权也解析进来），
        之后改授权不影响已经发出的待办。只列<b>当前步</b>——后面步骤的任务已落行，但还不到你办。
      </p>
      ${rows.length === 0 ? '<div class="empty">没有待办。</div>'
        : `<table><thead><tr><th>实例</th><th>第几步</th><th>任务</th><th>业务</th><th>发起时间</th><th></th></tr></thead>
           <tbody>${rows.map(x => `<tr>
             <td class="num">#${x.instance_id}</td>
             <td class="num">${x.seq}</td>
             <td class="num">#${x.id}</td>
             <td>${esc(x.biz_type)} #${x.biz_id}</td>
             <td class="num">${esc(String(x.started_at).slice(0,16).replace('T',' '))}</td>
             <td>
               <button data-appr="${x.instance_id}" data-ok="1">通过</button>
               <button data-appr="${x.instance_id}" data-ok="0">驳回</button>
             </td>
           </tr>`).join('')}</tbody></table>`}
      <div class="kv">
        <span>一人驳回 → 整单否决（不等其他人）</span>
        <span>会签（mode=all）→ 全部同意才推进</span>
        <span>申请人不在审批人集合里（启动时剔除，不是点了再拒）</span>
      </div>
    </div>

    <div class="card">
      <h2>临时加签</h2>
      <p class="note">
        <b>加签改变结论，抄送只通知。</b>两者的区别不是参数，是表：加签落 <code>approval_task</code>
        （必须签，不签就走不过去），抄送落 <code>approval_cc</code>（不进"还剩几个待办"的计算）。
        加签<b>不校验角色</b>——能被加签的人，通常正是没有那个角色的人；但不能加给申请人，且必须写原因。
      </p>
      <div class="form">
        <label>任务号<input id="sgTask" placeholder="上表「任务」列的数字"></label>
        <label>加签给（用户 id）<input id="sgTo" value="3"></label>
        <label>原因<input id="sgWhy" placeholder="至少 4 个字"></label>
        <button id="sgGo">加签</button>
      </div>
      <div class="kv"><span>只能加在<b>当前步</b>，且这一步还没人处理过</span></div>
    </div>

    <div class="card">
      <h2>抄送我的（未读 ${ccs.length}）</h2>
      <p class="note">抄送不产生待办，也就不产生权力：被抄送的人去审批会得到 403。</p>
      ${ccs.length === 0 ? '<div class="empty">没有未读抄送。</div>'
        : `<table><thead><tr><th>实例</th><th>业务</th><th>单据状态</th><th>抄送时间</th><th></th></tr></thead>
           <tbody>${ccs.map(x => `<tr>
             <td class="num">#${x.instance_id}</td>
             <td>${esc(x.biz_type)} #${x.biz_id}</td>
             <td><span class="tag ${x.instance_status === 'approved' ? 'ok' : x.instance_status === 'rejected' ? 'bad' : 'warn'}">${esc(x.instance_status)}</span></td>
             <td class="num">${esc(String(x.added_at).slice(0,16).replace('T',' '))}</td>
             <td><button data-cc="${x.id}">知道了</button></td>
           </tr>`).join('')}</tbody></table>`}
    </div>`;

  $('#view').querySelectorAll('button[data-appr]').forEach(b => {
    b.onclick = () => {
      b.disabled = true;
      post(`/api/approval/act?instance=${b.dataset.appr}&approve=${b.dataset.ok}`,
           b.dataset.ok === '1' ? '已通过' : '已驳回', b);
    };
  });

  $('#view').querySelectorAll('button[data-cc]').forEach(b => {
    b.onclick = () => {
      b.disabled = true;
      post(`/api/approval/cc/seen?id=${b.dataset.cc}`, '已标记为知道', b);

  });

  $('#sgGo').onclick = () => {
    const q = new URLSearchParams({
      task: $('#sgTask').value.trim(), to: $('#sgTo').value.trim(), reason: $('#sgWhy').value.trim(),
    });
    post('/api/approval/addsign?' + q, '已加签：这一步要等他签完', $('#sgGo'));
  };
}

           </tr></thead><tbody>${rows.map(x => `<tr>
             <td>${esc(x.name)}</td>
             <td class="num">${esc(x.our_hours)}</td>
             <td class="num">${esc(x.our_amount)}</td>

           <tbody>${diffs.map(x => `<tr>
             <td>${esc(x.full_name)} <span class="sub">#${x.worker_id}</span></td>
             <td class="num">${esc(String(x.work_date).slice(0,10))}</td>
             <td><span class="tag ${x.kind === 'hours_differ' ? 'warn' : 'bad'}">${esc(x.kind)}</span></td>
             <td class="num">${esc(x.ours ?? '—')}</td>
             <td class="num">${esc(x.theirs ?? '—')}</td>
             <td class="num">${esc(x.hours_diff ?? '—')}</td>
           </tr>`).join('')}</tbody></table>`}
      <div class="kv"><span>差异 <b>${diffs.length}</b> 条 —— 有差异的单不可确认，差异不会被「顺手结掉」</span></div>
    </div>`;

  const build = $('#stBuild');
  if (build) build.onclick = () => {
    build.disabled = true;
    post(`/api/settlement/build?supplier=${$('#stSup').value}&period=${$('#stPeriod').value.trim()}`,
         '结算单已生成', build);
  };
  $('#view').querySelectorAll('button[data-sid]').forEach(b => {

      post(`/api/settlement/confirm?id=${b.dataset.sid}`, '结算单已确认', b);
    };

}

async function viewPerf() {
  const r = await call('/api/perf');
  if (r.status !== 200) return fail(r);
  const { cycles, results } = r.body;
  // ★ 默认打开**正在评的那个周期**（open），而不是 id 最小的那个：
  //   一进来看到的是"上季度已封存"，而要做的事在另一个周期里 —— 那一屏等于白开。
  const c = cycles.find(x => x.status === 'open') || cycles[0];
  let dist = [], pend = [], scored = [], scheme = null, items = [], problems = [];
  if (c) {
    const [d, pn, sc, it] = await Promise.all([
      // ★ 分布取 158 的 /dist：每档都出行（含 0 人档）。旧 /distribution 只出有人的档，
      //   报表上"这一档一个人都没有"与"方案里没有这一档"会长得一样。
      call(`/api/perf/dist?cycle=${c.id}`),
      call(`/api/perf/pending?cycle=${c.id}`),
      // 结果取 158 的 /results：带 scored_by / version / changed_count。
      // 旧的 /api/perf 只有分数，答不出"这个分是谁给的、改过几次"。
      call(`/api/perf/results?cycle=${c.id}`),
      c.scheme_id ? call(`/api/perf/items?scheme=${c.scheme_id}`) : Promise.resolve(null),
    ]);
    dist = d.body.rows || [];
    pend = pn.body.rows || [];
    scored = sc.status === 200 ? (sc.body.rows || []) : [];
    if (it && it.status === 200) {
      scheme = it.body.scheme; items = it.body.rows || [];
      problems = it.body.problems || [];
    }
  }
  const missing = pend.filter(x => x.bucket === 'missing');
  const mine = results.filter(x => x.cycle_id === c?.id);

  $('#view').innerHTML = `
    <div class="card">
      <h2>${esc(c?.name || '无周期')} · ${esc(c?.status || '')}</h2>
      <p class="note">
        <b>绩效周期必须封存才能参与算薪。</b>未封存就参与，等于按一份还会变的分发钱——
        而"算完再调分"在绩效季是常态，调完之后工资已发、绩效表也"看起来对"。
        封存那一刻，<b>系数按周期结束日生效的方案固化下来</b>，之后改方案不影响历史。
      </p>
      <div class="kv" style="margin:0 0 12px">
        <span>行数 <b>${c?.rows ?? 0}</b></span>
        <span>已评分 <b>${c?.scored ?? 0}</b></span>
        <span>喂给发薪期 <b>${esc(c?.pay_period || '—')}</b></span>
        <span>状态 <span class="tag ${c?.status === 'sealed' ? 'ok' : 'warn'}">${esc(c?.status || '—')}</span></span>
      </div>
      <button id="btnSeal" ${c?.status === 'sealed' ? 'disabled' : ''}>
        ${c?.status === 'sealed' ? '已封存' : '封存本周期（固化系数）'}
      </button>
      <div id="sealMsg" class="kv"></div>
    </div>

    <div class="card">
      <h2>录入：打分 / 不参与考核</h2>
      <p class="note">
        <b>打分即定档</b>（分数 → 档位），但 <b>系数不写</b>——系数只在封存那一刻固化。
        提前写系数，等于"系数在分数之前就定了"，而封存这件事防的正是这个。
        定不了档（方案有缺口）会直接拒，而不是存一行等封存时才发现。
      </p>
      <div class="form">
        <label>员工 id<input id="psEmp" placeholder="person_id"></label>
        <label>分数（0–100）<input id="psScore" placeholder="85"></label>
        <label>说明<input id="psNote" placeholder="可留空"></label>
        <button id="psGo" ${c?.status === 'sealed' ? 'disabled' : ''}>打分</button>
      </div>
      <div class="form" style="margin-top:8px">
        <label>员工 id<input id="pxEmp" placeholder="person_id"></label>
        <label>不参与的原因<input id="pxNote" placeholder="至少 4 个字（例：整月借调）"></label>
        <button id="pxGo" ${c?.status === 'sealed' ? 'disabled' : ''}>设为不参与</button>
      </div>
      <div class="kv">
        <span>${c?.status === 'sealed' ? '本周期已封存：改分数就是改已发的钱，两个按钮都已禁用' : '未封存：可反复改分，每次覆盖同一行'}</span>
      </div>
    </div>

    <div class="card">
      <h2>待评名单（还差 ${missing.length} 人）</h2>
      <p class="note">
        名单按「周期 × 周期内在职的人」展开，缺的那些标 <code>missing</code>。
        只看结果表的界面永远答不出"还差谁"——而封存正好卡在这件事上：
        3 人里评了 3 人与 30 人里评了 3 人，在"已评分 3"这个数字上完全一样。
      </p>
      ${pend.length === 0 ? '<div class="empty">这个周期没有在职人员。</div>'
        : `<table><thead><tr><th>员工</th><th>状态</th></tr></thead>
           <tbody>${pend.map(x => `<tr>
             <td>${esc(x.full_name || ('#' + x.employee_id))}</td>
             <td>${x.bucket === 'missing'
               ? '<span class="tag bad">未评</span>'
               : x.bucket === 'excluded'
                 ? '<span class="tag">不参与</span>'
                 : '<span class="tag ok">已评</span>'}</td>
           </tr>`).join('')}</tbody></table>`}
    </div>

    <div class="card">
      <h2>结果 <span class="sub" style="font-weight:400">
        谁评的、改过几次</span></h2>
      <p class="note">
        未参与考核是<b>显式状态 + 原因</b>，不是空值——空值会让"没考核"与"考核了没录分"同形，而两者处置相反。
        <b>每一行都带评分人与版本</b>：绩效分是拿去定系数、定钱的东西，它必须有一个签字的人。
        改分不拦，但<b>改了就一定留痕</b>（版本 N = 改过 N−1 次）——复盘时要能分清
        "看的是原始判断，还是被协调过的结果"。
      </p>
      <table><thead><tr><th>员工</th><th>状态</th><th class="num">得分</th><th>档位</th>
        <th>评分人</th><th class="num">版本</th><th>说明</th><th></th></tr></thead>
        <tbody>${(scored.length ? scored : mine).map(x => `<tr>
          <td>${esc(x.full_name || ('#' + x.employee_id))}</td>
          <td><span class="tag ${x.state === 'scored' ? 'ok' : 'warn'}">${x.state === 'scored' ? '已评分' : '未考核'}</span></td>
          <td class="num">${x.score ?? '—'}</td>
          <td>${esc(x.grade || '—')}</td>
          <td class="sub">${x.scored_by
            ? esc(x.scored_by_name || x.scored_by)
            : '<span class="tag warn">未记录</span>'}</td>
          <td class="num">${x.version ?? '—'}${Number(x.changed_count) > 0
            ? `<div class="sub">改过 ${x.changed_count} 次</div>` : ''}</td>
          <td class="sub">${esc(x.note || '')}</td>
          <td>${Number(x.changed_count) > 0
            ? `<button class="ghost" data-hist="${x.employee_id}">改分史</button>` : ''}</td>
        </tr>`).join('') || '<tr><td colspan="8" class="sub">本期还没有结果</td></tr>'}</tbody></table>
      <div id="histArea"></div>
    </div>

    <div class="card">
      <h2>加权考核项 <span class="sub" style="font-weight:400">
        ${scheme ? `方案 v${scheme.version} · ${esc(scheme.agg_rule || 'weighted')}` : '未配置方案'}</span></h2>
      <p class="note">
        门店的真实形态不是"一个 0–100 的总分"，而是 <b>营业额 40% + 客诉 20% + 卫生 20% + 出勤 20%</b>。
        "92 分"解释不了哪一项拖了后腿，也让店长没法就那一项去谈。
        <b>折分、加权、封顶全在库里</b>（<code>fn_perf_item_score</code> / <code>fn_perf_total</code>）——
        这里再算一遍，页面上的分与工资条读的那个分迟早会不一样。
        权重合计必须等于 1，<b>存的时候就校验</b>：等到汇总才发现加起来 0.95，
        那时已经有人按"评过了"在沟通了。
      </p>
      ${items.length === 0 ? `<div class="empty">
          这个方案还没有考核项。先配指标，再录实际值 —— 否则总分只能靠"拍一个 0–100"。</div>`
        : `<div class="kv" style="margin:0 0 10px">
            <span>考核项 <b>${items.length}</b></span>
            <span>权重合计 <b>${Number(items.reduce((a, x) => a + Number(x.weight), 0)).toFixed(2)}</b></span>
            ${problems.length
              ? `<span class="tag bad">体检 ${problems.length} 条</span>`
              : '<span class="tag ok">体检通过</span>'}
          </div>
          ${problems.length ? `<div class="kv sub" style="margin-bottom:8px">
            ${problems.map(pp => `<span>${esc(pp.metric_code)}：${esc(pp.problem)}</span>`).join('')}
          </div>` : ''}
          <table><thead><tr><th>指标</th><th>类别</th><th class="num">权重</th>
            <th class="num">目标</th><th>方向</th><th class="num">上限</th><th>公式</th></tr></thead>
            <tbody>${items.map(x => `<tr>
              <td><b>${esc(x.metric_name)}</b><div class="sub"><code>${esc(x.metric_code)}</code></div></td>
              <td class="sub">${esc({ quant: '量化', behavior: '行为价值观', bonus: '加分项', penalty: '扣分项' }[x.kind] || x.kind)}</td>
              <td class="num"><b>${(Number(x.weight) * 100).toFixed(0)}%</b></td>
              <td class="num">${x.target_value === null ? '<span class="sub">无（录入值即得分）</span>' : esc(x.target_value)}</td>
              <td class="sub">${esc(x.direction === 'down' ? '越小越好' : '越大越好')}</td>
              <td class="num">${esc(x.score_max)}</td>
              <td class="sub">${x.formula ? `<code>${esc(x.formula)}</code>` : '—'}</td>
            </tr>`).join('')}</tbody></table>

          <div class="form" style="margin-top:10px">
            <label>员工 id<input id="piEmp" placeholder="person_id" style="width:110px"></label>
            ${items.map(x => `<label>${esc(x.metric_name)}
              <input data-item="${x.id}" data-code="${esc(x.metric_code)}"
                placeholder="${x.target_value === null ? '实际值' : `目标 ${esc(x.target_value)}`}"
                style="width:110px"></label>`).join('')}
          </div>
          <div class="form" style="margin-top:6px">
            <button id="piGo">录实际值并算加权总分</button>
            <span class="sub" style="align-self:center">
              留空的那一项按 0 计、不重新归一（归一化会让"少打一项"变成"分数被抬高"）</span>
          </div>
          <div id="piMsg" class="kv"></div>`}
    </div>

    <div class="card">
      <h2>强制分布 <span class="sub" style="font-weight:400">每档都出行</span></h2>
      <p class="note">
        只报不拦——拦的后果是有人去调分，而调过的分与真分在表里同形，看不出来。
        <b>0 人的档也占一行</b>：少了那一行，"这一档一个人都没有"（要有人去谈，执行没到位）
        与"方案里没有这一档"（不用管）就再也分不开了。
      </p>
      ${dist.length === 0 ? '<div class="empty">无数据</div>'
        : `<table><thead><tr><th>档位</th><th class="num">人数</th><th class="num">占比</th>
             <th class="num">目标</th><th class="num">偏离</th></tr></thead>
           <tbody>${dist.map(d => `<tr${Number(d.n) === 0 ? ' style="opacity:.6"' : ''}>
             <td>${esc(d.grade)}${Number(d.n) === 0 ? ' <span class="tag">这一档没人</span>' : ''}</td>
             <td class="num">${d.n}</td>
             <td class="num">${d.pct === null ? '<span class="masked">无分母</span>' : `${esc(d.pct)}%`}</td>
             <td class="num">${d.target_pct === null ? '<span class="sub">不参与</span>' : `${esc(d.target_pct)}%`}</td>
             <td class="num">${d.over_by === null ? '—' : (Number(d.over_by) > 0
               ? `<b style="color:var(--bad)">+${esc(d.over_by)}</b>` : esc(d.over_by))}</td>
           </tr>`).join('')}</tbody></table>`}
    </div>`;

  // ---- 与上期对比：逐项差异 + 归因 ----
  const sd = $('#slipDiff');
  if (sd) sd.onclick = async () => {
    const box = $('#slipDiffBox');
    const w = await call(`/api/payslip/diff?person=${sd.dataset.person}&period=${sd.dataset.period}`);
    if (w.status !== 200) {
      box.innerHTML = `<p class="sub" style="color:var(--bad,#b4261d)">
        ${esc(w.body.error || w.status)} ${esc(w.body.message || '')}</p>`;
      return;
    }
    const d = w.body.rows || [];
    const e = w.body.explain || [];
    const kindCn = { changed: '变动', added: '新增', removed: '消失', same: '不变' };
    if (!d.length) {
      box.innerHTML = `<p class="sub" style="margin-top:8px">${e.map(x => esc(x.msg)).join('；')}</p>`;
      return;
    }
    box.innerHTML = `
      <div style="margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)">
        <b>和上一期（${esc(w.body.base || '上月')}）比</b>
        <ul style="margin:6px 0 8px;padding-left:18px;font-size:13px">
          ${e.map(x => `<li>${esc(x.msg)}</li>`).join('')}
        </ul>
        <!-- ★ stack2：这张表 5 列共 610px，在 335px 的卡片里 **「金额」整列不可见**——
             而这一屏存在的唯一理由就是回答"哪一项变了、变了多少"。 -->
        <table class="stack2"><thead><tr>
          <th>项目</th><th class="num">上期</th>
          <th class="num">本期</th><th class="num">差额</th>
          <th></th></tr></thead><tbody>
          ${d.map(x => `<tr>
            <td>${esc(x.item_name)} <span class="sub">${esc(x.item_code)}</span></td>
            <td class="num sub" data-label="上期">${fmt(x.prev_amount)}</td>
            <td class="num" data-label="本期">${fmt(x.cur_amount)}</td>
            <td class="num" data-label="差额" style="color:${Number(x.diff) < 0 ? 'var(--bad)' : (Number(x.diff) > 0 ? 'var(--ok)' : 'inherit')}">
              <b>${Number(x.diff) > 0 ? '+' : ''}${fmt(x.diff)}</b></td>
            <td>${x.kind === 'changed' ? '<span class="tag warn">变动</span>'
                 : x.kind === 'added' ? '<span class="tag ok">新增</span>'
                 : x.kind === 'removed' ? '<span class="tag">消失</span>'
                 : '<span class="sub">不变</span>'}</td>
          </tr>`).join('')}
        </tbody></table>
        <p class="sub" style="margin-top:4px">
          差额为正是本月多发、为负是少发。上面那几条是能对上账的原因；
          对不上的部分会明说"需要人工核对"，不硬编一个理由。
        </p>
      </div>`;
  };

  // ---- 录提成 / 报销：写的是同一个人的当期的两本账，只是去向不同 ----
  const btnC = $('#commAdd');
  if (btnC) {
    btnC.onclick = async () => {
      const amt = Number($('#commAmt').value);
      if (!(amt >= 0) || !$('#commAmt').value) return toast('bad', '<b>E_ARG</b> 提成金额必须是非负数');
      const w = await call(`/api/commission?person=${person}&period=${period}`
        + `&amount=${amt}&basis=${encodeURIComponent($('#commBasis').value || '')}`, { method: 'POST' });
      if (w.status !== 200) return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
      toast('ok', `提成 <b>${amt}</b> 已录入（计入应发、参与计税）`);
      viewPayslip();
    };
  }
  // ---- 工资表导入：读文件 → 原始请求体上传 → 逐行结论 → 应用 ----
  const impGo = $('#impGo');
  if (impGo) {
    impGo.onclick = async () => {
      const f = $('#impFile')?.files?.[0];
      if (!f) return toast('bad', '<b>E_FILE</b> 先选一个文件（.xlsx / .csv）');
      const kind = $('#impKind').value;
      const per = $('#impPeriod').value.trim();
      const box = $('#impResult');
      box.innerHTML = '<div class="empty">正在解析…</div>';
      impGo.disabled = true;
      let buf;
      try { buf = await f.arrayBuffer(); } catch { buf = null; }
      impGo.disabled = false;
      if (!buf) { box.innerHTML = '<div class="empty">读不出这个文件</div>'; return; }

      const res = await fetch(`/api/salary/import?kind=${kind}&filename=${encodeURIComponent(f.name)}`
        + `&period=${encodeURIComponent(per)}`, {
        method: 'POST',
        headers: { 'content-type': 'application/octet-stream',
                   ...(token ? { authorization: `Bearer ${token}`, 'x-aihr-token': token } : {}) },
        body: buf,
      });
      let out = {};
      try { out = await res.json(); } catch { out = {}; }
      if (res.status !== 200) {
        box.innerHTML = `<div class="empty">导入被拒：<b>${esc(out.error || res.status)}</b> ${esc(out.message || '')}</div>`;
        return;
      }
      const bad = out.rows.filter(r => !r.ok);
      const colOf = (r) => Object.entries(r.payload).filter(([k]) => k !== 'person_id')
        .map(([k, v]) => `${k}=${v}`).join('  ');
      box.innerHTML = `
        <div class="kv" style="margin:10px 0 6px">
          <span>批次 <b>#${out.batch_id}</b></span>
          <span>共 <b>${out.total}</b> 行</span>
          <span>通过 <b style="color:var(--ok)">${out.ok}</b></span>
          <span>未通过 <b style="color:${bad.length ? 'var(--bad)' : 'var(--fg-2)'}">${out.fail}</b></span>
        </div>
        <table class="stack"><thead><tr><th>行</th><th>结论</th><th>内容</th></tr></thead>
          <tbody>${out.rows.map(r => `<tr>
            <td class="num">行 ${r.row_no}</td>
            <td data-label="结论">${r.ok ? '<span class="tag ok">通过</span>'
                       : `<span class="tag bad">未通过</span> <span class="sub">${esc(r.error)}</span>`}</td>
            <td class="sub" data-label="内容">${esc(colOf(r))}</td>
          </tr>`).join('')}</tbody></table>
        ${kind === 'data' && out.fail === 0
          ? `<div class="form" style="margin-top:10px">
               <button id="impApply">应用到 ${esc(per)} 的工资结构</button>
               <span class="sub" style="align-self:center">会把每人的合计写成月薪标准，并按列拆成结构</span>
             </div>` : ''}`;

      const ap = $('#impApply');
      if (ap) {
        ap.onclick = async () => {
          ap.disabled = true;
          const w = await call(`/api/salary/import/apply?batch=${out.batch_id}&period=${encodeURIComponent(per)}`,
            { method: 'POST' });
          ap.disabled = false;
          if (w.status !== 200) {
            return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
          }
          toast('ok', `已应用：<b>${w.body.applied}</b> 人的工资结构（期间 ${esc(w.body.period)}）`);
          viewPayslip();
        };
      }
    };
  }

  const btnE = $('#expAdd');
  if (btnE) {
    btnE.onclick = async () => {
      const amt = Number($('#expAmt').value);
      if (!(amt > 0)) return toast('bad', '<b>E_ARG</b> 报销金额必须大于 0');
      const w = await call(`/api/expense?person=${person}&period=${period}`
        + `&category=${encodeURIComponent($('#expCat').value)}&amount=${amt}`, { method: 'POST' });
      if (w.status !== 200) return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
      toast('ok', `报销单 <b>${amt}</b> 已提交（待审批，不计税、不进工资条）`);
      viewPayslip();
    };
  }
}

// ============================================================================
// 离职结算：经济补偿金 + 代通知金 + 年假折现
// ----------------------------------------------------------------------------
// 这一页只解决一个问题：**离职那天到底该付多少钱**，以及为什么是这个数。
//
// 三个数各有各的算法，混在一起就是灾难：
//   · 经济补偿金：按本单位年限 × 前 12 个月平均工资，超三倍社平要封顶且年限封 12；
//   · 代通知金：只有第 40 条情形才给，按上月工资（不是 12 个月平均）；
//   · 年假折现：已经在 129 里登记过，这里只取数合计。
//
// 而且补偿金的个税是**单独计税**的（3 倍社平以内免征、超过部分按年表单独算），
// 绝不能并进当月工资 —— 并进去那个月的累计预扣就乱了，而且改不回来。

function fail(r) {
  // 428：登录了，但必须先改口令。这不是"权限不够"，所以不弹登录框，直接给表单。
  if (r.status === 428) {
    $('#view').innerHTML = `<div class="card">
      <h2>必须先修改口令</h2>
      <p class="note">
        这个账号用的是临时口令。<b>未改密前，除改口令外的接口一律拒绝（428）</b>——
        用 200 + 提示语的做法会被前端忽略，而忽略的代价是临时口令继续有效。
      </p>
      <div class="form">
        <label>当前口令<input id="pwdOld" type="password" value="temp1234"></label>
        <label>新口令<input id="pwdNew" type="password" value="demo5678"></label>
        <button id="pwdGo">修改</button>
      </div>
      <div class="kv"><span>改完之后，<b>其它设备上的会话会被立刻吊销</b>（只保留当前这个）</span></div>
    </div>`;
    $('#pwdGo').onclick = () => {
      const q = new URLSearchParams({ old: $('#pwdOld').value, new: $('#pwdNew').value });
      post('/api/me/password?' + q, '口令已修改，其它会话已吊销');
    };
    return;
  }
  // ★ 403 不是“请求失败”：它是“你这个角色没这个页的读权限”。
  //   原来一律写“请求失败 HTTP 403”，看起来像服务坏了，
  //   而事实上换个账号就能看 —— 这一句差别很大。
  if (r.status === 403) {
    $('#view').innerHTML = `<div class="card">
      <h2>这个页面你的角色看不了</h2>
      <p class="note">岗位权限拒绝（\`${esc(r.body.error || 'E_RESOURCE_FORBIDDEN')}\`）。
        它不是系统故障——是这个账号没有对应资源的读权限。</p>
      <div class="form" style="flex-wrap:wrap;gap:8px">
        ${USERS.map((u) => `<button class="ghost" data-login="${u.id}"
           title="${esc(u.hint)}">换成：${esc(u.name)}</button>`).join('')}
      </div>
    </div>`;
    $('#view').querySelectorAll('button[data-login]').forEach((b) => {
      b.onclick = () => login(Number(b.dataset.login));
    });
    return;
  }
  $('#view').innerHTML = `<div class="card"><h2>请求失败</h2>
    <p class="note">HTTP ${r.status} · ${esc(r.body.error || '')}</p></div>`;
}

// 身份也能进 URL（?as=5）：截图、贴链接时不用再描述"点第几个身份"
const AS = Number(new URLSearchParams(location.search).get('as'));
// ★ 真实帐套里账号不止演示那 5 个：`?u=13&pwd=demo1234` 直接以该账号登录。
//   没有它就只能看 1..5 号，而"演示帐套 31 个人各自的视角"正是要验的东西。
{
  const q = new URLSearchParams(location.search);
  const qu = Number(q.get('u') || 0);
  if (Number.isInteger(qu) && qu > 0) login(qu, q.get('pwd') || null);
  // ★ 这里必须把 pwd 也传下去：`?as=1&pwd=demo1234` 是测试与排障的常用写法，
  //   原来只认 ?u= 的 pwd，?as= 的 pwd 被丢掉 → 用 PWD_OF(1) 去登，
  //   而 1 号在演示帐套里是 admin1234、在切片库里是 demo1234，两边只能对一个。
  // 默认进 4（集团人事）：它是"什么都看得到、又刚好是业务角色"的那个视角。
  // 1 号（系统管理员）与 2 号（帐套管理员）没有「审批」读权限，首页两块是「—」——
  // 那不是坏了，但第一次打开就看到两个破折号，会被当成没做好。
  else login(USERS.some(u => u.id === AS) ? AS : 4, q.get('pwd') || null);
}
</script>
</body>
</html>
