  const orgs = (await call('/api/account')).status === 200 ? [] : [];

  $('#view').innerHTML = `
    <div class="card">
      <h2>帐套 ${L ? `<span class="tag ${L.status === 'active' ? 'ok' : 'warn'}">${
        L.status === 'active' ? '已启用' : '草稿'}</span>` : ''}</h2>
      ${ALL.length > 1 ? `<div class="kv">${ALL.map(x => `<span>${esc(x.name)}
        <span class="sub">${esc(x.code)} · 组织 ${x.orgs} · 账号 ${x.accounts}${
          x.is_default ? ' · 默认' : ''}</span></span>`).join('')}</div>` : ''}
      ${L ? `<div class="kv">
        <span>${esc(L.name)} <span class="sub">${esc(L.code)}</span></span>
        <span>启用期间 <b>${esc(L.start_period)}</b></span>
        <span>组织 <b>${L.orgs}</b></span><span>账号 <b>${L.accounts}</b></span>
      </div>
      ${L.status === 'draft' ? '<button id="lgAct">启用帐套</button>' : ''}`
      : `<p class="note">还没有帐套。填三项即可开：编码、名称、启用期间。
          <b>启用期间一旦写定不再改</b>——改它等于让已经算过的薪换个会计期间。</p>
        <div class="kv">
          <input id="lgCode" placeholder="编码，如 YH-001" value="YH-001">
          <input id="lgName" placeholder="公司名称" value="示例餐饮集团">
          <input id="lgPeriod" placeholder="启用期间 YYYY-MM" value="2026-06">
          <button id="lgOpen">开帐套</button>
        </div>`}
      ${L ? `<div class="kv" style="margin-top:10px">
        <input id="lgCode" placeholder="新帐套编码" value="">
        <input id="lgName" placeholder="新帐套名称" value="">
        <input id="lgPeriod" placeholder="启用期间 YYYY-MM" value="2026-07">
        <button id="lgNew">再开一个帐套</button></div>
        <p class="sub">可以建多个集团帐套（不同法人/城市）。<b>但业务表还没按帐套分区</b>——
        现在能把组织与账号分开建，两个帐套同时产生考勤/工资还不行（已登记为债）。</p>` : ''}
    </div>

    <div class="card">
      <h2>加门店</h2>
      <p class="note">层级硬约束：<b>集团 → 区域 → 门店</b>。门店下面不能再挂门店——
        否则"这家店几个人"的汇总会把下级店算进去。</p>
      <div class="kv">
        <select id="orgParent"><option value="">（作为集团根）</option></select>
        <input id="orgName" placeholder="门店/区域名称">
        <select id="orgKind"><option value="store">门店</option><option value="region">区域</option></select>
        <button id="orgAdd">添加</button>
      </div>
      <p class="sub">上级从「组织」页读；这里先支持填父组织 id。</p>
    </div>

    <div class="card">
      <h2>加账号</h2>
      <p class="note">一个账号 = 主档 + 角色 + 数据范围。角色决定"能碰哪类事"，
        范围决定"能看哪些行"——两者分开，加范围不会顺手给权。</p>
      <div class="kv">
        <input id="acLogin" placeholder="登录名，如 s01m">
        <input id="acName" placeholder="显示名">
        <select id="acRole">${roles.map(x => `<option value="${x}">${x}</option>`).join('')}</select>
        <input id="acOrg" placeholder="数据范围组织 id（空=全集团）">
        <button id="acAdd">创建</button>
      </div>
    </div>`;

  const swallow = (id, fn) => { const b = $('#' + id); if (b) b.onclick = () => fn(b); };
  swallow('lgOpen', (b) => {
    b.disabled = true;
    post(`/api/ledger/open?code=${encodeURIComponent($('#lgCode').value)}`
      + `&name=${encodeURIComponent($('#lgName').value)}`
      + `&period=${encodeURIComponent($('#lgPeriod').value)}`, '帐套已开', b);
  });
  swallow('lgAct', (b) => post('/api/ledger/activate', '帐套已启用', b));
  swallow('lgNew', (b) => {
    b.disabled = true;
    post(`/api/ledger/open?code=${encodeURIComponent($('#lgCode').value)}`
      + `&name=${encodeURIComponent($('#lgName').value)}`
      + `&period=${encodeURIComponent($('#lgPeriod').value)}`, '新帐套已开', b);
  });
  swallow('orgAdd', (b) => {
    const parent = $('#orgParent').value.trim();
    post(`/api/org?name=${encodeURIComponent($('#orgName').value)}`
      + `&kind=${$('#orgKind').value}${parent ? `&parent=${parent}` : ''}`, '组织已添加', b);
  });
  swallow('acAdd', (b) => {
    const org = $('#acOrg').value.trim();
    post(`/api/account?login=${encodeURIComponent($('#acLogin').value)}`
      + `&display=${encodeURIComponent($('#acName').value)}`
      + `&role=${$('#acRole').value}${org ? `&org=${org}` : ''}`, '账号已创建（口令 demo1234）', b);
  });
}

// ============================================================================
// 排班看板：人（行）× 日（列）× 班次（颜色），鼠标/手指拖着划一片
// ----------------------------------------------------------------------------
// 操作手感对齐"高级排班"：选一个班次 → 在格子上按住拖 → 松手提交。
// 一个格 = 一人一天一个班（库里是 UNIQUE(employee_id, work_date)）：
// 两班并存等于同一天两个工时，而那是"拆班"，不是排班。
// 排班页当前门店。★ 145 起周视图/排班/确认都按门店走（写入要落到 schedule.store_id），
// 所以这一页不再是"全员视图"—— 那是旧看板的能力，代价是写不进任何门店。
let RSTORE = 10;

async function viewRoster() {
  // ★ 数据源：/api/roster/week（读 schedule / schedule_segment，145 的写入目标）。
  //   原来读 /api/roster —— 它读的是 roster_slot，而 145 的 fn_roster_assign 写
  //   schedule。**两个数据源**，于是"排完班看不见自己排的班"。
  //   roster_slot 现在只剩历史数据，页面不再读它。
  const from = TODAY;
  const r = await call(`/api/roster/week?store=${RSTORE}&from=${from}&days=7`);
  if (r.status !== 200) return fail(r);
  const { shifts, rows, people: PEOPLE } = r.body;

  // 行：按人聚合；列：7 天
  const days = Array.from({ length: 7 }, (_, i) =>
    new Date(Date.parse(from + 'T00:00:00Z') + i * 86400000).toISOString().slice(0, 10));
  // 行标题来自 people（"这一周一个人都没排"也要有行，否则看起来像这家店没人）；
  // 格子来自 rows（**稀疏**：没排班的那天不出现，排了休息才有一行且 is_rest=true）。
  // 业务时区的时分：start_at 是 UTC 的 ISO，直接 slice 会差 8 小时
  const hmOf = (v) => {
    if (!v) return '';
    try {
      return new Date(v).toLocaleTimeString('zh-CN',
        { timeZone: TZ, hour: '2-digit', minute: '2-digit', hour12: false });
    } catch { return ''; }
  };

  const people = (PEOPLE || []).map(p => ({
    id: Number(p.employee_id), name: p.person_name, no: p.employee_no,
  }));
  // ★ 一天可能有多段（划线排班），周视图一格只放得下一个班次名：
  //   取最早那段显示，其余用 "+N" 计数 —— 直接覆盖会让同一格叠出两行字。
  const cellOf = new Map();
  for (const x of rows) {
    const k = `${x.employee_id}|${String(x.work_date).slice(0, 10)}`;
    const cur = cellOf.get(k);
    if (!cur) { cellOf.set(k, { ...x, _more: 0 }); continue; }
    cur._more = (cur._more || 0) + 1;
  }

  $('#view').innerHTML = `
    <div class="card">
      <h2>排班看板 · 门店 <span id="rsStoreWrap">${RSTORE}</span> · ${esc(from)} 起 7 天
        <span style="flex:1"></span>
        <label class="sub" style="font-weight:400">门店
          <select id="rsStore" style="width:110px">
            <option value="10" ${RSTORE === 10 ? 'selected' : ''}>A 店</option>
            <option value="11" ${RSTORE === 11 ? 'selected' : ''}>B 店</option>
            <option value="12" ${RSTORE === 12 ? 'selected' : ''}>C 店</option>
          </select></label>
      </h2>
      <p class="note">
        选一个班次，然后在格子上<b>按住拖动</b>划一片，松手即保存。
        <b>一个格 = 一人一天一个班</b>（两班并存等于同一天两个工时，那是拆班不是排班）。
        看板只记"谁上哪个班"，<b>不参与算薪</b>——工时仍走排班段 → 考勤日那条链路。
      </p>
      <div class="legend" id="legend">
        ${(shifts || []).map(x => `<span><i class="sw" style="background:${esc(x.color)}"></i>
          <b>${esc(x.name)}</b>${x.is_rest ? '' : ` ${esc(String(x.start_time).slice(0,5))}-${esc(String(x.end_time).slice(0,5))}`}</span>`).join('')}
        <span style="margin-left:auto">本周已排 <b>${rows.length}</b> 格 ·
          未排 <b>${Math.max(people.length * 7 - (rows || []).filter(r => !r.is_rest).length, 0)}</b> 格</span>
      </div>
      <div class="palette" id="palette">
        ${shifts.map((s, i) => `<span class="chip ${i === 0 ? 'on' : ''}" data-code="${esc(s.code)}">
          <span class="dot" style="background:${esc(s.color)}"></span>${esc(s.name)}</span>`).join('')}
        <span class="chip" data-code=""><span class="dot" style="background:#fff;border:1px solid #cbd5e1"></span>清除</span>
      </div>
      <div class="roster-wrap"><table class="roster">
        <thead><tr><th style="text-align:left">员工</th>
          ${days.map(d => `<th>${d.slice(5)}<div class="sub">${'日一二三四五六'[new Date(d + 'T00:00:00Z').getUTCDay()]}</div></th>`).join('')}
        </tr></thead>
        <tbody>${people.map(p => `<tr>
          <td class="name">${esc(p.name)}<div class="sub">${esc(p.no || '')}</div></td>
          ${days.map(d => {
            const c = cellOf.get(`${p.id}|${d}`);
            const bg = c && c.color ? c.color : '';
            return `<td class="cell ${bg ? ('shift-' + (c.shift_code || '')) : 'empty'}"
              data-emp="${p.id}" data-date="${d}"
              style="${bg ? `background:${bg}` : ''}"
              title="${c && c.shift_name ? esc(c.shift_name) : '未排班'}">
              ${c ? (c.is_rest
                ? '<div class="sn">休</div><div class="st">休息</div>'
                : `<div class="sn">${esc(c.shift_name || '')}${c._more ? ` +${c._more}` : ''}</div>
                   <div class="st">${hmOf(c.start_at)}-${hmOf(c.end_at)}</div>`)
                : ''}</td>`;
          }).join('')}
        </tr>`).join('')}</tbody>
      </table></div>
      <p class="roster-hint">提示：手机/Pad 上可用手指划（同一套页面，不装 App）。</p>
    </div>`;

  // ---- 配色选择 ----
  let paintCode = shifts[0] ? shifts[0].code : 'EARLY';
  $('#palette').querySelectorAll('.chip').forEach(el => {
    el.onclick = () => {
      $('#palette').querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
      el.classList.add('on');
      paintCode = el.dataset.code;      // 空串 = 清除
    };
  });

  // ---- 拖拉划线 ----
  let dragging = false;
  const picked = new Set();
  const key = (td) => `${td.dataset.emp}|${td.dataset.date}`;
  const paintSel = (on) => (td) => { td.classList.toggle('sel', on); on ? picked.add(td) : picked.delete(td); };

  const down = (ev) => {
    if (!ev.target.classList || !ev.target.classList.contains('cell')) return;
    ev.preventDefault();
    dragging = true; picked.clear();
    paintSel(true)(ev.target);
  };
  const over = (ev) => {
    if (!dragging) return;
    const td = ev.target.closest ? ev.target.closest('.cell') : null;
    if (td && !td.classList.contains('sel')) paintSel(true)(td);
  };
  const up = async () => {
    if (!dragging) return;
    dragging = false;
    const cells = [...picked];
    cells.forEach(td => td.classList.remove('sel'));
    picked.clear();
    if (!cells.length) return;
    const dates = [...new Set(cells.map(c => c.dataset.date))];
    const emps = [...new Set(cells.map(c => c.dataset.emp))];
    // ★ 逐格写 /api/roster/assign（写 schedule）。原来是 /api/roster/paint
    //   （写 roster_slot）—— 那条路上排的班，周视图和确认流程都看不到。
    //   多格 = 多次调用：拖动一圈最多 7 格，这个量可以接受，
    //   而"批量"要再造一个批量接口，收益不如先把两套数据源合成一套。
    let ok = 0, firstErr = null;
    for (const td of cells) {
      const q = new URLSearchParams({
        employee: td.dataset.emp, date: td.dataset.date,
        shift: paintCode, store: String(RSTORE),
      });
      if (paintCode) {
        const res = await call('/api/roster/assign?' + q.toString(), { method: 'POST' });
        if (res.status === 200) ok++; else firstErr = firstErr || res.body;
      } else {
        const res = await call('/api/roster/clear?' + q.toString(), { method: 'POST' });
        if (res.status === 200) ok++;
      }
    }
    if (!ok) return toast('bad', `<b>${esc((firstErr && firstErr.error) || '排班失败')}</b>`
      + ` ${esc((firstErr && firstErr.message) || '')}`);
    // 手感：本地立即上色（不等重画），随后再按真实数据重画一次
    const color = paintCode ? (shifts.find(x => x.code === paintCode) || {}).color : '';
    const name = paintCode ? (shifts.find(x => x.code === paintCode) || {}).name : '';
    for (const td of cells) {
      td.style.background = color || '';
      td.textContent = name || '';
      td.classList.toggle('empty', !color);
    }
    toast('ok', paintCode ? `已排班 ${ok} 格` : `已清除 ${ok} 格`);
    setTimeout(() => viewRoster(), 400);
  };

  // ---- 本周覆盖：哪几天没人 ----
  // ★ 排班表最容易漏的不是"排错了"，是"整整一天没人排" —— 而那天在表格里
  //   只是一列空白，跟"大家都休息"长得一样。所以单独算一遍：
  //   这一天有几个人上班、都是什么班；一个人都没有就标出来。
  {
    const byDay = new Map(days.map(d => [d, []]));
    for (const x of rows) {
      if (x.is_rest) continue;
      const d = String(x.work_date).slice(0, 10);
      if (byDay.has(d)) byDay.get(d).push(x);
    }
    const shiftCount = new Map();
    for (const x of rows) {
      if (x.is_rest) continue;
      const k = x.shift_code;
      shiftCount.set(k, (shiftCount.get(k) || 0) + 1);
    }
    const empty = days.filter(d => byDay.get(d).length === 0);
    const wrap2 = document.querySelector('.roster-wrap');
    if (wrap2 && wrap2.closest('.card')) {
      const card2 = document.createElement('div');
      card2.className = 'card';
      card2.innerHTML = `
        <h2>本周覆盖 <span class="sub" style="font-weight:400">
          ${people.length} 人 × 7 天 · ${empty.length ? `<b style="color:var(--bad,#b4261d)">${empty.length} 天没人</b>` : '每天都有安排'}</span></h2>
        <p class="note">
          表格里的一列空白，可能是"大家都休息"，也可能是"没人排" —— 两者看起来一样。
          这里按天算一遍：<b>一个人都没有的那天标红</b>，它才是真正要补的洞。
        </p>
        <div class="tier-grid" style="grid-template-columns:repeat(7,1fr);margin:0 0 8px">
          ${days.map(d => {
            const list = byDay.get(d) || [];
            const isEmp = list.length === 0;
            return `<div class="tier" style="${isEmp ? 'border-color:var(--bad,#b4261d);background:rgba(180,38,29,.05)' : ''}">
              <div class="k">${d.slice(5)} ${'日一二三四五六'[new Date(d + 'T00:00:00Z').getUTCDay()]}</div>
              <div class="v" style="font-size:16px;color:${isEmp ? 'var(--bad,#b4261d)' : 'inherit'}">
                ${isEmp ? '0' : list.length}<span>人</span></div>
              <div class="k">${isEmp ? '无人排班' : [...new Set(list.map(x => x.shift_name))].join(' / ')}</div>
            </div>`;
          }).join('')}
        </div>
        <div class="kv">
          ${(shifts || []).filter(x => !x.is_rest).map(x =>
            `<span>${esc(x.name)} <b>${shiftCount.get(x.code) || 0}</b> 人日</span>`).join('')}
          <span>休息 <b>${(rows || []).filter(r => r.is_rest).length}</b> 人日</span>
        </div>`;
      wrap2.closest('.card').after(card2);
    }
  }

  // ---- 借调 / 人员调度（153）----
  // 产品案例里出现频率最高的一条（潮牛壹号、上海物语、傣妹、京小盒都提到）：
  // 借出 → 审批 → 自动调入目标门店 → 到期自动回。
  {
    const dp = await call('/api/roster/dispatch?org=' + RSTORE);
    if (dp.status === 200) {
      const L = dp.body.rows || dp.body || [];
      const ST = { draft: '待批', approved: '借调中', rejected: '已驳回',
                   cancelled: '已撤销', finished: '已结束' };
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <h2>借调 / 人员调度 <span class="sub" style="font-weight:400">
          ${Array.isArray(L) ? L.length : 0} 条 · 借出后自动调入对方门店，到期自动回</span></h2>
        <p class="note">
          不是"每天跑个作业把人搬来搬去"，而是<b>写一条带有效期的门店归属</b>：
          借调期内考勤自动落到对方门店、<b>工时成本按组织自动分摊</b>、到期自然失效。
          前者要调度器、会漏跑、会重复搬；后者过期即失效。
        </p>
        <table class="stack"><thead><tr>
          <th style="width:140px">人</th><th style="width:150px">借出 → 借入</th>
          <th style="width:170px">期间</th><th style="width:80px">状态</th>
          <th>原因</th><th style="width:110px"></th>
        </tr></thead><tbody>
          ${(Array.isArray(L) ? L : []).map(x => `<tr>
            <td><b>${esc(x.person_name || x.employee_name || ('#' + x.employee_id))}</b></td>
            <td class="sub" data-label="借出→借入">${esc(x.from_org_name || ('#' + x.from_org))}
              → ${esc(x.to_org_name || ('#' + x.to_org))}</td>
            <td class="sub" data-label="期间">${esc(String(x.from_date).slice(0,10))} ~
              ${esc(String(x.to_date).slice(0,10))}</td>
            <td data-label="状态">${x.status === 'approved' ? '<span class="tag ok">借调中</span>'
              : (x.status === 'draft' ? '<span class="tag warn">待批</span>'
              : `<span class="tag">${esc(ST[x.status] || x.status)}</span>`)}</td>
            <td class="sub" data-label="原因">${esc(x.reason || '')}</td>
            <td style="white-space:nowrap">${x.status === 'draft' ? `
              <button data-dp-ok="${x.id}">通过</button>
              <button class="ghost" data-dp-no="${x.id}">驳回</button>` : ''}
              ${x.status === 'approved' ? `<button class="ghost" data-dp-end="${x.id}">提前结束</button>` : ''}</td>
          </tr>`).join('') || `<tr><td colspan="6" class="sub">
            还没有借调单。门店高峰期从别店借人，走这里 —— 借完自动调回，不用手工改归属。</td></tr>`}
        </tbody></table>
        <div class="form" style="margin-top:10px">
          <label>人<input id="dpEmp" type="number" placeholder="person id" style="width:96px"></label>
          <label>借到<input id="dpTo" type="number" value="11" style="width:80px"></label>
          <label>从<input id="dpFrom" type="date" value="${from}" style="width:150px"></label>
          <label>到<input id="dpToDate" type="date" value="${from}" style="width:150px"></label>
          <label>原因<input id="dpWhy" placeholder="晚市缺人，B 店支援" style="width:180px"></label>
          <button id="dpGo">提交借调</button>
        </div>`;
      document.querySelector('#view').appendChild(card);

      const go = async (path, label) => {
        const w = await call(path, { method: 'POST' });
        if (w.status !== 200) {
          return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
        }
        toast('ok', label);
        load();
      };
      document.querySelectorAll('[data-dp-ok]').forEach(b => {
        b.onclick = () => go(`/api/roster/dispatch/approve?id=${b.dataset.dpOk}&ok=1`, '已通过，已调入对方门店');
      });
      document.querySelectorAll('[data-dp-no]').forEach(b => {
        b.onclick = () => {
          const note = prompt('驳回原因（会留在记录里）', '该时段本店也缺人');
          if (note === null) return;
          go(`/api/roster/dispatch/approve?id=${b.dataset.dpNo}&ok=0&note=${encodeURIComponent(note)}`, '已驳回');
        };
      });
      document.querySelectorAll('[data-dp-end]').forEach(b => {
        b.onclick = () => go(`/api/roster/dispatch/end?id=${b.dataset.dpEnd}`, '已提前结束，今日起回原门店');
      });
      document.querySelector('#dpGo').onclick = async () => {
        const q = new URLSearchParams({
          employee: $('#dpEmp').value.trim(), to_org: $('#dpTo').value.trim(),
          from: $('#dpFrom').value, to: $('#dpToDate').value, reason: $('#dpWhy').value.trim(),
        });
        if (!q.get('employee')) return toast('bad', '要填借谁（person id）');
        const w = await call('/api/roster/dispatch/create?' + q.toString(), { method: 'POST' });
        if (w.status !== 200) {
          return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
        }
        toast('ok', '已提交，待审批');
        load();
      };
    }
  }

  // ---- 排班统计（155）：排班率 + 班次热力 + 工时 ----
  {
    const st = await call(`/api/roster/stat/rate?org=${RSTORE}&from=${from}&days=7`);
    if (st.status === 200) {
      const R = st.body.rows || st.body || [];
      const money = (n) => Number(n || 0).toLocaleString('zh-CN', { maximumFractionDigits: 1 });
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <h2>排班率 <span class="sub" style="font-weight:400">${esc(from)} 起 7 天 ·
          已排 / 在职</span></h2>
        <p class="note">
          <b>只排了休息的人不算已排</b> —— 休息不是出勤。所以"那天没人排"与"那天大家都休息"
          在这张表上是两个数。没有在职人数时比率返回 <b>空</b> 而不是 0%（0% 会被读成"一个都没排"）。
        </p>
        <table class="stack"><thead><tr>
          <th style="width:130px">日期</th><th class="num" style="width:90px">在职</th>
          <th class="num" style="width:90px">已排</th><th class="num" style="width:110px">排班率</th>
          <th class="num" style="width:110px">其中划线</th><th style="width:160px">覆盖</th>
        </tr></thead><tbody>
          ${(Array.isArray(R) ? R : []).map(x => {
            const r = x.rate === null || x.rate === undefined ? null : Number(x.rate);
            return `<tr>
              <td><b>${esc(String(x.work_date).slice(0, 10))}</b></td>
              <td class="num" data-label="在职">${x.need}</td>
              <td class="num" data-label="已排">${x.planned}</td>
              <td class="num" data-label="排班率">${r === null ? '<span class="sub">—</span>'
                : `<b>${(r * 100).toFixed(0)}%</b>`}</td>
              <td class="num sub" data-label="其中划线">${x.temp || 0}</td>
              <td data-label="覆盖"><div style="height:9px;border-radius:3px;background:var(--line);overflow:hidden">
                <div style="height:100%;width:${r === null ? 0 : Math.min(r * 100, 100)}%;
                  background:${r !== null && r >= 0.9 ? 'var(--ok,#137333)' : 'var(--primary)'}"></div></div></td>
            </tr>`;
          }).join('') || '<tr><td colspan="6" class="sub">这段时间没有排班数据</td></tr>'}
        </tbody></table>`;
      document.querySelector('#view').appendChild(card);
    }
  }

  // ---- 排班规则（149）：合规上限 / 连续排班 / 月休 / 预警 / 提醒 ----
  // 照白皮书 2.1 与官方界面：「排班设置 → 排班规则 → 新增排班规则」。
  // 上限是硬拦（排不进去），预警是提示（排得进去但标黄）—— 两者分开。
  {
    const rr = await call(`/api/roster/rule?org=${RSTORE}`);
    if (rr.status === 200) {
      const R = rr.body;
      const e = R.effective || {};
      const h = (min) => (min === null || min === undefined ? '' : (Number(min) / 60).toFixed(1));
      const src = { self: '本门店自己定的', parent: `继承自上级组织（#${e.org_id}）`,
                    global: '全局缺省规则', none: '还没有任何规则 —— 现在不做校验' }[R.source];
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <h2>排班规则 <span class="sub" style="font-weight:400">${esc(src)}</span></h2>
        <p class="note">
          <b>上限是硬拦</b>（排不进去，报错里会说超了多少）；<b>预警是提示</b>（排得进去，页面标黄）。
          两者合成就只有"要么什么都不说、要么直接不让排"。
          <br>上限按<b>日 / 周 / 月</b>三层，日上限再分<b>工作日 / 休息日 / 法定节假日</b> ——
          法定节假日加班给 300%，所以它必须单独一条线。
        </p>
        <div class="form" style="margin:0 0 8px">
          <label>规则名称<input id="rrName" value="${esc(e.name || '门店排班规则')}" style="width:180px"></label>
          <label>工作日上限(时)<input id="rrWd" value="${h(e.max_min_workday)}" style="width:92px"></label>
          <label>休息日上限(时)<input id="rrRd" value="${h(e.max_min_restday)}" style="width:92px"></label>
          <label>节假日上限(时)<input id="rrHd" value="${h(e.max_min_holiday)}" style="width:92px"></label>
        </div>
        <div class="form" style="margin:0 0 8px">
          <label>周上限(时)<input id="rrWeek" value="${h(e.max_min_week)}" style="width:88px"></label>
          <label>月上限(时)<input id="rrMonth" value="${h(e.max_min_month)}" style="width:88px"></label>
          <label>连续排班(天)<input id="rrConsec" value="${e.max_consecutive_days ?? ''}" style="width:96px"></label>
          <label>月最少休息(天)<input id="rrRest" value="${e.min_rest_days_month ?? ''}" style="width:104px"></label>
          <label>预警线(时)<input id="rrWarn" placeholder="8,10,12"
            value="${(e.warn_daily_hours || []).join(',')}" style="width:110px"></label>
        </div>
        <div class="form">
          <label class="sub"><input id="rrEditPast" type="checkbox"
            ${e.can_edit_past === false ? '' : 'checked'}> 可修改已发生排班</label>
          <label>发布<select id="rrPublish" style="width:140px">
            <option value="save" ${e.publish_mode === 'save' ? 'selected' : ''}>保存即生效</option>
            <option value="manual" ${e.publish_mode === 'manual' ? 'selected' : ''}>手动发布</option>
            <option value="approve_auto" ${e.publish_mode === 'approve_auto' ? 'selected' : ''}>审批后自动发布</option>
            <option value="approve_manual" ${e.publish_mode === 'approve_manual' ? 'selected' : ''}>审批后手动发布</option>
          </select></label>
          <label class="sub"><input id="rrRemind" type="checkbox"
            ${e.remind_enabled ? 'checked' : ''}> 未排班提醒</label>
          <label>提前(天)<input id="rrBefore" value="${e.remind_before_days ?? 1}" style="width:70px"></label>
          <label>发给<select id="rrScope" style="width:150px">
            <option value="manager" ${e.remind_scope === 'manager' ? 'selected' : ''}>仅排班人</option>
            <option value="both" ${e.remind_scope === 'both' ? 'selected' : ''}>排班人 + 员工</option>
          </select></label>
          <button id="rrSave" ${R.canWrite ? '' : 'disabled'}>保存规则</button>
        </div>
        <div class="kv" style="margin-top:8px">
          <span>改这里的值会立刻影响<b>下一次</b>排班；已经排好的不动</span>
          <span class="sub">没有规则 = 不校验（沿用上线前行为）</span>
        </div>`;
      document.querySelector('#view').appendChild(card);

      const toMin = (v) => (String(v).trim() === '' ? '' : Math.round(Number(v) * 60));
      document.querySelector('#rrSave').onclick = async () => {
        const q = new URLSearchParams({
          org: String(RSTORE), name: $('#rrName').value.trim(),
          max_min_workday: String(toMin($('#rrWd').value)),
          max_min_restday: String(toMin($('#rrRd').value)),
          max_min_holiday: String(toMin($('#rrHd').value)),
          max_min_week: String(toMin($('#rrWeek').value)),
          max_min_month: String(toMin($('#rrMonth').value)),
          max_consecutive_days: $('#rrConsec').value.trim(),
          min_rest_days_month: $('#rrRest').value.trim(),
          warn_daily_hours: $('#rrWarn').value.trim(),
          can_edit_past: $('#rrEditPast').checked ? '1' : '0',
          publish_mode: $('#rrPublish').value,
          remind_enabled: $('#rrRemind').checked ? '1' : '0',
          remind_before_days: $('#rrBefore').value.trim(),
          remind_scope: $('#rrScope').value,
        });
        const w = await call('/api/roster/rule/set?' + q.toString(), { method: 'POST' });
        if (w.status !== 200) {
          return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
        }
        toast('ok', '排班规则已保存');
        load();
      };
    }
  }

  // ---- 日视图时间轴（148 划线）：产品里划线就长这样 ----
  // 照白皮书截图的交互：表头 0点…23点+次日0点，一小时一列，点空格左右拖动划线，
  // 段内白字显示起止，段右端红圈数字 = 工时；右击班段可删或设休息。
  // ★ 与"周视图"的分工：周视图看一周的全貌，日视图才是划线的地方 ——
  //   因为时段要精确到小时，一周七天挤在一屏里没法拖。
  {
    const today = from;
    const dayRes = await call(`/api/roster/week?store=${RSTORE}&from=${today}&days=1`);
    if (dayRes.status === 200) {
      const D = dayRes.body;
      const ppl = D.people || [];
      const segs = D.rows || [];
      const card = document.createElement('div');
      card.className = 'card';
      card.id = 'dayCard';
      card.innerHTML = `
        <h2>日视图 · ${esc(today)}
          <span class="sub" style="font-weight:400">划线排班在这里拖</span>
          <span style="flex:1"></span>
          <label class="sub" style="font-weight:400">日期
            <input id="dvDate" type="date" value="${esc(today)}" style="width:150px"></label>
        </h2>
        <p class="note" style="background:#fffbe6;border:1px solid #ffe58f;
             border-radius:8px;padding:8px 10px;margin:0 0 10px">
          <b>点击【空白格子】后左右拖动可进行划线排班，【右击班段】可进行班段删除及休息时间的设置</b>
          <br><span class="sub">划出来的不是"班次"，是<b>一段时间</b> —— 班次库里有没有这个班不重要；
          同一行连划多段，段与段之间的空白就是休息。</span>
        </p>
        <div class="tl" id="tlWrap">
          <div class="tl-head">
            <div class="tl-name"></div>
            <div class="tl-num">已排工时</div>
            <div class="tl-hours">
              ${Array.from({ length: 24 }, (_, h) =>
                `<span>${h}点</span>`).join('')}<span>次日0点</span>
            </div>
          </div>
          <div id="tlBody"></div>
        </div>
        <div class="kv" style="margin-top:8px">
          <span>这一天 <b>${ppl.length}</b> 人 · <b>${segs.length}</b> 段</span>
          <span class="sub">提示：拖不满 15 分钟不会生成（那不是一段班，是手抖）</span>
        </div>`;
      document.querySelector('#view').prepend(card);
      document.querySelector('#dvDate').onchange = (e) => {
        const d = e.target.value;
        if (d) { window.__dvDate = d; }
        load();
      };

      const body = document.querySelector('#tlBody');
      const minOf = (iso) => {
        const dd = new Date(iso);
        return dd.getHours() * 60 + dd.getMinutes()
          + (dd.getDate() !== new Date(today + 'T00:00:00').getDate() ? 1440 : 0);
      };
      const hhmm = (m) => `${String(Math.floor(m / 60) % 24).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;

      body.innerHTML = (ppl.length ? ppl : [{ employee_id: '', person_name: '（这家店没有在册人员）', employee_no: '' }])
        .map(pp => {
          const mine = segs.filter(x => String(x.employee_id) === String(pp.employee_id));
          return `<div class="tl-row" data-emp="${esc(pp.employee_id)}">
            <div class="tl-name"><b>${esc(pp.person_name)}</b>
              <span class="sub">${esc(pp.employee_no || '')}</span></div>
            <div class="tl-num" title="已排工时（这一段排了多少小时）">
              ${(mine.reduce((a, x) => {
                let s1 = minOf(x.start_at), e1 = minOf(x.end_at);
                if (e1 <= s1) e1 += 1440;
                return a + (Math.min(e1, 1440) - Math.max(s1, 0));
              }, 0) / 60).toFixed(1)}h
            </div>
            <div class="tl-track" data-emp="${esc(pp.employee_id)}">
              ${Array.from({ length: 24 }, () => '<i class="tl-cell"></i>').join('')}
              ${mine.map(x => {
                let a = minOf(x.start_at), b = minOf(x.end_at);
                if (b <= a) b += 1440;
                b = Math.min(b, 1440);
                a = Math.max(0, Math.min(a, 1439));
                const w = Math.max(b - a, 8);
                const isTemp = !x.shift_name || x.shift_name === '划线';
                // ★ 段内只写时段（`07:00 - 10:00`），**不加时长角标**：
                //   白皮书旧截图里有个红圈数字，但产品视频的当前版本没有 ——
                //   以视频为准（截图可能是更早的版本或另一家的产品）。
                return `<div class="tl-seg ${isTemp ? 'temp' : 'fixed'}"
                  style="left:${(a / 1440 * 100).toFixed(3)}%;width:${(w / 1440 * 100).toFixed(3)}%"
                  data-seg="${x.segment_id || ''}" data-emp="${esc(pp.employee_id)}"
                  data-from="${hhmm(a)}" data-to="${hhmm(b)}"
                  title="${esc(x.shift_name || '划线')} ${hhmm(a)}-${hhmm(b)}">
                  <span class="t">${hhmm(a)} - ${hhmm(b)}</span>
                </div>`;
              }).join('')}
            </div>
          </div>`;
        }).join('');

      // ---- 拖动划线 ----
      let dragging = null;
      body.querySelectorAll('.tl-track').forEach(track => {
        track.onpointerdown = (ev) => {
          if (ev.target.closest('.tl-seg')) return;     // 点在已有段上：不当划线
          const r = track.getBoundingClientRect();
          const toMin = (x) => Math.max(0, Math.min(1440,
            Math.round((x - r.left) / r.width * 1440 / 15) * 15));
          dragging = { track, r, start: toMin(ev.clientX), cur: toMin(ev.clientX), emp: track.dataset.emp };
          track.setPointerCapture(ev.pointerId);
          paintSel();
        };
        track.onpointermove = (ev) => {
          if (!dragging || dragging.track !== track) return;
          dragging.cur = Math.max(0, Math.min(1440,
            Math.round((ev.clientX - dragging.r.left) / dragging.r.width * 1440 / 15) * 15));
          paintSel();
        };
        track.onpointerup = async (ev) => {
          if (!dragging || dragging.track !== track) return;
          const a = Math.min(dragging.start, dragging.cur);
          const b = Math.max(dragging.start, dragging.cur);
          const emp = dragging.emp;
          clearSel();
          dragging = null;
          if (b - a < 15) return;
          if (!emp) return toast('bad', '这一行没有具体的人，排不了');
          const q = new URLSearchParams({
            employee: emp, date: today, from: hhmm(a), to: hhmm(b),
            store: String(RSTORE), break: '', reason: '',
          });
          const w = await call('/api/roster/line?' + q.toString(), { method: 'POST' });
          if (w.status !== 200) {
            return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
          }
          toast('ok', `已划上 ${hhmm(a)}-${hhmm(b)}（${(w.body.minutes / 60).toFixed(1)} 小时）`);
          load();
        };
      });
      const paintSel = () => {
        clearSel();
        if (!dragging) return;
        const a = Math.min(dragging.start, dragging.cur);
        const b = Math.max(dragging.start, dragging.cur);
        const el = document.createElement('div');
        el.className = 'tl-sel';
        el.style.left = `${(a / 1440 * 100).toFixed(3)}%`;
        el.style.width = `${((b - a) / 1440 * 100).toFixed(3)}%`;
        dragging.track.appendChild(el);
      };
      const clearSel = () => body.querySelectorAll('.tl-sel').forEach(e => e.remove());

      // ---- 右击班段：删除 / 设休息 ----
      body.querySelectorAll('.tl-seg').forEach(seg => {
        seg.oncontextmenu = async (ev) => {
          ev.preventDefault();
          const emp = seg.dataset.emp, f = seg.dataset.from, t = seg.dataset.to;
          const pick = prompt(`班段 ${f}-${t}\n输入操作：\n  1 = 删除这段\n  2 = 改休息时间（按分钟）\n（取消则不动）`, '1');
          if (pick === null) return;
          if (pick.trim() === '1') {
            const w = await call(`/api/roster/clear?employee=${emp}&date=${today}`, { method: 'POST' });
            if (w.status !== 200) {
              return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
            }
            toast('ok', '已删除');
            return load();
          }
          if (pick.trim() === '2') {
            const bm = prompt('休息多少分钟？（重划这一段，原段会被替换）', '60');
            if (bm === null) return;
            await call(`/api/roster/clear?employee=${emp}&date=${today}`, { method: 'POST' });
            const q = new URLSearchParams({ employee: emp, date: today, from: f, to: t,
              store: String(RSTORE), break: String(bm || 0), reason: '设休息' });
            const w = await call('/api/roster/line?' + q.toString(), { method: 'POST' });
            if (w.status !== 200) {
              return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
            }
            toast('ok', `休息 ${w.body.break_min} 分钟，计薪 ${(w.body.net_minutes / 60).toFixed(1)} 小时`);
            return load();
          }
        };
      });
    }
  }

  // ---- 门店确认（145）：排班是"人排好了"，确认是"门店认了" ----
  // 两件事分开：排班单方面就能改，确认要门店表态。没有这一步，
  // 门店月底说"这个班不是我排的"就没有任何记录可查。
  // ★ 用 DOM 追加而不是改上面的模板字符串：模板已经够长，再加一块卡片
  //   容易把嵌套括号搞错，而那种错只在运行时白屏。
  const wrapEl = document.querySelector('.roster-wrap');
  if (wrapEl && wrapEl.closest('.card')) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <h2>门店确认 <span class="sub" style="font-weight:400">
        排班 → 推送 → 门店确认 → 锁定，四步都有经手人</span></h2>
      <p class="note">
        排班单方面就能改，<b>确认要门店表态</b>：没有这一步，门店月底说
        "这个班不是我排的"就没有任何记录可查。
        <b>锁定之后不能再改排班</b>（要改先把确认退回去）；
        有争议（<span class="tag bad">有异议</span>）时不允许锁定，先把争议处理掉。
        <br>推一份空周表等于让人签一张没内容的字 —— 没有排班时推送会直接拒。
      </p>
      <div class="form">
        <label>门店<input id="rcStore" type="number" value="10" style="width:80px"></label>
        <label>期间<input id="rcPeriod" value="${from.slice(0, 7)}" style="width:110px"
          placeholder="YYYY-MM"></label>
        <button id="rcPush">推送门店</button>
        <button class="ghost" id="rcConfirm">门店确认</button>
        <button class="ghost" id="rcDispute">提异议</button>
        <button class="ghost" id="rcLock">锁定</button>
        <span class="sub" style="align-self:center" id="rcMsg">—</span>
      </div>`;
    wrapEl.closest('.card').after(card);

    const rcQ = () => `store=${$('#rcStore').value}&period=${encodeURIComponent($('#rcPeriod').value)}`;
    const rcGo = async (path, label, extra = '') => {
      const w = await call(`${path}?${rcQ()}${extra}`, { method: 'POST' });
      if (w.status !== 200) {
        $('#rcMsg').innerHTML = `<span class="tag bad">${esc(w.body.error || w.status)}</span> `
          + esc(w.body.message || '');
        return;
      }
      $('#rcMsg').innerHTML = `<span class="tag ok">${esc(label)}</span> ${w.body.count} 条`;
      toast('ok', `${label}：${w.body.count} 条`);
      setTimeout(() => viewRoster(), 300);
    };
    $('#rcPush').onclick = () => rcGo('/api/roster/push', '已推送');
    $('#rcConfirm').onclick = () => rcGo('/api/roster/confirm', '门店已确认', '&ok=1');
    $('#rcDispute').onclick = () => {
      const note = prompt('异议要说清哪里不对（这句话会留在记录里）');
      if (!note) return;
      rcGo('/api/roster/confirm', '已记异议', `&ok=0&note=${encodeURIComponent(note)}`);
    };
    $('#rcLock').onclick = () => {
      if (!confirm('锁定之后这一期排班不能再改（要改先把确认退回去）。确认锁定？')) return;
      rcGo('/api/roster/lock', '已锁定');
    };
  }

  // ---- 划线排班（148）：上到几点就划到几点 ----
  // ★ 白皮书里这条的原话是"排班时不需要再去添加班次，直接划出班次时长即可"。
  //   所以这里不问"哪个班"，只问"几点到几点"；休息按规则自动扣、也能手改，
  //   右边实时给出净工时（对应产品里的"小红点标识工作时长"）。
  {
    const wrap0 = document.querySelector('.roster-wrap');
    if (wrap0 && wrap0.closest('.card')) {
      const c3 = document.createElement('div');
      c3.className = 'card';
      c3.id = 'lineCard';
      c3.innerHTML = `
        <h2>划线排班 <span class="sub" style="font-weight:400">
          兼职工 / 临时工：上到几点就划到几点</span></h2>
        <p class="note">
          这里<b>不从班次里选</b>，直接给一段时段 —— 下午 4 点到 9 点来帮忙，就是 5 小时。
          超过 <b>${'' }6 小时</b>按制度项自动扣休息（当前设置见「薪酬政策 → 制度」），
          也可以手填覆盖（各家吃饭时间不一样）。
          <br>与同一天已有排班<b>时段重叠会被拒</b>：两段叠在一起就是两倍工时，而工资按工时算。
        </p>
        <div class="form">
          <label>人<input id="rlEmp" type="number" placeholder="person id" style="width:96px"></label>
          <label>日期<input id="rlDate" type="date" value="${from}" style="width:150px"></label>
          <label>从<input id="rlFrom" type="time" value="16:00" style="width:110px"></label>
          <label>到<input id="rlTo" type="time" value="21:00" style="width:110px"></label>
          <label>休息(分)<input id="rlBreak" type="number" placeholder="按规则"
            style="width:88px"></label>
          <label>原因<input id="rlWhy" placeholder="可选：临时顶班" style="width:150px"></label>
          <button id="rlGo">划上</button>
        </div>
        <div class="tier-grid kpi3" style="margin:10px 0 0">
          <div class="tier"><div class="k">划线时长</div>
            <div class="v" style="font-size:18px" id="rlSpan">5.0<span>小时</span></div></div>
          <div class="tier"><div class="k">休息</div>
            <div class="v" style="font-size:18px" id="rlBrk">0<span>分钟</span></div>
            <div class="k">超过 6 小时按规则扣</div></div>
          <div class="tier"><div class="k">计薪工时</div>
            <div class="v" style="font-size:18px;color:var(--ok,#137333)" id="rlNet">5.0<span>小时</span></div>
            <div class="k">存进排班段，考勤与算薪都读它</div></div>
        </div>`;
      wrap0.closest('.card').after(c3);

      const toMin = (t) => {
        const m = /^(\d{2}):(\d{2})$/.exec(String(t || ''));
        return m ? Number(m[1]) * 60 + Number(m[2]) : null;
      };
      const recalc = () => {
        const a = toMin($('#rlFrom').value), b = toMin($('#rlTo').value);
        if (a === null || b === null) return;
        let span = b - a;
        if (span <= 0) span += 24 * 60;          // 跨零点
        const bmRaw = $('#rlBreak').value.trim();
        const bm = bmRaw === '' ? (span > 6 * 60 ? 0 : 0) : Number(bmRaw);
        const net = Math.max(span - (bm || 0), 0);
        $('#rlSpan').innerHTML = `${(span / 60).toFixed(1)}<span>小时</span>`;
        $('#rlBrk').innerHTML = `${bm || 0}<span>分钟</span>`;
        $('#rlNet').innerHTML = `${(net / 60).toFixed(1)}<span>小时</span>`;
      };
      ['#rlFrom', '#rlTo', '#rlBreak'].forEach(sel => {
        const el = document.querySelector(sel);
        if (el) el.oninput = recalc;
      });
      recalc();

      $('#rlGo').onclick = async () => {
        const q = new URLSearchParams({
          employee: $('#rlEmp').value.trim(), date: $('#rlDate').value,
          from: $('#rlFrom').value, to: $('#rlTo').value,
          store: String(RSTORE), break: $('#rlBreak').value.trim(),
          reason: $('#rlWhy').value.trim(),
        });
        if (!q.get('employee')) return toast('bad', '要填是给谁划（person id）');
        const w = await call('/api/roster/line?' + q.toString(), { method: 'POST' });
        if (w.status !== 200) {
          return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
        }
        toast('ok', `已划上：${(w.body.minutes / 60).toFixed(1)} 小时`
          + `（休息 ${w.body.break_min} 分，计薪 ${(w.body.net_minutes / 60).toFixed(1)} 小时）`);
        load();
      };
    }
  }

  const rsSel = document.querySelector('#rsStore');
  if (rsSel) rsSel.onchange = (e) => { RSTORE = Number(e.target.value); load(); };

  const tbl = document.querySelector('.roster');
  tbl.addEventListener('mousedown', down);
  tbl.addEventListener('mouseover', over);
  document.addEventListener('mouseup', up, { once: true });
  tbl.addEventListener('touchstart', (e) => down({ preventDefault: () => e.preventDefault(),
    target: document.elementFromPoint(e.touches[0].clientX, e.touches[0].clientY) }), { passive: false });
  tbl.addEventListener('touchmove', (e) => {
    const el = document.elementFromPoint(e.touches[0].clientX, e.touches[0].clientY);
    if (el) over({ target: el });
  }, { passive: true });
  tbl.addEventListener('touchend', up);
}

// ============================================================================
// 打卡（参照钉钉的最小可用集）：一个大按钮 + 今天的状态
// ----------------------------------------------------------------------------
// 这里刻意**不显示工时**：工时是"排班 + 休息扣除"算出来的结果，
// 打卡页显示它就会变成第二份口径。打卡页只回答"我几点按了一下"。
async function viewPunch() {
  // 支持直达某一天：#punch/2026-11-13（巡检与截图都要它）
  const hashDate = (location.hash.split('/')[1] || '').trim();
  const r = await call('/api/punch/today');
  if (r.status !== 200) return fail(r);
  const { today: t, store } = r.body;
  const CN = { not_started: '未开始', on_duty: '上班中', done: '已下班' };
  const hhmm = (x) => x ? String(x).slice(11, 16) : '—';

  $('#view').innerHTML = `
    <div class="card punch-card">
      <h2>今日打卡${store ? `<span class="sub" style="font-weight:400"> · ${esc(store.name)}</span>` : ''}</h2>
      <p class="note">
        时间是<b>服务器时间</b>（改手机时间不影响打卡）；定位只用于判断
        <b>${store ? store.radius_m : 300}</b> 米围栏，
        <b>围栏外也能打，但会标记</b> —— 拒绝打卡会让外勤打不上，然后互相代打。
      </p>
      <div class="punch-state">
        <div class="punch-clock" id="punchClock">--:--</div>
        <div class="punch-line">上班 <b>${hhmm(t.first_in)}</b> · 下班 <b>${hhmm(t.last_out)}</b>
          <span class="tag ${t.state === 'done' ? 'ok' : 'warn'}">${CN[t.state] || t.state}</span></div>
        ${t.outside ? '<div class="punch-warn">有一次打卡在围栏外（已记录，不算失败）</div>' : ''}
      </div>
      <div class="punch-actions">
        <button id="punchIn"  ${t.state !== 'not_started' ? 'disabled' : ''}>上班打卡</button>
        <button id="punchOut" ${t.state !== 'on_duty' ? 'disabled' : ''}>下班打卡</button>
      </div>
      <p class="sub">忘打卡请走「补卡」审批（补卡要留痕）；这里直接补一条，等于谁都能改历史。</p>
    </div>

    <div class="card">
      <h2>打卡流水
        <span style="float:right;font-weight:400;font-size:13px">
          <input type="date" id="punchLogDate" value="${/^\d{4}-\d{2}-\d{2}$/.test(hashDate) ? hashDate : new Date().toISOString().slice(0,10)}"
                 style="padding:4px 8px"></span></h2>
      <p class="note">
        这里列的是<b>原始打卡事件</b>：谁、几点、哪台设备、来自哪个系统。
        <b>钉钉的打卡会标出来源</b> — 它不经过本页按钮，但会同步进来（幂等键去重，重复同步不翻倍）。
        <b>这里没有工时</b>：工时由排班与休息扣除算出，在这一页显示就会变成第二份口径。
      </p>
      <div id="punchLog"><span class="sub">读取中…</span></div>
    </div>`;

  const tick = () => { const el = $('#punchClock'); if (el) el.textContent = new Date().toLocaleTimeString('zh-CN', { hour12: false }); };
  tick(); clearInterval(window.__punchTimer); window.__punchTimer = setInterval(tick, 1000);

  const send = (kind, btn) => {
    btn.disabled = true;
    const geo = navigator.geolocation;
    const go = (lat, lng) => post(
      `/api/punch?kind=${kind}${lat != null ? `&lat=${lat}&lng=${lng}` : ''}`
      + `&device=${encodeURIComponent((navigator.userAgent || '').slice(0, 40))}`,
      kind === 'in' ? '上班打卡成功' : '下班打卡成功', btn);
    // 定位失败也照打：拿不到位置只是"没有证据"，不该让人打不上卡
    if (geo) geo.getCurrentPosition((p) => go(p.coords.latitude, p.coords.longitude),
                                  () => go(null, null), { timeout: 4000 });
    else go(null, null);
  };
  const bi = $('#punchIn'), bo = $('#punchOut');
  if (bi) bi.onclick = () => send('in', bi);
  if (bo) bo.onclick = () => send('out', bo);

  const SRC_CN = { app: '页面', web: '网页', device: '考勤机', dingtalk: '钉钉', feishu: '飞书' };
  const loadLog = async (date) => {
    const el = $('#punchLog');
    if (!el) return;
    const res = await call(`/api/punch/log?date=${date}`);
    if (res.status !== 200) { el.innerHTML = `<span class="sub">读不到（${esc(res.body.error)}）</span>`; return; }
    const d = res.body;
    if (!d.rows.length) {
      el.innerHTML = `<span class="sub">${esc(date)} 还没有打卡记录${d.staff ? '' : '（你只能看到自己）'}`
        + `。若你刚在钉钉打了卡，等增量同步跑一次（≤1 分钟）就会出现。</span>`
        + (d.latest ? `<p class="sub">最近一次有记录：<a href="#punch/${esc(d.latest.date)}">`
            + `${esc(d.latest.date)}（${d.latest.count} 条）</a></p>` : '');
      return;
    }
    el.innerHTML = `<table><thead><tr>
        <th>姓名</th><th>工号</th><th>时间</th><th>方向</th><th>来源</th><th>地点</th>
      </tr></thead><tbody>${d.rows.map(x => `<tr>
        <td>${esc(x.full_name)}</td>
        <td class="num">${esc(x.employee_no || '—')}</td>
        <td class="num">${esc(new Date(x.punch_at).toLocaleTimeString('zh-CN',
          { timeZone: TZ, hour12: false }).slice(0, 5))}</td>
        <td>${x.kind === 'in' ? '上班' : '下班'}</td>
        <td><span class="tag ${x.source === 'dingtalk' || x.source === 'feishu' ? 'ok' : ''}">
          ${SRC_CN[x.source] || esc(x.source)}</span></td>
        <td class="sub">${esc(x.store_name || '—')}${x.distance_m != null ? ` · ${x.distance_m}m` : ''}</td>
      </tr>`).join('')}</tbody></table>
      <p class="sub">共 ${d.count} 条 · ${d.scope === 'all' ? '范围：全部部门（管考勤的人）' : '范围：仅本人'}</p>`;
  };
  const dEl = $('#punchLogDate');
  if (dEl) { dEl.onchange = () => loadLog(dEl.value); loadLog(dEl.value); }
}

// 代理表单的绑定（在 viewRoles 渲染之后调用）
function bindActing() {
  const btn = $('#acGrant');
  if (btn) btn.onclick = async () => {
    btn.disabled = true;
    const q = `agent=${encodeURIComponent($('#acAgent').value)}`
      + `&role=${$('#acRole').value}&days=${$('#acDays').value}`
      + `&reason=${encodeURIComponent($('#acReason').value)}`;
    const r = await call(`/api/acting/grant?${q}`, { method: 'POST' });
    btn.disabled = false;
    if (r.status !== 200) return toast('bad', `<b>${esc(r.body.error)}</b> ${esc(r.body.message || '')}`);
    toast('ok', '代理已设定');
    viewRoles();
  };
  document.querySelectorAll('[data-rev]').forEach(b => {
    b.onclick = async () => {
      const r = await call(`/api/acting/revoke?id=${b.dataset.rev}`, { method: 'POST' });
      if (r.status !== 200) return toast('bad', `<b>${esc(r.body.error)}</b>`);
      toast('ok', '已结束代理');
      viewRoles();
    };
  });
}

// ============================================================================
// 工资条 / 我的工资表
// ----------------------------------------------------------------------------
// 一个人一份。上半是"我的工资表"（结构 + 口径 + 浮动），下半是工资条明细。
// ★ 结构与工资条**必须同屏**：只给一张结构表，人看不出"这个月到底发了多少"；
//   只给一张工资条，人看不出"13000 是怎么来的"。两个问题都要答。
// ============================================================================
async function viewPayslip() {
  const [r, plan] = await Promise.all([call('/api/payslip'), call('/api/salary/plan')]);
  if (r.status !== 200) return fail(r);
  const rows = r.body.rows || [];
  // 这张表在演示库里是 1,122 行：卡片化后单行 104px，整页 127,338px（约 157 屏）。
  // 前 100 行 + 「显示全部」，把页高拉回千级；被截断会明说还有多少行。
  const slipShown = rowsToShow('payslip', rows);
  // 这份清单里有没有别人的行 —— 有就默认遮实发（自己那行也遮，规则一致）
  const slipMask = netsAreOthers(rows);
  const p = plan.status === 200 ? plan.body : null;
  // ★ 钱相关路径现在不允许“账号没挂人员就退回 uid”（会看到别人的工资），
  //   所以管理账号这里会拿不到“我的工资表”。拿不到就得说为什么，
  //   否则页面上只剩一张没头没尾的清单，看起来像功能没做。
  const planErr = plan.status === 200 ? null : (plan.body && plan.body.error) || String(plan.status);

  // ★ 先算期间与人：模板里要用它（"导入到哪一期"），
  //   定义放在模板之后会 TDZ 报错 —— 而报错信息只会说 "Cannot access 'period'"，
  //   看起来像变量拼错，而不是顺序错了。
  const period = p?.period || TODAY.slice(0, 7);
  const person = p?.person || ME?.person_id;
  const monthly = p && p.monthly_amount !== null ? Number(p.monthly_amount) : null;
  const items = (p && p.items) || [];
  const sum = items.reduce((a, x) => a + Number(x.amount), 0);
  const slip = p && p.payslip;
  // 签收状态（186）：只在"有本人工资条"时才问。失败不阻断页面（签收是附加动作）。
  // ★ 用 /api/payslip/acks 而不是新加字段：签收状态与工资条是两条数据，
  //   塞进同一个响应会让"签收表挂了"变成"工资条打不开"。
  let ackRow = null;
  if (slip && slip.id) {
    const ar = await call('/api/payslip/acks');
    if (ar.status === 200) {
      ackRow = (ar.body.mine || []).find((x) => Number(x.payslip_id) === Number(slip.id)) || null;
    }
  }

  const fmt = (n) => Number(n ?? 0).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  // 结构表：一行一项，右侧一根占比条。占比用月薪总额做分母，
  // 这样"岗位津贴占 23%"是一眼能读的，而不用心算。
  const structRows = items.map(x => {
    const amt = Number(x.amount);
    const pct = monthly ? Math.round(amt / monthly * 100) : 0;
    return `<tr>
      <td><b>${esc(x.name)}</b> <span class="sub">${esc(x.item_code)}</span></td>
      <td class="num" data-label="金额">${fmt(amt)}</td>
      <td data-label="占比">
        <span class="struct-bar"><i style="width:${Math.max(2, pct)}%"></i></span>
      </td>
      <td class="num sub" data-label="占月薪">${pct}%</td>
    </tr>`;
  }).join('');

  const heroKv = p ? `
    <div class="kv" style="margin-top:4px">
      <span>每日工时 <b>${Number(p.work_hours_day || 0)}</b> 小时</span>
      <span>月计薪 <b>${Number(p.days_per_month || 0)}</b> 天</span>
      <span>法定节假日 <b>${p.legal_holiday === 'paid' ? '带薪' : esc(p.legal_holiday || '—')}</b></span>
      <span>期间 <b>${esc(p.period || '—')}</b></span>
    </div>` : '';

  const slipCard = slip ? `
    <div class="card">
      <h2>最近一期工资条 <span class="sub" style="font-weight:400">${esc(slip.period)}</span></h2>
      <div class="pos-sum">
        <div><b>${fmt(slip.gross_amount)}</b>应发</div>
        <div><b style="color:var(--bad)">−${fmt(slip.si_employee)}</b>社保个人</div>
        <div><b style="color:var(--bad)">−${fmt(slip.tax_amount)}</b>个人所得税</div>
        <div><b style="color:var(--ok)">${fmt(slip.net_amount)}</b>实发</div>
      </div>
      <table class="stack"><thead><tr><th>项目</th><th>金额</th></tr></thead>
        <tbody>${(slip.items || []).map(x => `<tr>
          <td>${esc(x.name || x.item_code)} <span class="sub">${esc(x.item_code)}</span></td>
          <td class="num" data-label="金额" style="color:${Number(x.amount) < 0 ? 'var(--bad)' : 'inherit'}">${fmt(x.amount)}</td>
        </tr>`).join('')}</tbody></table>
      <p class="sub">明细之和 = 应发 − 社保 − 个税 = 实发。报销不在这里：它不是工资，单独一张单。</p>
      <div class="form" style="margin-top:8px">
        <button id="slipDiff" class="ghost"
          data-person="${person ?? ''}" data-period="${esc(slip.period)}">与上期对比</button>
        <span class="sub" style="align-self:center">
          员工问"为什么这个月少了 300"时点这里 —— 逐项差异 + 能对上账的原因
        </span>
      </div>
      <div id="slipDiffBox"></div>
      <div class="form" style="margin-top:8px; align-items:center">
        ${ackRow && ackRow.acked
          ? `<span class="tag ok">已签收</span>
             <span class="sub">${esc(String(ackRow.acked_at || '').slice(0, 16).replace('T',' '))}
               · ${ackRow.method === 'web' ? '本人线上签' : ackRow.method === 'paper' ? '纸质回执已代录' : '导入'}</span>`
          : `<button id="slipAck" class="ghost" data-slip="${esc(slip.id)}">我确认已阅</button>
             <span class="sub" style="align-self:center">
               这是"我认这张数"，与"谁看过"（查阅留痕）是两件事：不回执，
               发错了算谁的说不清
             </span>`}
      </div>
    </div>`
    : `<div class="card"><h2>最近一期工资条</h2>
        <div class="empty">还没有算过薪。算薪之后这里会出现应发 / 社保 / 个税 / 实发与逐项明细。</div></div>`;

  $('#view').innerHTML = `
    <div class="card">
      <div class="org-head">
        <h2 style="margin:0">我的工资表
          <span class="sub" style="font-weight:400">${esc(ME?.name || '')}${ME?.role ? ' · ' + esc(ME.role) : ''}</span>
        </h2>
        <span style="flex:1"></span>
        <div class="pay-hero">${!p ? '—' : (monthly === null ? '未定月薪' : '¥ ' + fmt(monthly))}
          <span>月薪标准</span></div>
      </div>
      ${heroKv}
      ${!p
        ? `<p class="note" style="margin-top:10px">${/^E_NO_EMPLOYEE(?:NT)?$/.test(String(planErr))
            ? '这个账号是<b>管理账号</b>，对应不到任何员工档案，所以没有"我的工资表"。'
              + '下面清单里是你有权限看的工资条（按行闸收窄）。'
            : '读不到工资表：' + esc(planErr || '未知原因')}</p>`
        : (monthly === null
        ? `<p class="note" style="margin-top:10px">还没有给你定月薪。定完之后这里会显示工资结构与每一分钱的去向。</p>`
        : `<table class="stack2" style="margin-top:10px"><thead><tr>
             <th>工资项</th><th>金额</th><th>占比</th><th>%</th></tr></thead>
           <tbody>${structRows}
             <tr><td><b>合计</b></td><td class="num" data-label="金额"><b>${fmt(sum)}</b></td><td></td><td></td></tr>
           </tbody></table>
           <p class="sub">结构只解释"月薪由哪些项组成"，拆它不会改变总额 ——
             保存时若各项之和 ≠ 月薪标准，服务端会直接拒绝。</p>`)}
    </div>

    <div class="card">
      <h2>本月浮动收入 <span class="sub" style="font-weight:400">${esc(p?.period || '')}</span></h2>
      <p class="note">
        <b>提成是工资</b>：计入应发、参与计税、在工资条上单独一行。
        <b>报销不是工资</b>：不计税、不进工资条明细，单独一张单、单独付款。
      </p>
      <div class="kv" style="margin-bottom:8px">
        <span>提成合计 <b>${fmt(p?.commission)}</b></span>
        <span>报销合计 <b>${fmt(p?.expense)}</b></span>
      </div>
      <div class="form">
        <label>提成金额<input id="commAmt" type="number" min="0" step="0.01" style="width:120px" placeholder="0.00"></label>
        <label>依据<input id="commBasis" placeholder="如：10月 3 单" style="width:180px"></label>
        <button id="commAdd">录提成</button>
        <span style="width:16px"></span>
        <label>报销金额<input id="expAmt" type="number" min="0" step="0.01" style="width:120px" placeholder="0.00"></label>
        <label>类别<select id="expCat">
          <option>差旅</option><option>交通</option><option>招待</option><option>办公</option><option>其他</option>
        </select></label>
        <button id="expAdd">报销单</button>
      </div>
      ${(p?.commission_rows?.length || p?.expense_rows?.length) ? `<table class="stack2" style="margin-top:10px">
        <thead><tr><th>类型</th><th>金额</th><th>说明</th><th>状态</th></tr></thead>
        <tbody>
          ${(p.commission_rows || []).map(x => `<tr>
            <td><span class="tag ok">提成</span></td><td class="num" data-label="金额">${fmt(x.amount)}</td>
            <td class="sub" data-label="依据">${esc(x.basis || '—')}</td><td class="sub" data-label="状态">${esc(x.status)}</td></tr>`).join('')}
          ${(p.expense_rows || []).map(x => `<tr>
            <td><span class="tag warn">报销</span></td><td class="num" data-label="金额">${fmt(x.amount)}</td>
            <td class="sub" data-label="类别">${esc(x.category)}${x.note ? ' · ' + esc(x.note) : ''}</td>
            <td class="sub" data-label="状态">${esc(x.status)}</td></tr>`).join('')}
        </tbody></table>` : ''}
    </div>

    ${(!slip && planErr) ? `<div class="card">
      <h2>我的工资表</h2>
      <p class="note">${planErr === 'E_NO_EMPLOYMENT'
        ? '这个账号是<b>管理账号</b>，对应不到任何员工档案，所以没有“我的工资表”。'
          + '下面列表里是你有权限看的工资条（按行闸收窄）。'
        : '读不到工资表：' + esc(planErr)}</p>
    </div>` : ''}
    ${slipCard}

    <div class="card">
      <h2>工资表导入 <span class="sub" style="font-weight:400">Excel / CSV</span></h2>
      <p class="note">
        两种表，别混：<b>工资项目与公式</b>（首行表头要有「项目名称」「代码」，
        可带「类型」「公式」）用来建项目；<b>每人金额</b>（表头要有「工号」或「姓名」，
        其余每一列是一个工资项）用来给一群人定工资。
        <b>先导项目，再导金额</b> —— 金额表里的列必须对得上已登记的项目。
      </p>
      <div class="form">
        <label>文件<input type="file" id="impFile" accept=".csv,.tsv,.txt,.xlsx"></label>
        <label>类型<select id="impKind">
          <option value="items">工资项目与公式</option>
          <option value="data">每人金额</option>
        </select></label>
        <label>期间<input id="impPeriod" value="${esc(period)}" style="width:112px"></label>
        <button id="impGo">上传并校验</button>
      </div>
      <div id="impResult"></div>
      <p class="sub">一行一结论：通过的行入库，不通过的行带着原因留在批次里。
        整批有错时不会写入一半 —— 那样会变成"有人有数、有人没数"，而看不出来。</p>
    </div>

    <div class="card">
      <h2>工资条（可见范围按权限） <span class="sub" style="font-weight:400">${rows.length} 行</span></h2>
      <p class="note">净值按字段权限求值：无权限时返回掩码，HTTP 仍是 200 —— 看不到某个字段不是错误。</p>
      ${rows.length === 0
        ? `<div class="empty">0 行：当前身份看不到任何工资条（不是"没有数据"）。</div>`
        : `<table class="stack2"><thead><tr><th>员工</th><th>应发</th><th>实发</th><th>字段动作</th></tr></thead>
           <tbody>${slipShown.map(x => `<tr>
             <td class="num">#${x.employee_id}</td>
             <td class="num" data-label="应发">${x.gross_amount ?? '—'}</td>
             ${x.net_amount === null
               ? '<td class="num" data-label="实发"><span class="masked">已掩码</span></td>'
               : netCell(esc(x.net_amount), slipMask)}
             <td data-label="字段动作"><span class="tag ${x._net_amount_action === 'visible' ? 'ok' : 'warn'}">${esc(x._net_amount_action)}</span></td>
           </tr>`).join('')}</tbody></table>
           ${moreRowsBtn('payslip', rows.length, slipShown.length)}`}
    </div>

    <div class="card">
      <h2>谁看过我的工资条
        <span class="sub" style="font-weight:400">查阅留痕</span></h2>
      <p class="note">
        工资条是发下去让人签字确认的凭证 —— 所以"谁在什么时候看过它"也要能查。
        <b>看自己不留痕</b>：只记别人看了你的；一批人一次导出只记一条（不按人刷屏）。
        留痕里没有金额，它回答的是"谁看过"，不是"看到多少"。
      </p>
      <div class="form">
        <button id="pvLoad" class="ghost">查最近 50 条</button>
        <span class="sub" style="align-self:center">有薪酬全量权限的账号会看到全公司的记录</span>
      </div>
      <div id="pvBox"></div>
    </div>`;

  // ---- 查阅留痕（184）：谁在什么时候看过工资条 ----
  // ★ 只读、按需加载：这一屏默认不发请求 —— 大多数访问是"看自己的工资"，
  //   每次都拉一遍留痕等于把一次页面打开变成两次查询。
  const pvBtn = $('#pvLoad');
  if (pvBtn) pvBtn.onclick = async () => {
    const box = $('#pvBox');
    box.innerHTML = '<div class="empty">正在读取…</div>';
    const w = await call('/api/payslip/views?limit=50');
    if (w.status !== 200) {
      box.innerHTML = `<p class="sub" style="color:var(--bad)">${esc(w.body.error || w.status)}
        ${esc(w.body.message || '')}</p>`;
      return;
    }
    const rs = w.body.rows || [];
    if (!rs.length) {
      box.innerHTML = '<div class="empty">还没有记录：看自己的工资条不留痕，'
        + '别人也没查过你。</div>';
      return;
    }
    const when = (t) => new Date(t).toLocaleString('zh-CN', { hour12: false });
    const scopeCn = { single: '单条', list: '列表', print: '打印', export: '导出' };
    const all = w.body.view_scope === 'all';
    box.innerHTML = `
      <p class="sub" style="margin-top:8px">${all
        ? '当前账号有薪酬全量权限，下面是<b>全公司</b>的查阅记录（可按 person / from / to 收窄）。'
        : '下面是<b>别人查看你</b>工资条的记录。'}</p>
      <table class="stack2"><thead><tr>
        <th>时间</th><th>谁</th>${all ? '<th>看了谁</th>' : ''}
        <th>范围</th><th class="num">行数</th></tr></thead><tbody>
        ${rs.map(x => `<tr>
          <td class="sub" data-label="时间">${esc(when(x.at))}</td>
          <td data-label="谁">${esc(x.actor_name || ('账号#' + x.actor_user_id))}</td>
          ${all ? `<td class="sub" data-label="看了谁">${esc(x.subject_name || (x.subject_person_id ? '#' + x.subject_person_id : '整批'))}</td>` : ''}
          <td data-label="范围"><span class="tag">${esc(scopeCn[x.scope] || x.scope)}</span></td>
          <td class="num" data-label="行数">${x.row_count}</td>
        </tr>`).join('')}
      </tbody></table>
      <p class="sub" style="margin-top:4px">
        一批人只记一条、"行数"是那一次看了几行 —— 所以批量记录里
        <b>看不出"我在不在那一批"</b>，这是这套留痕已知的边界。
      </p>`;
  };

  // ---- 签收（186）：点一下写一条回执，然后重画这一页 ----
  // ★ 不做二次确认弹窗：签收是"我认这张数"，弹窗会让人以为是危险操作；
  //   而真正的防误触是"只能签自己的 + 一张单一条回执"（服务端保证）。
  const ackBtn = $('#slipAck');
  if (ackBtn) ackBtn.onclick = async () => {
    ackBtn.disabled = true;
    const w = await call(`/api/payslip/ack?slip=${encodeURIComponent(ackBtn.dataset.slip)}`,
      { method: 'POST' });
    if (w.status === 200) {
      toast('ok', w.body.already ? '这张工资条你已经签过了' : '已签收，谢谢确认');
      await viewPayslip();
    } else {
      toast('bad', `<b>${esc(w.body.error || w.status)}</b>`
        + (w.body.message ? `<br>${esc(w.body.message)}` : ''));
      ackBtn.disabled = false;
    }
  };

  // ---- 与上期对比：逐项差异 + 归因 ----
  const sd = $('#slipDiff');
  if (sd) sd.onclick = async () => {
    const box = $('#slipDiffBox');
    const w = await call(`/api/payslip/diff?person=${sd.dataset.person}&period=${sd.dataset.period}`);
    if (w.status !== 200) {
      box.innerHTML = `<p class="sub" style="color:var(--bad,#b4261d)">
        ${esc(w.body.error || w.status)} ${esc(w.body.message || '')}</p>`;
      return;
    }
    const d = w.body.rows || [];
    const e = w.body.explain || [];
    const kindCn = { changed: '变动', added: '新增', removed: '消失', same: '不变' };
    if (!d.length) {
      box.innerHTML = `<p class="sub" style="margin-top:8px">${e.map(x => esc(x.msg)).join('；')}</p>`;
      return;
    }
    box.innerHTML = `
      <div style="margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)">
        <b>和上一期（${esc(w.body.base || '上月')}）比</b>
        <ul style="margin:6px 0 8px;padding-left:18px;font-size:13px">
          ${e.map(x => `<li>${esc(x.msg)}</li>`).join('')}
        </ul>
        <!-- ★ stack2：这张表 5 列共 610px，在 335px 的卡片里 **「金额」整列不可见**——
             而这一屏存在的唯一理由就是回答"哪一项变了、变了多少"。 -->
        <table class="stack2"><thead><tr>
          <th>项目</th><th class="num">上期</th>
          <th class="num">本期</th><th class="num">差额</th>
          <th></th></tr></thead><tbody>
          ${d.map(x => `<tr>
            <td>${esc(x.item_name)} <span class="sub">${esc(x.item_code)}</span></td>
            <td class="num sub" data-label="上期">${fmt(x.prev_amount)}</td>
            <td class="num" data-label="本期">${fmt(x.cur_amount)}</td>
            <td class="num" data-label="差额" style="color:${Number(x.diff) < 0 ? 'var(--bad)' : (Number(x.diff) > 0 ? 'var(--ok)' : 'inherit')}">
              <b>${Number(x.diff) > 0 ? '+' : ''}${fmt(x.diff)}</b></td>
            <td>${x.kind === 'changed' ? '<span class="tag warn">变动</span>'
                 : x.kind === 'added' ? '<span class="tag ok">新增</span>'
                 : x.kind === 'removed' ? '<span class="tag">消失</span>'
                 : '<span class="sub">不变</span>'}</td>
          </tr>`).join('')}
        </tbody></table>
        <p class="sub" style="margin-top:4px">
          差额为正是本月多发、为负是少发。上面那几条是能对上账的原因；
          对不上的部分会明说"需要人工核对"，不硬编一个理由。
        </p>
      </div>`;
  };

  // ---- 录提成 / 报销：写的是同一个人的当期的两本账，只是去向不同 ----
  const btnC = $('#commAdd');
  if (btnC) {
    btnC.onclick = async () => {
      const amt = Number($('#commAmt').value);
      if (!(amt >= 0) || !$('#commAmt').value) return toast('bad', '<b>E_ARG</b> 提成金额必须是非负数');
      const w = await call(`/api/commission?person=${person}&period=${period}`
        + `&amount=${amt}&basis=${encodeURIComponent($('#commBasis').value || '')}`, { method: 'POST' });
      if (w.status !== 200) return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
      toast('ok', `提成 <b>${amt}</b> 已录入（计入应发、参与计税）`);
      viewPayslip();
    };
  }
  // ---- 工资表导入：读文件 → 原始请求体上传 → 逐行结论 → 应用 ----
  const impGo = $('#impGo');
  if (impGo) {
    impGo.onclick = async () => {
      const f = $('#impFile')?.files?.[0];
      if (!f) return toast('bad', '<b>E_FILE</b> 先选一个文件（.xlsx / .csv）');
      const kind = $('#impKind').value;
      const per = $('#impPeriod').value.trim();
      const box = $('#impResult');
      box.innerHTML = '<div class="empty">正在解析…</div>';
      impGo.disabled = true;
      let buf;
      try { buf = await f.arrayBuffer(); } catch { buf = null; }
      impGo.disabled = false;
      if (!buf) { box.innerHTML = '<div class="empty">读不出这个文件</div>'; return; }

      const res = await fetch(`/api/salary/import?kind=${kind}&filename=${encodeURIComponent(f.name)}`
        + `&period=${encodeURIComponent(per)}`, {
        method: 'POST',
        headers: { 'content-type': 'application/octet-stream',
                   ...(token ? { authorization: `Bearer ${token}`, 'x-aihr-token': token } : {}) },
        body: buf,
      });
      let out = {};
      try { out = await res.json(); } catch { out = {}; }
      if (res.status !== 200) {
        box.innerHTML = `<div class="empty">导入被拒：<b>${esc(out.error || res.status)}</b> ${esc(out.message || '')}</div>`;
        return;
      }
      const bad = out.rows.filter(r => !r.ok);
      const colOf = (r) => Object.entries(r.payload).filter(([k]) => k !== 'person_id')
        .map(([k, v]) => `${k}=${v}`).join('  ');
      box.innerHTML = `
        <div class="kv" style="margin:10px 0 6px">
          <span>批次 <b>#${out.batch_id}</b></span>
          <span>共 <b>${out.total}</b> 行</span>
          <span>通过 <b style="color:var(--ok)">${out.ok}</b></span>
          <span>未通过 <b style="color:${bad.length ? 'var(--bad)' : 'var(--fg-2)'}">${out.fail}</b></span>
        </div>
        <table class="stack"><thead><tr><th>行</th><th>结论</th><th>内容</th></tr></thead>
          <tbody>${out.rows.map(r => `<tr>
            <td class="num">行 ${r.row_no}</td>
            <td data-label="结论">${r.ok ? '<span class="tag ok">通过</span>'
                       : `<span class="tag bad">未通过</span> <span class="sub">${esc(r.error)}</span>`}</td>
            <td class="sub" data-label="内容">${esc(colOf(r))}</td>
          </tr>`).join('')}</tbody></table>
        ${kind === 'data' && out.fail === 0
          ? `<div class="form" style="margin-top:10px">
               <button id="impApply">应用到 ${esc(per)} 的工资结构</button>
               <span class="sub" style="align-self:center">会把每人的合计写成月薪标准，并按列拆成结构</span>
             </div>` : ''}`;

      const ap = $('#impApply');
      if (ap) {
        ap.onclick = async () => {
          ap.disabled = true;
          const w = await call(`/api/salary/import/apply?batch=${out.batch_id}&period=${encodeURIComponent(per)}`,
            { method: 'POST' });
          ap.disabled = false;
          if (w.status !== 200) {
            return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
          }
          toast('ok', `已应用：<b>${w.body.applied}</b> 人的工资结构（期间 ${esc(w.body.period)}）`);
          viewPayslip();
        };
      }
    };
  }

  const btnE = $('#expAdd');
  if (btnE) {
    btnE.onclick = async () => {
      const amt = Number($('#expAmt').value);
      if (!(amt > 0)) return toast('bad', '<b>E_ARG</b> 报销金额必须大于 0');
      const w = await call(`/api/expense?person=${person}&period=${period}`
        + `&category=${encodeURIComponent($('#expCat').value)}&amount=${amt}`, { method: 'POST' });
      if (w.status !== 200) return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
      toast('ok', `报销单 <b>${amt}</b> 已提交（待审批，不计税、不进工资条）`);
      viewPayslip();
    };
  }
}


// ============================================================================
// 薪酬政策：默认按法定，界面可改，改要 HR 主管以上
// ----------------------------------------------------------------------------
// 这一页的定位：**法定是默认值，不是天花板**。
// 有的企业整体优于法定（病假一律 80%），有的地区细则不同，有的就是想让日薪低一点
// （那样事假扣得少）。系统给默认值与底线，不替客户定政策。
//
// 但"能改"要配三件事，少一件就会出事：
//   ① 看得见法定默认值 —— 否则没人知道自己是"改了"还是"本来就这样"；
//   ② 每一次改都要写原因 —— 否则三个月后查不出这个 21.5 是谁定的；
//   ③ 只有 HR 主管以上能改 —— 店长改一个加班倍数，全公司下个月都按它算。
//
// 硬底线仍然不进界面：加班倍数额度有触发器（低于 1.5/2/3 直接拒）、
// 病假比例不得低于 60%。这些是法律，不是偏好。
// ============================================================================
const PAY_POLICY_META = {
  PAY_DAYS_PER_MONTH:  { legal: 21.75, unit: '天', hint: '法定 (365−104)/12。调高=日薪更低（事假扣得少），调低=多扣。' },
  PAY_WORK_HOURS_DAY:  { legal: 8, unit: '小时', hint: '法定标准工时 8 小时/日。' },
  PAY_BASIS:           { legal: 'day', options: ['day', 'hour'], hint: 'day=按人天（月薪制）；hour=按工时（时薪×实际工时）。个人可在人员档案上覆盖。' },
  PAY_WORKDAYS_SOURCE: { legal: 'calendar', options: ['calendar', 'roster', 'policy'], hint: '应出勤怎么算：日历工作日 / 排班天数 / 制度 21.75。' },
  PAY_OT_AUTO:         { legal: 'off', options: ['off', 'on'], hint: 'off 只出加班工时不算钱（上线前行为）；on 按法定倍数自动算。' },
  PAY_OT_COMP_REST:    { legal: 'pay', options: ['pay', 'deduct'], hint: '休息日加班"能安排补休的"不付 200%。默认 pay 一律给钱（多付不少付）；有补休登记后改 deduct。平日与法定节假日不能补休。' },
  PAY_OT_RATE_WEEKDAY: { legal: 1.5, unit: '倍', min: 1.5, hint: '平日延长工时。法定下限 1.5，只能调高。' },
  PAY_OT_RATE_RESTDAY: { legal: 2.0, unit: '倍', min: 2, hint: '休息日且不能补休。法定下限 2.0。' },
  PAY_OT_RATE_HOLIDAY: { legal: 3.0, unit: '倍', min: 3, hint: '法定节假日。法定下限 3.0。' },
  PAY_LEGAL_HOLIDAY:   { legal: 'paid', options: ['paid', 'unpaid'], hint: '法定节假日是否带薪（法定：带薪）。' },
};

// 社保申报基数的查看年度：默认当年，但调基通常在年中做下一年度的准备，
// 所以必须能切 —— 只给"当年"会让 7 月做下一年基数的人看不到自己刚录的东西。
let SID_YEAR = null;

async function viewPayPolicy() {
  const [r, lt, wt, sid] = await Promise.all([
    call('/api/payroll/policy'), call('/api/leave/types'), call('/api/work-time'),
    call('/api/si/declare' + (SID_YEAR ? `?year=${SID_YEAR}` : '')),
  ]);
  if (r.status !== 200) return fail(r);
  const { policies, tiers, wages, canWrite } = r.body;
  const leaveTypes = (lt.status === 200 ? lt.body.rows : []) || [];
  const hy = await call(`/api/att/holidays?year=${new Date(TODAY).getFullYear()}`);
  const hol = (hy.status === 200 ? hy.body.rows : []) || [];
  const holYear = (hy.status === 200 ? hy.body.year : new Date(TODAY).getFullYear());
  const holLegal = (hy.status === 200 ? hy.body.legalCount : 0);
  const holGaps = (hy.status === 200 ? hy.body.gaps : []) || [];
  const holCover = (hy.status === 200 ? hy.body.coverage : []) || [];
  const wtRows = (wt.status === 200 ? wt.body.rows : []) || [];
  const wtPeriod = (wt.status === 200 ? wt.body.period : '') || '';
  const sidRows = (sid.status === 200 ? sid.body.rows : []) || [];
  const sidYear = (sid.status === 200 ? sid.body.year : 0) || 0;
  const sidFloor = (sid.status === 200 ? sid.body.floor : null);
  const sidCeil = (sid.status === 200 ? sid.body.ceiling : null);
  const fmt = (n) => Number(n ?? 0).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const cur = (p) => (p.num !== null && p.num !== undefined ? Number(p.num) : p.txt);
