<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<!-- ★ 手机端五行，抄的是本地那个 ERP 的做法（它比 CRM 全）：
     viewport-fit=cover     刘海屏/全面屏下不留黑边，否则底部按钮被 home 指示条盖住
     apple-mobile-web-app-* 加桌面图标时按应用打开，不套 Safari 的地址栏
     theme-color            安卓 Chrome 地址栏跟着主色走，深色界面不刺眼
     format-detection       工号/手机号不被 iOS 识别成电话号码变蓝色链接（点了会弹拨号） -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0f1216" />
<meta name="format-detection" content="telephone=no" />
<title>AI-HR · 权限与算薪切片</title>
<style>
  :root{
    --bg:#0f1216; --panel:#161b22; --line:#232a33; --fg:#e6edf3; --dim:#8b949e;
    --accent:#4c8dff; --ok:#3fb950; --warn:#d29922; --bad:#f85149;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif}
  header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;
         align-items:center;gap:16px;flex-wrap:wrap}
  h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.3px}
  .sub{color:var(--dim);font-size:12px}
  .spacer{flex:1}
  .who{display:flex;gap:6px;align-items:center}
  button{background:var(--panel);color:var(--fg);border:1px solid var(--line);white-space:nowrap;
         border-radius:6px;padding:6px 11px;font-size:13px;cursor:pointer;
         font-family:inherit}
  button:hover{border-color:#39424d}
  button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  button:disabled{opacity:.45;cursor:not-allowed}
  main{padding:20px 22px;max-width:1080px}
  /* 页签会增多：让它换行而不是把每个按钮压成两行字（"工作台"竖着排很难看） */
  button{white-space:nowrap}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;
         padding:16px 18px;margin-bottom:16px}
  .card h2{font-size:13px;margin:0 0 4px;font-weight:600}
  .card p.note{color:var(--dim);font-size:12px;margin:0 0 12px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:500;font-size:12px}
  td.num{font-variant-numeric:tabular-nums}
  .masked{color:var(--dim);font-style:italic}
  /* 实发默认遮挡、点一下看。遮住时颜色淡一档 + 虚线下划线，告诉人"这里能点"——
     不给提示的话，四个圆点在用户眼里和"数据没出来"长得一样。 */
  .masked-net{color:var(--dim); cursor:pointer; user-select:none; letter-spacing:1.5px;
              border-bottom:1px dashed var(--line)}
  .masked-net.on{color:var(--fg); letter-spacing:0; border-bottom-color:transparent}
  .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;
       border:1px solid var(--line);color:var(--dim)}
  .tag.ok{color:var(--ok);border-color:#1f6f34}
  .tag.warn{color:var(--warn);border-color:#6b5015}
  .tag.bad{color:var(--bad);border-color:#7a2721}
  .empty{color:var(--dim);padding:14px 4px;font-size:13px}
  .kv{display:flex;gap:22px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin-top:10px}
  .kv b{color:var(--fg);font-weight:500}
  code{background:#0b0e12;border:1px solid var(--line);border-radius:4px;
       padding:1px 5px;font-size:12px}
  .banner{border-left:3px solid var(--accent);padding:10px 14px;background:#11161d;
          border-radius:0 6px 6px 0;font-size:12.5px;color:var(--dim);margin-bottom:16px}
  .banner b{color:var(--fg)}
  /* 工作台的数字块：只回答"该不该点进去"，所以不做进度条、不做趋势图 */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px;margin:6px 0 4px}
  .tile{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;
        background:#0b0e12;border:1px solid var(--line);border-radius:8px;padding:12px 14px;
        cursor:pointer;font-family:inherit;color:var(--fg);transition:border-color .15s}
  .tile:hover{border-color:#39424d}
  .tile.hot{border-color:#7a2721;background:#16100f}
  .tile .n{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
  .tile.hot .n{color:var(--bad)}
  .tile .l{font-size:12.5px}
  .defs{margin:12px 0 0;padding-left:18px;font-size:12px;color:var(--dim);line-height:1.9}
  .defs b{color:var(--fg);font-weight:500}
  /* 表单：写操作的入口。没有它，后端能写而人只能 curl */
  .form{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-top:4px}
  .form label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--dim)}
  .form input,.form select{background:#0b0e12;color:var(--fg);border:1px solid var(--line);
    border-radius:6px;padding:5px 8px;font-size:13px;font-family:inherit;min-width:110px}
  .form input:focus,.form select:focus{outline:none;border-color:var(--accent)}
  /* 提示条：拒绝必须说清是哪一条（业务码），不能只说"失败" */
  .toast{position:fixed;right:18px;bottom:18px;max-width:420px;background:var(--panel);
    border:1px solid var(--line);border-left:3px solid var(--dim);border-radius:6px;
    padding:10px 14px;font-size:12.5px;box-shadow:0 8px 24px #0008;animation:slide .18s ease-out}
  .toast.ok{border-left-color:var(--ok)}
  .toast.bad{border-left-color:var(--bad)}
  .toast b{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  @keyframes slide{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}

/* ---- 手机 / Pad（H5 一套页面：安卓、iOS、Pad 通用） ---- */
@media (max-width: 720px) {
  body { font-size: 15px; }
  .card { padding: 12px; margin: 8px 0; overflow-x: auto; }
  /* ★ 原来是 table{display:block;overflow-x:auto} —— display:block 会让 thead/tbody
     失去表格布局，手机上整个表被压成"一列一列往下堆"。正确做法是：
     表格保持 table，给卡片一条横向滚动条，并给表格一个最小宽度（不被压扁）。 */
  table { min-width: 560px; }
  .punch-card { text-align: center; }
  .punch-clock { font-size: 44px; letter-spacing: 2px; }
  .punch-actions { display: flex; flex-direction: column; gap: 10px; }
  .punch-actions button { padding: 16px; font-size: 17px; }
}
.punch-card { text-align: center; }
.punch-clock { font-size: 40px; font-variant-numeric: tabular-nums; margin: 6px 0; }
.punch-line { color: var(--fg-2, #555); }
.punch-actions { display: flex; gap: 10px; justify-content: center; margin-top: 12px; }
.punch-actions button { min-width: 120px; padding: 12px 18px; }
.punch-warn { color: #b45309; margin-top: 6px; }

/* ================= 蓝白科技感主题（覆盖层，不动原有规则） ================= */
:root{
  --bg:#eef4ff; --card:#ffffff; --fg:#0f172a; --fg-2:#475569; --line:#dbe6ff;
  --primary:#1d4ed8; --primary-2:#3b82f6; --accent:#06b6d4;
  --ok:#0f9d6b; --warn:#b45309; --bad:#dc2626;
  --shadow:0 6px 18px rgba(29,78,216,.10); --radius:14px;
}
body{
  background:
    radial-gradient(900px 420px at 12% -10%, rgba(59,130,246,.20), transparent 60%),
    radial-gradient(700px 360px at 88% 0%, rgba(6,182,212,.16), transparent 55%),
    var(--bg);
  color:var(--fg);
}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow);}
.card h2{letter-spacing:.2px}
button{background:linear-gradient(180deg,var(--primary-2),var(--primary)); color:#fff;
  border:0; border-radius:10px; padding:8px 14px; font-weight:600;
  box-shadow:0 4px 12px rgba(29,78,216,.25); transition:transform .06s ease;}
button:hover{transform:translateY(-1px)}
button:disabled{background:#c7d2fe; box-shadow:none; transform:none}
.tabs{background:rgba(255,255,255,.7); backdrop-filter:blur(6px); border-bottom:1px solid var(--line)}
th{color:var(--fg-2); font-weight:600}
table{border-collapse:separate; border-spacing:0}
td,th{border-color:var(--line)}

/* ================= 排班看板：拖拉划线 + 班次配色 ================= */
.roster-wrap{overflow:auto; border-radius:12px; border:1px solid var(--line)}
.roster{border-collapse:separate; border-spacing:0; min-width:820px; user-select:none}
.roster th,.roster td{border-bottom:1px solid var(--line); padding:0; font-size:12px}
.roster th{padding:8px 10px; background:#f7faff; position:sticky; top:0; z-index:2}
.roster td.name{position:sticky; left:0; background:#fff; z-index:1; padding:8px 10px; min-width:130px}
.roster td.cell{width:92px; height:46px; cursor:crosshair; position:relative;
  text-align:center; color:#fff; transition:outline .05s; vertical-align:middle}
/* 班次名一行、起止时间一行：只显示"班"或只有色块，等于让人靠颜色记班次 */
.roster td.cell .sn{font-size:12px; font-weight:700; line-height:15px; letter-spacing:.2px}
.roster td.cell .st{font-size:10px; line-height:13px; opacity:.88; font-variant-numeric:tabular-nums}
.roster td.cell.empty{background:
  repeating-linear-gradient(135deg,#fcfdff,#fcfdff 6px,#f6f9ff 6px,#f6f9ff 12px)}
.roster td.cell.empty::after{content:''; }
.roster td.cell.sel{outline:2px solid var(--primary); outline-offset:-2px}
/* 图例：把"哪个颜色是什么班"贴在表格上方，人不用回头点一遍调色板 */
.legend{display:flex; gap:14px; flex-wrap:wrap; align-items:center;
  font-size:12px; color:var(--fg-2); margin:0 0 8px}
.legend b{color:var(--fg); font-weight:600}
.legend .sw{width:12px; height:12px; border-radius:3px; display:inline-block; margin-right:5px;
  vertical-align:-1px}
.palette{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:8px 0 12px}
.chip{display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border-radius:999px;
  border:1px solid var(--line); background:#fff; cursor:pointer; font-size:12px; font-weight:600}
.chip.on{box-shadow:0 0 0 2px var(--primary) inset}
.chip .dot{width:10px; height:10px; border-radius:50%}
.roster-hint{color:var(--fg-2); font-size:12px}

/* ===== 日视图时间轴（划线排班）：一小时一列，段是绝对定位的条 ===== */
.tl{border:1px solid var(--line); border-radius:12px; overflow:hidden; background:#fff}
.tl-head,.tl-row{display:flex; align-items:stretch}
.tl-head{background:#f7faff; border-bottom:1px solid var(--line)}
.tl-name{width:110px; flex:0 0 110px; padding:6px 8px; border-right:1px solid var(--line);
  font-size:12px; line-height:1.3; background:#fff; z-index:2}
.tl-head .tl-name{background:#f7faff}
.tl-hours{flex:1; display:grid; grid-template-columns:repeat(25,1fr); font-size:10px;
  color:var(--fg-2); padding:6px 0}
.tl-hours span{text-align:left; padding-left:2px; border-left:1px solid var(--line)}
.tl-row{border-bottom:1px solid var(--line)}
.tl-row:last-child{border-bottom:none}
.tl-track{flex:1; position:relative; height:36px; display:grid;
  grid-template-columns:repeat(24,1fr); cursor:crosshair; touch-action:none}
.tl-cell{border-left:1px solid #eef2f7; display:block}
.tl-seg{position:absolute; top:5px; bottom:5px; border-radius:6px; overflow:hidden;
  display:flex; align-items:center; padding:0 14px 0 5px; cursor:default}
.tl-seg.temp{background:#bfdbfe; border:1px solid #93c5fd; color:#1e3a8a}
.tl-seg.fixed{background:#2563eb; border:1px solid #1d4ed8; color:#fff}
.tl-seg .t{font-size:10px; font-weight:600; white-space:nowrap; overflow:hidden}
.tl-num{width:64px; flex:0 0 64px; padding:6px 8px; border-right:1px solid var(--line);
  font-size:11px; color:var(--fg-2); text-align:right; font-variant-numeric:tabular-nums;
  display:flex; align-items:center; justify-content:flex-end}
.tl-sel{position:absolute; top:3px; bottom:3px; background:rgba(37,99,235,.22);
  border:1px dashed #2563eb; border-radius:4px; pointer-events:none}
@media (max-width:720px){
  .roster td.cell{width:64px; height:50px}
  .roster td.name{min-width:96px; font-size:12px}
  /* ★ 日视图时间轴：原来是 `.tl{overflow:hidden}` + 25 个小时格挤成 1fr，
     在 335px 的卡片里每小时只有 6.7px —— 时间轴只画到 11 点，"10""11"的数字还叠在一起，
     12:00–23:59 这一段**永远拿不到**，下午班/晚班在手机上报不了。
     修法与排班看板同一套（.roster-wrap + min-width + sticky 首列）：
     给 .tl 一条横向滚动，行给一个最小宽度让小时格回到可点尺寸，姓名列钉在左侧。 */
  .tl{overflow-x:auto; -webkit-overflow-scrolling:touch}
  .tl-head,.tl-row{min-width:820px}
  .tl-name{position:sticky; left:0; z-index:3}
}

input, select, textarea{
  background:#fff; color:var(--fg); border:1px solid var(--line); border-radius:8px;
  padding:6px 10px; font-size:13px; font-family:inherit;
}
input:focus, select:focus, textarea:focus{outline:2px solid #c7d7ff; border-color:var(--primary-2)}
tr.inactive td{opacity:.55}
.org-row{cursor:pointer}
.org-row:hover td{background:#f5f9ff}
.org-row .caret{display:inline-block; width:12px; color:#94a3b8; transition:transform .12s}
.org-expand .caret{transform:rotate(90deg)}
.graph-wrap{overflow:auto; border-radius:12px; background:
  radial-gradient(600px 300px at 50% 40%, #f2f7ff, #ffffff 70%)}
.org-graph{width:100%; height:680px}
.org-graph .node{cursor:pointer}
.org-graph .node circle{transition:stroke-width .1s, fill-opacity .1s}
.org-graph .node:hover circle{stroke:#1d4ed8; stroke-width:3; fill-opacity:1}
/* 班次配色：常见班次用类，未知班次仍走 inline 兜底。
   不用 inline 的唯一理由是 CSP 收紧那天它们会一起变白，而白底白字看起来像"没排班"。 */
.shift-EARLY{background:#2563eb;color:#fff}
.shift-MID{background:#0ea5e9;color:#fff}
.shift-LATE{background:#7c3aed;color:#fff}
.shift-CLOSE{background:#db2777;color:#fff}
.shift-REST{background:#94a3b8;color:#fff}
.shift-FIXED{background:#1d4ed8;color:#fff}
/* ================= 正式态精修（克制的排版，不是演示页） ================= */
header{
  display:flex; align-items:center; gap:10px; padding:10px 20px;
  background:rgba(255,255,255,.86); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20;
}
header h1{font-size:16px; letter-spacing:.4px; margin:0; font-weight:700; color:var(--primary)}
header .sub{color:var(--fg-2); font-size:12px}
header .spacer{flex:1}
.me{display:flex; flex-direction:column; line-height:1.25; text-align:right; margin-right:6px}
.me b{font-size:13px; font-weight:600}
.me .sub{font-size:11px; color:var(--fg-2)}

/* 导航：两级。一级是"这件事属于哪一块"，二级才是具体页面。
   ★ 容器**不能** overflow:hidden/auto —— 下拉面板是绝对定位的子元素，
     一裁就看不见（做过一次，表现为"点了没反应"）。手机端另用 fixed 面板。 */
/* ★ 结构：.tabs 只做"定位容器 + 吸顶"，横滑交给 .navrow，下拉放在 #droplayer。
   为什么不能把下拉塞进横滑容器里：手机上 .navrow 有 overflow-x:auto，
   它会成为 fixed/absolute 弹出的包含块并**裁掉溢出部分** ——
   现象是"点了菜单，面板在 DOM 里有位置但看不见"（实测 rect 正确、画面空白）。 */
.tabs{
  padding:0 12px; background:rgba(255,255,255,.96); border-bottom:1px solid var(--line);
  /* ★ 原来写死 top:51px。桌面 header 正好 51px，所以看着是对的；
     但窄屏 header 会 flex-wrap 成两行（375px 下实测 87px），tabs 仍贴在 51px ——
     滚过 51px 之后 header（z-index 20）把导航条盖掉 36px，只剩 2px 露头，
     表现为"手机上滑一下，导航就点不到了"。
     --hdr-h 由 JS 按 header 实测高度写入（见 syncStickyTop），默认值仍写 51 兜底。 */
  position:sticky; top:var(--hdr-h, 51px); z-index:19;
  /* ★ backdrop-filter 会为 fixed/absolute 后代创建包含块，等于给下拉加一层裁剪风险；
     吸顶条本来就不透明，没必要。 */
  backdrop-filter:none;
}
.navrow{display:flex; flex-wrap:wrap; gap:2px}
/* 右缘横滑提示：桌面放得下 11 个一级项（flex-wrap:wrap），这块根本不该存在；
   只在手机断点（.navrow 改成横滑的那一处）里才 display:block。 */
.navfade{display:none}
/* 「显示门店」只出现在手机上：桌面 1280 下 67 个节点本来就排得开，不需要这个开关。 */
.only-phone{display:none}
/* 组之间留一点呼吸：11 个一级项紧挨着会读成一长串，间距是唯一的分组线索 */
.navgroup{position:relative}
.navgroup + .navgroup{margin-left:5px}
.nav-orphan{align-self:center; margin-left:8px; padding:2px 8px; border-radius:99px;
  background:#fdf2f2; border:1px solid #f3c6c6; color:#b4261d; font-size:11.5px}
.tabs .navbtn:hover{background:#f4f7fd; border-radius:6px 6px 0 0}
.tabs .navbtn{
  background:transparent; color:var(--fg-2); box-shadow:none; border-radius:0;
  padding:9px 13px; font-weight:500; font-size:13px; white-space:nowrap;
  border-bottom:2px solid transparent;
}
.tabs .navbtn.on{color:var(--primary); border-bottom-color:var(--primary); font-weight:650}
.navbtn .caret{display:inline-block; width:0; height:0; margin-left:5px; vertical-align:2px;
  border-left:3.5px solid transparent; border-right:3.5px solid transparent;
  border-top:4px solid currentColor; opacity:.5}
.navgroup.open .navbtn{color:var(--primary)}
.navgroup.open .navbtn .caret{transform:rotate(180deg)}
#droplayer{position:absolute; top:100%; left:var(--dl,0); z-index:60; display:none}
#droplayer.on{display:block}
#droplayer.wide{left:4px; right:4px}
.dropdown{
  min-width:238px; background:#fff; border:1px solid var(--line);
  border-radius:0 0 10px 10px; box-shadow:0 14px 30px rgba(16,24,40,.14); padding:5px;
}
#droplayer.wide .dropdown{min-width:0; border-radius:10px; max-height:62vh; overflow:auto}
.dropdown button{
  display:flex; flex-direction:column; align-items:flex-start; gap:1px;
  width:100%; padding:7px 10px; border:none; border-radius:6px;
  background:transparent; box-shadow:none; text-align:left; font-weight:500;
  border-bottom:none;
}
.dropdown button b{font-size:12.5px; font-weight:600; color:var(--fg)}
.dropdown button span{font-size:11px; color:var(--fg-2); line-height:1.35}
.dropdown button:hover{transform:none; background:#f4f7fd}
.dropdown button.on{background:#eef3ff}
.dropdown button.on b, .dropdown button.on span{color:var(--primary)}
/* ★ 原来 main 被限宽 1080：1600 的屏幕上右边空出 500px，
   看起来像"没做完"而不是"留白讲究"。表格为主的系统应该铺满。 */
main{padding:0 12px 20px; max-width:1720px; margin:0 auto}
.card{margin:8px 0; padding:10px 12px}
.card h2{font-size:14px; font-weight:650; margin:0 0 4px}
.note{font-size:12px; color:var(--fg-2); line-height:1.45; margin:2px 0 6px}
.note b{color:var(--fg)}
table{font-size:12.5px; width:100%}
/* ★ table-layout:fixed 是必需的：默认 auto 会按内容分配列宽，
   于是"当前值"这种短内容列反而占得最宽、说明列被压成一条 —— 
   给了 width 也不生效。fixed 之后 width 才算数，剩余宽度自动给未设宽的列。 */
.card > table, #view table{table-layout:fixed !important}
.card > table th,.card > table td,#view table th,#view table td{overflow-wrap:anywhere}
th,td{padding:4px 8px; vertical-align:middle}
th{font-size:11.5px; letter-spacing:.3px; text-transform:none; background:#f8faff}
/* 数字列右对齐 + 等宽，扫一眼就能比大小（不是装饰，是让"哪行不对"自己跳出来） */
td.num,th.num{text-align:right; font-variant-numeric:tabular-nums}
button.ghost{
  background:transparent; color:var(--fg-2); border:1px solid var(--line);
  box-shadow:none; font-weight:500; padding:5px 10px; font-size:12px;
}
button.ghost:hover{color:var(--primary); border-color:var(--primary); transform:none}
button.ghost.on{color:var(--primary); border-color:var(--primary); background:#eef4ff}
.tab-sep{display:inline-block; width:1px; height:16px; background:var(--line); margin:0 6px; align-self:center}
.tag{font-size:11px; padding:1px 7px; border-radius:999px; background:#eef2ff; color:#3747a5; font-weight:600}
.tag.ok{background:#e7f7ef; color:#0f7a52}
.tag.warn{background:#fff4e5; color:#a15c00}
.tag.bad{background:#fdecec; color:#b3261e}

/* =========================================================================
   组织架构 · 图形层
   -------------------------------------------------------------------------
   两页（部门 / 岗位）用一个滑动分段器切换；部门里再分三种看法。
   图形全部是自算坐标 + 原生 SVG：不引外部图库（离线、内网、CSP 都安全），
   而且"这个节点为什么在这儿"能指着代码解释。
   ========================================================================= */

/* ---- 滑动分段器：滑块跟在选项后面走，不是三个独立按钮 ---- */
.seg{
  --n:2; --i:0;
  position:relative; display:inline-flex; padding:3px; border-radius:12px;
  background:#eef3ff; border:1px solid var(--line);
}
.seg .thumb{
  position:absolute; top:3px; left:3px; height:calc(100% - 6px);
  width:calc((100% - 6px) / var(--n));
  border-radius:9px; background:#fff; box-shadow:0 2px 8px rgba(29,78,216,.18);
  transform:translateX(calc(var(--i) * 100%));
  transition:transform .22s cubic-bezier(.4,.1,.2,1);
}
.seg button{
  position:relative; z-index:1; background:transparent; box-shadow:none; border:0;
  color:var(--fg-2); font-weight:600; font-size:13px; padding:7px 18px; border-radius:9px;
  min-width:104px;
}
.seg button:hover{transform:none; color:var(--primary)}
.seg button.on{color:var(--primary)}
.seg button .cnt{font-weight:500; color:#94a3b8; margin-left:5px; font-size:11.5px}

/* 工具条里的小号分段器：和顶部同一种滑动件，只是尺寸收一档 */
.seg.sm{padding:2px; border-radius:10px}
.seg.sm .thumb{top:2px; left:2px; height:calc(100% - 4px);
  width:calc((100% - 4px) / var(--n)); border-radius:8px;
  box-shadow:0 1px 4px rgba(29,78,216,.16)}
.seg.sm button{min-width:0; padding:4px 11px; font-size:12px; border-radius:8px}

/* ---- 次级视图切换（树形 / 关系网 / 清单）---- */
.subseg{display:inline-flex; gap:4px; padding:3px; background:#f5f8ff;
  border:1px solid var(--line); border-radius:10px}
.subseg button{background:transparent; box-shadow:none; color:var(--fg-2);
  font-weight:500; font-size:12px; padding:5px 12px; border-radius:7px}
.subseg button:hover{transform:none; color:var(--primary)}
.subseg button.on{background:#fff; color:var(--primary); font-weight:600;
  box-shadow:0 1px 4px rgba(29,78,216,.16)}

/* ---- 画布外壳：可缩放、可拖拽平移 ---- */
.canvas-bar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:2px 0 10px}
.canvas-bar .hint{color:var(--fg-2); font-size:11.5px; margin-left:auto}
.zoomer{display:inline-flex; align-items:center; gap:2px; border:1px solid var(--line);
  border-radius:9px; overflow:hidden; background:#fff}
.zoomer button{background:#fff; box-shadow:none; color:var(--fg-2); border-radius:0;
  padding:4px 10px; font-size:13px; line-height:1.4}
.zoomer button:hover{transform:none; background:#eef4ff; color:var(--primary)}
.zoomer .val{min-width:50px; text-align:center; font-size:11.5px; color:var(--fg-2);
  font-variant-numeric:tabular-nums}
.org-canvas{
  overflow:auto; border:1px solid var(--line); border-radius:12px; cursor:grab;
  background:
    radial-gradient(600px 320px at 22% 0%, rgba(59,130,246,.10), transparent 60%),
    linear-gradient(180deg,#fbfdff,#f7faff);
  background-size:auto, auto;
  max-height:min(78vh, 860px);
}
.org-canvas.dragging{cursor:grabbing}
.org-canvas svg{display:block; margin:0 auto; transform-origin:0 0}
/* 点阵底：让"拖到哪儿了"有参照，不靠阴影 */
.org-canvas{background-image:
  radial-gradient(circle at 1px 1px, #dbe6ff 1px, transparent 0),
  radial-gradient(600px 320px at 22% 0%, rgba(59,130,246,.10), transparent 60%);
  background-size:22px 22px, auto;}

/* ---- 树形图节点 ---- */
.onode{cursor:pointer}
.onode .nbox{transition:stroke .12s, filter .12s}
.onode:hover .nbox{stroke:var(--primary); stroke-width:1.8}
.onode.sel .nbox{stroke:var(--primary); stroke-width:2}
.onode.dim{opacity:.28}
.onode.kin .nbox{stroke:var(--primary-2)}
.link{transition:stroke .12s, stroke-width .12s}
.link.kin{stroke:var(--primary); stroke-width:2.4}
.link.dim{stroke:#e6eefc}
.fold{cursor:pointer}
.fold circle{transition:fill .12s, stroke .12s}
.fold:hover circle{fill:var(--primary); stroke:var(--primary)}
.fold:hover text{fill:#fff}

/* ---- 关系网 ---- */
.org-graph .node{cursor:pointer}
.org-graph .node.lit circle.core{filter:drop-shadow(0 0 10px rgba(29,78,216,.45))}
.org-graph .node.dim{opacity:.18}
.org-graph .node.dim text{opacity:.4}
.org-graph .link2{transition:opacity .12s, stroke .12s}
.org-graph .link2.dim{opacity:.10}
.org-graph .link2.kin{stroke:var(--primary); stroke-width:2.6; opacity:1}

/* ---- 岗位卡片 ---- */
.pos-dept{margin:0 0 14px; border:1px solid var(--line); border-radius:12px; overflow:hidden;
  background:#fff}
.pos-dept > header{display:flex; align-items:center; gap:10px; padding:9px 14px;
  background:linear-gradient(90deg,#f4f8ff,#fbfdff); border-bottom:1px solid var(--line)}
.pos-dept > header b{font-size:13px}
.pos-dept > header .sub{font-size:11.5px}
.pos-dept > header .bar{margin-left:auto; height:6px; width:120px; border-radius:99px;
  background:#e8eeff; overflow:hidden}
.pos-dept > header .bar i{display:block; height:100%; border-radius:99px;
  background:linear-gradient(90deg,var(--primary-2),var(--primary))}
.pos-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(232px,1fr)); gap:10px;
  padding:12px}
.pos-card{border:1px solid var(--line); border-radius:11px; padding:10px 12px; background:#fff;
  transition:box-shadow .12s, border-color .12s, transform .08s}
.pos-card:hover{border-color:#b9cdfb; box-shadow:0 6px 16px rgba(29,78,216,.10);
  transform:translateY(-1px)}
.pos-card.vacant{border-style:dashed; background:#fcfdff}
.pos-card .top{display:flex; align-items:center; gap:6px; margin-bottom:6px}
.pos-card .top b{font-size:13px; letter-spacing:.2px}
.pos-card .who{display:flex; align-items:center; margin:6px 0 4px; min-height:28px}
.pos-card .av{width:27px; height:27px; border-radius:50%; display:inline-flex;
  align-items:center; justify-content:center; font-size:12px; line-height:1; color:#fff;
  font-weight:600; border:2px solid #fff; box-shadow:0 1px 3px rgba(15,23,42,.16);
  flex:0 0 auto}
/* 叠压只发生在相邻之间：用 + 而不是给每个都设负 margin（后者会切到上一个） */
.pos-card .av + .av{margin-left:-8px}
.pos-card{min-height:96px; display:flex; flex-direction:column}
.pos-card .meta{font-size:11.5px; color:var(--fg-2); line-height:1.5; margin-top:auto; padding-top:4px}
.pos-card .empty-hint{font-size:11.5px; color:#94a3b8; font-style:normal}
.pos-sum{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:8px;
  margin:4px 0 12px}
.pos-sum div{background:#f8faff; border:1px solid var(--line); border-radius:10px;
  padding:8px 12px; font-size:11.5px; color:var(--fg-2)}
.pos-sum div b{display:block; font-size:20px; color:var(--fg); font-variant-numeric:tabular-nums;
  line-height:1.3}

/* 起草人/说明块：图形页容易只剩图，把口径钉在图上 */
.fignote{font-size:11.5px; color:var(--fg-2); margin-top:8px; line-height:1.7}
.fignote b{color:var(--fg)}
.lgd{display:inline-flex; align-items:center; gap:5px; margin-right:14px; font-size:11.5px;
  color:var(--fg-2)}
.lgd i{width:9px; height:9px; border-radius:3px; display:inline-block}

.org-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

/* 工资表：月薪总额做成一个"大数字"，其余数字都是它的注脚 */
.pay-hero{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;
  font-size:26px;font-weight:700;color:var(--primary);font-variant-numeric:tabular-nums}
.pay-hero span{font-size:11px;font-weight:500;color:var(--fg-2);letter-spacing:.4px}
/* code 在深色主题里是深底浅字；蓝白主题下必须反过来，否则是一块黑 */
code,pre{background:#f3f6ff;border:1px solid #dbe6ff;color:#1e3a8a;border-radius:5px;
  padding:1px 6px;font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  white-space:nowrap}
.struct-bar{display:block;height:7px;border-radius:99px;background:#eef2ff;overflow:hidden}
.struct-bar i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--primary-2),var(--primary))}
/* ★ 旧深色主题里 `.form input{background:#0b0e12}`，比通用 input 规则更具体，
   蓝白主题下就成了"黑框白字"。这里按同样的选择器覆盖回来。 */
.form input,.form select,.form textarea{background:#fff;color:var(--fg);border:1px solid var(--line)}
.form label{color:var(--fg-2)}

/* 指标卡：少量、等长的数据（病假 5 档）横排铺开比表格饱满得多 —
   表格只有 3 列却要占 1500px，中间那列会被拉成一条空白带。 */
/* 宽表在手机上的卡片化：一列一行的 .stack 对 12 列的表太长了（一人占满一屏），
   所以这里用两列网格 —— 每张卡 3~4 行，一屏能看两个人。 */
@media (max-width: 720px){
  table.stack2{min-width:0 !important; width:100%; table-layout:auto}
  table.stack2 thead{display:none}
  table.stack2 tbody{display:block}
  table.stack2 tr{display:grid; grid-template-columns:1fr 1fr; column-gap:10px; row-gap:1px;
    border:1px solid var(--line); border-radius:8px; padding:8px 11px; margin-bottom:8px}
  table.stack2 td{display:block; padding:1px 0; border:none; text-align:left !important}
  table.stack2 td::before{content:attr(data-label) ' '; color:var(--fg-2); font-size:11px}
  table.stack2 td.hide-sm{display:none !important}
  table.stack2 td:first-child{grid-column:1/-1; padding-bottom:5px; margin-bottom:4px;
    border-bottom:1px dashed var(--line)}
  table.stack2 td:first-child::before{content:''}
  table.stack2 td:last-child{grid-column:1/-1; padding-top:5px; margin-top:2px;
    border-top:1px dashed var(--line); text-align:right !important}
}
/* 表内滚动：节假日一年 39 行，铺开会把整页拖长一倍，后面的卡片被挤没了 */
.scroll-y{max-height:440px; overflow:auto; border-radius:6px}
/* 节假日缺口条（130）：错误红、提醒橙。它不是装饰 —— 这条缝会让应出勤算错 */
.hol-gap{background:#fdf7ef; border:1px solid #f0dcc0; border-left:3px solid #d08a2a;
  border-radius:0 6px 6px 0; padding:8px 12px; margin:2px 0 10px; font-size:12px}
.hol-gap b{display:block; margin-bottom:2px; color:#8a5a12}
.hol-gap ul{margin:0; padding-left:18px}
.hol-gap li.error{color:#b4261d; font-weight:500}
.hol-gap li.warn{color:#6b5a42}
.hol-pill{display:inline-flex; align-items:center; gap:4px; font-size:11.5px;
  padding:3px 9px; border-radius:99px; border:1px solid var(--line); background:#f8faff; color:var(--fg-2)}
.hol-pill.ok{border-color:#bfe3c8; background:#f2fbf4; color:#2b6a3d}
.hol-pill.missing{border-color:#f3c6c6; background:#fdf2f2; color:#b4261d; font-weight:600}
.hol-pill.unconfirmed{border-color:#f0dcc0; background:#fdf7ef; color:#8a5a12}
.tier-grid{display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:8px; margin-top:6px}
.tier{background:#f8faff; border:1px solid var(--line); border-radius:8px; padding:9px 11px}
.tier .k{font-size:11px; color:var(--fg-2); line-height:1.4; margin-bottom:2px}
.tier .v{font-size:20px; font-weight:700; color:var(--primary);
  font-variant-numeric:tabular-nums; line-height:1.15}
.tier .v span{font-size:11px; font-weight:600; margin-left:1px}
/* 指标卡列数也走类，不用内联 style —— 内联的优先级高于媒体查询，
   手机端会照旧排 4 列，每个卡片被压成一条竖条（截图里"当前口径"被折成三行）。 */
.tier-grid.kpi4{grid-template-columns:repeat(4, minmax(0,1fr))}
.tier-grid.kpi3{grid-template-columns:repeat(3, minmax(0,1fr))}
.tier-grid.kpi5{grid-template-columns:repeat(5, minmax(0,1fr))}
@media (max-width:1100px){ .tier-grid{grid-template-columns:repeat(3, minmax(0,1fr))}
  .tier-grid.kpi5{grid-template-columns:repeat(3, minmax(0,1fr))} }
@media (max-width:1100px){ .tier-grid.kpi4{grid-template-columns:repeat(2, minmax(0,1fr))} }
@media (max-width:720px){ .tier-grid{grid-template-columns:repeat(2, minmax(0,1fr)); gap:6px}
  .tier{padding:8px 9px} .tier .v{font-size:17px} }

/* 假种卡：7 个假种排成网格。用表格的话"说明"列会被拉成一条空白带，
   而每行信息量又很小 —— 卡片能把比例做成大数字，一眼扫完。 */
.lt-grid{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px; margin-top:6px}
.lt{background:#f8faff; border:1px solid var(--line); border-radius:8px; padding:9px 11px;
  display:flex; flex-direction:column; gap:3px}
.lt.off{opacity:.6}
.lt .h{display:flex; align-items:center; gap:5px; flex-wrap:wrap}
.lt .h code{font-size:11px; padding:0 5px}
.lt .n{font-size:13px; font-weight:650}
.lt .v{font-size:22px; font-weight:700; color:var(--primary);
  font-variant-numeric:tabular-nums; line-height:1.1}
.lt .v span{font-size:11px; font-weight:600; margin-left:1px}
.lt .k{font-size:11px; color:var(--fg-2); line-height:1.4; min-height:31px}
.lt .a{display:flex; gap:5px; margin-top:2px}
@media (max-width:1200px){ .lt-grid{grid-template-columns:repeat(3, minmax(0,1fr))} }
@media (max-width:720px){ .lt-grid{grid-template-columns:repeat(2, minmax(0,1fr)); gap:6px}
  .lt{padding:8px 9px} .lt .v{font-size:18px} .lt .k{min-height:0} }

/* 小屏堆叠：宽表在手机上横向滑动看不全，改成"一行一张小卡"，
   label 由 data-label 生成。只给信息型表格用（政策/假种），
   操作型表格（月报）仍用横向滑动 —— 那类表要横向对比。 */
@media (max-width:720px){
  table.stack{min-width:0 !important; width:100%; table-layout:auto}
  table.stack thead{display:none}
  table.stack, table.stack tbody, table.stack tr, table.stack td{display:block; width:auto}
  table.stack tr{border:1px solid var(--line); border-radius:8px;
    padding:8px 10px; margin:0 0 8px}
  table.stack td{padding:2px 0; text-align:left !important; border:none}
  table.stack td::before{content:attr(data-label) ' '; color:var(--fg-2); font-size:11px}
  table.stack td:first-child{padding-bottom:4px; margin-bottom:4px;
    border-bottom:1px dashed var(--line)}
  table.stack td:first-child::before{content:''}
  table.stack td:last-child{padding-top:6px}
  table.stack td.hide-sm{display:none !important}
}

@media (max-width:720px){
  header{flex-wrap:wrap}          /* 窄屏别把"退出"挤到屏幕外 */
  main{padding:0 10px 18px}
  .card{margin:8px 0; padding:10px; overflow-x:auto}
  .note{font-size:11.5px; line-height:1.45}
  /* 宽表（月报 12 列、政策 6 列）在手机上只能滑：卡片内部一条滚动条，
     表格保持 table 布局 + 最小宽度，不会被压成一条。
     不用 display:block —— 那会让表头与数据行错位。 */
  .card > table{table-layout:auto; width:auto; min-width:520px}
  /* ★ 上面那句 `width:auto` 把 `table.stack`/`table.stack2` 自己写的 `width:100%` 也压掉了
     （同优先级、这句更晚），结果卡片化的表按内容收缩：实测同一套模板下宽度是
     167 / 253 / 275 / 276 / 333px 五种，右边留一条空白，看起来像没做完。
     这五句只做一件事：卡片化的表占满卡片宽度。不影响仍是宽表的页面。 */
  table.stack, table.stack2{width:100%}
  /* 手机上把次要列收起来：一屏能看到"政策项/当前值/法定/说明"，
     而不是滑三次才看到法定值。生效日与星期在桌面端看，手机上不必占位。 */
  .hide-sm{display:none !important}
  /* 顶部导航多到放不下：一级自己横滑（11 个），二级落到宽面板上 */
  .tabs{padding:0 6px}
  .navrow{flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; gap:0}
  .navrow::-webkit-scrollbar{height:0}
  /* ★ 一个**改前就有**的怪值，别当新 bug 去"修"：
     375px 下 `documentElement.scrollWidth` 比 `clientWidth` 多约 161px，
     来源是 .navrow 的横滑内容被 document 计入了宽度；但 `window.scrollX` 恒为 0
     （整页实际滚不动），`elementFromPoint` 也证明右侧没有可点的溢出内容。
     ⚠️ 不要用 `html,body{overflow-x:hidden}` 去"消掉"这个数：那会在祖先上造一个
        滚动容器，`.tabs` 的 position:sticky 会失效（导航不再吸顶），
        而症状是"手机上滑下去导航没了"——比多 161px 难查得多。
     真要在意这个数，得让 .navrow 的溢出不计入 document（改 min-width:0 / 用
     width:100% 的包裹层），那是重构导航容器，不在这一刀里。 */
  /* ★ 横滑提示：11 个一级项在 375px 里放不下，右缘原来露出半截「考勤排班 ▾」，
     但没有任何迹象说明"这一排还能往右滑" —— 看起来就像导航只有前 7 个。
     右缘一道渐隐 + 一个 › 只说这一件事；滚到最右（或本来就不溢出）时整块消失，
     因为常驻的箭头会被读成"这里有个按钮"。遮罩 pointer-events:none，不吃点击。 */
  .navfade{display:block; position:absolute; top:0; right:0; width:46px; height:100%;
    pointer-events:none; opacity:0; transition:opacity .16s;
    background:linear-gradient(to right, rgba(255,255,255,0), rgba(255,255,255,.94) 55%)}
  .navfade.on{opacity:1}
  .navfade::after{content:'›'; position:absolute; right:5px; top:50%;
    transform:translateY(-50%); font-size:20px; line-height:1; font-weight:700;
    color:var(--primary); opacity:.8}
  /* ★ 点按区：实测 375px 下这一排 .navbtn 只有 37px 高（padding 9 + 字号 12.5 的行盒），
     低于 44px 的手指友好下限；而它是全站被点最多的控件（不进二级菜单就得点它）。
     只给它加 min-height，不放大字号 —— 高度靠上下留白补，文字密度不变。
     ★ 其余按钮（header 的「退出」29px、表单里 30–34px 的那些）**没动**：
       它们散布在各页表单里，统一抬高会改变每一处排版，收益不如风险，留作未解决项。 */
  .tabs .navbtn{padding:9px 11px; font-size:12.5px; min-height:44px}
  .seg button{min-width:0; padding:7px 12px; font-size:12.5px}
  .only-phone{display:inline-block}
  .canvas-bar .hint{display:none}
  .canvas-bar{gap:6px}
  .canvas-bar .zoomer button{padding:4px 7px}
  .org-canvas{max-height:64vh}
  .pos-cards{grid-template-columns:1fr}
  .org-head{gap:8px}
  .org-head .kv{flex:1 1 100%; margin:0}
  /* ★ 这里**曾经**有一句 `.card{overflow:clip}`，注释写的是"子元素不许把整页撑出
     横向滚动条"。意图是对的，手段是错的，而且把上面第 557 行的 `overflow-x:auto`
     一起废掉了（`overflow` 是简写，会重置 overflow-x）：
       · `clip` 不产生滚动容器，也不能程序化滚动，还不把溢出算进祖先的滚动区
         —— 结果是宽表被**裁掉且拖不动**，右侧那 167px 永远拿不到；
       · 实测 36 个页签里 18 个有宽表，其中 12 个因此把"实发/调整按钮/在编缺编"
         这类关键列整列切掉。
     `overflow-x:auto` 本来就不会让整页变宽（卡片自己就是滚动容器，520px 的表
     放在 353px 的卡片里只会在卡片内滚），所以那句 `clip` 属于自我拆台。
     ★ 别再加回来：要压纵向溢出请针对具体容器（.scroll-y / .roster-wrap /
       .org-canvas / .tl 各自带滚动），不要在 .card 上做全站一刀切。 */
}

/* =========================================================================
   触屏点按区：只在本断点抬到 44×44（上一轮的遗留项）
   -------------------------------------------------------------------------
   44 是手指点得准的下限（iOS HIG 与 Material 是同一个数）。375px 实测，改前：
     · header 的「退出」（button.ghost）        29px 高
     · 各页表单/表格里的 button                25–34px 高，最窄的只有 22.5px 宽
     · 排班看板上的 .chip / 表单 select        31.2 / 30–34px
   这些都在拇指覆盖范围内被反复点，所以统一抬到 44。三条边界写在这里：

   ① 只在 ≤720px 生效 —— 桌面 1280 下**一个像素都不许动**（改后用 36 个页签的
      逐元素 rect 指纹与改前逐页比对过，见提交说明）。
   ② 只抬**控件**（button / .chip / select），**不抬** span.tag：
      全站 .tag 实测 1177 个、高 19.9–21.6px，逐个查过没有一个是可点的
      （都是状态标签，没有 onclick/role="button"），抬成 44 会把卡片化的表格
      撑成一屏三行 —— 那不是可用性，是另一种不可用。
   ③ 不用 !important：.navbtn / .seg / button.ghost 各自的 padding 仍然生效，
      只是最终高度不低于 44，别处的排版规则照旧能覆盖它。 */
@media (max-width:720px){
  button, .chip, select { min-height: 44px; }
  button { min-width: 44px; }
}
</style>
</head>
<body>
<header>
  <h1>AI-HR</h1>

<main>

<script>
// 演示帐套（香香鱼米）的集团账号。**每个账号带自己的口令** —— 这一点很重要：
// 原来这张表只有 id 和名字，口令统一取 DEMO_PWD，而新帐套里 1 号（系统管理员）
// 的口令是 admin1234 → 页面自动 login(1) 必然失败，于是"打开就是一片空白"。
// 空白页比报错更难查：它看起来像"系统没起来"，其实是"登录失败但没人说"。
const USERS = [
  { id: 1, name: '系统管理员', pwd: 'admin1234', hint: '建帐/权限/诊断；不是业务角色' },
  { id: 2, name: '帐套管理员', pwd: 'demo1234', hint: '看得到全部 67 个组织节点（演示默认）' },
  { id: 3, name: '总经理', pwd: 'demo1234', hint: '只读：什么都能看，什么都改不了' },
  { id: 4, name: '集团人事', pwd: 'demo1234', hint: '组织/花名册/合同；工资条只看自己' },
  { id: 5, name: '薪酬专员', pwd: 'demo1234', hint: '算薪/工资条全量；有查阅留痕' },

// ---------------------------------------------------------------------------
// 导航：两级
// ---------------------------------------------------------------------------
// 平铺 28 个页签时，"制度"和"算薪"看起来一样重要 —— 而它们一个一年看两次、
// 一个每月必用。分组是信息层级，不是装饰：先回答"这件事属于哪一块"，
// 再回答"具体是哪个页面"。所以一级只放 11 个，其余全部收进下拉。
//
// ★ 一级的顺序是业务顺序，不是字母序：我的 → 系统管理（把帐开起来、人加进来）
//   → 人事组织 → 考勤排班 → 假期 → 薪酬 → 招聘 → 绩效 → 培训 → 看板 → AI。
//   真实上手路径就是这一条：先建帐，再加人，然后才是打卡算钱。
const GROUPS = [
  { key: 'mine',    name: '我的',     items: ['home', 'approval', 'roles'] },
  { key: 'sys',     name: '系统管理', items: ['ledger', 'employees', 'policy', 'exceptions', 'health'] },
  { key: 'hr',      name: '人事组织', items: ['org', 'headcount', 'contract', 'exit', 'severance'] },
  { key: 'att',     name: '考勤排班', items: ['punch', 'roster', 'attendance', 'att', 'close', 'attx'] },
  { key: 'leaveg',  name: '假期',     items: ['leave', 'leavereq', 'cashout'] },
  { key: 'pay',     name: '薪酬',     items: ['payroll', 'payslip', 'declare', 'siledger', 'adjust', 'salaryitem', 'paypolicy', 'settlement'] },
  { key: 'recruit', name: '招聘',     items: ['recruit'] },
  { key: 'perf',    name: '绩效',     items: ['perf'] },
  { key: 'learn',   name: '培训学习', items: ['training'] },
  { key: 'board',   name: '看板',     items: ['dashboard', 'report'] },
  { key: 'ai',      name: 'AI 智能',  items: ['mcp'] },
];

// 二级页面的名字与一句说明。下拉里只有名字会显得空 ——
// 而"这个页面到底是干什么的"恰恰是菜单最该回答的问题。
const TABS = [
  { key: 'home',       name: '工作台',   desc: '今天要处理的、待办一眼看完' },
  { key: 'approval',   name: '待办审批', desc: '考勤月报、请假与调整单' },
  { key: 'roles',      name: '我的权限', desc: '我能看什么、能改什么' },

  { key: 'ledger',     name: '建帐',     desc: '开帐套、导期初、加人员' },
  { key: 'employees',  name: '员工档案', desc: '花名册、入职与工号' },
  { key: 'contract',   name: '人事合同', desc: '关键项填报、试用期校验、生成标准格式' },
  { key: 'policy',     name: '制度',     desc: '制度项的生效日与覆盖层级' },
  { key: 'exceptions', name: '例外',     desc: '到期未关闭的例外与责任人' },
  { key: 'health',     name: '自检',     desc: '判据覆盖率与失败项' },

  { key: 'org',        name: '组织架构', desc: '部门、岗位、汇报关系' },
  { key: 'headcount',  name: '编制',     desc: '部门编制与实际在岗' },
  { key: 'exit',       name: '离职交接', desc: '离职单、交接清单、离职证明与竞业' },
  { key: 'severance',  name: '离职结算', desc: '补偿金、代通知金、年假折现' },

  { key: 'punch',      name: '打卡',     desc: '排班对照、异常与补卡' },
  { key: 'roster',     name: '排班',     desc: '班次、排班表、跨店支援' },
  { key: 'attendance', name: '考勤人日', desc: '逐日工时与加班拆分' },
  { key: 'att',        name: '考勤报表', desc: '日报汇总成月报，可调可审' },
  { key: 'close',      name: '考勤封账', desc: '封账之后数据才可算薪' },
  { key: 'attx',       name: '考勤异常', desc: '漏卡/迟到/无排班打卡、补卡单、疑似代打卡' },

  { key: 'leave',      name: '假期额度', desc: '谁还有多少假，按假种看' },
  { key: 'leavereq',   name: '请假单',   desc: '待审、已批、驳回与起止日' },
  { key: 'cashout',    name: '年假与折现', desc: '额度、结转、300% 折现' },

  { key: 'payroll',    name: '算薪',     desc: '发起、重算、预演影响面' },
  { key: 'payslip',    name: '工资条',   desc: '明细、与上期环比' },
  { key: 'declare',    name: '申报表',   desc: '个税扣缴与社保费的月度申报' },
  { key: 'siledger',   name: '社保台账', desc: '参保段、基数调整留痕、与工资条对账' },
  { key: 'adjust',     name: '工资调整', desc: '调薪单、按月版本' },
  { key: 'salaryitem', name: '工资项',   desc: '自建项与公式' },
  { key: 'paypolicy',  name: '薪酬政策', desc: '社保、个税、节假日、工时' },
  { key: 'settlement', name: '外包结算', desc: '外包人天与结算单' },

  { key: 'recruit',    name: '招聘',     desc: '需求、候选人、录用' },
  { key: 'perf',       name: '绩效',     desc: '周期、目标、评分与分发' },
  { key: 'training',   name: '培训学习', desc: '课程、学时、结业（规划中）' },

  { key: 'dashboard',  name: '数据看板', desc: '人效、成本、出勤趋势' },
  { key: 'report',     name: '报表',     desc: '导出与对账' },

  { key: 'mcp',        name: '开放层',   desc: '给 AI 用的工具与接口' },
];

// 页签放在 hash 里：这样"这一屏"可以被链接、被截图、被贴进文档。
// 纯内部状态的话，每一份截图都要先描述"点第三个页签"。
// ★ 只取第一段：`#punch/2026-11-13` 是"打卡页 + 指定日期"，
//   而路由只认页签名。整串拿去做匹配会落到默认页（看起来像"点不动"）。
const hashTab = () => (location.hash || '').replace('#', '').split('/')[0];
// 第二段是"页内视图"（#org/graph 网状、#punch/2026-11-13 指定日期）
const hashSub = () => (location.hash || '').split('/')[1] || '';
let LEAVE_TYPE = null;   // 假期额度页当前选中的假种（切页面回来不跳回去）
let token = null, uid = 1, ME = null,
    // 业务时区的"今天"（由 /api/me 给）。各页默认日期用它，不用 new Date() ——
    // 浏览器在 UTC 时区时，早上 8 点前 new Date() 会取到"昨天"。
    TODAY = new Date().toISOString().slice(0, 10),
    // 业务时区：由 /api/me 给（库里 app_tz()）。前端**不写死 +08:00** ——
    // 服务器在哪不重要，重要的是按客户所在地算日子。
    TZ = 'Asia/Shanghai',
    // ?demo=1 才显示演示身份切换（截图与培训用），默认是正式态
    DEMO_MODE = new URLSearchParams(location.search).get('demo') === '1',
    tab = TABS.some(t => t.key === hashTab()) ? hashTab() : 'home';

// 当前选中的发薪主体（法人）。★ 原来 4 处写死 entity=1，
//   一个租户有两个法人时，第二个法人根本算不了薪 —— 而页面上没有任何地方能改。
let CUR_ENTITY = 1;
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ============================================================================
// 长列表：前 100 行 + 「显示全部」
// ----------------------------------------------------------------------------
// 为什么需要它：手机端把宽表卡片化之后，一行从 29px 变成 104–157px。
// 实测「工资条」1,122 行 → 页高 127,338px（约 157 屏），「工资调整」374 行 → 62,910px。
// 每一行都读得清了，但"找一个要调薪的人"要滑 157 屏，比宽表更难受。
//
// ★ 为什么不是分页控件：手机上分页按钮点不准，而且这是演示不是生产；
//   为什么不是 max-height + overflow:auto：卡片里套一个竖向滚动框，
//   滑到底会突然开始滚整页，那个"滚错了对象"的体验比页长长更糟。
// ★ 为什么按钮上要写"还有 N 行"：默默只显示 100 行，会让人以为是"就这么多人"
//   —— 被截断必须说出来，这和"0 行不是没有数据"是同一条纪律。
// ★ 展开状态记在这里而不是每次渲染重置：切页签回来还保持展开，符合直觉。
//   重置点是"刷新数据"（reload / 重新取数），不是"重新渲染"。
const ROWS_FIRST = 100;
const SHOW_ALL = Object.create(null);   // { payslip: true, adjust: true, ... }

/** 取这一页实际要渲染的行；展开过就全给。 */
const rowsToShow = (key, rows) =>
  (SHOW_ALL[key] ? rows : rows.slice(0, ROWS_FIRST));

/** 被截断时给一个按钮。没截断就什么都不给（不给"共 3 行"这种废话）。 */
const moreRowsBtn = (key, total, shown) => (total <= shown ? '' :
  `<button class="ghost" data-more="${key}" style="margin-top:8px">
     还有 <b>${total - shown}</b> 行没显示，点这里展开（共 ${total} 行）</button>`);

// ============================================================================
// 实发：多人清单里默认遮住，点一下看
// ----------------------------------------------------------------------------
// 依据是用户原话："所有人自己只能看自己的，除了 hr 专职人员。"
// 所以这一层只管**展示策略**，权限边界不在这里 —— 行闸在服务端
// （非 HR 的 listSlips 只返回自己那一行），前端假定拿到的行都是"允许看的"。
//
// ★ 判据用"这份清单里有别人的行吗"，不用角色码：
//    · 行闸生效后，非 HR 只会拿到自己 1 行 → 不遮（自己的工资遮住像系统坏了）
//    · HR / 老板拿到的是多人清单 → **全部默认遮，连自己那行也遮**（规则一致才解释得清）
//    · 行闸万一没生效，非 HR 拿到 374 行 → 这里仍然会遮，等于多一层兜底
//   用角色码就得维护一张"谁是 HR"的表，而它和 payroll.mjs 的白名单一定会漂。
//
// ★ 用 •••• 不用 ***：等宽数字里 *** 容易和小数点、负号混在一起。
// ★ 不挂 title / aria-label：那等于换个地方把值说出去。
// ★ 值放在 data-net —— 这不是加密，开 devtools 照样看得见。它挡的是
//   "扫一眼 / 截个图 / 顺手复制"这三种真实场景；要真隐蔽得改成点击时单独取数，
//   那是另一个接口，不在这一刀里。
const MASK_NET_TEXT = '••••';

// ── 编制/定编「沿用」标签（181 / 183）─────────────────────────────────────
// ★ 为什么要有它：编制与档口定编现在都"定了就一直用"（本期没定 → 沿用最近一期）。
//   沿用之后，"这月根本没定编"和"定过、数与上期相同"在数字上完全一样。
//   所以后端把 status / carried_from 一起给出来，这里必须显示 —— 不显示就等于
//   把上期预算静默当成本期预算，而那比"显示未定编"更坏（它看起来是对的）。
const carriedTag = (status, from, label) => (status === 'carried' && from)
  ? ` <span class="sub" title="${esc(label)}本期没有单独定，沿用 ${esc(from)} 的数">沿用 ${esc(from)}</span>`
  : '';

// ── 「你只能看本档口的人」（182）────────────────────────────────────────────
// ★ 只在该收窄**已经生效但认不出档口/没填人**时说话：
//   · state='off'   → 没开能力位，看全店，不该打扰；
//   · ok=true       → 正常收窄，页面上的人数就是真实的档口人数；
//   · 其余           → 页面会显示 0 行或少人，而它和"这家店真的没人"长得一样。
//   用就地一行 sub，不用弹窗：这不是错误，弹窗会被当成坏了。
const stationScopeNote = (sc) => {
  if (!sc || sc.state !== 'on' || sc.ok === true) return '';
  const why = String(sc.reason || '');
  const msg = /没填|未填|人数|nnf/i.test(why)
    ? '你只能看本档口的人；本档口今天没填上岗人数，所以这里可能少人。'
    : '认不出你在哪个档口，所以这里只显示 0 行；请店长在档口配置里确认你今天在哪个档口。';
  return `<p class="sub" style="margin:6px 0 0">${esc(msg)}</p>`;
};

/** 这份清单里有没有别人的行。 */
// ★ 千万不能用 `rows.length > 1` 当"在看别人"的代理 —— 实测踩到：
//   部门主管 / 部门员工拿到的是 **3 行**，那是"自己 × 3 个期间"，不是 3 个人。
//   按行数判会把员工自己的工资也遮住，而需求原话是"看自己不需要遮，遮了像系统坏了"。
//   所以这里按 employee_id 逐行比，字面回答"有没有别人的行"。
// ★ ME 还没落地时不知道"我"是谁：退化成"多行就遮"（宁可多遮，也别把别人的钱露出来）。
const netsAreOthers = (rows) => {
  const me = (ME && ME.person_id != null) ? Number(ME.person_id) : null;
  if (me === null) return rows.length > 1;
  return rows.some((x) => Number(x.employee_id) !== me);
};

/** 实发单元格：hide=true 时默认遮住，点一下显示。 */
const netCell = (safeText, hide) => (hide
  ? `<td class="num masked-net" data-label="实发" data-net="${safeText}"
       data-hidden="1">${MASK_NET_TEXT}</td>`
  : `<td class="num" data-label="实发">${safeText}</td>`);

// 一个委托监听解决三个页面：不用在每次渲染后重新绑 handler
// （每个渲染函数都绑一次是这类"展开"按钮最常见漏绑的地方）。
// 同一个监听里也处理"实发"的点击显示 —— 两件事都是"点一下改一个属性"，
// 分包监听只会让"点了没反应"更难查。
document.addEventListener('click', (e) => {
  const more = e.target.closest && e.target.closest('[data-more]');
  if (more) { SHOW_ALL[more.dataset.more] = true; return load(); }
  const net = e.target.closest && e.target.closest('[data-net]');
  if (net) {
    const hidden = net.dataset.hidden !== '0';
    net.textContent = hidden ? net.dataset.net : MASK_NET_TEXT;
    net.dataset.hidden = hidden ? '0' : '1';
    net.classList.toggle('on', hidden);
  }
});

async function call(path, opts = {}) {
  const r = await fetch(path, {
    ...opts,
    headers: { ...(opts.headers||{}), ...(token ? { authorization: `Bearer ${token}`, 'x-aihr-token': token } : {}) },
  });
  let body = null;
  try { body = await r.json(); } catch { body = {}; }
  return { status: r.status, body };
}

// 演示口令：四个身份共用（见 code/db/035_auth.sql 与 server.mjs 的种子）。
// 真实部署第一件事就是把它换掉 —— 页面上写出来，是因为"藏在代码里的默认口令"
// 比"写明白的演示口令"更危险。
const DEMO_PWD = 'demo1234';
// 不同身份的演示口令：user 5 是"临时口令，必须先改"
// ★ 口令按账号取，不再"只有 5 号是特例"。上次那个写法在新帐套上直接失效
//   （1 号口令是 admin1234，被当成 demo1234 去登），而表现是**空白页**。
const PWD_OF = (id) => (USERS.find((u) => u.id === id) || {}).pwd || DEMO_PWD;

// 导出：必须带 token，所以不能用 <a href>，要走 fetch → Blob → 临时链
async function downloadCsv(path, filename) {
  const r = await fetch(path, { headers: token ? { authorization: `Bearer ${token}`, 'x-aihr-token': token } : {} });
  if (!r.ok) {
    let body = {}; try { body = await r.json(); } catch {}
    toast('bad', `<b>${esc(body.error || r.status)}</b>`);
    return;
  }
  const url = URL.createObjectURL(await r.blob());
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('ok', '已导出（掩码与页面一致）');
}

// 打开服务端渲染的打印页（合同、工资单）：fetch 带鉴权 → blob → 新窗口。
// ★ 不走"URL 里带 token"的裸链接：token 会进浏览器历史、进代理日志、
//   进别人转发的那条消息里。合同与工资单都是给人签字盖章的凭证，
//   拿到一个链接就能打开，这件事不能接受。
async function openPrint(path) {
  const r = await fetch(path, { headers: token ? { authorization: `Bearer ${token}`, 'x-aihr-token': token } : {} });
  if (!r.ok) {
    let b = {}; try { b = await r.json(); } catch {}
    toast('bad', `<b>${esc(b.error || r.status)}</b>${b.message ? `<br>${esc(b.message)}` : ''}`);
    return;
  }
  const url = URL.createObjectURL(await r.blob());
  const w = window.open(url, '_blank');
  if (!w) toast('bad', '浏览器拦了新窗口，允许后重试');
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

// ★ 登录失败时**必须画出东西**。原来失败只弹一个 6 秒的 toast，然后 #view 是空的 ——
//   截图看上去就是"系统挂了/一片空白"，而真实原因是"这个账号登不上"。
//   摆一排可点的账号比任何错误码都管用：现场三秒能换一个进去。
function renderLoginFallback(reason) {
  const el = document.querySelector('#view');
  if (!el) return;
  el.innerHTML = `
    <div class="card">
      <h2>登录没成功，换一个账号试试</h2>
      <p class="note" style="color:var(--bad)">${esc(reason || '账号或口令不正确')}</p>
      <div class="form" style="flex-wrap:wrap; gap:8px">
        ${USERS.map((u) => `<button class="ghost" data-login="${u.id}"
            title="${esc(u.hint)}">${esc(u.name)}（${esc(u.hint)}）</button>`).join('')}
      </div>
      <p class="sub">也可以直接带参进：<code>/?u=2&amp;pwd=demo1234</code>
        （<code>u</code> 是账号 id）。若提示 429，是同一来源失败太多次被限流，
        **别再刷新**（刷新会再试一次、把锁定时间往后推），等 15 分钟或换一个账号。</p>
    </div>`;
  el.querySelectorAll('button[data-login]').forEach((b) => {
    b.onclick = () => login(Number(b.dataset.login));
  });
}

async function login(id, pwd = null) {
  uid = id;
  // ★ 第二个参数是给"不是演示那 5 个身份"的账号用的（真实帐套里 30 多个人）。
  //   不传就仍按演示口令表走 —— 既有行为不变。
  const r = await call(`/login?user=${id}&pwd=${encodeURIComponent(pwd || PWD_OF(id))}`, { method: 'POST' });
  // ★ 429 必须单独说人话，不能和"口令错"长一样（实测踩到：同一来源失败 30 次锁 15 分钟，
  //   而页面每次加载都会自动 login(1) —— 于是"越刷新越登不上"，现场只看得到 429）。
  //   ★ 这里**不做自动重试**：重试只会把锁定窗口往后推，这是实测出来的，不是推理。
  if (r.status === 429) {
    const st = r.body && r.body.state === 'locked' ? '锁定' : '受限';
    toast('bad', `<b>登录被${st}（429）</b><br>`
      + '同一来源连续失败 30 次会锁定约 15 分钟。<br>'
      + '别反复刷新（每次刷新都会再试一次、把锁续上）；'
      + '可以等一会儿，或换账号进：<code>?u=2&amp;pwd=demo1234</code>');
    renderLoginFallback(`登录被${st}（429）：同一来源连续失败 30 次会锁定约 15 分钟。`
      + '别反复刷新 —— 刷新会再试一次、把锁续上。');
    return;
  }
  if (r.status !== 200) {
    const msg = `${r.body.error || r.status}${r.body.message ? '：' + r.body.message : ''}`;
    toast('bad', `<b>${esc(r.body.error || r.status)}</b>`
      + (r.body.message ? `<br>${esc(r.body.message)}` : ''));
    // ★ 空白页是最糟的失败形态：看起来像服务没起来。一定要画点东西出来。
    renderLoginFallback(msg);
    return;
  }
  token = r.body.token;
  // ★ 登录后立刻拉"我是谁"：右上角要显示姓名与岗位，不是 user id。
  //   失败不阻断（退回 id 显示），但正常路径一定拿得到。
  try {
    const me = await call('/api/me');
    if (me.status === 200) {
      ME = me.body;
      if (ME.today) TODAY = ME.today;
      if (ME.tz) TZ = ME.tz;
    }
  } catch { /* 保持未登录态 */ }
  render();
  load();
}

// 写操作的统一出口：成功刷新，失败**把业务码原样显示**。
// 只显示"失败"的界面会让人去猜——而这里每个拒绝都有一条能查的名字
// （E_OUT_OF_SCOPE / E_HC_OVER_ALLOCATED / E_RQ_NOT_LEAF …）。
function toast(kind, html) {
  const d = document.createElement('div');
  d.className = 'toast ' + kind;
  d.innerHTML = html;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), kind === 'ok' ? 2600 : 6000);
}

async function post(path, okText, btn) {
  const r = await call(path, { method: 'POST' });
  if (r.status === 200) {
    toast('ok', esc(okText || '已提交'));
    await load();          // 成功 → 重新渲染（按钮随之重建），所以不必再启用
  } else {
    toast('bad', `<b>${esc(r.body.error || r.status)}</b>`
      + (r.body.message ? `<br>${esc(r.body.message)}` : ''));
    if (btn) btn.disabled = false;   // 失败 → 页面没重渲染，必须手动放回
  }
  return r;
}

// 带 JSON body 的写操作（考核项数组、逐项实际值）。
// 不复用 post()：post 只发空 body，而这个要带结构；两者混用迟早有人把 body 当路径传。
async function postJson(path, body) {
  return call(path, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify(body ?? {}),
  });
}

// ★ 正式态：右上角只显示"我是谁、什么岗位"和一个退出。

        title="${esc(u.hint)}">${esc(u.name)}</button>`).join('') : ''}

// 当前页属于哪个一级分组。找不到就落到第一组 —— 新加的页签忘了登记也不会白屏。
const groupOf = (k) => GROUPS.find(g => g.items.includes(k)) || GROUPS[0];

function closeNav() {
  document.querySelectorAll('#tabs .navgroup.open').forEach(el => {
    el.classList.remove('open');
    const b = el.querySelector('.navbtn');
    if (b) b.setAttribute('aria-expanded', 'false');
  });
  const layer = $('#droplayer');
  if (layer) { layer.classList.remove('on'); layer.innerHTML = ''; }
}

function goTab(k) {
  tab = k;
  // ★ 用 pushState 而不是 replaceState：换成 push 之后**浏览器后退/前进才真的按页签走**。
  //   原来用 replace 是为了"不刷历史"，代价是后退直接离开应用 —— 而人在一个
  //   多页签的后台里按后退，期待的是"回到上一屏"，不是"退出系统"。
  //   （演示时被人按一次后退就回到空白页，比"历史记录长一点"糟得多。）
  history.pushState(null, '', '#' + k);
  closeNav();
  render(); load();
}

// ★ 监听 hashchange：否则**浏览器后退/前进和在地址栏改 #xxx 都不生效**。
//   goTab 用的是 replaceState（不产生历史记录、也不触发 hashchange），
//   所以在没有这个监听之前，页面只有"点菜单"能换页 —— 后退键回到上一屏
//   会什么都不动，而 URL 已经变了，看起来像"页面卡住"。
//   ★ 这里不再 replaceState：hashchange 本身就意味着地址已经对了。
window.addEventListener('hashchange', () => {
  const k = hashTab();
  if (!TABS.some((t) => t.key === k)) return;   // 不认识的页签：不动
  if (k === tab) return;                        // 同一个页签：不重画（会打断输入）
  tab = k;
  closeNav();
  render(); load();
});

function renderTabs() {
  const cur = groupOf(tab);

  // ★ 新加页签忘了登记分组时，它不会出现在任何菜单里 —— 页还在，但点不到。
  //   这种情况必须当场说出来，否则表现为"这个功能没了"而没人知道为什么。
  const orphan = TABS.filter(t => !GROUPS.some(g => g.items.includes(t.key)));

  $('#navrow').innerHTML = GROUPS.map(grp => {
    const items = grp.items.map(k => TABS.find(t => t.key === k)).filter(Boolean);
    if (!items.length) return '';
    // 只有一个页面的分组（招聘/绩效/培训/AI/假期）：点击直达，
    // 不弹一个只有一行的菜单 —— 那种菜单点开比直接跳过去更慢。
    const single = items.length === 1;
    const on = grp.key === cur.key;
    return `<div class="navgroup${on ? ' on' : ''}" data-g="${grp.key}" data-n="${items.length}">
      <button class="navbtn${on ? ' on' : ''}" aria-haspopup="${single ? 'false' : 'true'}"
        aria-expanded="false">${esc(grp.name)}${single ? '' : '<i class="caret"></i>'}</button>
    </div>`;
  }).join('') + (orphan.length
    ? `<span class="nav-orphan">未归类的页签：${orphan.map(t => esc(t.key)).join('、')}</span>`
    : '');

  $('#navrow').querySelectorAll('.navgroup').forEach(el => {
    const grp = GROUPS.find(x => x.key === el.dataset.g);
    const btn = el.querySelector('.navbtn');
    if (!btn) return;
    btn.onclick = (e) => {
      e.stopPropagation();
      if (grp.items.length === 1) return goTab(grp.items[0]);
      const wasOpen = el.classList.contains('open');
      closeNav();
      if (wasOpen) return;
      el.classList.add('open');
      btn.setAttribute('aria-expanded', 'true');
      openPanel(grp, btn);
    };
  });

  // 导航重建后 scrollWidth 变了，遮罩要重算；rAF 一次是为了字体加载完成后
  // 宽度还可能再变（字宽不同 → 露出半截的位置不同）。
  syncNavFade();
  requestAnimationFrame(syncNavFade);
}

// 下拉面板渲染到 #droplayer（.tabs 的直接子元素），**不是**按钮的子元素。
// 原因见样式那段：放进横滑容器里会被裁掉。这里是"按按钮实际位置对齐"。
function openPanel(grp, btn) {
  const layer = $('#droplayer');
  if (!layer) return;
  const items = grp.items.map(k => TABS.find(t => t.key === k)).filter(Boolean);
  layer.innerHTML = `<div class="dropdown" role="menu">
    ${items.map(t => `<button data-tab="${esc(t.key)}" role="menuitem"
        class="${t.key === tab ? 'on' : ''}">
      <b>${esc(t.name)}</b><span>${esc(t.desc || '')}</span></button>`).join('')}
  </div>`;

  // 手机：面板铺满宽度（竖排菜单横滑找位置没意义）；桌面：贴着按钮左沿。
  const wide = window.innerWidth <= 720;
  layer.classList.toggle('wide', wide);
  const tabsBox = $('#tabs').getBoundingClientRect();
  if (!wide) {
    const x = Math.max(0, btn.getBoundingClientRect().left - tabsBox.left - 12);
    layer.style.setProperty('--dl', x + 'px');
  }
  layer.classList.add('on');

  layer.querySelectorAll('button[data-tab]').forEach(b => {
    b.onclick = (e) => { e.stopPropagation(); goTab(b.dataset.tab); };
  });
}

// 点空白处或按 Esc 收起下拉。★ 只注册一次：renderTabs 会被反复调用，
// 在里面注册会累积成 N 个监听器（点一下跑 N 次，表现为"偶尔要点两次"）。
document.addEventListener('click', (e) => {
  if (!e.target.closest('#tabs')) closeNav();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeNav();
});
window.addEventListener('resize', closeNav);

// ★ 吸顶错位：header 是 sticky top:0，.tabs 是 sticky top:51px。
//   51px 只在桌面对（header 恰好 51px）；窄屏 header 会换行成 87px，
//   于是 header 把导航条盖掉 36px（实测 header 0–87 / tabs 51–89，露头 2px）。
//   这里把 header 的**实测高度**写进 --hdr-h，CSS 那边 top:var(--hdr-h,51px)。
//   为什么不用常量 / 不用 window.innerWidth 分支：header 高度是内容决定的
//   （身份名长短、系统字号、字体加载完成、横竖屏都会变），只能实测。
//   ResizeObserver 顺带覆盖"切身份后姓名换行"这类不触发 resize 的变化。
function syncStickyTop() {
  const h = document.querySelector('header');
  if (!h) return;
  document.documentElement.style.setProperty(
    '--hdr-h', Math.round(h.getBoundingClientRect().height) + 'px');
}
syncStickyTop();
if (window.ResizeObserver) new ResizeObserver(syncStickyTop).observe(document.querySelector('header'));
window.addEventListener('resize', syncStickyTop);
window.addEventListener('orientationchange', syncStickyTop);

// ★ 一级导航横滑提示（样式见 .navfade）：只回答"右边还有没有"。
//   判据用 scrollWidth - clientWidth - scrollLeft > 4：
//   留 4px 余量是因为 375px 下 overflow 会因亚像素取整差 0–1px，
//   差 1px 就亮遮罩等于"滑到头了还挂着箭头"，那比没有提示更误导。
function syncNavFade() {
  const row = $('#navrow'), fade = $('#navfade');
  if (!row || !fade) return;
  const more = row.scrollWidth - row.clientWidth - row.scrollLeft > 4;
  fade.classList.toggle('on', more);
}
// 监听挂在 .navrow 容器上（renderTabs 只换它的 children，容器本身不重建），
// 所以不必每次渲染都重复注册 —— 重复注册会变成 N 个监听器，滑一下算 N 次。
$('#navrow').addEventListener('scroll', syncNavFade, { passive: true });
window.addEventListener('resize', syncNavFade);
window.addEventListener('orientationchange', syncNavFade);
syncNavFade();

function render() { renderWho(); renderTabs(); }

// ============================================================================
// 建帐：开帐套 → 加门店 → 加账号（三步，按真实顺序）

// 这是"新客户签约后第一件事"。没有这一屏，"开一个客户"就只能对着 SQL 抄种子，

// 三步都只写**结构性数据**（帐套/组织/账号），不灌业务数据 —— 考勤与工资靠运营产生。
async function viewLedger() {
  const r = await call('/api/ledger');
