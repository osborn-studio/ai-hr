// 两种朝向只是"主轴/次轴"互换：竖排每层往下、兄弟往右；横排每层往右、兄弟往下。
// 卡片尺寸也不同 —— 竖排同级可能十几个，用窄卡才能少滚一点。
const ORG_ORI = {
  v: { NW: 164, NH: 66, GX: 14, GY: 54, nameLen: 9, fs: 12.5 },
  h: { NW: 216, NH: 76, GX: 66, GY: 14, nameLen: 13, fs: 13.5 },
};

/** 横向/纵向分层布局：主轴由层级推进，次轴由叶子顺序推进，父节点居中于子节点群 */
function orgTreeLayout(rows, collapsed, ori) {
  const G = ORG_ORI[ori] || ORG_ORI.v;
  const { NW, NH, GX, GY } = G;
  const PAD = 26;
  const depthStep = ori === 'h' ? NW + GX : NH + GY;
  const sibStep = ori === 'h' ? NH + GY : NW + GX;

  const kids = new Map();
  for (const r of rows) {
    const k = r.parent_id === null ? '@root' : String(r.parent_id);
    if (!kids.has(k)) kids.set(k, []);
    kids.get(k).push(r);
  }
  const roots = kids.get('@root') || [];
  const nodes = [];
  let cursor = 0;

  const walk = (n, depth) => {
    const cs = kids.get(String(n.id)) || [];
    const shut = collapsed.has(String(n.id));
    const vis = shut ? [] : cs;
    let s;
    if (!vis.length) { s = cursor; cursor += sibStep; }
    else {
      const ss = vis.map(c => walk(c, depth + 1));
      s = (ss[0] + ss[ss.length - 1]) / 2;
    }
    nodes.push({
      ...n, depth,
      x: (ori === 'h' ? PAD + depth * depthStep : PAD + s),
      y: (ori === 'h' ? PAD + s : PAD + depth * depthStep),
      kidCount: cs.length, shut,
    });
    return s;
  };
  roots.forEach((rt, i) => { if (i) cursor += sibStep * 0.5; walk(rt, 0); });

  const byId = new Map(nodes.map(n => [String(n.id), n]));
  const links = [];
  for (const n of nodes) {
    for (const c of (kids.get(String(n.id)) || [])) {
      const cp = byId.get(String(c.id));
      if (cp) links.push([n, cp]);
    }
  }
  const maxX = nodes.reduce((a, n) => Math.max(a, n.x + NW), NW);
  const maxY = nodes.reduce((a, n) => Math.max(a, n.y + NH), NH);
  return { nodes, links, W: maxX + PAD, H: maxY + PAD, NW, NH, ori };
}

/** 正交折线：先沿主轴出、在层间空白处转弯、再进子节点。斜线会把"布局"读成"关系" */
function orgLinkPath(a, b, L, r = 9) {
  const { NW, NH, ori } = L;
  // 节点可以比 L.NW 宽（手机两层版式里集团卡片要更宽才放得下"香香鱼米餐饮集团"），
  // 出口按**自己的**宽度算，否则连线会从卡片中间穿过去。
  const aw = a.w || NW;
  if (ori === 'h') {
    const x1 = a.x + aw, y1 = a.y + NH / 2, x2 = b.x, y2 = b.y + NH / 2;
    if (Math.abs(y2 - y1) < 0.5) return `M${x1},${y1} H${x2}`;
    const mx = x1 + Math.max(22, (x2 - x1) / 2);
    const s = Math.sign(y2 - y1);
    const rr = Math.min(r, Math.abs(y2 - y1) / 2, (mx - x1) / 2, (x2 - mx) / 2);
    return `M${x1},${y1} H${mx - rr} Q${mx},${y1} ${mx},${y1 + s * rr}`
      + ` V${y2 - s * rr} Q${mx},${y2} ${mx + rr},${y2} H${x2}`;
  }
  const x1 = a.x + aw / 2, y1 = a.y + NH, x2 = b.x + (b.w || NW) / 2, y2 = b.y;
  if (Math.abs(x2 - x1) < 0.5) return `M${x1},${y1} V${y2}`;
  const my = y1 + Math.max(18, (y2 - y1) / 2);
  const s = Math.sign(x2 - x1);
  const rr = Math.min(r, Math.abs(x2 - x1) / 2, (my - y1) / 2, (y2 - my) / 2);
  return `M${x1},${y1} V${my - rr} Q${x1},${my} ${x1 + s * rr},${my}`
    + ` H${x2 - s * rr} Q${x2},${my} ${x2},${my + rr} V${y2}`;
}

function orgTreeSvg(L) {
  const { NW, NH, ori } = L;
  const G = ORG_ORI[ori] || ORG_ORI.v;

  const links = L.links.map(([a, b]) => `<path class="link" data-a="${a.id}" data-b="${b.id}"
      d="${orgLinkPath(a, b, L)}" fill="none" stroke="#c9d8f5" stroke-width="1.7" stroke-linecap="round"/>`
  ).join('');

  const nodes = L.nodes.map(n => {
    const c = orgColor(n.kind);
    const gap = n.quota === null ? null : (n.quota - (n.headcount || 0));
    const gTxt = gap === null ? '未定编' : gap > 0 ? `缺 ${gap}` : gap < 0 ? `超 ${-gap}` : '满编';
    const gCol = gap === null ? '#94a3b8' : gap > 0 ? '#b45309' : gap < 0 ? '#dc2626' : '#0f9d6b';
    // 172：门店节点第三行改成「缺 X · 档口 N」。
    // ★ 门店是叶子，它的"含下级"就等于"在编"（第二行已有），所以这一行
    //   让给档口 —— 不是删掉信息，是把重复的那条换成缺的那条。
    //   区域/集团没有档口，仍然显示含下级。
    const line3 = n.stations > 0
      ? `${gap === null ? '未定编' : gap > 0 ? `缺 ${gap}` : gap < 0 ? `超 ${-gap}` : '满编'}`
        + ` · <tspan fill="#0f172a" font-weight="600">档口 ${n.stations}</tspan>`
        + (n.station_gap > 0 ? ` · <tspan fill="#b45309" font-weight="600">岗缺 ${n.station_gap}</tspan>` : '')
      : `含下级 ${n.subtree ?? 0} · <tspan fill="${gCol}" font-weight="600">${gTxt}</tspan>`;
    const y1 = ori === 'h' ? 28 : 26;
    const y2 = ori === 'h' ? 48 : 45;
    const y3 = ori === 'h' ? 66 : 59;
    // 卡片宽度可以逐节点覆盖（n.w）：手机两层版式里集团卡片要 164 才放得下
    // 「香香鱼米餐饮集团」8 个字，下面的区域卡片 136 两列才排得进 375px。
    // 不设 n.w 时一律用 L.NW —— 桌面走的还是这条路径，输出与改前一致。
    const nw = n.w || NW;
    const nameLen = n.w ? Math.max(G.nameLen, 8) : G.nameLen;
    // 竖排左侧竖条会挤掉名称宽度，改顶部横条
    const strip = ori === 'h'
      ? `<rect x="0" y="11" width="4" height="${NH - 22}" rx="2" fill="${c}"/>`
      : `<rect x="11" y="0" width="${nw - 22}" height="3.5" rx="2" fill="${c}"/>`;
    const foldX = ori === 'h' ? nw - 32 : nw - 30;
    const foldY = ori === 'h' ? NH / 2 - 10 : 5;
    return `<g class="onode" data-org="${n.id}" data-name="${esc(n.name)}"
        transform="translate(${n.x},${n.y})">
      <rect class="nbox" x="0" y="0" width="${nw}" height="${NH}" rx="13"
        fill="#fff" stroke="#dbe6ff" stroke-width="1.2" filter="url(#orgShadow)"/>
      ${strip}
      <text x="15" y="${y1}" font-size="${G.fs}" font-weight="600" fill="#0f172a">${
        esc(orgShort(n.name, nameLen))}</text>
      <text x="15" y="${y2}" font-size="10.8" fill="#64748b">编制 ${n.quota ?? '—'} · ${
        n.kidCount ? '直属' : '在编'} ${n.headcount ?? 0}</text>
      <text x="15" y="${y3}" font-size="10.8" fill="#64748b">${line3}</text>
      ${n.kidCount ? `<g class="fold" data-fold="${n.id}" transform="translate(${foldX},${foldY})">
        <rect width="26" height="20" rx="10" fill="#fff" stroke="#c7d7ff"/>
        <text x="13" y="14" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1d4ed8">${
          n.shut ? '+' + n.kidCount : '−'}</text>
      </g>` : ''}
    </g>`;
  }).join('');

  return `<svg viewBox="0 0 ${L.W} ${L.H}" width="${L.W}" height="${L.H}"
    data-w="${L.W}" data-h="${L.H}" xmlns="http://www.w3.org/2000/svg" style="font-family:inherit">
    <defs>
      <filter id="orgShadow" x="-20%" y="-25%" width="140%" height="170%">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1d4ed8" flood-opacity="0.10"/>
      </filter>
    </defs>
    ${links}${nodes}
  </svg>`;
}

// ★ 手机默认只画两层（集团 + 区域），门店（第三层）收起来。
//   为什么必须这么做：60 家门店在竖排布局里一字排开，画布实测 10718px 宽；
//   自动居中只把视口摆在**集团节点**上，于是在手机上"组织架构"这一页
//   首屏只有一个节点可读，要找一家店得往右拖十几屏 —— 而它本该是"一眼看清结构"的图。
//   ≤720px 首次进入把 6 个区域折起来（节点 67 → 7），要门店时点「显示门店（60）」。
//   桌面不动：1280px 下 67 个节点本来就排得开，多一次点击只是负担。
const isPhone = () => window.innerWidth <= 720;

function orgTwoLayerDefault() {
  // 幂等：往 Set 里重复 add 没有副作用，所以每次进这一页都能重新落回"两层"，
  // 而页内点「+」展开某个区域不会被下一次重画折回去（重画不经过这里）。
  if (!isPhone() || ORGST.showStores) return;
  for (const r of ORGST.rows) if (r.depth === 1) ORGST.collapsed.add(String(r.id));
}

/** 展开/收起第三层（门店）。收起 = 把区域全部折回去，与首次进入同一套节点集合。 */
function setStoresShown(on) {
  ORGST.showStores = on;
  for (const r of ORGST.rows) {
    if (r.depth !== 1) continue;
    if (on) ORGST.collapsed.delete(String(r.id));
    else ORGST.collapsed.add(String(r.id));
  }
  // 展开后画布从 334px 变回 10718px，沿用进入页面时那套"把视口摆在集团上"的逻辑
  if (on) ORGST.centered = false;
  paintOrgTree();
}

// ★ 手机只画两层时再单独排一次版：集团在上，区域排成两列。
//   为什么"折起来"还不够：6 个区域仍是一字排开，画布 992px 宽，
//   在 375px 的屏幕上首屏只看得到 3 个城市 —— 那只是把滚动距离从十几屏减到两屏，
//   并没有做到"一眼看清结构"。两列排下来画布实测 334×406，7 个节点全在首屏内。
//   只在"纯两层 + 竖排"时生效：一旦展开门店（67 个节点）就回到原来的单行走廊，
//   桌面端完全不走这里（isPhone() 为假直接返回，L 原样返回）。
function orgWrapTwoLayer(L) {
  if (!isPhone() || ORGST.showStores || L.ori !== 'v') return;
  const kids = L.nodes.filter(n => n.depth === 1);
  if (kids.length < 3 || L.nodes.length !== kids.length + 1) return;   // 只处理"纯两层"
  const root = L.nodes.find(n => n.depth === 0);
  if (!root) return;
  const NW = 136, NH = 66, GX = 10, GY = 24, PAD = 26, ROOTW = 164;
  const cols = kids.length > 4 ? 2 : kids.length;
  const rows = Math.ceil(kids.length / cols);
  const totalW = cols * (NW + GX) - GX;
  const top = PAD + NH + 42;          // 42 是留给"集团 → 区域"那一段折线的高度
  L.NW = NW;                          // orgTreeSvg 用 L.NW/L.NH 画卡片，改这里就够了
  kids.forEach((n, i) => {
    n.x = PAD + (i % cols) * (NW + GX);
    n.y = top + Math.floor(i / cols) * (NH + GY);
  });
  root.w = ROOTW;                     // 集团卡片单独放宽，否则名字被折叠按钮压住
  root.x = PAD + (totalW - ROOTW) / 2;
  root.y = PAD;
  L.W = Math.max(totalW, ROOTW) + PAD * 2;
  L.H = top + rows * (NH + GY) - GY + PAD;
}

function paintOrgTree() {
  const box = $('#orgCanvas');
  if (!box) return;
  const L = orgTreeLayout(ORGST.rows, ORGST.collapsed, ORGST.ori);
  orgWrapTwoLayer(L);      // 手机"纯两层"时改成两列排布（见函数上方说明）
  box.innerHTML = orgTreeSvg(L);
  applyZoom();

  // 开关文案跟着状态走：不写死"显示门店"，否则展开后按钮还是这四个字，
  // 用户会以为点了没生效，再点一次又收回去。
  const sb = $('#orgStoresBtn');
  if (sb) {
    const n = ORGST.rows.filter(r => r.depth === 2).length;
    sb.textContent = ORGST.showStores ? `只看两层（收 ${n} 家店）` : `显示门店（${n}）`;
  }

  // 首次绘制要把"我在这棵树的哪"摆正：
  //   竖排根在顶部 → 滚到最上，横向居中根；
  //   横排根在最左 → 垂直居中根（否则 16 个同级部门时先看到最上面那个）。
  if (!ORGST.centered) {
    ORGST.centered = true;
    // ★ 竖排**不**自动缩到"全塞进来"：16 个同级部门一缩就是 45%，字全糊了，
    //   等于用"看得全"换掉了"看得清"。保持 1:1、横向滚动，要全貌点「适应」。
    const root = L.nodes.find(n => n.parent_id === null);
    if (root) {
      if (ORGST.ori === 'v') box.scrollLeft = Math.max(0, (root.x + L.NW / 2) * ORGST.scale - box.clientWidth / 2);
      else box.scrollTop = Math.max(0, (root.y + L.NH / 2) * ORGST.scale - box.clientHeight / 2);
    }
  }

  box.querySelectorAll('.onode').forEach(g => {
    g.onclick = (e) => {
      if (e.target.closest('[data-fold]')) return;
      box.querySelectorAll('.onode.sel').forEach(x => x.classList.remove('sel'));
      g.classList.add('sel');
      highlightPath(g.dataset.org);
      showOrgPanel(g.dataset.org);
    };
  });
  box.querySelectorAll('[data-fold]').forEach(f => {
    f.onclick = (e) => {
      e.stopPropagation();
      const id = String(f.dataset.fold);
      if (ORGST.collapsed.has(id)) ORGST.collapsed.delete(id);
      else ORGST.collapsed.add(id);
      paintOrgTree();
    };
  });
  bindPan(box);
}

/** 点亮"我 + 我的上级链 + 我的直接下级"，其余淡出 —— 深树里找一条路径 */
function highlightPath(orgId) {
  const box = $('#orgCanvas');
  if (!box) return;
  const byId = new Map(ORGST.rows.map(r => [String(r.id), r]));
  const kin = new Set([String(orgId)]);
  let cur = byId.get(String(orgId));
  let guard = 0;
  while (cur && cur.parent_id !== null && guard++ < 40) {
    kin.add(String(cur.parent_id));
    cur = byId.get(String(cur.parent_id));
  }
  for (const r of ORGST.rows) if (String(r.parent_id) === String(orgId)) kin.add(String(r.id));

  box.querySelectorAll('.onode').forEach(g => {
    const id = String(g.dataset.org);
    g.classList.toggle('kin', kin.has(id) && id !== String(orgId));
    g.classList.toggle('dim', !kin.has(id));
  });
  box.querySelectorAll('.link').forEach(p => {
    const on = kin.has(String(p.dataset.a)) && kin.has(String(p.dataset.b));
    p.classList.toggle('kin', on);
    p.classList.toggle('dim', !on);
  });
}

function orgPosNetCard(ps, rows) {
  const fake = [];
  const rootName = rows.find(r => r.parent_id === null)?.name || '岗位网络';
  fake.push({ id: 'R', parent_id: null, name: rootName, kind: 'group', headcount: 0, quota: null, subtree: 0 });
  const seen = new Map();
  let i = 0;
  for (const x of ps) {
    const k = x.org_name || '（未归部门）';
    if (!seen.has(k)) {
      const id = 'D' + (i++);
      seen.set(k, id);
      fake.push({ id, parent_id: 'R', name: k, kind: 'region', headcount: 0, quota: null, subtree: 0 });
    }
    const d = fake.find(z => z.id === seen.get(k));
    d.headcount = Number(d.headcount || 0);
    fake.push({ id: 'P' + x.position_id, parent_id: seen.get(k), name: x.name,
      kind: 'dept', headcount: x.holders, quota: null, subtree: 0 });
  }
  // 部门节点的人数 = 其岗位在岗人次之和（"人次"不是人头，一人多岗会重复计）
  for (const d of fake.filter(z => String(z.id).startsWith('D'))) {
    d.headcount = fake.filter(z => z.parent_id === d.id)
      .reduce((a, z) => a + Number(z.headcount || 0), 0);
  }
  const total = ps.reduce((a, x) => a + Number(x.holders || 0), 0);
  fake[0].headcount = total;

  return `<div class="card">
    <h2>岗位网络 <span class="sub" style="font-weight:400">部门 → 岗位</span></h2>
    <div class="canvas-bar">
      <div class="zoomer">
        <button data-zoom="out">−</button>
        <span class="val" id="orgZoom">100%</span>
        <button data-zoom="in">＋</button>
        <button data-zoom="fit">适应</button>
      </div>
      <span class="hint">悬停看一个部门下的所有岗位 · 圆里是在岗人次</span>
    </div>
    <div class="org-canvas" id="orgCanvas" style="max-height:min(78vh,820px)">${orgRadialSvg(fake, { click: 'none' })}</div>
    <div class="fignote">同一个人在多个岗位上都算一次 —— 这张图回答"岗位有没有人"，
      不是"有多少人头"。</div>
  </div>`;
}

function orgRadialSvg(rows, opts = {}) {
  const kids = new Map();
  for (const r of rows) {
    const k = r.parent_id === null ? '@root' : String(r.parent_id);
    if (!kids.has(k)) kids.set(k, []);
    kids.get(k).push(r);
  }
  const roots = kids.get('@root') || [];

  // ① 先把每层的"标签总宽"量出来 —— 环的半径由它决定。
  //   定长半径的图，16 个部门时标签会叠成一团：那不是数据密，是布局没算标签。
  const layerW = [];
  const collect = (n, d) => {
    const lw = Math.min(String(n.name || '').length, 10) * 12 + 18;
    layerW[d] = (layerW[d] || 0) + lw;
    for (const c of (kids.get(String(n.id)) || [])) collect(c, d + 1);
  };
  roots.forEach(r => collect(r, 0));

  const R = [0];
  for (let d = 1; d < layerW.length; d++) {
    const need = (layerW[d] || 0) / (2 * Math.PI) * 1.10;   // 标签沿圆周排开的弧长
    R[d] = Math.max(R[d - 1] + 156, need, 168);             // 同时不能压住内环
  }

  const nodes = [];
  const place = (n, a0, a1, depth) => {
    const r = R[depth] || 0;
    const mid = (a0 + a1) / 2;
    const hc = Number(n.headcount || 0);
    // 部门/区域节点给一个更大的起点：和岗位同大小时，"这是分组还是岗位"看不出来
    const base = n.kind === 'region' ? 24 : 17;
    const rad = depth === 0 ? 42 : Math.min(42, base + Math.sqrt(hc) * 5.2);
    nodes.push({ ...n, depth, angle: mid, x: r * Math.cos(mid), y: r * Math.sin(mid), rad });
    const cs = kids.get(String(n.id)) || [];
    if (!cs.length) return;
    // 按"人数 + 子树"加权分角度：人多/枝大的分支占更宽
    const span = a1 - a0;
    const rNext = R[depth + 1] || 0;
    const wts = cs.map(c => 1 + Math.sqrt(Number(c.headcount || 0) + Number(c.subtree || 0)) * 0.55);
    const tot = wts.reduce((a, b) => a + b, 0);
    // ★ 先保证每个标签占得到"自己那一份弧长"，剩下的角度再按人数/子树权重分。
    //   纯按权重分时，0 人的小部门只分到 3°，标签直接压在邻居身上。
    const mins = cs.map(c => (Math.min(String(c.name || '').length, 10) * 12 + 26) / Math.max(rNext, 1));
    const sumMin = mins.reduce((a, b) => a + b, 0);
    const widths = sumMin >= span
      ? mins.map(m => m / sumMin * span)
      : cs.map((c, i) => mins[i] + (span - sumMin) * wts[i] / tot);
    let acc = a0;
    cs.forEach((c, idx) => {
      place(c, acc, acc + widths[idx], depth + 1);
      acc += widths[idx];
    });
  };
  roots.forEach((rt, i) => place(rt, -Math.PI / 2 + i * 0.3, 1.5 * Math.PI + i * 0.3, 0));

  const byId = new Map(nodes.map(n => [String(n.id), n]));
  const links = [];
  for (const n of nodes) {
    if (n.parent_id === null) continue;
    const p = byId.get(String(n.parent_id));
    if (p) links.push([p, n]);
  }

  // ② 标签几何 + 包围盒（画布按内容裁，不留一大圈空白）
  let minX = 0, minY = 0, maxX = 0, maxY = 0;
  const grow = (x1, y1, x2, y2) => {
    minX = Math.min(minX, x1); maxX = Math.max(maxX, x2);
    minY = Math.min(minY, y1); maxY = Math.max(maxY, y2);
  };
  for (const n of nodes) {
    grow(n.x - n.rad, n.y - n.rad, n.x + n.rad, n.y + n.rad);
    const label = n.name.length > 10 ? n.name.slice(0, 10) + '…' : n.name;
    const lw = label.length * 12 + 14;
    const ax = Math.cos(n.angle), ay = Math.sin(n.angle);
    const off = n.rad + 13;
    const lx = n.x + ax * off, ly = n.y + ay * off;
    const anchor = ax > 0.35 ? 'start' : ax < -0.35 ? 'end' : 'middle';
    const bx = anchor === 'start' ? lx - 6 : anchor === 'end' ? lx - lw + 6 : lx - lw / 2;
    Object.assign(n, { label, lw, lx, ly, anchor, bx });
    grow(bx, ly - 11, bx + lw, ly + 11);
  }
  const PAD = 20;
  const W = Math.ceil(maxX - minX + PAD * 2);
  const H = Math.ceil(maxY - minY + PAD * 2);
  const dx = PAD - minX, dy = PAD - minY;

  const linkSvg = links.map(([a, b]) => {
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    // 控制点朝圆心收一点：线看起来"从中心长出来"，而不是一堆直棍
    const qx = mx * 0.90, qy = my * 0.90;
    const w = Math.max(1.1, Math.min(3.6, 1 + Math.log2(1 + Number(b.subtree || b.headcount || 0)) * 0.7));
    return `<path class="link2" data-a="${a.id}" data-b="${b.id}"
      d="M${a.x.toFixed(1)},${a.y.toFixed(1)} Q${qx.toFixed(1)},${qy.toFixed(1)} ${b.x.toFixed(1)},${b.y.toFixed(1)}"
      fill="none" stroke="#c9d8f5" stroke-width="${w.toFixed(1)}" stroke-linecap="round"/>`;
  }).join('');

  const nodeSvg = nodes.map(n => {
    const c = orgColor(n.kind);
    const isRoot = n.depth === 0;
    return `<g class="node" data-org="${n.id}" data-parent="${n.parent_id ?? ''}" data-name="${esc(n.name)}">
      <circle class="halo" cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="${(n.rad + 6).toFixed(1)}"
        fill="${c}" fill-opacity=".12"/>
      <circle class="core" cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="${n.rad.toFixed(1)}"
        fill="${isRoot ? 'url(#orgRoot)' : c}" fill-opacity="${isRoot ? 1 : 0.92}"
        stroke="#fff" stroke-width="2.2" filter="url(#orgGlow)"/>
      <text x="${n.x.toFixed(1)}" y="${(n.y + 4.5).toFixed(1)}" text-anchor="middle"
        font-size="${isRoot ? 14 : 12}" font-weight="700" fill="#fff">${Number(n.headcount || 0)}</text>
      <rect x="${n.bx.toFixed(1)}" y="${(n.ly - 11).toFixed(1)}" width="${n.lw.toFixed(0)}" height="22" rx="8"
        fill="#fff" fill-opacity=".88" stroke="#e6eefc"/>
      <text x="${n.lx.toFixed(1)}" y="${(n.ly + 4).toFixed(1)}" text-anchor="${n.anchor}"
        font-size="11.5" font-weight="600" fill="#334155">${esc(n.label)}</text>
      <title>${esc(n.name)} · 编制 ${n.quota ?? '未定'} · 在编 ${n.headcount ?? 0}</title>
    </g>`;
  }).join('');

  const clickable = opts.click === 'org' ? '1' : '0';
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" data-w="${W}" data-h="${H}"
    data-click="${clickable}" class="org-graph" xmlns="http://www.w3.org/2000/svg" style="font-family:inherit">
    <defs>
      <radialGradient id="orgRoot" cx="34%" cy="30%" r="85%">
        <stop offset="0%" stop-color="#60a5fa"/><stop offset="100%" stop-color="#1d4ed8"/>
      </radialGradient>
      <filter id="orgGlow" x="-50%" y="-50%" width="200%" height="200%">
        <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1d4ed8" flood-opacity=".18"/>
      </filter>
    </defs>
    <g transform="translate(${dx.toFixed(1)},${dy.toFixed(1)})">${linkSvg}${nodeSvg}</g>
  </svg>`;
}

function bindRadial() {
  const box = $('#orgCanvas');
  if (!box) return;
  const svg = box.querySelector('svg');
  const clickable = svg?.dataset.click === '1';
  const gs = [...box.querySelectorAll('.node')];
  const links = [...box.querySelectorAll('.link2')];
  const parentOf = new Map(gs.map(g => [g.dataset.org, g.dataset.parent || '']));

  const near = (id) => {
    const set = new Set([id]);
    const par = parentOf.get(id) || '';
    if (par) set.add(par);
    for (const [k, v] of parentOf) {
      if (v === id) set.add(k);                       // 子
      if (par && v === par && k !== id) set.add(k);    // 兄弟
    }
    return set;
  };

  for (const g of gs) {
    g.addEventListener('mouseenter', () => {
      const set = near(g.dataset.org);
      for (const x of gs) {
        const on = set.has(x.dataset.org);
        x.classList.toggle('dim', !on);
        x.classList.toggle('lit', on && x !== g);
      }
      for (const l of links) {
        const on = set.has(l.dataset.a) && set.has(l.dataset.b);
        l.classList.toggle('kin', on);
        l.classList.toggle('dim', !on);
      }
    });
    g.addEventListener('mouseleave', () => {
      for (const x of gs) x.classList.remove('dim', 'lit');
      for (const l of links) l.classList.remove('kin', 'dim');
    });
    if (clickable) g.onclick = () => showOrgPanel(g.dataset.org);
  }

  // 图宽超出画布就整体缩到装得下；比画布窄就保持 1:1（放大只会让人以为数据变大了）
  if (svg) {
    const s = Math.min((box.clientWidth - 22) / Number(svg.dataset.w),
                       (box.clientHeight - 18) / Number(svg.dataset.h));
    if (s < 1) { ORGST.scale = Math.max(0.42, s); applyZoom(); }
  }
  bindPan(box);
}

function orgListCard(rows, noQuota) {
  const body = rows.map((x) => {
    const pad = 10 + x.depth * 18;
    // 有下级的组织：编制是"下辖之和"，人数要拿**含下级**比才对得上；
    // 叶子：含下级就等于自己，两种比法结果相同。标注依据，免得读者拿"在编"去减。
    const basis = x.has_kids ? '<span class="sub">含下级</span>' : '';
    const gap = x.gap === null ? '<span class="sub">未定编</span>'
      : x.gap > 0 ? `<b style="color:var(--warn)">缺 ${x.gap}</b>${basis}`
      : x.gap < 0 ? `<b style="color:var(--bad)">超 ${-x.gap}</b>${basis}`
      : `<span class="sub">满编</span>${basis}`;
    return `<tr class="org-row ${x.is_active === false ? 'inactive' : ''}" data-org="${x.id}">
      <td style="padding-left:${pad}px">
        <span class="caret">▸</span>
        ${x.depth > 0 ? '<span class="sub">└ </span>' : ''}
        <b>${esc(x.name)}</b>
        <span class="tag ${x.kind === 'group' ? 'ok' : ''}">${ORG_KIND[x.kind] || x.kind}</span>
        ${x.is_active === false ? '<span class="tag warn">已停用</span>' : ''}
      </td>
      <td class="num">${x.quota === null ? '—' : x.quota}${carriedTag(x.quota_status, x.quota_carried_from, '编制')}</td>
      <td class="num">${x.headcount}</td>
      <td class="num">${gap}</td>
      <td class="num sub">${x.subtree}${x.stations
        ? ` · 档 ${x.stations}${x.station_gap > 0
            ? ` <b style="color:var(--warn)">缺 ${x.station_gap}</b>` : ''}`
        : ''}</td>
    </tr>`;
  }).join('');

  return `<div class="card">
    <h2>部门清单 <span class="sub" style="font-weight:400">一行一个部门 · 点行展开人员</span></h2>
    <table><thead><tr>
      <th>组织</th><th>编制</th><th>在编</th><th>缺编</th><th>含下级</th>
    </tr></thead><tbody>${body || '<tr><td colspan="5" class="sub">还没有组织</td></tr>'}</tbody></table>
    <p class="sub">「缺编 = 编制 − 在编」，负数表示超编；「—」表示这个部门还没定编（不是 0）。
      <b>有下级的组织按「含下级」人数比</b>（编制是下辖之和，跟直属比会把整个下辖的编都报成缺口），
      叶子节点的含下级就等于在编，两种比法同一个数。
      ${noQuota ? `${noQuota} 个部门未定编。` : ''}</p>
    <div class="card" id="orgPanel" hidden></div>
  </div>`;
}

/** 点一行展开/收起该部门人员（清单视图用） */
async function toggleOrgMembers(tr) {
  const next = tr.nextElementSibling;
  if (next && next.classList.contains('org-expand')) { next.remove(); return; }
  const id = tr.dataset.org;
  const r = await call(`/api/org/members?org=${id}`);
  if (r.status !== 200) return toast('bad', `<b>${esc(r.body.error)}</b>`);
  const d = r.body;
  const gap = d.quota === null ? null : d.quota - d.headcount;
  const html = `<tr class="org-expand"><td colspan="5" style="background:#f8faff">
    <div style="padding:4px 0 8px">
      <div class="kv" style="margin:0 0 8px">
        <span>${esc(d.org.name)}</span>
        <span>编制 <b>${d.quota === null ? '未定' : d.quota}</b></span>
        <span>在编 <b>${d.headcount}</b></span>
        <span>${orgGapTxt(gap)}</span>
      </div>
      ${d.rows.length === 0 ? '<span class="sub">这个部门没有直属人员（人数可能都在下级）。</span>'
        : `<table style="font-size:12px"><thead><tr>
             <th>工号</th><th>姓名</th><th>岗位</th><th>入职</th><th>来源</th>
           </tr></thead><tbody>${d.rows.map(p => `<tr>
             <td class="num">${esc(p.employee_no || '—')}</td>
             <td>${esc(p.full_name)}</td>
             <td class="sub">${esc(p.role_names || '—')}</td>
             <td class="num">${esc(String(p.hire_date).slice(0, 10))}</td>
             <td>${p.from_dingtalk ? '<span class="tag ok">钉钉</span>' : '<span class="sub">本系统</span>'}</td>
           </tr>`).join('')}</tbody></table>`}
    </div></td></tr>`;
  tr.insertAdjacentHTML('afterend', html);
}

// ---------------------------------------------------------------------------
// 门店档口与缺岗（172）：点开门店节点时的那一段
// ---------------------------------------------------------------------------
// 一次请求拿回三个数与明细（/api/org/stations?detail=1），页面不做第二次取数 ——
// 分两次取就会出现"编制是昨天的、到岗是今天的"那一屏。
//
// ★ 两个口径必须在页面上写明，否则这一屏会被自己的数问住：
//   ① 「岗次」与「人头」不是一回事：一人兼两个岗，档口岗次 2、人头 1。
//      门店那栏数人头，档口这栏数岗次，两个数不能相减。
//   ② 「未定编」不是「缺 0」：这个档口当期一个岗都没定编时，缺岗是"没有"，
//      不是"刚好够"。所以显示成灰字，且不进合计。
async function loadOrgStations(orgId) {
  const box = $('#orgStationBox');
  if (!box) return;
  box.innerHTML = '<p class="sub" style="margin:2px 0">档口取数中…</p>';
  const r = await call(`/api/org/stations?store=${orgId}&detail=1`);
  if (r.status !== 200) {
    // 403 与"没配档口"必须长得不一样：一个是"不该你看"，一个是"这里是空的"。
    // 画成一个样子，店长会去问"为什么我们店没有档口"。
    box.innerHTML = `<p class="sub" style="margin:2px 0">${
      r.status === 403 ? '这家店不在你的数据范围内，看不到档口与缺岗'
        : `档口取数失败：${esc((r.body && r.body.error) || r.status)}`}</p>`;
    return;
  }
  const d = r.body;
  const q = d.store.quota;

  if (!d.stations.length) {
    box.innerHTML = `<p class="sub" style="margin:2px 0">这家店还没配档口${
      q === null ? '，门店也还没定编' : `（门店编 ${q} 个，全部算"还没分到档口"）`}。</p>`
      + stationConfigHtml(d);
    bindStationConfig(orgId, d);
    return;
  }

  // ★ 单位写出来：档口这一栏的数是**岗次**，"超 1" 读不出"超 1 个岗"还是"1 个人"。
  //   负数不是错数据 —— 编制调小了、人还在岗，就是超编。用"超编"而不是"-1"，
  //   是因为"缺岗 -1"是句错话（缺口不会是负的，负的是另一个状态）。
  const gapCell = (g) => (g === null ? '<span class="sub">未定编</span>'
    : g > 0 ? `<b style="color:var(--warn)">缺岗 ${g}</b>`
    : g < 0 ? `<b style="color:var(--bad)">超编 ${-g}</b>`
    : '<span class="sub">满编</span>');

  // 「沿用」的标记（181）：这一期没重新配，编制来自更早一期。
  // ★ 必须显示 —— 用户定的口径是"定了就一直用"，而沿用的副作用正是"漏配看不出来"。
  //   只把数字补上也满足不了需求：那会让"忘了配 7 月"和"7 月配了 5 个编"长得一样。
  const carriedTag = (p) => (p.carried_from
    ? `<span class="sub" style="color:#0369a1"> 沿用${esc(String(p.carried_from).slice(0, 7))}</span>`
    : '');

  const body = d.stations.map((s) => {
    const pos = (s.positions || []).map((p) => `<span class="sub" style="margin-right:12px;white-space:nowrap">${
      esc(p.position_name)} <b>${p.holders}</b>/${p.headcount === null ? '—' : p.headcount}${
      carriedTag(p)}${
      // 跨期改属：重组是允许的，但**看得懂**是另一件事 —— 不标一句，
      // 翻到那一期的人第一反应是"数据错"（见 docs/48 §14.1）
      p.prev_station_name
        ? `<span class="sub" style="color:#7c3aed"> ←${esc(String(p.prev_period).slice(0, 7))} 由${esc(p.prev_station_name)}改属</span>`
        : ''} ${
      p.gap === null ? '' : p.gap > 0
        ? `<b style="color:var(--warn)">缺 ${p.gap}</b>${p.days_open != null ? `<span class="sub">·${p.days_open}天</span>` : ''}`
        : p.gap < 0 ? `<b style="color:var(--bad)">超 ${-p.gap}</b>` : ''}${
      p.holder_names ? `<span class="sub">（${esc(p.holder_names)}）</span>` : ''}</span>`).join('');
    return `<tr>
      <td><b>${esc(s.station_name)}</b><div class="sub" style="font-size:11px">${
        s.line_code === 'kitchen' ? '后厨' : s.line_code === 'floor' ? '前厅' : '后勤'}</div></td>
      <td class="num">${s.quota === null ? '—' : s.quota}${
        s.quota_status === 'carried'
          ? `<div class="sub" style="font-size:10px;color:#0369a1">沿用 ${esc(String(s.carried_from || '').slice(0, 7))}</div>`
          : s.quota_status === 'mixed'
            ? '<div class="sub" style="font-size:10px;color:#0369a1">部分沿用</div>' : ''}</td>
      <td class="num">${s.holders}<span class="sub">/${s.slots_filled}</span></td>
      <td class="num">${gapCell(s.gap)}</td>
      <td style="font-size:12px">${pos || '<span class="sub">还没配岗位</span>'}</td>
    </tr>`;
  }).join('');

  const extLine = d.extern && d.extern.hours > 0
    ? `<span>外包 <b>${d.extern.hours}</b> 小时 / ${d.extern.workers} 人 <span class="sub">不占编</span></span>`
    : '';
  const unsetLine = d.store.stations_unset > 0
    ? `<span style="color:var(--warn)">${d.store.stations_unset} 个档口未定编</span>` : '';
  // 沿用（181）：这一屏的编制里有多少是沿用更早一期来的。
  // 与「未定编」并列给 —— 两个都不是"本期配过"，但含义完全不同，
  // 合成一个"已定编 N 个"就把"这个月没人动过编制"这件事抹掉了。
  const carriedCnt = (d.store.stations_carried || 0) + (d.store.stations_mixed || 0);
  const carriedLine = carriedCnt > 0
    ? `<span style="color:#0369a1">${carriedCnt} 个档口沿用上期定编${
        d.store.stations_mixed > 0 ? `（其中 ${d.store.stations_mixed} 个部分沿用）` : ''}</span>` : '';

  box.innerHTML = `<div style="margin:2px 0 8px">
      <div class="kv" style="margin:0 0 6px">
        <span>门店编 <b>${q === null ? '未定' : q}</b></span>
        <span>已分到档口 <b>${d.store.station_quota}</b></span>
        <span>还没分到档口 <b>${d.store.quota_unallocated === null ? '—' : d.store.quota_unallocated}</b> 个编</span>
        <span>档口到岗 <b>${d.store.slots_filled}</b> 岗次 <span class="sub">（${d.store.holders} 人次）</span></span>
        ${d.store.gap > 0 ? `<span>档口缺岗 <b style="color:var(--warn)">${d.store.gap}</b></span>` : ''}
        ${unsetLine}${carriedLine}${extLine}
      </div>
      <table style="font-size:12px"><thead><tr>
        <th>档口</th><th>编制</th><th>到岗<span class="sub">岗次</span></th><th>缺岗</th><th>岗位明细（在岗/编制）</th>
      </tr></thead><tbody>${body}</tbody></table>
      <p class="sub" style="margin:6px 0 0">
        「到岗」两栏是<b>人头/岗次</b>：一人兼两个岗时，岗次比人头多，两者不能相减。
        门店那一栏数人头，档口这一栏数岗次 —— 这是 083 定的口径：
        编制看的是"岗位有没有人"，不是"人头去重"。
        「未定编」是<b>没设</b>，不是 0；它不进缺岗合计。外包按工时统计、不占编也不计到岗。
        「<span style="color:#0369a1">沿用 2026-06</span>」是<b>这一期没重新配</b>、
        按上一期定的编继续用（定了就一直用）—— 与"未定编"不是一回事，也不等于"这一期核过编"。
      </p>
      ${stationConfigHtml(d)}
    </div>`;
  bindStationConfig(orgId, d);
}

// ---------------------------------------------------------------------------
// 档口配置（172 的写入口）：预置 / 开通 / 关闭 / 配编制
// ---------------------------------------------------------------------------
// ★ 为什么配置放在"点开门店"这个抽屉里，而不是另开一页：
//   档口是**某一家店**的内部结构。做成独立页面就要先选门店，而选门店那一步
//   和这里"你已经点开了哪家店"是同一件事 —— 两处都得再选一次。
//
// ★ 四件事的顺序是**有依赖**的，页面上按这个顺序排，不按接口顺序排：
//   ① 先按品牌线预置（或手工开通一个档口）→ ② 再给档口的岗位配编制
//   → ③ 缺岗数才出现。反过来做会发现"配编制"没得选：还没开档口。
const STATION_BRANDS = [
  ['common', '通用'], ['cantonese', '粤菜 / 港式'], ['sichuan', '川菜'],
  ['tempura', '天妇罗专门店'], ['noodle', '面馆'], ['hotpot', '火锅'], ['western', '西餐 / 西式简餐'],
];

function stationConfigHtml(d) {
  const openOpts = d.stations
    .map((s) => `<option value="${s.station_id}">${esc(s.station_name)}</option>`).join('');
  return `<div class="card" style="margin:10px 0 0;padding:10px 12px">
      <h2 style="font-size:13px;margin:0 0 8px">档口配置
        <span class="sub" style="font-weight:400">先开通档口，再给它的岗位配编制 —— 顺序反过来会"没得选"</span></h2>
      <div class="form">
        <label>品牌线
          <select id="stBrand">${STATION_BRANDS.map(([v, n]) =>
            `<option value="${v}">${esc(n)}</option>`).join('')}</select>
        </label>
        <button id="stPreset">按品牌线预置</button>
        <span class="sub" style="align-self:center">只开档口、不定编（一个大店几个档口是店型决定的，不替客户猜）</span>
      </div>
      <div class="form">
        <label>可选档口<select id="stPick" style="min-width:150px"></select></label>
        <button id="stEnable">开通</button>
        <span class="sub" style="align-self:center;font-size:11px">起始日定了就不改；要改请先「关闭」到目标日前一天，再重开</span>
        <label>已开通<select id="stOpen" style="min-width:130px">${
          openOpts || '<option value="">（还没开过）</option>'}</select></label>
        <button id="stClose">关闭</button>
        <span class="sub" style="align-self:center">关闭前要先把在岗的人调走</span>
      </div>
      <div class="form">
        <label>配编制：档口<select id="stPosSta" style="min-width:120px">${
          openOpts || '<option value="">（还没开过）</option>'}</select></label>
        <label>岗位<select id="stPos" style="min-width:130px"></select></label>
        <label>编制<input id="stPosHc" type="number" min="0" step="1" value="1"
          style="width:74px"></label>
        <label>期间<input id="stPosMonth" value="${esc(ORGST.period || '')}"
          placeholder="YYYY-MM" style="width:96px"></label>
        <button id="stPosSave">保存</button>
      </div>
      <p class="sub" style="margin:2px 0 0">
        编制按<b>月</b>、追加版本、只增不改 —— "上个月这个档口几个编"要还能查出来。
        编制填 <b>0</b> 与<b>不配</b>不是一回事：0 是"这个岗不要人"，不配是"还没定编"（页面显示灰色「未定编」，不进缺岗合计）。
      </p>
    </div>`;
}

function bindStationConfig(orgId, d) {
  const brandSel = $('#stBrand');
  const pickSel = $('#stPick');
  const posSel = $('#stPos');
  if (!brandSel || !pickSel || !posSel) return;

  const refresh = () => loadOrgStations(orgId);
  // 岗位清单：只列内部岗位。外包岗由库里直接拒（E_SP_OUTSOURCED），
  // 这里先过滤掉 —— 让人从下拉里选一个必然被拒的项，是给操作员设陷阱。
  call('/api/positions').then((r) => {
    const ps = ((r.status === 200 && r.body.rows) || [])
      .filter((x) => x.is_outsourced !== true)
      .map((x) => `<option value="${x.position_id}">${esc(x.name)}</option>`).join('');
    posSel.innerHTML = ps || '<option value="">（还没有岗位，先去「岗位」建）</option>';
  }).catch(() => {});

  const fillChoices = () => {
    const open = new Set(d.stations.map((s) => Number(s.station_id)));
    call(`/api/org/station/choices?brand_line=${encodeURIComponent(brandSel.value)}`).then((r) => {
      // ★ 三种"下拉是空的"必须长得不一样，否则运营会照着错的那个去处理：
      //   ① 取不到词表（403/404/网络断）→ "接口没通"，该找管理员；
      //   ② 这条线本来就没有档口 → "选错品牌线了"，该换一条；
      //   ③ 都开过了 → "这家店已经配齐了"，不用再动。
      //   全归成「都开过了」的话，接口挂了会显示成"这家店配齐了"——
      //   而那时候真正该做的事是报修，不是继续配编制。
      if (r.status !== 200) {
        pickSel.innerHTML = `<option value="">（取不到档口词表：${esc(r.body && r.body.error || r.status)}）</option>`;
        return;
      }
      const rows = (r.body && r.body.rows) || [];
      if (!rows.length) {
        pickSel.innerHTML = '<option value="">（这条品牌线没有档口可配）</option>';
        return;
      }
      const avail = rows.filter((x) => !open.has(Number(x.station_id)));
      pickSel.innerHTML = avail.length
        ? avail.map((x) => `<option value="${x.station_id}">${esc(x.name)}（${esc(x.code)}）</option>`).join('')
        : '<option value="">（这条线的档口都开过了）</option>';
    }).catch(() => {
      pickSel.innerHTML = '<option value="">（取档口词表失败：网络或服务不可用）</option>';
    });
  };
  fillChoices();
  brandSel.onchange = fillChoices;

  const doPost = async (path, okMsg) => {
    const r = await call(path, { method: 'POST' });
    if (r.status !== 200) {
      // 业务码原样显示：E_OUT_OF_SCOPE 与 E_STN_IN_USE 下一步该做什么完全不同
      return toast('bad', `<b>${esc(r.body.error || r.status)}</b> ${esc(r.body.message || '')}`);
    }
    toast('ok', okMsg);
    refresh();
  };

  $('#stPreset').onclick = () => doPost(
    `/api/org/station/preset?store=${orgId}&brand_line=${encodeURIComponent(brandSel.value)}`,
    `已按「${(STATION_BRANDS.find((b) => b[0] === brandSel.value) || [])[1] || brandSel.value}」预置档口`);

  $('#stEnable').onclick = () => {
    if (!pickSel.value) return toast('bad', '<b>E_STN_NO_DEF</b> 没有可开通的档口');
    // ★ 幂等命中要说出来：接口拿回的是**已存在**的那一段（起始日不是这次填的），
    //   不说清楚，人事会以为"我改了起始日"——而它根本没变，也没报错。
    return call(`/api/org/station/enable?store=${orgId}&station=${pickSel.value}`, { method: 'POST' })
      .then((r) => {
        if (r.status !== 200) {
          return toast('bad', `<b>${esc(r.body.error || r.status)}</b> ${esc(r.body.message || '')}`);
        }
        if (r.body.idempotent) {
          toast('ok', `这个档口已经<b>从 ${esc(r.body.from)} 起</b>开通了，起始日未变；`
            + '要改请先「关闭」到目标日前一天再重开');
        } else {
          toast('ok', `档口已从 <b>${esc(r.body.from || '')}</b> 起开通`);
        }
        return loadOrgStations(orgId);
      })
      .catch(() => toast('bad', '<b>E_NET</b> 开通失败：网络或服务不可用'));
  };

  $('#stClose').onclick = () => {
    const v = $('#stOpen').value;
    if (!v) return toast('bad', '<b>E_STN_NOT_FOUND</b> 这家店还没有档口');
    return doPost(`/api/org/station/close?store=${orgId}&station=${v}`, '档口已关闭（历史编制不动）');
  };

  $('#stPosSave').onclick = () => {
    const sta = $('#stPosSta').value;
    const pos = posSel.value;
    const hc = Number($('#stPosHc').value);
    const month = ($('#stPosMonth').value || '').trim();
    if (!sta) return toast('bad', '<b>E_STN_NOT_FOUND</b> 这家店还没有档口');
    if (!pos) return toast('bad', '<b>E_ARG_INVALID</b> 还没有可配的岗位');
    if (!Number.isInteger(hc) || hc < 0) return toast('bad', '<b>E_ARG_INVALID</b> 编制必须是非负整数');
    if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(month)) {
      return toast('bad', '<b>E_SP_PERIOD</b> 期间要写成 YYYY-MM（编制是按月定的）');
    }
    return doPost(`/api/org/station/position?store=${orgId}&station=${sta}`
      + `&position=${pos}&month=${encodeURIComponent(month)}&headcount=${hc}`,
      `已配编制 ${hc} 个（追加版本，历史不动）`);
  };
}

// ---------------------------------------------------------------------------
// 部门人员面板（树/网共用）：人员 + 定编
// ---------------------------------------------------------------------------
async function showOrgPanel(orgId) {
  const panel = $('#orgPanel');
  if (!panel || !/^\d+$/.test(String(orgId || ''))) return;
  const r = await call(`/api/org/members?org=${orgId}`);
  if (r.status !== 200) return toast('bad', `<b>${esc(r.body.error)}</b>`);
  const d = r.body;
  if (!d.org) return;
  const gap = d.quota === null ? null : d.quota - d.headcount;
  panel.hidden = false;
  panel.innerHTML = `<h2>${esc(d.org.name)}
      <span class="sub" style="font-weight:400">${ORG_KIND[d.org.kind] || ''}</span>
      <span style="float:right;font-weight:400"><button class="ghost" id="pClose">收起</button></span></h2>
    <div class="kv" style="margin-bottom:10px">
      <span>编制 <b>${d.quota === null ? '未定' : d.quota}</b></span>
      <span>在编 <b>${d.headcount}</b></span>
      <span>${orgGapTxt(gap)}</span>
    </div>
    <div id="orgStationBox"></div>
    <div class="form">
      <label>定编人数<input id="pQuota" type="number" min="0" step="1"
        value="${d.quota ?? ''}" style="width:112px"></label>
      <label>原因（≥4 字）<input id="pReason" value="年度定编" style="width:170px"></label>
      <button id="pSaveQuota">保存编制</button>
      <span class="sub" style="align-self:center">追加一个版本，不改历史</span>
    </div>
    ${d.rows.length === 0 ? '<p class="sub" style="margin-top:10px">这个部门没有直属人员（人数可能都在下级）。</p>'
      : `<table style="margin-top:10px"><thead><tr>
           <th>工号</th><th>姓名</th><th>岗位/角色</th><th>入职</th><th>来源</th></tr></thead>
         <tbody>${d.rows.map(p => `<tr>
           <td class="num">${esc(p.employee_no || '—')}</td><td>${esc(p.full_name)}</td>
           <td class="sub">${esc(p.role_names || '—')}</td>
           <td class="num">${esc(String(p.hire_date).slice(0, 10))}</td>
           <td>${p.from_dingtalk ? '<span class="tag ok">钉钉</span>' : '<span class="sub">本系统</span>'}</td>
         </tr>`).join('')}</tbody></table>`}`;

  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  $('#pClose').onclick = () => { panel.hidden = true; };
  // 172：档口段只在"部门"上取。集团/区域没有档口 —— 让它们去请求只会拿到
  // 一份空清单，然后页面写"这家店还没配档口"，把"这不是门店"讲成了"没配"。
  if (d.org.kind === 'dept') loadOrgStations(d.org.id);
  else $('#orgStationBox').innerHTML = '';
  $('#pSaveQuota').onclick = async () => {
    const q = Number($('#pQuota').value);
    const reason = ($('#pReason').value || '').trim();
    if (!Number.isInteger(q) || q < 0) return toast('bad', '<b>E_QUOTA</b> 编制必须是非负整数');
    if (reason.length < 4) return toast('bad', '<b>E_REASON</b> 原因至少 4 个字');
    const w = await call(`/api/headcount/set?org=${d.org.id}&period=${encodeURIComponent(ORGST.period)}`
      + `&quota=${q}&reason=${encodeURIComponent(reason)}`, { method: 'POST' });
    if (w.status !== 200) {
      return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
    }
    toast('ok', `编制已改为 <b>${q}</b>（追加版本 v${w.body.version ?? ''}）`);
    viewOrg();
  };
}

// 岗位：卡片 / 网络
// ---------------------------------------------------------------------------
function orgPosCard(ps) {
  const groups = new Map();
  for (const x of ps) {
    const k = x.org_name || '（未归部门）';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(x);
  }
  const order = ORGST.rows.filter(r => r.kind !== 'group').map(r => r.name);
  const keys = [...groups.keys()].sort((a, b) => {
    const ia = order.indexOf(a), ib = order.indexOf(b);
    return (ia < 0 ? 9e3 : ia) - (ib < 0 ? 9e3 : ib);
  });

  const filled = ps.filter(x => x.holders > 0).length;
  const outsourced = ps.filter(x => x.is_outsourced).length;
  const vacant = ps.length - filled;

  const sections = keys.map(k => {
    const list = groups.get(k);
    const here = list.reduce((a, x) => a + Number(x.holders || 0), 0);
    const pct = list.length ? Math.round(list.filter(x => x.holders > 0).length / list.length * 100) : 0;
    return `<section class="pos-dept">
      <header>
        <b>${esc(k)}</b>
        <span class="sub">${list.length} 个岗位 · 在岗 ${here} 人次</span>
        <span class="bar" title="岗位有人率 ${pct}%"><i style="width:${pct}%"></i></span>
      </header>
      <div class="pos-cards">${list.map(posCardHtml).join('')}</div>
    </section>`;
  }).join('');

  return `<div class="card">
    <h2>岗位卡片 <span class="sub" style="font-weight:400">按部门分组</span></h2>
    <p class="note">岗位是<b>人为设计</b>的，与权限角色是两件事：岗位说明"他干什么"，
      角色说明"他能碰什么"。<b>一人可多岗</b>，所以"在岗人次"不等于人头。</p>
    <div class="pos-sum">
      <div><b>${ps.length}</b>岗位总数</div>
      <div><b>${filled}</b>有在岗</div>
      <div><b>${vacant}</b>空缺</div>
      <div><b>${outsourced}</b>外包岗</div>
    </div>
    ${sections || '<div class="empty">还没有岗位。</div>'}
  </div>`;
}

function posCardHtml(x) {
  const names = String(x.holder_names || '').split('、').filter(Boolean);
  const tag = x.level === 1 ? '<span class="tag">主管</span>' : '';
  const out = x.is_outsourced ? '<span class="tag warn">外包</span>' : '';
  return `<div class="pos-card ${names.length ? '' : 'vacant'}">
    <div class="top"><b>${esc(x.name)}</b>${tag}${out}</div>
    ${names.length ? `<div class="who">${names.slice(0, 7).map(n =>
      `<span class="av" style="background:${orgHueOf(n)}" title="${esc(n)}">${esc(orgInitials(n))}</span>`
    ).join('')}</div>` : ''}
    <div class="meta">${names.length
      ? `在岗 <b>${x.holders}</b> 人 · ${esc(names.join('、'))}`
      : '<span class="empty-hint">空缺 · 有编制没人</span>'}</div>
  </div>`;
}

function applyZoom() {
  const svg = document.querySelector('#orgCanvas svg');
  if (!svg) return;
  const W = Number(svg.dataset.w), H = Number(svg.dataset.h);
  svg.setAttribute('width', Math.round(W * ORGST.scale));
  svg.setAttribute('height', Math.round(H * ORGST.scale));
  const z = $('#orgZoom');
  if (z) z.textContent = Math.round(ORGST.scale * 100) + '%';
}

function bindZoom() {
  // 竖排 / 横排：只换布局，不动数据。选择记在本机 —— 这是"看图的习惯"，
  // 不该跟着帐套走（同一个帐套换个人看，偏好也是各人自己的）。
  document.querySelectorAll('#orgOri button').forEach(b => {
    b.onclick = () => {
      const ori = b.dataset.ori;
      if (ORGST.ori === ori) return;
      ORGST.ori = ori;
      try { localStorage.setItem('aihr.org.ori', ori); } catch {}
      const seg = $('#orgOri');
      if (seg) {
        seg.style.setProperty('--i', ori === 'v' ? 0 : 1);
        seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.ori === ori));
      }
      ORGST.scale = 1; ORGST.centered = false;
      paintOrgTree();
    };
  });

  document.querySelectorAll('#view [data-zoom]').forEach(b => {
    b.onclick = () => {
      const k = b.dataset.zoom;
      if (k === 'in') ORGST.scale = Math.min(2, Math.round((ORGST.scale + 0.15) * 100) / 100);
      else if (k === 'out') ORGST.scale = Math.max(0.35, Math.round((ORGST.scale - 0.15) * 100) / 100);
      else if (k === 'fit') {
        const box = $('#orgCanvas'), svg = box && box.querySelector('svg');
        if (box && svg) {
          ORGST.scale = Math.min(1.4, Math.max(0.35,
            (box.clientWidth - 26) / Number(svg.dataset.w)));
        }
      } else if (k === 'expand') {
        ORGST.collapsed = new Set(); paintOrgTree(); return;
      } else if (k === 'depth2') {
        ORGST.collapsed = new Set(ORGST.rows.filter(x => x.depth >= 1).map(x => String(x.id)));
        paintOrgTree(); return;
      } else if (k === 'stores') {
        setStoresShown(!ORGST.showStores); return;
      }
      applyZoom();
    };
  });
}

/** 拖动平移 + Ctrl/⌘ 滚轮缩放。用 pointer 事件并自己 capture，避免重复挂 window 监听 */
function bindPan(box) {
  if (!box || box.dataset.pan === '1') return;
  box.dataset.pan = '1';
  let down = false, sx = 0, sy = 0, sl = 0, st = 0, pid = null;
  box.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.onode') || e.target.closest('.node') || e.button !== 0) return;
    down = true; pid = e.pointerId;
    sx = e.clientX; sy = e.clientY; sl = box.scrollLeft; st = box.scrollTop;
    box.classList.add('dragging');
    try { box.setPointerCapture(pid); } catch {}
  });
  box.addEventListener('pointermove', (e) => {
    if (!down) return;
    box.scrollLeft = sl - (e.clientX - sx);
    box.scrollTop = st - (e.clientY - sy);
  });
  const up = () => {
    down = false; box.classList.remove('dragging');
    if (pid !== null) { try { box.releasePointerCapture(pid); } catch {} pid = null; }
  };
  box.addEventListener('pointerup', up);
  box.addEventListener('pointercancel', up);
  box.addEventListener('wheel', (e) => {
    if (!(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    ORGST.scale = Math.min(2, Math.max(0.35,
      Math.round((ORGST.scale + (e.deltaY > 0 ? -0.1 : 0.1)) * 100) / 100));
    applyZoom();
  }, { passive: false });
}

function bindOrgAdd() {

// ============================================================================
// 考勤异常与补卡（168）：识别 → 通知 → 员工说明 → 处理 → 关闭
// ----------------------------------------------------------------------------
// 之前漏打卡只能直接改打卡记录，改完查不出"谁批的、为什么"。
// 而补卡是考勤造假的高发口（代人打卡）—— 所以它是**单据**，不是一次 UPDATE。
//
// ★ 三件事：
//   ① 异常要能指到"哪一天哪一条"—— 员工月底看到"缺勤 1 天"来问，
//      答不出是哪一天，那是把账算成糊涂账；
//   ② 补卡必须**先审批再落库**——先改数再补审批，等于"改数"发生在"有人同意"之前；
//   ③ 疑似代打卡只报不拦 —— 同一设备同一分钟、同一人 60 秒内两次，
//      误判率高（共用打卡机很常见），硬拦会让人打不了卡。
// ============================================================================
async function viewAttX() {
  const period = window.ATX_PERIOD
    || new Date().toISOString().slice(0, 7);
  const [ex, dx] = await Promise.all([
    call(`/api/att/exceptions?period=${encodeURIComponent(period)}`),
    call(`/api/att/dup-punch?period=${encodeURIComponent(period)}`),
  ]);
  if (ex.status !== 200) return fail(ex);
  const rows = ex.body.rows || [];
  const kpi = ex.body.kpi || {};
  const dups = dx.status === 200 ? (dx.body.rows || []) : [];
  const K_CN = { late: '迟到', early: '早退', absent: '缺勤', miss_punch: '漏卡',
    no_roster: '无排班打卡', under_hours: '工时不足' };
  const S_CN = { open: '待处理', explained: '已说明', resolved: '已处理', waived: '已豁免' };

  $('#view').innerHTML = `
    <div class="card">
      <h2>考勤异常 <span class="sub" style="font-weight:400">
        ${period} · 共 ${rows.length} 条 · 待处理 ${kpi.open ?? 0} 条</span></h2>
      <p class="note">
        异常要能指到<b>哪一天哪一条</b>：员工月底看到"缺勤 1 天"来问，答不出是哪一天，
        那就是把账算成糊涂账。<b>扫描是幂等的</b>（重跑不翻倍），
        所以可以随时点一下看看现在有多少。
        <br><b>补卡是单据，不是一次 UPDATE</b>：未审批的单子不许写进考勤 ——
        先改数再补审批，等于"改数"发生在"有人同意"之前，事后看不出谁批的。
      </p>
      <div class="form">
        <label>期间<input id="axPeriod" type="month" value="${esc(period)}" style="width:150px"></label>
        <button id="axScan">扫描本月</button>
        <button class="ghost" id="axReload">只看</button>
        <span class="sub" style="align-self:center">
          扫描会按排班与打卡生成异常，已存在的不会重复插</span>
      </div>
    </div>

    <div class="card">
      <h2>异常清单</h2>
      ${rows.length === 0 ? '<div class="empty">这个月还没有异常（先扫描一次，或这个月确实都很准）</div>' : `
      <table><thead><tr><th>日期</th><th>员工</th><th>类型</th><th class="num">分钟</th>
        <th>来源</th><th>状态</th><th style="width:190px"></th></tr></thead>
        <tbody>${rows.slice(0, 100).map((x) => `<tr>
          <td class="sub">${esc(String(x.work_date).slice(0, 10))}</td>
          <td>${esc(x.full_name || ('#' + x.employee_id))}</td>
          <td><span class="tag ${x.kind === 'absent' ? 'bad' : (x.kind === 'miss_punch' ? 'warn' : '')}">
            ${esc(K_CN[x.kind] || x.kind)}</span></td>
          <td class="num">${x.minutes === null ? '—' : esc(x.minutes)}</td>
          <td class="sub">${x.source === 'auto' ? '扫描' : '手工'}</td>
          <td><span class="tag ${x.status === 'resolved' ? 'ok' : (x.status === 'open' ? 'bad' : 'warn')}">
            ${esc(S_CN[x.status] || x.status)}</span></td>
          <td>${x.status === 'open'
            ? `<button class="ghost" data-axa="${x.id}" data-act="notify">通知</button>
               <button class="ghost" data-axa="${x.id}" data-act="explain">记说明</button>`
            : (x.status === 'explained'
              ? `<button data-axa="${x.id}" data-act="resolve">处理完</button>
                 <button class="ghost" data-axa="${x.id}" data-act="waive">豁免</button>`
              : `<span class="sub">${esc(x.resolved_by || '')}</span>`)}</td>
        </tr>`).join('')}</tbody></table>`}
      <div id="axMsg" class="kv"></div>
    </div>

    <div class="card">
      <h2>补卡单 <span class="sub" style="font-weight:400">先审批，再落库</span></h2>
      <div class="form">
        <label>员工 id<input id="pxEmp" placeholder="person_id" style="width:110px"></label>
        <label>补哪一天<input id="pxDate" type="date" style="width:150px"></label>
        <label>补哪一端<select id="pxType" style="width:110px">
          <option value="in">上班卡</option><option value="out">下班卡</option>
          <option value="both">两端</option>
        </select></label>
        <label>补成几点<input id="pxTime" type="datetime-local" style="width:190px"></label>
      </div>
      <div class="form" style="margin-top:6px">
        <label style="flex:1">理由（至少 4 字）<input id="pxReason"
          placeholder="例：地铁故障，到店后在收银台补登记" style="width:100%"></label>
        <button id="pxOpen">开补卡单</button>
      </div>
      <div id="pxMsg" class="kv"></div>
      <p class="note sub">
        ★ 补卡不会覆盖已有的那一端：有效出勤取"最早上班 / 最晚下班"（打卡证据语义）。
        要改已有那一端的时间，正确通道是异常说明或补账，不是补卡。
      </p>
    </div>

    <div class="card">
      <h2>疑似代人打卡 <span class="sub" style="font-weight:400">只报不拦</span></h2>
      <p class="note">
        同一设备同一分钟、或同一个人 60 秒内打两次。共用打卡机很常见，误判率高 ——
        所以这里只列出来给人看，不做任何拦截。拦错了，员工当场打不了卡。
      </p>
      ${dups.length === 0 ? '<div class="empty">这个月没有疑似记录</div>' : `
      <table><thead><tr><th>类型</th><th>人</th><th>时间</th><th>设备</th>
        <th class="num">间隔</th></tr></thead>
        <tbody>${dups.slice(0, 50).map((x) => `<tr>
          <td class="sub">${x.reason === 'same_person_60s' ? '同一人 60 秒内两次' : '不同人同一设备同一分钟'}</td>
          <td>${esc(x.employee_id === x.peer_id ? `#${x.employee_id}`
            : `#${x.employee_id} / #${x.peer_id}`)}</td>
          <td class="sub">${esc(String(x.punched_at).slice(0, 19).replace('T', ' '))}</td>
          <td class="sub">${esc(x.device_id || '—')}</td>
          <td class="num">${esc(x.gap_sec)}s</td>
        </tr>`).join('')}</tbody></table>`}
    </div>`;

  const iso = (d) => d.toISOString().slice(0, 10);
  if ($('#pxDate')) $('#pxDate').value = iso(new Date());

  const sc = $('#axScan');
  if (sc) sc.onclick = async () => {
    sc.disabled = true;
    const p = $('#axPeriod').value;

    sc.disabled = false;
    if (res.status !== 200) {
      return toast('bad', `<b>${esc(res.body.error || res.status)}</b> ${esc(res.body.message || '')}`);
    }
    const n = res.body.inserted === undefined
      ? Object.values(res.body.by_kind || {}).reduce((a, b) => a + Number(b), 0)
      : res.body.inserted;
    toast('ok', `扫描完成：新增 <b>${n}</b> 条异常（已存在的不会重复插）`);
    window.ATX_PERIOD = p;
    load();
  };
  const rl = $('#axReload');
  if (rl) rl.onclick = () => { window.ATX_PERIOD = $('#axPeriod').value; load(); };

  document.querySelectorAll('[data-axa]').forEach((b) => {
    b.onclick = async () => {
      const act = b.dataset.act;
      const note = act === 'notify' ? null : prompt(
        act === 'explain' ? '员工怎么说的？（会留痕，不能改）'
          : (act === 'waive' ? '为什么豁免？' : '怎么处理的？'), '');
      if (act !== 'notify' && note === null) return;
      b.disabled = true;
      const res = await postJson('/api/att/exception/close',
        { exceptionId: Number(b.dataset.axa), action: act, note });
      b.disabled = false;
      if (res.status !== 200) {
        return toast('bad', `<b>${esc(res.body.error || res.status)}</b> ${esc(res.body.message || '')}`);
      }
      toast('ok', `已${act === 'notify' ? '通知' : act === 'explain' ? '记下说明'
        : act === 'waive' ? '豁免' : '处理'}`);
      load();
    };
  });

  const po = $('#pxOpen');
  if (po) po.onclick = async () => {
    po.disabled = true;
    const res = await postJson('/api/att/punch-fix', {
      employeeId: Number($('#pxEmp').value.trim()),
      workDate: $('#pxDate').value,
      fixType: $('#pxType').value,
      fixTime: $('#pxTime').value ? new Date($('#pxTime').value).toISOString() : null,
      reason: $('#pxReason').value.trim(),
    });
    po.disabled = false;
    if (res.status !== 200) {
      $('#pxMsg').innerHTML = `<span class="tag bad">${esc(res.body.error || res.status)}</span>
        <span>${esc(res.body.message || '')}</span>`;
      return toast('bad', `<b>${esc(res.body.error || res.status)}</b><br>${esc(res.body.message || '')}`);
    }
    $('#pxMsg').innerHTML = `<span class="tag ok">已开补卡单 ${esc(res.body.code || '')}</span>
      <span>下一步：审批通过后再点「落库」，才会写进考勤</span>`;
    toast('ok', '已开补卡单（未生效）');
  };
}

// ============================================================================
// 社保参保台账（166）：参保段 / 基数留痕 / 逐月明细 / 与工资条对账
// ----------------------------------------------------------------------------
// 与「申报表」那一屏分开：那边是**报给税务与社保的表**，这边是**我们自己的账**。
// 报出去的表错了要更正申报；台账错了要更正的是钱。
//
// ★ 三件台账必须回答的事：
//   ① 谁在哪个月、在哪个城市、参了哪些险种、基数多少 —— 员工问"我 3 月参保了吗"，
//      现在只能回答"算一下"，算完就没了；
//   ② 基数年度调整的旧值去哪了 —— 员工质疑"这个月为什么扣多了"，没有留痕就答不出；
//   ③ 台账按基数×费率算出来的个人额，与工资条真扣的对不对得上 —— 差一分都该点名。
// ============================================================================
async function viewSiLedger() {
  const [list, rec] = await Promise.all([
    call('/api/si/enrollments'),
    call('/api/si/reconcile?period=' + encodeURIComponent((window.SI_PERIOD || ''))),

  if (list.status !== 200) return fail(list);
  const rows = list.body.rows || [];
  const kpi = list.body.kpi || {};

  // 对账按期间：默认取台账里最近的起缴月
  const periods = [...new Set(rows.map((x) => x.start_period))].sort().reverse();
  const period = window.SI_PERIOD || periods[0] || '';
  const recRows = (rec.status === 200 && window.SI_PERIOD) ? (rec.body.rows || []) : [];
  const diff = recRows.filter((x) => x.status && x.status !== 'ok');

  $('#view').innerHTML = `
    <div class="card">
      <h2>社保参保台账 <span class="sub" style="font-weight:400">
        ${kpi.enrollments ?? rows.length} 段 · 在缴 ${kpi.open ?? '—'} 段</span></h2>
      <p class="note">
        与「申报表」分开：那边是<b>报给税务与社保的表</b>，这边是<b>我们自己的账</b>。
        报出去的表错了要更正申报；台账错了要更正的是钱。
        <br>参保段是<b>带起止月的段</b>，不是"当前状态" —— 期间不许重叠（库里有排他约束）。
        调基会写一条留痕再开新段，旧值不丢：员工问"这个月为什么扣多了"，能翻出来。
      </p>
      <!-- ★ stack2：9 列在 375px 下只看得见 6 列，**「个人」「单位」「来源」整列不可见** ——
           这两列是"账上到底扣了多少"的答案，看不见就只剩姓名城市，台账等于名录。 -->
      <table class="stack2"><thead><tr><th>员工</th><th>城市</th><th>险种</th><th>起缴月</th>
        <th>停缴月</th><th class="num">基数</th><th class="num">个人</th>
        <th class="num">单位</th><th>来源</th></tr></thead>
        <tbody>${rows.slice(0, 60).map((x) => `<tr>

    </div>

    <div class="card">
      <h2>按人看某个月 <span class="sub" style="font-weight:400">逐险种，只读台账</span></h2>

        明细<b>只读台账行</b>，不按当前政策重算 —— 重算会让"当年按旧基数缴的"变成
        "按新基数缴的"，而申报表与稽核认的是当时那个数。
      </p>
      <div class="form">
        <label>员工 id<input id="slEmp" placeholder="person_id" style="width:110px"></label>
        <label>期间<input id="slPeriod" type="month" style="width:150px"></label>

    <div class="card">
      <h2>与工资条对账 <span class="sub" style="font-weight:400">差一分都点名</span></h2>
      <p class="note">
        台账按"基数 × 费率"算出来的个人额，与工资条里真扣的个人部分，应当一致。
        不一致的两种可能：工资条的险种明细漏了一行，或者台账的基数录错了 ——
        两种都要在这个月改掉，隔月只能走更正。

      <div class="form">
        <label>期间<select id="slRecPeriod" style="width:150px">
          ${periods.map((p) => `<option value="${esc(p)}" ${p === period ? 'selected' : ''}>${esc(p)}</option>`)
            .join('') || '<option value="">—</option>'}

        <button id="slRec">对账</button>
        <span class="sub" style="align-self:center">差异 ${recRows.length ? diff.length : '—'} 行</span>
      </div>
      <div id="slRecArea">${recRows.length ? `
        <table class="stack2"><thead><tr><th>员工</th><th class="num">台账个人额</th>
          <th class="num">工资条扣款</th><th class="num">差额</th><th>状态</th></tr></thead>
          <tbody>${recRows.map((x) => `<tr${x.status !== 'ok' ? ' style="background:rgba(180,38,29,.06)"' : ''}>
            <td>${esc(x.full_name || ('#' + x.employee_id))}</td>
            <td class="num" data-label="台账个人额">${x.ledger_total === null ? '—' : Number(x.ledger_total).toFixed(2)}</td>
            <td class="num" data-label="工资条扣款">${x.payslip_total === null ? '—' : Number(x.payslip_total).toFixed(2)}</td>
            <td class="num" data-label="差额">${x.diff === null ? '—' : (Number(x.diff) === 0

            <td data-label="状态">${x.status === 'ok' ? '<span class="tag ok">一致</span>'

    if (!emp || !p) return toast('bad', '员工与期间都要填');

      return toast('bad', `<b>${esc(res.body.error || res.status)}</b> ${esc(res.body.message || '')}`);

           <td class="num" data-label="个人额">${Number(x.employee_amount).toFixed(2)}</td>

         </tr>`).join('')}</tbody></table>`;
  };

  const rc = $('#slRec');
  if (rc) rc.onclick = () => {
    window.SI_PERIOD = $('#slRecPeriod').value;
    load();
  };
}

// ============================================================================
// 离职交接（165）：离职单 → 交接清单 → 生效 → 离职证明
// ----------------------------------------------------------------------------
// 之前的做法是直接改 employment.leave_date，改完就查不出"为什么走、谁批的、
// 东西还回来没有"。而离职是劳动争议的第二高发点（第一是调岗调薪）。
//
// ★ 三件事必须由系统回答：
//   ① 最后工作日是哪天 —— 它是社保停缴月、最后一份工资、经济补偿年限的共同起点，
//      两个值只能有一个是对的；
//   ② 交接做完了没有 —— 工牌/钥匙/客户资料/在办事项，没交接完就放人走，
//      出事的补救成本远高于多问一句；
//   ③ 离职证明 —— 法定必须出具，且**只写四要素与年限**：
//      写原因、写评价、写竞业，会被下家追问，也容易构成侵权。
// ============================================================================
async function viewExit() {
  const r = await call('/api/hr/exit/list');
  if (r.status !== 200) return fail(r);
  const { rows, kpi } = r.body;
  const K_CN = { resign: '主动离职', terminate: '单位解除', retire: '退休',
    contract_end: '合同到期' };
  const S_CN = { draft: '草稿', approved: '已批', done: '已办结', cancelled: '已取消' };
  const d = (v) => (v ? String(v).slice(0, 10) : '—');

  $('#view').innerHTML = `
    <div class="card">
      <h2>离职交接 <span class="sub" style="font-weight:400">
        ${kpi.total} 张 · 待办 ${kpi.pending} 张 · 交接未完成 ${kpi.handover_open} 张</span></h2>
      <p class="note">
        <b>最后工作日</b>是社保停缴月、最后一份工资、经济补偿年限的共同起点 ——
        两个值只能有一个是对的，所以它落在一张单据上，不是直接改档案。
        <br><b>交接清单</b>里工牌、钥匙、客户资料、在办事项没归还，放人走之后再补的代价远高于多问一句。
        <br><span class="sub"><b>离职证明</b>只写姓名、证件号、岗位、入职与离职日期、本单位工作年限，外加盖章位。
        写原因、写评价、写竞业，会被下家追问，也容易构成侵权 —— 所以系统里没有这几个字段可填。</span>
      </p>
      ${rows.length === 0 ? '<div class="empty">还没有离职单。下面开一张。</div>' : `
      <table><thead><tr><th>单号</th><th>员工</th><th>类型</th><th>提出日</th>
        <th>最后工作日</th><th>交接</th><th>状态</th><th style="width:210px"></th></tr></thead>
        <tbody>${rows.map((x) => `<tr>
          <td><code>${esc(x.code)}</code></td>
          <td>${esc(x.full_name || ('#' + x.employee_id))}
            ${x.handover_to_name ? `<div class="sub">交接给 ${esc(x.handover_to_name)}</div>` : ''}</td>
          <td class="sub">${esc(K_CN[x.kind] || x.kind)}</td>
          <td class="sub">${d(x.apply_date)}</td>
          <td class="sub">${d(x.last_work_date)}</td>
          <td>${Number(x.items_total) === 0 ? '<span class="sub">未登记</span>'
            : `${Number(x.items_returned)} / ${Number(x.items_total)}
               ${Number(x.items_returned) < Number(x.items_total)
                 ? '<span class="tag warn">未完成</span>' : '<span class="tag ok">已完成</span>'}`}</td>
          <td><span class="tag ${x.status === 'done' ? 'ok' : (x.status === 'draft' ? '' : 'warn')}">
            ${esc(S_CN[x.status] || x.status)}</span></td>
          <td>
            ${x.status !== 'done' ? `<button class="ghost" data-exho="${x.id}">交接</button>` : ''}
            ${x.status === 'draft' || x.status === 'approved'
              ? `<button data-exgo="${x.id}">生效</button>` : ''}
            ${x.status === 'done' ? `<button class="ghost" data-excert="${x.id}">离职证明</button>` : ''}
          </td>
        </tr>`).join('')}</tbody></table>`}
      <div id="exArea"></div>
    </div>

    <div class="card">
      <h2>开一张离职单</h2>
      <div class="form">
        <label>员工 id<input id="exEmp" placeholder="person_id" style="width:110px"></label>
        <label>类型<select id="exKind" style="width:150px">
          ${Object.entries(K_CN).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}
        </select></label>
        <label>提出日<input id="exApply" type="date" style="width:150px"></label>
        <label>最后工作日<input id="exLast" type="date" style="width:150px"></label>
      </div>
      <div class="form" style="margin-top:6px">
        <label>交接人 id<input id="exTo" placeholder="可留空" style="width:110px"></label>
        <label style="flex:1">离职原因（至少 4 字）<input id="exReason"
          placeholder="例：个人原因，已面谈" style="width:100%"></label>
        <button id="exOpen">开单</button>
      </div>
      <div id="exMsg" class="kv"></div>
    </div>`;

  const iso = (dt) => dt.toISOString().slice(0, 10);
  if ($('#exApply')) { $('#exApply').value = iso(new Date()); $('#exLast').value = iso(new Date()); }

  const op = $('#exOpen');
  if (op) op.onclick = async () => {
    op.disabled = true;
    const res = await postJson('/api/hr/exit/open', {
      employeeId: Number($('#exEmp').value.trim()),
      kind: $('#exKind').value,
      applyDate: $('#exApply').value,
      lastWorkDate: $('#exLast').value,
      reason: $('#exReason').value.trim(),
      handoverTo: $('#exTo').value.trim() ? Number($('#exTo').value.trim()) : null,
    });
    op.disabled = false;
    if (res.status !== 200) {
      $('#exMsg').innerHTML = `<span class="tag bad">${esc(res.body.error || res.status)}</span>
        <span>${esc(res.body.message || '')}</span>`;
      return toast('bad', `<b>${esc(res.body.error || res.status)}</b><br>${esc(res.body.message || '')}`);
    }
    const w = res.body.warnings || [];
    $('#exMsg').innerHTML = `<span class="tag ok">已开单 ${esc(res.body.code || '')}</span>
      ${w.map((x) => `<div class="sub" style="color:var(--warn,#a15c00)">${esc(x.message || x)}</div>`).join('')}`;
    toast('ok', '已开离职单（未生效）');
    load();
  };

  // 交接清单
  document.querySelectorAll('[data-exho]').forEach((b) => {
    b.onclick = async () => {
      const id = b.dataset.exho;
      const h = await call(`/api/hr/exit/handover?id=${id}`);
      if (h.status !== 200) return toast('bad', esc(h.body.message || h.status));
      const items = h.body.items || [];
      const area = $('#exArea');
      area.innerHTML = `<h2 style="margin-top:14px">交接清单 · ${esc(h.body.code || '')}</h2>
        <p class="note">勾选"已归还"再提交。关键项（工牌/钥匙/客户资料）没归还时，生效会先给预警 ——
          预警不是拦，但它是"放人走之前最后一句提醒"。</p>
        ${items.length === 0 ? '<div class="empty">还没有交接项，先加两条再提交。</div>' : ''}
        <table><thead><tr><th>类别</th><th>事项</th><th>已归还</th><th>备注</th></tr></thead>
          <tbody>${items.map((x, i) => `<tr>
            <td class="sub">${esc(x.category)}</td>
            <td>${esc(x.item)}</td>
            <td><input type="checkbox" data-ho="${i}" ${x.is_returned ? 'checked' : ''}></td>
            <td class="sub">${esc(x.note || '')}</td>
          </tr>`).join('')}</tbody></table>
        <div class="form" style="margin-top:8px">
          <label>新增事项<input id="hoItem" placeholder="例：门店钥匙" style="width:200px"></label>
          <label>类别<select id="hoCat" style="width:130px">
            <option value="asset">资产</option><option value="document">资料</option>
            <option value="account">账务</option><option value="work">在办事项</option>
          </select></label>
          <button class="ghost" id="hoAdd">加上去</button>
          <button id="hoSave">提交交接状态</button>
        </div>`;
      const collect = (extra) => {
        const list = items.map((x, i) => ({
          item: x.item, category: x.category,
          isReturned: $(`[data-ho="${i}"]`) ? $(`[data-ho="${i}"]`).checked : x.is_returned,
          note: x.note,
        }));
        return extra ? list.concat([extra]) : list;
      };
      if ($('#hoAdd')) $('#hoAdd').onclick = () => {
        const it = $('#hoItem').value.trim();
        if (!it) return;
        items.push({ item: it, category: $('#hoCat').value, is_returned: false, note: null });
        b.click();
      };
      const sv = $('#hoSave');
      if (sv) sv.onclick = async () => {
        sv.disabled = true;
        const res = await postJson('/api/hr/exit/handover', { id: Number(id), items: collect() });
        sv.disabled = false;
        if (res.status !== 200) {
          return toast('bad', `<b>${esc(res.body.error || res.status)}</b> ${esc(res.body.message || '')}`);
        }
        toast('ok', '交接状态已保存');
        load();
      };
    };
  });

  document.querySelectorAll('[data-exgo]').forEach((b) => {
    b.onclick = async () => {
      if (!confirm('确认办结离职？会写入离职日、终止合同、收口门店归属 —— 这三件事同时发生。')) return;
      b.disabled = true;
      const res = await call(`/api/hr/exit/apply?id=${b.dataset.exgo}`, { method: 'POST' });
      b.disabled = false;
      if (res.status !== 200) {
        return toast('bad', `<b>${esc(res.body.error || res.status)}</b> ${esc(res.body.message || '')}`);
      }
      toast('ok', `已办结：任职 ${res.body.employment_rows} 行、合同 ${res.body.contract_rows} 行、`
        + `归属 ${res.body.assignment_rows} 行`);
      load();
    };
  });

  document.querySelectorAll('[data-excert]').forEach((b) => {
    b.onclick = async () => {
      const res = await call(`/api/hr/exit/certificate?id=${b.dataset.excert}`);
      if (res.status !== 200) return toast('bad', esc(res.body.message || res.status));
      const txt = res.body.body || res.body.certificate || '';
      // 证明是新窗口里"能直接打印的一张纸"：不依赖 JS 再取数
      const w = window.open('', '_blank');
      if (!w) return toast('bad', '浏览器拦了新窗口');
      w.document.write(`<!doctype html><meta charset="utf-8"><title>离职证明</title>
        <style>body{font:14px/2 "Songti SC",SimSun,serif;max-width:720px;margin:40px auto;padding:0 24px}
        pre{white-space:pre-wrap;font:inherit}
        @media print{body{margin:0}}</style>
        <pre>${esc(txt)}</pre>
        <p style="text-align:right;margin-top:8px;color:#666">
          （用 Ctrl/⌘ + P 打印）</p>`);
      w.document.close();
    };
  });
}

// ============================================================================
// 人事合同（160）：关键项填报 → 校验 → 生成标准格式 → 打印盖章
// ----------------------------------------------------------------------------
// 这一屏要回答三件事，顺序不能换：
//   ① **谁还没有合同**（在职但无生效合同）—— 双倍工资风险的起算点，
//      而它的特征是"系统里一切正常"：人在上班、工资在发，直到离职那天有人提出来；
//   ② **哪些快到期**（90 天内）—— 续签要提前谈，不是到期当天再说；
//   ③ **新签一份**：填关键项，库里判试用期是否超法定上限，然后生成标准格式。
//
// ★ 页面上不重复算试用期上限：那个数在库里（fn_contract_probation_max），
//   页面再算一遍，两处漂的那一次就是签了一份违法合同。
// ============================================================================
async function viewContract() {
  const [r, un, ent, chg] = await Promise.all([
    call('/api/hr/contracts'),
    call('/api/hr/contract/unsigned'),
    call('/api/hr/entities'),
    call('/api/hr/changes'),
  ]);
  if (r.status !== 200) return fail(r);
  const { rows, kpi } = r.body;
  const unsigned = un.status === 200 ? un.body : { rows: [], overdue: 0 };
  const entities = ent.status === 200 ? (ent.body.rows || []) : [];
  const entBad = ent.status === 200 ? Number(ent.body.incomplete || 0) : 0;
  const changes = chg.status === 200 ? (chg.body.rows || []) : [];
  const chgUnsigned = chg.status === 200 ? Number(chg.body.kpi.unsigned || 0) : 0;

  const KIND_CN = { fixed: '固定期限', open: '无固定期限', task: '以完成一定工作任务为期限',
    parttime: '非全日制', intern: '实习' };
  const ST_CN = { draft: '草稿', pending_sign: '待签', signed: '已签',
    terminated: '已终止', expired: '已到期' };
  const d = (v) => (v ? String(v).slice(0, 10) : '—');

  const head = `<div class="card">
    <h2>人事合同</h2>
    <p class="note">
      合同是人事的地基：没有它，"入职"只是一个日期，答不出"这个人跟我们是什么关系、到哪天为止"。
      而它最容易出的错不是排版，是<b>生成了一份违法或无效的合同</b> ——
      试用期超上限（条款无效，已履行的按转正后工资补差）、合同期不满 3 个月却约了试用期、
      同一人在同一主体约第二次试用期、无固定期限填了终止日（那样它在法律上就是固定期限）。
      这些**在库里判**，不靠填表的人记得。
      <br><span class="sub">签下去的那一刻，正文会存成快照：之后公司改了模板，
      这份合同<b>一个字都不会变</b> —— 合同是"当时双方签的是什么"的证据。</span>
    </p>
    <div class="tier-grid kpi4" style="margin:0 0 10px">
      <div class="tier"><div class="k">已签在履行</div>
        <div class="v">${kpi.signed}<span>份</span></div>
        <div class="k">含草稿 ${kpi.draft} 份</div></div>
      <div class="tier"><div class="k">90 天内到期</div>
        <div class="v" style="color:${kpi.expiring ? 'var(--warn,#a15c00)' : 'inherit'}">
          ${kpi.expiring}<span>份</span></div>
        <div class="k">续签要提前谈</div></div>
      <div class="tier"><div class="k">已过期未续</div>
        <div class="v" style="color:${kpi.expired ? 'var(--bad,#b4261d)' : 'inherit'}">
          ${kpi.expired}<span>份</span></div>
        <div class="k">到期仍在岗 = 视为继续履行</div></div>
      <div class="tier"><div class="k">在职无生效合同</div>
        <div class="v" style="color:${unsigned.overdue ? 'var(--bad,#b4261d)' : 'inherit'}">
          ${unsigned.rows.length}<span>人</span></div>
        <div class="k">其中入职超 30 天 ${unsigned.overdue} 人</div></div>
    </div>
    ${entBad > 0 ? `<p class="note" style="color:var(--warn,#a15c00)">
      <b>甲方主体还没补全</b>：${entBad} 个主体只有编号、没有名称与信用代码。
      用它们签出来的合同，甲方一栏是无效的 —— 先去「制度 / 法人主档」补齐。</p>` : ''}
  </div>`;

  const unsignedCard = unsigned.rows.length === 0 ? '' : `<div class="card">
    <h2>在职但没有生效合同 <span class="sub" style="font-weight:400">
      ${unsigned.rows.length} 人 · 超 30 天 ${unsigned.overdue} 人</span></h2>
    <p class="note">
      这是<b>双倍工资风险</b>的起算点：用工之日起一个月内应当订立书面劳动合同。
      它非常安静 —— 人在上班、工资在发、系统里一切正常，直到离职那天有人提出来。
      刚入职几天没签是正常流程，所以这里按"入职天数"排序，超 30 天的标红。
    </p>
    <table><thead><tr><th>工号</th><th>姓名</th><th>入职日</th>
      <th class="num">已入职</th><th>状态</th></tr></thead>
      <tbody>${unsigned.rows.map((x) => `<tr>
        <td class="sub">${esc(x.employee_no || '—')}</td>

  </div>`;

  const listCard = `<div class="card">
    <h2>合同清单 <span class="sub" style="font-weight:400">${rows.length} 份</span></h2>
    <table><thead><tr><th>合同编号</th><th>员工</th><th>类型</th>
      <th>起止</th><th class="num">到期</th><th>状态</th><th style="width:150px"></th></tr></thead>
      <tbody>${rows.map((c) => `<tr>
        <td><code>${esc(c.contract_no)}</code>
          <div class="sub">${esc(c.entity_name || ('法人 #' + c.legal_entity_id))}</div></td>
        <td>${esc(c.full_name || ('#' + c.employee_id))}
          <div class="sub">${esc(c.job_title)} · ${esc(c.workplace)}</div></td>
        <td class="sub">${esc(KIND_CN[c.kind] || c.kind)}
          ${c.probation_from ? `<div class="sub">试用至 ${d(c.probation_to)}</div>` : ''}</td>
        <td class="sub">${d(c.start_date)} ~ ${c.end_date ? d(c.end_date) : '无固定'}</td>
        <td class="num">${c.days_left === null ? '<span class="sub">—</span>'

        <td><span class="tag ${c.status === 'signed' ? 'ok' : (c.status === 'draft' ? '' : 'warn')}">
          ${esc(ST_CN[c.status] || c.status)}</span></td>
        <td>
          <button class="ghost" data-ctprev="${c.id}">预览</button>
          ${c.status === 'draft' ? `<button data-ctsign="${c.id}">签署</button>` : ''}
          ${c.status === 'signed' ? `<button class="ghost" data-ctrenew="${c.id}">续签</button>` : ''}
        </td>
      </tr>`).join('') || '<tr><td colspan="7" class="sub">还没有合同</td></tr>'}
      </tbody></table>
  </div>`;

  const onboardCard = `<div class="card">
    <h2>从 offer 一键入职 <span class="sub" style="font-weight:400">岗位与月薪不填第二遍</span></h2>
    <p class="note">
      入职和合同本来是两件事，但合同上最要紧的三样（<b>岗位、月薪、入职日</b>）
      刚刚在 offer 里填过一遍。填两遍的后果不是麻烦，是<b>两个数会不一样</b>：

      入职日差几天，工龄、社保起缴月、试用期起算全跟着错。而这些错都不报错。
      <br>所以这里一次办完：建人 → 任职 → 工号 → <b>合同草稿</b>。
      合同仍需面签（系统不替人签）。
    </p>
    ${entities.length === 0 ? '<div class="empty">还没有法人主体，签不了。</div>' : `
    <div class="form">
      <label>offer 编号<input id="obOffer" placeholder="offer.id" style="width:110px"></label>
      <label>入职日<input id="obDate" type="date" style="width:150px"></label>
      <label>甲方主体<select id="obEnt" style="width:200px">
        ${entities.map((e) => `<option value="${e.id}">${esc(e.name)}</option>`).join('')}

      <label>乙方送达地址<input id="obAddr" placeholder="通讯地址（合同必须）" style="width:230px"></label>

    </div>
    <div id="obMsg" class="kv"></div>`}
  </div>`;

  const CHG_CN = { position: '调岗', transfer_store: '转店',
    employment_type: '用工类型转换', hours_system: '工时制度变更' };
  const chgCard = `<div class="card">
    <h2>员工异动 <span class="sub" style="font-weight:400">
      ${changes.length} 张单 · 已生效但协议未签 ${chgUnsigned} 张</span></h2>
    <p class="note">
      调岗、转店、换用工类型，法律上都是<b>变更劳动合同</b>。《劳动合同法》第三十五条要求
      变更<b>采用书面形式</b>——在系统里改一下档案，不等于变更完成。
      所以这里：开一张异动单 → 按生效日切归属段 → <b>另出一份变更协议</b>（草稿，面签后才算完）。
      <br><span class="sub">★ 生效日之前的工资仍按原岗位原门店算：归属是**切段**的，不是改现值 ——
      改现值会让上月补算的工资按新门店走，而那个错改不回来。</span>
    </p>
    ${chgUnsigned > 0 ? `<p class="note" style="color:var(--warn,#a15c00)">
      <b>${chgUnsigned} 张异动已生效但变更协议还没签</b> —— 这是"档案改了、书面没落"的状态，
      员工事后主张"未经协商变更"，公司拿不出东西。去下面清单里点「预览协议」打印面签。</p>` : ''}
    ${changes.length === 0 ? '<div class="empty">还没有异动单</div>' : `
    <table><thead><tr><th>单号</th><th>员工</th><th>类型</th><th>生效日</th>
      <th>变更内容</th><th>状态</th><th>变更协议</th><th></th></tr></thead>
      <tbody>${changes.map((g) => `<tr>
        <td><code>${esc(g.code)}</code></td>
        <td>${esc(g.full_name || ('#' + g.employee_id))}</td>
        <td class="sub">${esc(CHG_CN[g.kind] || g.kind)}</td>
        <td class="sub">${esc(String(g.effective_date).slice(0, 10))}</td>
        <td class="sub">${[
          g.new_job_title ? `岗位 ${esc(g.old_job_title)} → <b>${esc(g.new_job_title)}</b>` : '',
          g.new_workplace ? `地点 ${esc(g.old_workplace)} → <b>${esc(g.new_workplace)}</b>` : '',
          g.new_org_id ? `门店 #${g.old_org_id} → <b>#${g.new_org_id}</b>` : '',
        ].filter(Boolean).join('<br>') || '—'}</td>
        <td><span class="tag ${g.status === 'applied' ? 'ok' : ''}">
          ${esc({ draft: '草稿', approved: '已批', applied: '已生效', cancelled: '已取消' }[g.status] || g.status)}</span></td>
        <td class="sub">${g.new_contract_no
          ? `<code>${esc(g.new_contract_no)}</code> ${g.new_contract_status === 'signed'
            ? '<span class="tag ok">已签</span>' : '<span class="tag warn">待签</span>'}`
          : '—'}</td>
        <td>${g.status === 'applied'
          ? (g.contract_id ? `<button class="ghost" data-chgprev="${g.contract_id}">预览协议</button>` : '')

    <div class="form" style="margin-top:10px">
      <label>员工 id<input id="cgEmp" placeholder="person_id" style="width:110px"></label>
      <label>类型<select id="cgKind" style="width:150px">
        ${Object.entries(CHG_CN).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}

      <label>生效日<input id="cgDate" type="date" style="width:150px"></label>
      <label>新岗位<input id="cgJob" placeholder="调岗时填" style="width:130px"></label>
      <label>新地点<input id="cgPlace" placeholder="改工作地点时填" style="width:150px"></label>
      <label>新门店 id<input id="cgOrg" placeholder="转店时填" style="width:100px"></label>
    </div>
    <div class="form" style="margin-top:6px">
      <label style="flex:1">原因（至少 4 个字）<input id="cgReason"
        placeholder="例：商圈调整，A 店并入 B 店，人员随店走" style="width:100%"></label>
      <button id="cgGo">开异动单</button>
    </div>
    <div id="cgMsg" class="kv"></div>
  </div>`;

  const formCard = `<div class="card">
    <h2>新签 / 续签：填关键项</h2>
    <p class="note">
      只填<b>关键项</b>，正文由模板生成 —— 条款顺序照《劳动合同法》第十七条的必备条款。
      试用期留空就是"无试用期"；填了就会按合同期分档校验
      （3 个月以下不得约定，1 年以内最多 1 个月，3 年以内最多 2 个月，3 年以上及无固定期限最多 6 个月）。
    </p>
    ${entities.length === 0 ? `<div class="empty">还没有法人主体 —— 合同甲方是空的，签不了。</div>` : `
    <div class="form">
      <label>员工 id<input id="ctEmp" placeholder="person_id" style="width:110px"></label>
      <label>甲方主体<select id="ctEnt" style="width:210px">
        ${entities.map((e) => `<option value="${e.id}">${esc(e.name)}</option>`).join('')}
      </select></label>
      <label>类型<select id="ctKind" style="width:150px">
        ${Object.entries(KIND_CN).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}
      </select></label>
    </div>
    <div class="form">
      <label>起始日<input id="ctStart" type="date" style="width:150px"></label>
      <label>终止日<input id="ctEnd" type="date" style="width:150px"></label>
      <label>试用期起<input id="ctPf" type="date" style="width:150px"></label>
      <label>试用期止<input id="ctPt" type="date" style="width:150px"></label>

    <div class="form">

      <label>工作地点<input id="ctPlace" placeholder="示例路店" style="width:150px"></label>
      <label>乙方送达地址<input id="ctAddr" placeholder="通讯地址" style="width:230px"></label>
    </div>
    <div class="form">
      <label>工时制度<select id="ctHours" style="width:150px">
        <option value="standard">标准工时</option>
        <option value="comprehensive">综合计算工时</option>
        <option value="irregular">不定时工作制</option>
      </select></label>
      <label>约定工资<input id="ctWage" placeholder="6500" style="width:110px"></label>
      <label>单位<select id="ctUnit" style="width:100px">
        <option value="month">元/月</option><option value="hour">元/小时</option>
      </select></label>
      <label>发薪日<input id="ctDay" placeholder="15" style="width:80px"></label>
      <button id="ctSave">保存草稿</button>
    </div>
    <div id="ctMsg" class="kv"></div>`}
  </div>`;

  $('#view').innerHTML = head + unsignedCard + onboardCard + chgCard + listCard + formCard;

  // 默认日期：起今天、止两年后（最常见的固定期限）
  const iso = (dt) => dt.toISOString().slice(0, 10);
  const addYears = (n) => { const t = new Date(); t.setFullYear(t.getFullYear() + n); return iso(t); };
  if ($('#obDate')) $('#obDate').value = iso(new Date());
  if ($('#cgDate')) $('#cgDate').value = iso(new Date());
  if ($('#ctStart')) $('#ctStart').value = iso(new Date());
  if ($('#ctEnd')) $('#ctEnd').value = addYears(2);

  // 无固定期限时把终止日清空并禁掉 —— 库里也会拒（ck_ec_open_end），
  // 这里只是别让人先填了再被拒
  if ($('#ctKind')) $('#ctKind').onchange = (e) => {
    const open = e.target.value === 'open';
    if ($('#ctEnd')) { $('#ctEnd').disabled = open; if (open) $('#ctEnd').value = ''; }
    if ($('#ctPf')) { $('#ctPf').disabled = ['parttime', 'intern', 'task'].includes(e.target.value); }

  const cg = $('#cgGo');
  if (cg) cg.onclick = async () => {

    if ($('#cgJob').value.trim()) next.job_title = $('#cgJob').value.trim();
    if ($('#cgPlace').value.trim()) next.workplace = $('#cgPlace').value.trim();
    if ($('#cgOrg').value.trim()) next.org_id = Number($('#cgOrg').value.trim());

      employeeId: Number($('#cgEmp').value.trim()),
      kind: $('#cgKind').value,

    if (res.status !== 200) {

    $('#cgMsg').innerHTML = `<span class="tag ok">已开单</span>
      <span>下一步点清单里的「生效」—— 会按生效日切归属段，并生成一份变更协议草稿</span>
      ${w.length ? `<br>${w.map((x) => `<span class="tag warn">提醒</span> ${esc(x)}`).join('<br>')}` : ''}`;

  document.querySelectorAll('[data-chgapply]').forEach((b) => {

      if (!confirm('确认按生效日执行？会切归属段，并生成一份变更协议草稿（面签后才算完成）。')) return;
      b.disabled = true;
      const res = await call(`/api/hr/change/apply?id=${b.dataset.chgapply}`, { method: 'POST' });
      if (res.status !== 200) {
        toast('bad', `<b>${esc(res.body.error || res.status)}</b> ${esc(res.body.message || '')}`);
