    </div>

    <div class="card">
      <h2>计算规则 <span class="sub" style="font-weight:400">算薪前拦截 / 算薪后告警</span></h2>
      <p class="note">
        <b>before + block</b>：算薪**之前**当门 —— 命中就挡住这个人，不留工资条，但留一条命中记录
        （"为什么他没算出来"要查得到）。<b>after + warn</b>：算完留一条提示，不拦。
        规则自身写错按拦截处理：坏规则不能放行。
      </p>
      <table><thead><tr><th>代码</th><th>名称</th><th>阶段</th><th>动作</th><th>条件</th><th>提示</th><th>状态</th><th></th></tr></thead>
        <tbody>${(rules || []).map(r => `<tr>
          <td><code>${esc(r.code)}</code></td><td>${esc(r.name)}</td>
          <td><span class="tag">${r.stage === 'before' ? '算薪前' : '算薪后'}</span></td>
          <td>${r.action === 'block' ? '<span class="tag bad">拦截</span>' : '<span class="tag warn">告警</span>'}</td>
          <td class="sub">${esc(r.formula)}</td>
          <td class="sub">${esc(r.message)}</td>
          <td>${r.is_active ? '<span class="tag ok">启用</span>' : '<span class="tag warn">停用</span>'}</td>
          <td><button class="ghost" data-rule="${esc(r.code)}" data-active="${r.is_active ? '0' : '1'}">
            ${r.is_active ? '停用' : '启用'}</button></td>
        </tr>`).join('') || '<tr><td colspan="8" class="sub">还没有规则。常见两条：应发超过阈值要人工复核、实发为 0 要检查结构。</td></tr>'}
        </tbody></table>
      <div class="form" style="margin-top:10px">
        <label>代码<input id="rlCode" placeholder="GROSS_CAP" style="width:130px"></label>
        <label>名称<input id="rlName" placeholder="应发上限复核" style="width:140px"></label>
        <label>阶段<select id="rlStage"><option value="before">算薪前</option><option value="after">算薪后</option></select></label>
        <label>动作<select id="rlAction"><option value="block">拦截</option><option value="warn">告警</option></select></label>
        <label>条件<input id="rlFormula" value="if(GROSS > 50000, 1, 0)" style="width:200px;font-family:ui-monospace,Menlo,monospace"></label>
        <label>提示<input id="rlMessage" placeholder="应发超过 5 万需人工复核" style="width:200px"></label>
        <button id="rlSave">保存规则</button>
      </div>
      <div id="rlHits" style="margin-top:10px">
        ${(hits || []).length ? `<div class="sub" style="margin-bottom:4px">最近命中</div>
          <table style="font-size:12px"><thead><tr><th>规则</th><th>阶段</th><th>动作</th><th>人</th><th>提示</th><th>时间</th></tr></thead>
          <tbody>${hits.map(h => `<tr>
            <td><code>${esc(h.rule_code)}</code></td>
            <td class="sub">${h.stage === 'before' ? '算薪前' : '算薪后'}</td>
            <td>${h.action === 'block' ? '<span class="tag bad">拦截</span>' : '<span class="tag warn">告警</span>'}</td>
            <td class="num">#${h.person_id}</td>
            <td class="sub">${esc(h.message)}</td>
            <td class="sub">${esc(String(h.hit_at).replace('T',' ').slice(0,19))}</td>
          </tr>`).join('')}</tbody></table>` : '<span class="sub">还没有命中记录。</span>'}
      </div>
    </div>

    <div class="card">
      <h2>公式说明 <span class="sub" style="font-weight:400">运算符：+ − * / 与 &gt; &lt; &gt;= &lt;= = &lt;&gt; AND OR NOT</span></h2>
      <table><thead><tr><th>函数</th><th>签名</th><th>说明</th><th>示例</th></tr></thead>
        <tbody>${funcs.map(f => `<tr>
          <td><code>${esc(f.code)}</code></td>
          <td class="sub">${esc(f.args)}</td>
          <td>${esc(f.descr)}</td>
          <td class="sub"><code>${esc(f.example)}</code></td>
        </tr>`).join('')}</tbody></table>
      <p class="sub">
        变量里没值的按 <b>0</b> 算（不是报错）；<code>prorata</code> 的"应出"为 0 时按不折算处理。
        公式里不能出现引号、分号或注释符 —— 那不是限制，是这套东西能安全跑起来的前提。
      </p>
    </div>`;

  const ta = $('#siFormula');
  const insertAtCursor = (text) => {
    const start = ta.selectionStart ?? ta.value.length;
    const end = ta.selectionEnd ?? ta.value.length;
    ta.value = ta.value.slice(0, start) + text + ta.value.slice(end);
    ta.focus();
    ta.selectionStart = ta.selectionEnd = start + text.length;
  };

  document.querySelectorAll('.si-var').forEach(el => {
    el.onclick = () => insertAtCursor(el.dataset.v);
  });
  document.querySelectorAll('.si-fn').forEach(el => {
    el.onclick = () => insertAtCursor(el.dataset.f);
  });

  document.querySelectorAll('.si-row').forEach(tr => {
    tr.onclick = (e) => {
      if (e.target.closest('[data-toggle]')) return;
      const x = rows.find(y => y.code === tr.dataset.code);
      if (!x) return;
      $('#siCode').value = x.code;
      $('#siCode').disabled = true;      // code 是主键：改了等于新建一项，老工资条就对不上了
      $('#siName').value = x.name;
      $('#siKind').value = x.item_kind;
      $('#siOrder').value = x.sort_order;
      ta.value = x.formula || '';
      $('#siResult').textContent = '';
      ta.scrollIntoView({ behavior: 'smooth', block: 'center' });
      ta.focus();
    };
  });

  document.querySelectorAll('[data-toggle]').forEach(b => {
    b.onclick = async (e) => {
      e.stopPropagation();
      const w = await call(`/api/salary/item/active?code=${encodeURIComponent(b.dataset.toggle)}`
        + `&active=${b.dataset.active}`, { method: 'POST' });
      if (w.status !== 200) return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
      toast('ok', `已${b.dataset.active === '1' ? '启用' : '停用'} <b>${esc(b.dataset.toggle)}</b>`);
      viewSalaryItems();
    };
  });

  const clear = $('#siClear');
  if (clear) clear.onclick = () => {
    $('#siCode').disabled = false;
    ['siCode', 'siName', 'siFormula'].forEach(id => { $('#' + id).value = ''; });
    $('#siOrder').value = 100;
    $('#siResult').textContent = '';
  };

  $('#siPreview').onclick = async () => {
    const f = ta.value.trim();
    if (!f) return toast('bad', '<b>E_FORMULA_EMPTY</b> 先写一个公式');
    let vars = {};
    try { vars = JSON.parse($('#siVars').value || '{}'); } catch {
      return toast('bad', '<b>E_VARS</b> 试算变量必须是 JSON');
    }
    const w = await call(`/api/salary/formula/preview?formula=${encodeURIComponent(f)}`
      + `&vars=${encodeURIComponent(JSON.stringify(vars))}`, { method: 'POST' });
    if (w.status !== 200) return toast('bad', `<b>${esc(w.body.error || w.status)}</b>`);
    const el = $('#siResult');
    el.innerHTML = w.body.ok
      ? `试算结果 <b style="color:var(--ok);font-size:15px">${Number(w.body.value).toFixed(2)}</b>`
      : `<b style="color:var(--bad)">${esc(w.body.error)}</b>`;
  };

  document.querySelectorAll('[data-rule]').forEach(b => {
    b.onclick = async () => {
      const w = await call(`/api/salary/rule/active?code=${encodeURIComponent(b.dataset.rule)}`
        + `&active=${b.dataset.active}`, { method: 'POST' });
      if (w.status !== 200) return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
      toast('ok', `已${b.dataset.active === '1' ? '启用' : '停用'}规则 <b>${esc(b.dataset.rule)}</b>`);
      viewSalaryItems();
    };
  });

  const rlSave = $('#rlSave');
  if (rlSave) {
    rlSave.onclick = async () => {
      const q = new URLSearchParams({
        code: $('#rlCode').value.trim().toUpperCase(),
        name: $('#rlName').value.trim(),
        stage: $('#rlStage').value, action: $('#rlAction').value,
        formula: $('#rlFormula').value.trim(),
        message: $('#rlMessage').value.trim(),
      });
      if (!q.get('code')) return toast('bad', '<b>E_ITEM_CODE</b> 规则代码不能为空');
      const w = await call('/api/salary/rule?' + q.toString(), { method: 'POST' });
      if (w.status !== 200) return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
      toast('ok', `规则 <b>${esc(q.get('code'))}</b> 已保存`);
      viewSalaryItems();
    };
  }

  $('#siSave').onclick = async () => {
    const code = $('#siCode').value.trim().toUpperCase();
    const name = $('#siName').value.trim();
    const formula = ta.value.trim();
    if (!code) return toast('bad', '<b>E_ITEM_CODE</b> 代码不能为空');
    if (name.length < 2) return toast('bad', '<b>E_ITEM_NAME</b> 名称至少 2 个字');
    const w = await call(`/api/salary/item?code=${encodeURIComponent(code)}`
      + `&name=${encodeURIComponent(name)}&kind=${$('#siKind').value}`
      + `&formula=${encodeURIComponent(formula)}&order=${Number($('#siOrder').value) || 100}`,
      { method: 'POST' });
    if (w.status !== 200) {
      return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
    }
    toast('ok', `已保存 <b>${esc(code)}</b>${formula ? '（公式项）' : ''}，下次算薪生效`);
    viewSalaryItems();
  };
}

// 算薪页当前期间。★ 原来写死 2026-03：换个客户、换个季度，这一页就只会看
// 一个永远不动的月份，而"这期能不能封账"恰恰是逐期不同的答案。
let PAY_PERIOD = null;

async function viewPayroll() {
  const [runs, pol, ents] = await Promise.all([
    call('/api/payroll/runs'),
    call('/api/payroll/policy'),
    call('/api/payroll/entities'),
  ]);
  const RUNS = runs.body.rows || [];
  const ENTS = (ents.status === 200 ? (ents.body.rows || []) : []);
  // 默认选中：已选过的 > 有批次的那个法人 > 第一个
  if (!ENTS.some(e => e.id === CUR_ENTITY)) {
    CUR_ENTITY = (RUNS[0] && RUNS[0].legal_entity_id) || (ENTS[0] && ENTS[0].id) || 1;
  }
  // 默认落在"最近一期有批次的期间"上；没有批次时才回落到当月
  const P = PAY_PERIOD || (RUNS[0] ? RUNS[0].period : TODAY.slice(0, 7));
  const unclosed = await call(`/api/attendance/unclosed?period=${P}`);
  const blocked = (unclosed.body.rows || []).length;
  const run = RUNS.find(x => x.period === P);

  let slipsHtml = '';
  let consistHtml = '';
  let sg = null;
  let pl = null;
  if (run) {
    const sgRes = await call(`/api/payroll/signoff?run=${run.id}`);
    if (sgRes.status === 200) sg = sgRes.body;
    const plRes = await call(`/api/payroll/paylist?run=${run.id}`);
    if (plRes.status === 200) pl = plRes.body;
    const [sl, cs] = await Promise.all([
      call(`/api/payroll/slips?run=${run.id}`),
      call('/api/payroll/consistency'),
    ]);
    const rows = sl.body.rows || [];
    // 374 行：卡片化后单行 144px，整页 81,732px。前 100 行 + 「显示全部」。
    // 下面那排 .kv 明细也一起截断，否则它自己就够把页面拉长一倍。
    const payShown = rowsToShow('payroll', rows);
    // 有别人的行就默认遮实发；只有自己一行时不遮
    const payMask = netsAreOthers(rows);
    slipsHtml = rows.length === 0
      ? `<div class="empty">这批没有工资条。</div>`
      // ★ stack2：6 列在 375px 下只看得见 4 列，**「事假扣」和「实发」整列不可见** ——
      //   而"实发"就是到手工资，工资表上看不到它，这一页就只剩应发。
      : `<table class="stack2"><thead><tr><th>员工</th><th>应发</th><th>社保</th><th>个税</th><th>事假扣</th><th>实发</th></tr></thead>
         <tbody>${payShown.map(x => `<tr>
           <td><b>${esc(x.full_name || ('员工 ' + x.employee_id))}</b>
             <div class="sub">${esc(x.employee_no || ('#' + x.employee_id))}</div></td>
           <td class="num" data-label="应发">${esc(x.gross_amount)}</td>
           <td class="num" data-label="社保">${x.si_employee === null ? '<span class="masked">掩码</span>' : esc(x.si_employee)}</td>
           <td class="num" data-label="个税">${esc(x.items.find(i=>i.item_code==='IIT')?.amount ?? '—')}</td>
           <td class="num" data-label="事假扣">${esc(x.items.find(i=>i.item_code==='LEAVE_DEDUCT')?.amount ?? '0')}</td>
           ${x.net_amount === null
             ? '<td class="num" data-label="实发"><span class="masked">掩码</span></td>'
             : netCell(esc(x.net_amount), payMask)}
           </tr>`).join('')}</tbody></table>
         ${moreRowsBtn('payroll', rows.length, payShown.length)}
         <div class="kv">${payShown.map(x=>`<span>员工${x.employee_id} 明细：<b>${x.items.map(i=>i.item_code).join(' / ')}</b></span>`).join('')}</div>`;
    consistHtml = `<div class="kv"><span>勾稽（必须为空）：
      <span class="tag ${cs.body.ok ? 'ok' : 'bad'}">${cs.body.ok ? '通过' : cs.body.rows.length + ' 条不一致'}</span></span></div>`;
  }

  // ---- 算薪预演（137）----
  // 期间默认取最近一期批次；没有批次就用下个月（"准备发下个月"是最常见的心境）。
  const allRuns = (runs.body.rows || []).slice().sort((a, b) => String(b.period).localeCompare(String(a.period)));
  const pvPeriod = allRuns[0]?.period || TODAY.slice(0, 7);
  const polList = (pol.status === 200 ? pol.body.policies : []) || [];
  const pvCard = `
    <div class="card">
      <h2>算薪预演 <span class="sub" style="font-weight:400">改参数之前先看影响面</span></h2>
      <p class="note">
        调津贴、调社保基数、改制度项之前，没人说得清"这一改会多花多少钱、谁变化最大"。
        以前只能改了再算——而算完工资条就已经落账了。
        <br>预演是<b>真的算两遍</b>（改前一遍、改后一遍），用的是同一个算薪函数，
        所以数不会跟真算漂；算完全部撤销，<b>批次、工资条、制度项一行都不会多</b>。
        <br>留空 = 这一项不动。制度项一次只预演一个 —— 同时改三项会影响因果，看不出是哪一项起的作用。
      </p>
      <div class="form">
        <label>期间<input id="pvPeriod" type="month" value="${esc(pvPeriod)}" style="width:150px"></label>
        <label>月薪整体<input id="pvPct" type="number" step="0.1" placeholder="如 5" style="width:90px"></label>
        <span class="sub" style="align-self:center">%</span>
        <label>每人加/减<input id="pvAdd" type="number" step="100" placeholder="如 300" style="width:100px"></label>
        <span class="sub" style="align-self:center">元</span>
        <label>社保基数<input id="pvSi" type="number" step="0.1" placeholder="如 8" style="width:90px"></label>
        <span class="sub" style="align-self:center">%</span>
        <label>制度项<select id="pvCode" style="width:220px">
          <option value="">（不改制度项）</option>
          ${polList.map(x => `<option value="${esc(x.code)}" data-t="${esc(x.value_type)}">
            ${esc(x.code)} · ${esc(x.name)}</option>`).join('')}
        </select></label>
        <label>改为<input id="pvVal" placeholder="on / 数值" style="width:110px"></label>
        <button id="pvGo">预演</button>
      </div>
      <div id="pvBox" class="sub" style="margin-top:10px">
        填一项再点「预演」。什么都不填也能点 —— 那是"按现在配置算一遍"，用来确认基线。
      </div>
    </div>`;

  // ---- 工资表会签（139）----
  // 这一块只回答一个问题：这张表现在能不能封账，如果不能，卡在谁那里。
  const SG_CN = { pending: '待签', approved: '已签', objected: '有异议', void: '已作废' };
  const sgTag = (st) => st === 'approved' ? '<span class="tag ok">已签</span>'
    : st === 'objected' ? '<span class="tag bad">有异议</span>'
    : st === 'void' ? '<span class="tag">已作废</span>'
    : '<span class="tag warn">待签</span>';
  const sgHtml = !run ? '' : `<div class="card">
      <h2>工资表会签与封账 <span class="sub" style="font-weight:400">
        ${sg && sg.rows.length
          ? `待签 ${sg.pending} · 异议 ${sg.objected} · ${sg.canSeal ? '可以封账' : '还不能封账'}`
          : '还没发起会签'}</span></h2>
      <p class="note">
        算完薪到封账之间，这张表要出去三趟：出纳核金额、财务核个税与社保、业务负责人核奖金。
        <b>会签不是审批流</b> —— 它只回答"谁看过、谁提了异议、什么时候定稿"。
        <br>有异议就<b>不能封账</b>（异议是要改数的信号，不是走过场的签字）；改完重新发起，已签的保留。
        ${sg && sg.rows.length && sg.rows[0].is_required === false
          ? '<br><span class="sub">当前制度「封账前必须会签」是 <b>off</b>：不签也能封账。要强内控可在薪酬政策里打开。</span>'

      </p>
      ${sg && sg.rows.length ? `
      <!-- ★ stack2：6 列在 375px 下第 5、6 列（意见 + **签字按钮**）不可见。

      <table class="stack2"><thead><tr>
        <th style="width:210px">角色</th><th style="width:130px">签字人</th>

        <th>意见</th><th style="width:160px"></th>
      </tr></thead><tbody>
        ${sg.rows.map(r => `<tr>
          <td><b>${esc(r.role_name)}</b></td>
          <td data-label="签字人">${esc(r.assignee_name)}</td>
          <td data-label="状态">${sgTag(r.status)}</td>
          <td class="sub" data-label="签于">${r.decided_at
            ? esc(String(r.decided_at).replace('T',' ').slice(0,16)) : '—'}</td>
          <td class="sub" data-label="意见">${esc(r.note || '')}</td>
          <td>${r.status === 'pending' ? `
            <button data-sgid="${r.id}" data-sgnote="0">签字</button>
            <button class="ghost" data-sgid="${r.id}" data-sgnote="1">提异议</button>` : ''}</td>
        </tr>`).join('')}
      </tbody></table>` : `
      <div class="form" style="margin:2px 0 0">
        ${(sg ? sg.roles : []).map((r, i) => `<label>${esc(r.name)}
          <select data-sgrole="${esc(r.code)}" style="width:180px">
            ${(sg ? sg.accounts : []).map(a => `<option value="${a.id}"
              ${Number(r.default_user_id) === Number(a.id) ? 'selected' : ''}>
              ${esc(a.display_name)}</option>`).join('')}
          </select></label>`).join('')}
        <button id="sgStart">发起会签</button>
        <span class="sub" style="align-self:center">三个人都要指定 —— 会签不能"谁都可以签"，那样等于没人负责</span>
      </div>`}
      ${sg && sg.chain && (sg.chain.upstream_draft || sg.chain.stale_count > 0) ? `
        <div class="kv" id="chainMsg" style="margin:8px 0 0;padding:8px 10px;
             border-left:3px solid var(--warn,#b45309);background:rgba(180,83,9,.06)">
          ${sg.chain.upstream_draft ? `<span><b>前期还没封账：${esc(sg.chain.upstream_draft)}</b>
            —— 累计预扣是"累计到本期"，前期没定稿就封本期，本期的累计会永久少一块。
            先把前期封了再回来。</span>` : ''}
          ${sg.chain.stale_count > 0 ? `<span><b>本期累计已过期：${sg.chain.stale_count} 人</b>
            <span class="sub">（${esc(sg.chain.stale_names || '')}）</span>
            —— 前期算过之后又改过数，建议先重算本期再封账；
            封下去定格的是一份过时的累计。</span>` : ''}
        </div>` : ''}
      <div class="form" style="margin-top:10px">
        <button id="sgSeal" ${sg && (sg.canSeal || sg.canSealConfirm) ? '' : 'disabled'}
          title="${sg && sg.canSeal ? '' : (sg && sg.chain && sg.chain.reason ? esc(sg.chain.reason) : '会签没完成（或有异议）时不能封账')}">
          ${run.status === 'draft' ? '封账' : '已封账'}</button>
        ${sg && sg.rows.length ? '<button class="ghost" id="sgRestart">重新发起会签</button>' : ''}
        <span class="sub" style="align-self:center">
          封账之后工资条不可改（更正走调整单），会签记录留在这张表上。
        </span>
      </div>
    </div>`;

  // ---- 发放回单（140）----
  // 封账说"这批数定了"，发放说"钱到账上了"。两件事分开记，因为中间可能隔几天、
  // 也可能退票重发 —— 合成一个状态，就再也答不出"到底发了没有"。
  const M_CN = { bank: '银行代发', cash: '现金', manual: '手工' };
  const money2 = (n) => Number(n || 0).toLocaleString('zh-CN',
    { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const payHtml = !run ? '' : `<div class="card">
      <h2>发放回单 <span class="sub" style="font-weight:400">
        ${run.status === 'paid'
          ? `已发放 ${String(run.paid_at || '').replace('T', ' ').slice(0, 16)}`
          : (run.status === 'sealed' ? '已封账 · 待登记发放'
             : '还没封账，先封账再登记发放')}</span></h2>
      <p class="note">
        封账只说明"这批数定了"，不代表钱已经到员工账上。登记发放要把
        <b>时间、方式、银行流水号</b> 记下来 —— 出错时这是唯一能对回原始凭证的锚点。
        <br><b>回单总额与工资表实发合计不一致会直接拒</b>：发错总额是发薪里最贵的错，
        差的钱会落到某个人头上，而没人会主动说自己多收了。
        <br><span class="sub">系统里<b>不存员工银行账号</b>：账号留在网银与代发系统，
        这里只导出"工号/姓名/部门/实发"给财务逐笔核对。</span>
      </p>
      <div class="tier-grid kpi4" style="margin:0 0 10px">
        <div class="tier"><div class="k">发放人数</div>
          <div class="v">${pl ? pl.count : 0}<span>人</span></div></div>
        <div class="tier"><div class="k">实发合计</div>
          <div class="v" style="font-size:17px">${money2(pl ? pl.total : 0)}</div>
          <div class="k">登记时与回单核对</div></div>
        <div class="tier"><div class="k">发放方式</div>
          <div class="v" style="font-size:15px">${run.status === 'paid'
            ? esc(M_CN[run.pay_method] || run.pay_method || '—') : '—'}</div></div>
        <div class="tier"><div class="k">流水号</div>
          <div class="v" style="font-size:14px">${esc(run.pay_ref || '—')}</div>
          <div class="k">${run.status === 'paid' ? '对账锚点' : '登记后写入'}</div></div>
      </div>
      <div class="form">
        <button class="ghost" id="plExport">导出实发清单 CSV</button>
        <label>门店<select id="plOrg" style="width:150px">
          <option value="">全部门店</option></select></label>
        <label>每页<select id="plPer" style="width:100px">
          <option value="1">1 人</option><option value="2">2 人</option></select></label>
        <button class="ghost" id="plPrint">打印工资单</button>
        <button class="ghost" id="plPack">一次出全套（按门店打包）</button>
        ${run.status === 'sealed' ? `
          <label>方式<select id="plMethod" style="width:130px">
            <option value="bank">银行代发</option>
            <option value="cash">现金</option>
            <option value="manual">手工</option>
          </select></label>
          <label>流水号<input id="plRef" placeholder="代发批次/回单号" style="width:200px"></label>
          <label>回单总额<input id="plTotal" value="${pl ? Number(pl.total).toFixed(2) : ''}" style="width:140px"></label>
          <button id="plPay">登记发放</button>` : ''}
        ${run.status === 'draft' ? '<span class="sub" style="align-self:center">先在上面完成会签与封账</span>' : ''}
      </div>
    </div>`;

  $('#view').innerHTML = `
    <div class="card">
      <h2>${esc(P)} 算薪
        <span style="flex:1"></span>
        <label class="sub" style="font-weight:400">发薪主体
          <select id="payEntity" style="width:190px">
            ${ENTS.length ? ENTS.map(e => `<option value="${e.id}" ${e.id === CUR_ENTITY ? 'selected' : ''}>
                ${esc(e.name)}${e.is_active === false ? '（停用）' : ''}</option>`).join('')
              : '<option value="1">法人 #1</option>'}
          </select></label>
        <label class="sub" style="font-weight:400;margin-left:10px">期间
          <select id="payPeriod" style="width:130px">
            ${(RUNS.length ? RUNS : [{ period: P, status: 'none' }]).map(x =>
              `<option value="${esc(x.period)}" ${x.period === P ? 'selected' : ''}>
                ${esc(x.period)}${x.status === 'none' ? '' : ' · ' + esc(x.status)}${x.entity_name ? ' · ' + esc(x.entity_name) : ''}</option>`).join('')}
          </select></label>
      </h2>
      <p class="note">门禁在库里：本期有考勤的门店未全部封账，算薪直接被数据库拒绝。
        <b>发薪主体（法人）</b>决定这批薪算给哪家公司 —— 一个期间每个法人各一个批次，
        所以"期间 + 法人"才是唯一的那一批。</p>
      <div class="kv" style="margin:0 0 12px">
        <span>法人 <b>${esc((ENTS.find(e => e.id === CUR_ENTITY) || {}).name || `#${CUR_ENTITY}`)}</b></span>
        <span>未封账门店 <b>${blocked}</b></span>
        <span>批次 <b>${run ? '#' + run.id + ' · ' + esc(run.status) : '尚未发起'}</b></span>
      </div>
      <button id="btnRun" ${blocked > 0 || (run && run.status !== 'draft') ? 'disabled' : ''}>
        ${run && run.status !== 'draft' ? '已封账（重算需先重开）'
          : (blocked > 0 ? '先封账才能算薪' : (run ? '重算' : '算一次薪'))}
      </button>
      ${run ? `<button id="btnExport" style="margin-left:8px">导出 CSV</button>
        <span class="sub">导出走同一个接口函数，掩码与页面一致</span>` : ''}
      <div id="runMsg" class="kv"></div>
    </div>
    ${run ? `<div class="card"><h2>工资条</h2>
      <p class="note">净值与社保分别求字段权限——同一张单上，一个字段可见不等于另一个也可见。</p>
      ${slipsHtml}${consistHtml}</div>` : ''}

    ${sgHtml}
    ${payHtml}
    ${pvCard}`;

  const exp = $('#btnExport');
  if (exp) exp.onclick = () => downloadCsv(`/api/payslip/export.csv?run=${run.id}`, `payslip_run${run.id}.csv`);

  // ---- 发放回单 ----
  const plExp = $('#plExport');
  if (plExp) plExp.onclick = () => downloadCsv(`/api/payroll/paylist.csv?run=${run.id}`,
    `paylist_run${run.id}.csv`);

  // ---- 打印工资单：按门店分组、一人一单、带签收栏与盖章位 ----
  // ★ 门店下拉用**服务端分好组的结果**填，不由前端从 paylist 里
  //   groupBy —— 那等于先把全公司的人发到浏览器再筛，和"把全公司模板发给店长"
  //   没有区别，只是把泄露点从文件挪到了响应里。
  const plOrg = $('#plOrg');
  if (plOrg) {
    call(`/api/payroll/print?run=${run.id}`).then((r) => {
      if (r.status !== 200) return;
      const gs = r.body.groups || [];
      plOrg.innerHTML = `<option value="">全部门店（${gs.length} 个 / ${
        (r.body.totals || {}).people || 0} 人）</option>`
        + gs.map((g) => `<option value="${g.org_id ?? ''}">${esc(g.org_name)}（${
          g.people.length} 人）</option>`).join('');
    });
  }

  const plPrint = $('#plPrint');
  if (plPrint) plPrint.onclick = async () => {
    plPrint.disabled = true;
    try {
      const org = $('#plOrg') ? $('#plOrg').value : '';
      const per = $('#plPer') ? $('#plPer').value : '1';
      // company：本仓还没有法人主档，打印件上的公司名只能由调用方给；
      // 空着就落成"法人 #N"，一眼能看出还没配 —— 而不是悄悄印一个错主体。
      const company = (ME && (ME.ledger || ME.org)) || '';
      const qs = new URLSearchParams({ run: String(run.id), per });
      if (org) qs.set('org', org);
      if (company) qs.set('company', company);
      const r = await fetch(`/api/payroll/print.html?${qs}`, {
        headers: token ? { authorization: `Bearer ${token}`, 'x-aihr-token': token } : {},
      });
      if (!r.ok) {
        let b = {}; try { b = await r.json(); } catch {}
        toast('bad', `<b>${esc(b.error || r.status)}</b>${b.message ? `<br>${esc(b.message)}` : ''}`);
        return;
      }
      // 服务端渲染的 HTML → blob → 新窗口。存下来的就是一张能打印的凭证，
      // 不依赖 JS 与接口还活着（财务归档、劳动仲裁举证都要它）。
      const url = URL.createObjectURL(await r.blob());
      const w = window.open(url, '_blank');
      if (!w) toast('bad', '浏览器拦了新窗口，允许后重试');
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      toast('ok', `已生成工资单：${org ? '按门店' : '全部门店'} · 每页 ${per} 人`);
    } finally {
      plPrint.disabled = false;
    }
  };

  const plPack = $('#plPack');
  if (plPack) plPack.onclick = async () => {
    // 一次出全套：这一期的**所有门店**各一份工资单，打成一个 zip。
    // ★ 参数是 period 不是 run：财务要的是"这一期的全套"，一期可能有多个法人批次；
    //   哪些批次归我，由服务端判（行闸+掩码都在 sheet() 里，前端不参与筛选）。
    plPack.disabled = true;
    try {
      const per = $('#plPer') ? $('#plPer').value : '1';
      const r = await fetch(`/api/payroll/payslip-pack?period=${encodeURIComponent(P)}&per=${per}`, {
        headers: token ? { authorization: `Bearer ${token}`, 'x-aihr-token': token } : {},
      });
      if (!r.ok) {
        let b = {}; try { b = await r.json(); } catch {}
        toast('bad', `<b>${esc(b.error || r.status)}</b>${b.message ? `<br>${esc(b.message)}` : ''}`);
        return;
      }
      // 包里几张单、几个人由响应头带回来，不用把 zip 解开才知道
      const files = r.headers.get('x-pack-files') || '?';
      const ppl = r.headers.get('x-pack-people') || '?';
      const url = URL.createObjectURL(await r.blob());
      const a = document.createElement('a');
      a.href = url;
      a.download = `工资单_${P}.zip`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      toast('ok', `已打包 <b>${files}</b> 个门店 / <b>${ppl}</b> 人：一个门店一个文件，直接分发`);
    } finally {
      plPack.disabled = false;
    }
  };

  const plPay = $('#plPay');
  if (plPay) plPay.onclick = async () => {
    const qs = new URLSearchParams({
      run: run.id,
      method: $('#plMethod').value,
      ref: $('#plRef').value.trim(),
      total: $('#plTotal').value.trim(),
    });
    if (!confirm('确认登记发放？登记后状态变为"已发放"，不能再改。')) return;
    const w = await call('/api/payroll/pay?' + qs.toString(), { method: 'POST' });
    if (w.status !== 200) {
      return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
    }
    toast('ok', `已登记发放：<b>${esc(M_CN[w.body.method] || w.body.method)}</b>
      ${w.body.ref ? '流水号 ' + esc(w.body.ref) : ''}`);
    load();
  };

  // ---- 会签：发起 / 签字 / 异议 / 封账 ----
  const sgStart = $('#sgStart');
  if (sgStart) sgStart.onclick = async () => {
    const qs = new URLSearchParams({ run: run.id });
    document.querySelectorAll('[data-sgrole]').forEach(sel => {
      qs.append('user', `${sel.dataset.sgrole}:${sel.value}`);
    });
    const w = await call('/api/payroll/signoff/start?' + qs.toString(), { method: 'POST' });
    if (w.status !== 200) {
      return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
    }
    toast('ok', `已发起会签：<b>${w.body.created}</b> 个角色待签`);
    load();
  };

  const sgRestart = $('#sgRestart');
  if (sgRestart) sgRestart.onclick = async () => {
    if (!confirm('重新发起会签？未签的行会作废（留痕），已签的保留。')) return;
    const qs = new URLSearchParams({ run: run.id });
    (sg ? sg.roles : []).forEach(r => {
      const hit = (sg.rows || []).find(x => x.role_code === r.code);
      qs.append('user', `${r.code}:${hit ? hit.assignee : (r.default_user_id || '')}`);
    });
    const w = await call('/api/payroll/signoff/start?' + qs.toString(), { method: 'POST' });
    if (w.status !== 200) {
      return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
    }
    toast('ok', `已重新发起：${w.body.created} 个角色待签`);
    load();
  };

  document.querySelectorAll('[data-sgid]').forEach(b => {
    b.onclick = async () => {
      const id = b.dataset.sgid;
      const isObject = b.dataset.sgnote === '1';
      let note = '';
      if (isObject) {
        const row = (sg.rows || []).find(x => String(x.id) === String(id));
        const v = prompt(`「${row ? row.role_name : '这一行'}」的异议（至少 4 个字，会写在这张表上）`, '');
        if (v === null) return;
        note = v.trim();
      }
      const qs = new URLSearchParams({ id, ok: isObject ? '0' : '1' });
      if (note) qs.set('note', note);
      const w = await call('/api/payroll/signoff/decide?' + qs.toString(), { method: 'POST' });
      if (w.status !== 200) {
        return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
      }
      toast('ok', isObject ? '已提异议：这张表在有异议期间不能封账' : '已签字');
      load();
    };
  });

  const pp = $('#payPeriod');
  if (pp) pp.onchange = (e) => { PAY_PERIOD = e.target.value; load(); };
  // 发薪主体切换：换人就要重取批次与门禁（法人不同，封账状态不同）。
  // ★ 同时清掉 PAY_PERIOD —— 否则"回到上个法人"时会落在上一个法人的期间上，
  //   页面上会出现"期间是 8 月、但批次是空的"这种半截状态。
  const pe = $('#payEntity');
  if (pe) pe.onchange = (e) => { CUR_ENTITY = Number(e.target.value); PAY_PERIOD = null; load(); };

  const sgSeal = $('#sgSeal');
  if (sgSeal && !sgSeal.disabled) sgSeal.onclick = async () => {
    if (!confirm('确认封账？封账之后工资条不可改（更正走调整单）。')) return;
    // 累计对不上前期时，库里默认拒。这里让人再确认一次 —— 把"知道它对不上、
    // 仍然定格"变成一个有签字人的动作，而不是一个被绕过的门禁。
    let qs = `run=${run.id}`;
    if (sg && sg.chain && sg.chain.stale_count > 0) {
      const ok = confirm(`本期有 ${sg.chain.stale_count} 人的累计与前期数据对不上\n`
        + `（${sg.chain.stale_names || ''}）\n\n`
        + '通常是前期算过之后又改过数 —— 建议先重算本期。\n'
        + '确认"按现状封账"？这会定格一份与前期对不上的累计。');
      if (!ok) return toast('bad', '已取消 —— 建议先点「重算」再封账');
      qs += '&accept=1';
    }
    const w = await call(`/api/payroll/seal?${qs}`, { method: 'POST' });
    if (w.status !== 200) {
      return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
    }
    toast('ok', `已封账（${esc(w.body.sealed_by)}）`);
    load();
  };

  // ---- 预演按钮 ----
  const pvGo = $('#pvGo');
  if (pvGo) pvGo.onclick = async () => {
    const period = $('#pvPeriod').value;
    if (!period) return toast('bad', '<b>E_ARG</b> 先选期间');
    const body = {};
    const pct = $('#pvPct').value.trim();
    const add = $('#pvAdd').value.trim();
    const si = $('#pvSi').value.trim();
    const code = $('#pvCode').value;
    const val = $('#pvVal').value.trim();
    if (pct) body.salary_pct = Number(pct);
    if (add) body.salary_add = Number(add);
    if (si) body.si_base_pct = Number(si);
    if (code) {
      if (!val) return toast('bad', '<b>E_ARG</b> 选了制度项就要填改成什么');
      body.policy = { [code]: val };
    }

    const box = $('#pvBox');
    box.innerHTML = '<span class="sub">算着…（真要跑两遍算薪，稍等）</span>';

  const btn = $('#btnRun');
  if (btn && !btn.disabled) btn.onclick = async () => {
    btn.disabled = true;
    const r = await call(`/api/payroll/run?period=${P}&entity=${CUR_ENTITY}`, { method: 'POST' });

// ============================================================================
// 培训学习
// ----------------------------------------------------------------------------
// 这个页面**没有数据**，而且我不打算编一套假数据填进去 ——
// 菜单里有一个点进去是空的页面，比没有这个菜单更糟：人会以为"功能坏了"。
//
// 所以这里只做一件事：说清"要做的话得先有哪几样东西"，以及为什么现在没做。
// 真实场景里，培训不是"看视频记学时"，而是挂在合规上的：
// 新员工入职培训、特种作业持证、食品安全管理员年度学时、店长的带训记录 ——
// 这些都要求"谁、什么时候、学了什么、谁签的字"，与现有的人事档案是同一套主体。
// ============================================================================
// ============================================================================
// 培训学习（144）：学时是到场记录，不是填报数字
// ----------------------------------------------------------------------------
// 这一屏原来写的是"还没做 —— 这里不放编造的数据"。现在它做完了，但那条原则没变：
// 页面上每个数都来自一条真实的记录（课程 → 场次 → 到场 → 结业），
// 没有"预计学时""计划参训"这种看起来饱满、事后无法自证的指标。
//
// 三件事在页面上必须一眼看出来：
//   ① **结业是算出来的**：到场学时 < 课程标准学时 → 不结业，并显示"还差几学时"；
//   ② **法定学时缺口**：制度项 TRAINING_MIN_HOURS_YEAR 没开（0）时这块不出现 ——
//      一个"人人都差 0 学时"的清单只会让人不再看它；
//   ③ **证书到期**：valid_months 只记长度，页面按"最后一次结业 + 有效期"算到期。
// ============================================================================

          ${(E.papers || []).map(pp => `<tr>
            <td><b>${esc(pp.name)}</b>
              <div class="sub"><code>${esc(pp.code)}</code>
                ${pp.is_active ? '' : ' · <span class="tag">停用</span>'}</div></td>
            <td class="hide-sm sub" data-label="课程">${esc(pp.course_name || '')}</td>
            <td class="sub" data-label="卷面">${pp.questions} 题 · ${money(pp.total_score)} 分
              <div class="sub">及格 ${money(pp.pass_score)}</div></td>
            <td class="num" data-label="限时">${pp.duration_min
              ? `${pp.duration_min} 分` : '<span class="sub">不限</span>'}</td>
            <td class="num" data-label="可考">${pp.max_attempts
              ? `${pp.max_attempts} 次` : '<span class="sub">不限</span>'}</td>
            <td class="num" data-label="作答">${pp.attempts}
              ${Number(pp.open_attempts) > 0
                ? `<div class="sub">${pp.open_attempts} 份未交</div>` : ''}
              ${Number(pp.late_count) > 0
                ? `<div class="sub" style="color:var(--warn,#a15c00)">${pp.late_count} 次超时</div>` : ''}</td>
            <td class="num" data-label="通过率">${pp.attempts
              ? `<b>${pp.pass_rate}%</b>` : '<span class="sub">—</span>'}</td>
            <td data-label=""><button class="ghost" data-expaper="${pp.id}"
              data-expass="${pp.pass_score}">开考</button></td>
          </tr>`).join('') || `<tr><td colspan="8" class="sub">
            还没有试卷。先在课程下组一张卷 —— 培训只记学时、没有考试，
            "学完了"就只是"人到了"。</td></tr>`}
        </tbody></table>
        <div id="exArea"></div>`;
      document.querySelector('#view').appendChild(card);

      document.querySelectorAll('[data-expaper]').forEach(btn => {
        btn.onclick = async () => {
          const pid = btn.dataset.expaper;
          const who = prompt('给谁开考？填 person id（员工档案里的 id）', '1');
          if (!who) return;

          // ★ 先查台账再发卷（156）：让人答完一整张 100 分的卷才被告知
          //   "你已经没机会了"，比一开始就不让他考更糟。
          const lg = await call(`/api/exam/ledger?paper=${pid}&employee=${encodeURIComponent(who)}`);
          if (lg.status !== 200) {
            return toast('bad', `<b>${esc(lg.body.error || lg.status)}</b> ${esc(lg.body.message || '')}`);
          }
          const L = lg.body;
          if (L.left_attempts !== null && L.left_attempts <= 0) {
            return toast('bad',
              `<b>次数已用完</b> 《${esc(L.paper_name)}》只能考 ${L.max_attempts} 次，`
              + `已考 ${L.used} 次，最高 ${money(L.best_score)} 分`
              + `${L.passed ? '（已通过）' : ''}。要再考得先改卷子的次数上限并写原因 ——`
              + '这条线是要报出去的，不能在页面上点一下就过。');
          }
          if (L.used > 0 && !L.passed) {
            const ok = confirm(`《${L.paper_name}》已考 ${L.used} 次，最高 ${money(L.best_score)} 分（未通过）。\n`
              + `${L.left_attempts === null ? '不限次数' : `还剩 ${L.left_attempts} 次机会`}。现在开考？`);
            if (!ok) return;
          }

          const st = await call(`/api/exam/start?paper=${pid}&employee=${encodeURIComponent(who)}`,
            { method: 'POST' });
          if (st.status !== 200) {
            return toast('bad', `<b>${esc(st.body.error || st.status)}</b> ${esc(st.body.message || '')}`);
          }
          const pq = await call(`/api/exam/paper?paper=${pid}`);
          if (pq.status !== 200) return toast('bad', '取卷失败');
          const P = pq.body;
          const area = document.querySelector('#exArea');
          const leftTxt = st.body.max_attempts === null
            ? `第 ${st.body.attempt_no} 次（这张卷不限次数）`
            : `第 ${st.body.attempt_no} 次 / 共 ${st.body.max_attempts} 次`;
          area.innerHTML = `
            <h2 style="margin-top:14px">${esc(P.name)}
              <span class="sub" style="font-weight:400">
                共 ${P.questions.length} 题 · 总分 ${money(P.total_score)} · 及格 ${money(P.pass_score)}</span></h2>
            <p class="note" style="margin:6px 0 0">
              ${P.duration_min ? `限时 <b>${P.duration_min} 分钟</b>（截止时刻由库端算，见下方倒计时）` : '不限时'}
              · ${leftTxt}${st.body.best_score !== null
                ? ` · 之前最高 ${money(st.body.best_score)} 分` : ''}
              · 超时不会被作废，但会记下超了多久。
            </p>
            <div id="exClock" class="sub" style="margin:4px 0 0"></div>
            <div id="exForm">${(P.questions || []).map((q, i) => `
              <div style="padding:10px 0;border-bottom:1px solid var(--line)">
                <div style="font-weight:600;margin-bottom:6px">
                  ${i + 1}. ${esc(q.stem)}
                  <span class="sub">（${q.kind === 'multi' ? '多选' : (q.kind === 'judge' ? '判断' : '单选')}
                    · ${money(q.score)} 分）</span></div>
                ${(q.options || []).map(o => `
                  <label style="display:inline-flex;align-items:center;gap:6px;margin-right:16px;font-weight:400">
                    <input type="${q.kind === 'multi' ? 'checkbox' : 'radio'}"
                      name="q${q.id}" value="${esc(o.k)}"> ${esc(o.k)}. ${esc(o.t)}
                  </label>`).join('')}
              </div>`).join('')}</div>
            <div class="form" style="margin-top:10px">
              <button id="exSubmit">交卷</button>
              <span class="sub" style="align-self:center">
                交卷后不能改（要重考就再开一次）</span>
            </div>`;

          // 倒计时：只是显示。真正的截止时刻在库里（exam_attempt.deadline_at），
          // 到点了也**不会自动交卷** —— 判分照常，只把 late_seconds 记下来。
          let clockTimer = null;
          if (st.body.deadline_at) {
            const end = new Date(st.body.deadline_at).getTime();
            const tick = () => {
              const el = document.querySelector('#exClock');
              if (!el) return clearInterval(clockTimer);
              const left = Math.round((end - Date.now()) / 1000);
              if (left >= 0) {
                el.innerHTML = `剩余 <b>${String(Math.floor(left / 60)).padStart(2, '0')}:`
                  + `${String(left % 60).padStart(2, '0')}</b>`;
                el.style.color = left <= 60 ? 'var(--bad,#b4261d)' : '';
              } else {
                el.innerHTML = `已超时 <b>${Math.floor(-left / 60)}</b> 分钟 —— `
                  + '<b>仍可交卷</b>，会记下超时时长（不作废）';
                el.style.color = 'var(--warn,#a15c00)';
              }
            };
            tick();
            clockTimer = setInterval(tick, 1000);
          } else {
            document.querySelector('#exClock').textContent = '这张卷不限时。';
          }

          document.querySelector('#exSubmit').onclick = async () => {
            if (clockTimer) clearInterval(clockTimer);
            const answers = (P.questions || []).map(q => {
              const els = [...document.querySelectorAll(`[name="q${q.id}"]`)]
                .filter(el => el.checked).map(el => el.value).sort();
              return els.length ? { q: q.id, picked: els.join(',') } : { q: q.id, picked: '' };
            });
            const r2 = await call(`/api/exam/submit?attempt=${st.body.attempt_id}`
              + `&answers=${encodeURIComponent(JSON.stringify(answers))}`, { method: 'POST' });
            if (r2.status !== 200) {
              return toast('bad', `<b>${esc(r2.body.error || r2.status)}</b> ${esc(r2.body.message || '')}`);
            }
            const R = r2.body;
            const lateMin = R.late_seconds > 0 ? Math.ceil(R.late_seconds / 60) : 0;
            area.innerHTML = `<div class="tier-grid kpi3" style="margin:12px 0 0">
              <div class="tier"><div class="k">得分</div>
                <div class="v" style="font-size:20px">${money(R.score)}<span>/${money(R.total_score)}</span></div>
                <div class="k">${R.right_count} / ${R.question_count} 题正确</div></div>
              <div class="tier"><div class="k">结果</div>
                <div class="v" style="font-size:17px;color:${R.passed ? 'var(--ok,#137333)' : 'var(--bad,#b4261d)'}">
                  ${R.passed ? '及格' : '不及格'}</div>
                <div class="k">及格线 ${money(P.pass_score)}</div></div>
              <div class="tier"><div class="k">${lateMin > 0 ? '超时交卷' : '下一步'}</div>
                <div class="v" style="font-size:${lateMin > 0 ? '15px' : '13px'};
                  color:${lateMin > 0 ? 'var(--warn,#a15c00)' : 'inherit'}">
                  ${lateMin > 0 ? `超 ${lateMin} 分钟` : (R.passed ? '可结业' : '需补考')}</div>
                <div class="k">${lateMin > 0
                  ? '已记下，仍按这个分数算 —— 算不算由人定'
                  : (R.passed ? '学时够 + 考过 = 结业' : '再开一次重考')}</div></div>
            </div>`;
            toast(R.passed ? 'ok' : 'bad',
              (R.passed ? `及格：<b>${R.score}</b> 分` : `不及格：<b>${R.score}</b> 分，需补考`)
              + (lateMin > 0 ? `（超时 ${lateMin} 分钟，已记录）` : ''));
            load();
          };
        };
      });
    }
  }

  const yIn = $('#trYear');
  if (yIn) yIn.onchange = (e) => { TR_YEAR = e.target.value; load(); };

  const ac = $('#trAddCourse');
  if (ac) ac.onclick = async () => {
    const qs = new URLSearchParams({
      code: $('#trCode').value.trim(), name: $('#trName').value.trim(),
      category: $('#trCat').value, hours: $('#trHours').value,
      statutory: $('#trStat').checked ? '1' : '0',
      valid_months: $('#trValid').value.trim(), note: '',
    });
    if (!qs.get('code') || !qs.get('name')) return toast('bad', '编码与名称都要填');
    const w = await call('/api/training/course?' + qs.toString(), { method: 'POST' });
    if (w.status !== 200) {
      return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
    }
    toast('ok', `已建课程 <b>${esc(w.body.code)}</b>`);
    load();
  };

  const as = $('#trAddSess');
  if (as) as.onclick = async () => {
    const qs = new URLSearchParams({
      course: $('#trSessCourse').value, entity: '1', date: $('#trDate').value,
      from: $('#trFrom').value, to: $('#trTo').value, hours: $('#trSHours').value,
      capacity: $('#trCap').value.trim(), trainer: $('#trTrainer').value.trim(), place: '',
    });
    const w = await call('/api/training/session?' + qs.toString(), { method: 'POST' });
    if (w.status !== 200) {
      return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
    }
    toast('ok', '场次已开 —— 下一步是报名');
    load();
  };

  // 「记学时」：先把在场的人报进来，再按本场学时记一次到场
  document.querySelectorAll('[data-trsess]').forEach(btn => {
    btn.onclick = async () => {
      const sid = btn.dataset.trsess, h = btn.dataset.trhours;
      const who = prompt('给谁记学时？填 person id（多人用逗号分隔）。\n'
        + '已报名的会跳过，未报名的先报名再记。', '1');
      if (!who) return;
      const ids = who.split(/[,，\s]+/).filter(Boolean);
      const en = await call(`/api/training/enroll?session=${sid}&employee=${ids.join(',')}`,
        { method: 'POST' });
      if (en.status !== 200) {
        return toast('bad', `<b>${esc(en.body.error || en.status)}</b> ${esc(en.body.message || '')}`);
      }
      const hr = prompt(`本场学时 ${h}。这次记多少小时？（少于课程标准学时就不结业）`, h);
      if (hr === null) return;
      const res = [];
      for (const id of en.body.enrolled) {
        const w = await call(`/api/training/attend?enroll=${id}&hours=${encodeURIComponent(hr)}`,
          { method: 'POST' });
        if (w.status !== 200) {
          return toast('bad', `<b>${esc(w.body.error || w.status)}</b> ${esc(w.body.message || '')}`);
        }
        res.push(w.body);
      }
      const done = res.filter(x => x.status === 'completed');
      const miss = res.filter(x => x.status !== 'completed');
      toast(miss.length ? 'bad' : 'ok',
        miss.length
          ? `<b>${miss.length} 人未结业</b> —— 还差 ${miss[0].missing_hours} 学时（标准 ${miss[0].std_hours}h）`
          : `已结业 <b>${done.length}</b> 人`);
      load();
    };
  });
}

async function viewHealth() {
  const r = await call('/api/health');
  if (r.status !== 200) return fail(r);
  const { summary, rows, requests, failures } = r.body;
  const total = summary.reduce((a, x) => a + Number(x.n), 0);
  const never = Number(summary.find(x => x.bucket === 'never_run')?.n || 0);

  $('#view').innerHTML = `
    <div class="card">
      <h2>判据覆盖率 · as_of ${esc(r.body.as_of)}</h2>
      <p class="note">四桶分开报，不给单一百分比——"1 条从没跑过"与"1 条真的失败"处置完全相反。</p>
      <div class="kv" style="margin:0 0 14px">
        ${summary.map(x => `<span>${esc(BUCKET_CN[x.bucket] || x.bucket)}
          <span class="tag ${BUCKET_CLS[x.bucket] || ''}">${x.n}</span></span>`).join('')}
        <span>合计 <b>${total}</b></span>
      </div>
      ${never > 0 ? `<div class="banner" style="margin:0 0 14px">
        有 <b>${never}</b> 组从未运行。<b>这不是"通过"</b>——本进程只读登记表，
        断言组是 CI 跑的：<code>npm test</code>。跑完刷新这一页会变。
      </div>` : ''}
      <table><thead><tr><th>判据组</th><th>域</th><th>类型</th><th>最近结论</th><th>上次运行</th></tr></thead>
        <tbody>${rows.map(x => `<tr>
          <td>${esc(x.check_code)}</td><td>${esc(x.domain)}</td><td>${esc(x.kind)}</td>
          <td><span class="tag ${BUCKET_CLS[x.bucket] || ''}">${esc(BUCKET_CN[x.bucket] || x.bucket)}</span></td>
          <td class="num">${x.last_run_at ? esc(String(x.last_run_at).replace('T',' ').slice(0,19)) : '—'}</td>
        </tr>`).join('')}</tbody></table>
    </div>

    <div class="card">
      <h2>请求留痕（最近 20 条）</h2>
      <p class="note">
        行级审计答不了<b>没有改到任何行的请求</b>——额度不够被拒、越权 403、重复审批被挡，
        这些在磁盘上什么都没变。而它们最容易藏着越权探测。
      </p>
      ${(requests || []).length === 0 ? '<div class="empty">暂无请求</div>'
        : `<table><thead><tr><th>时间</th><th>动作</th><th>结果</th><th>错误码</th></tr></thead>
           <tbody>${(requests || []).map(q => `<tr>
             <td class="num">${esc(String(q.at).replace('T',' ').slice(0,19))}</td>
             <td>${esc(q.action)}<div class="sub">actor #${esc(q.actor)}</div></td>
             <td>${q.ok ? '<span class="tag ok">成功</span>' : '<span class="tag bad">失败</span>'}</td>
             <td class="sub">${esc(q.error_code || '—')}</td>
           </tr>`).join('')}</tbody></table>`}
      <div class="kv">${(failures || []).length === 0
        ? '<span>近一小时无失败</span>'
        : (failures || []).map(f => `<span>${esc(f.action)} 失败 <b>${f.n}</b></span>`).join('')}</div>
    </div>`;
}

async function viewRoles() {
  const [r, ss, ac] = await Promise.all([
    call('/api/me/roles'),
    call('/api/me/sessions'),
    call('/api/acting'),

  $('#view').innerHTML = `
    <div class="card">
      <h2>这个身份的组织链</h2>
      <p class="note">组织授权沿这条链**向上**继承：授在祖先，后代获得；授在后代，祖先不获得。</p>
      ${org_chain.length === 0
        ? `<div class="empty">这个账号的可见范围来自<b>数据范围规则</b>（按组织子树配置），

      <p class="note">
        <b>代理由主管本人设定</b>，必须写起止时间（最长 90 天）。
        库里靠时间窗判断生效，<b>不靠定时任务</b> —— 定时任务没跑就会一直代理着，

      ${acting.as_agent.length ? `<h3 style="font-size:14px;margin:12px 0 6px">别人交给我的</h3>
        <table><thead><tr><th>主管</th><th>代理角色</th><th>起止</th><th>原因</th><th>状态</th><th></th></tr></thead>

          <td class="sub">${esc(String(x.valid_from).slice(0,10))} → ${esc(String(x.valid_to).slice(0,10))}</td>
          <td class="sub">${esc(x.reason)}</td>
          <td>${x.revoked_at ? '<span class="tag">已撤销</span>'
            : x.active ? '<span class="tag ok">生效中</span>' : '<span class="tag warn">未开始/已过期</span>'}</td>
          <td>${(!x.revoked_at && x.active) ? `<button data-rev="${x.id}">结束</button>` : ''}</td>
        </tr>`).join('')}</tbody></table>` : '<p class="sub">现在没有人把权限交给你。</p>'}

      ${acting.as_principal.length ? `<h3 style="font-size:14px;margin:16px 0 6px">我交给别人的</h3>
        <table><thead><tr><th>副手</th><th>代理角色</th><th>起止</th><th>原因</th><th>状态</th><th></th></tr></thead>
        <tbody>${acting.as_principal.map(x => `<tr>
          <td>${esc(x.agent_name)}</td><td>${esc(x.role_name)}</td>
          <td class="sub">${esc(String(x.valid_from).slice(0,10))} → ${esc(String(x.valid_to).slice(0,10))}</td>
          <td class="sub">${esc(x.reason)}</td>
          <td>${x.revoked_at ? '<span class="tag">已撤销</span>'
            : x.active ? '<span class="tag ok">生效中</span>' : '<span class="tag warn">未开始/已过期</span>'}</td>
          <td>${(!x.revoked_at && x.active) ? `<button data-rev="${x.id}">结束</button>` : ''}</td>
        </tr>`).join('')}</tbody></table>` : ''}

      <h3 style="font-size:14px;margin:16px 0 6px">设定一条代理</h3>
      <p class="sub">只有主管本人能设；副手自己点会得到 403（那是权限提升，不是顶班）。</p>
      <div class="kv">
        <input id="acAgent" placeholder="副手姓名，如 陈斌">
        <select id="acRole">
          <option value="store_mgr">店长</option>
          <option value="hr_ops">人事专员</option>
          <option value="payroll_spec">薪酬考勤专员</option>
          <option value="group_hr">集团人事负责人</option>
        </select>
        <input id="acDays" type="number" min="1" max="90" value="7" style="width:80px"> <span>天</span>
        <input id="acReason" placeholder="原因（至少 4 字，如：店长出差上海">
        <button id="acGrant">设定</button>
      </div>
    </div>

    <div class="card">
      <h2>有效权限 · 每条带来源</h2>
      <p class="note">审计要回答的不是"他有没有这个权限"，而是"他为什么有"。</p>
      ${roles.length === 0
        ? `<div class="empty">没有任何有效权限。</div>`
        : `<table><thead><tr><th>角色</th><th>数据范围</th><th>来源</th><th>经由</th></tr></thead>
           <tbody>${roles.map(x => `<tr>
             <td>${esc(x.role_name || ('角色 #' + x.role_id))}
               <span class="sub">${esc(x.role_code || '')}</span></td>
             <td>${esc(x.scope_name || ('范围 #' + x.data_scope_id))}</td>

    <div class="card">
      <h2>我的会话（${sessions.length} 台设备）</h2>
      <p class="note">
        会话存在库里，库只存 <code>sha256</code> 摘要 —— <b>明文不出现在数据库里</b>。
        过期是<b>比较出来的</b>（不是哪个定时任务翻的状态）；吊销是显式事实，
        带吊销人与原因。会话<b>不可延长、不可复活</b>，续期只能重新登录。
      </p>
      ${sessions.length === 0 ? '<div class="empty">没有活跃会话。</div>'
        : `<table><thead><tr><th>#</th><th>签发</th><th>到期</th><th>最后活跃</th><th></th></tr></thead>
           <tbody>${sessions.map(x => `<tr>
             <td class="num">${x.id}</td>
             <td class="num">${esc(String(x.issued_at).slice(0,19).replace('T',' '))}</td>
             <td class="num">${esc(String(x.expires_at).slice(0,19).replace('T',' '))}</td>
             <td class="num">${x.last_seen_at ? esc(String(x.last_seen_at).slice(11,19)) : '—'}</td>
             <td><button data-sess="${x.id}">退出这台</button></td>
           </tr>`).join('')}</tbody></table>`}
    </div>`;
  $('#view').querySelectorAll('button[data-sess]').forEach(b => {
    b.onclick = () => {
      b.disabled = true;
      post(`/api/me/sessions/revoke?id=${b.dataset.sess}&reason=用户主动退出这台设备`, '该会话已吊销', b);
    };
  });
  bindActing();
}


const FLOOR_CN = { group: '仅集团', region: '到区域', store: '到门店' };
// 枚举项的值是给机器读的（none / forfeit / single）。直接显示原文时，
// 业务看到的是"none"——那既不像中文，也不像"还没配"。所以只翻译**已知**取值，

const POLICY_VAL_CN = {
  none: '不处理', forfeit: '作废', payout: '折现',
  single: '单签', multi: '多步',
  cascaded: '逐级下分', cascade: '逐级下达', pool: '集团池',
  require_approval: '需审批', direct_reject: '直接拒绝',

};

async function viewPolicy() {
  const r = await call('/api/policy');
  if (r.status !== 200) return fail(r);
  const rows = r.body.rows || [];

  const TZ_LIST = [
    ['Asia/Shanghai', '中国标准时间（北京 UTC+8）'],
    ['Asia/Hong_Kong', '香港 UTC+8'],
    ['Asia/Singapore', '新加坡 UTC+8'],
    ['Asia/Tokyo', '东京 UTC+9'],
    ['UTC', '协调世界时 UTC+0'],
    ['Europe/London', '伦敦 UTC+0/+1'],
    ['America/New_York', '纽约 UTC-5/-4'],
  ];
  const curTz = (TZ_LIST.find(x => x[0] === TZ) || [TZ, TZ])[0];

  $('#view').innerHTML = `
    <div class="card">
      <h2>业务时区 <span class="sub" style="font-weight:400">系统按哪个时钟算"今天"</span></h2>
      <p class="note">
        它决定：<b>考勤属于哪一天</b>、<b>授权从哪天生效</b>、<b>算薪默认哪一期</b>。
        与服务器所在时区无关 —— 服务器在云上（常年 UTC），业务日仍按这里算。
        <b>改了不追溯</b>：历史单据仍按当时的时区归属。
      </p>
      <div class="kv">
        <span>当前：<b>${esc(TZ)}</b> · 今天 <b>${esc(TODAY)}</b></span>
      </div>
      <div class="kv" style="margin-top:8px">
        <select id="tzSel">${TZ_LIST.map(([v, n]) =>
          `<option value="${esc(v)}" ${v === curTz ? 'selected' : ''}>${esc(n)}</option>`).join('')}
        </select>
        <input id="tzReason" placeholder="改的原因（至少 4 字）" style="min-width:220px">
        <button id="tzSave">保存</button>
      </div>
      <p class="sub">一个集团跨两个时区时，用<b>多帐套</b>（一个帐套一个库）各自设时区，
        而不是让同一份数据里每行一个时区 —— 那样"今天"就没有唯一答案了。</p>
    </div>

    <div class="card">
      <h2>制度 · 以组织 #${r.body.org_id} 为视角</h2>
      <p class="note">
        集团给一个默认值；是否允许本单位改写，**由集团逐项声明**（不是所有项都能改）。
        制度只在写入时生效——已发过钱的月份不会因为改制度而变。
      </p>
      <table><thead><tr><th>制度项</th><th>集团值</th><th>本单位值</th><th>来源</th><th>可覆盖到</th></tr></thead>
        <tbody>${rows.map(x => {
          // ★ 按字符串比：枚举/文本项用 Number() 比会得到 NaN !== NaN → 永远标成"覆盖"。
          //   这类"看不出错"的显示问题，比接口报错更难发现。
          const own = String(x.value) !== String(x.group_value);
          return `<tr>
            <td>${esc(x.name)}<div class="sub">${esc(x.code)}</div></td>
            <td class="num">${x.group_value === null ? '—'
              : esc(POLICY_VAL_CN[String(x.group_value)] || x.group_value)}${x.unit ? ' ' + esc(x.unit) : ''}</td>
            <td class="num">${x.value === null ? '<span class="masked">无值</span>'
              : (own ? `<b>${esc(POLICY_VAL_CN[String(x.value)] || x.value)}</b>`
                     : esc(POLICY_VAL_CN[String(x.value)] || x.value))}${x.unit ? ' ' + esc(x.unit) : ''}</td>
            <td><span class="tag ${x.source === 'org' ? 'warn' : 'ok'}">${x.source === 'org' ? '本单位覆盖' : '集团统一'}</span></td>
            <td><span class="tag">${esc(FLOOR_CN[x.override_floor] || x.override_floor)}</span></td>
          </tr>`;
        }).join('')}</tbody></table>
      <div class="kv"><span>as_of <b>${esc(r.body.as_of)}</b></span>
        <span>本单位改写的项 <b>${rows.filter(x => x.source === 'org').length}</b></span></div>
    </div>`;
  bindTimezone();
}


// 时区保存：发布制度值 → 重取 /api/me（TODAY / TZ 跟着变）→ 重渲染
function bindTimezone() {
  const btn = $('#tzSave');
  if (!btn) return;
  btn.onclick = async () => {
    btn.disabled = true;
    const q = `code=BIZ_TIMEZONE&value=${encodeURIComponent($('#tzSel').value)}`
      + `&reason=${encodeURIComponent($('#tzReason').value)}`;
    const r = await call(`/api/policy/publish?${q}`, { method: 'POST' });
    btn.disabled = false;
    if (r.status !== 200) {
      return toast('bad', `<b>${esc(r.body.error)}</b> ${esc(r.body.message || '')}`);
    }
    TZ = r.body.tz; TODAY = r.body.today;
    toast('ok', `业务时区已改为 ${r.body.tz}`);
    viewPolicy();
  };
}

async function viewHeadcount() {
  const r = await call('/api/headcount?period=2026-06');
  if (r.status !== 200) return fail(r);
  const rows = r.body.rows || [];
  const depthOf = (id) => {
    let d = 0, cur = rows.find(x => x.id === id);
    while (cur && cur.parent_id != null) { d++; cur = rows.find(x => x.id === cur.parent_id); }
    return d;
  };

  $('#view').innerHTML = `
    <div class="card">
      <h2>编制 · ${esc(r.body.period)}（逐级下分）</h2>
      <p class="note">
        集团总编 → 区域 → 门店。<b>子项之和不得超过父项</b>；占编由归属派生，不落列。
        注意「可下分」与「可招」是两个数——混用会让门店以为还有十几个编可招。
      </p>
      <table><thead><tr>
        <th>组织</th><th>额度</th><th>已下分</th><th>可下分</th><th>占编</th><th>可招</th><th>状态</th>
      </tr></thead><tbody>${rows.map(x => {
        const over = x.quota !== null && Number(x.used) > Number(x.quota);
        const noq  = x.quota === null;
        return `<tr>
          <td style="padding-left:${8 + depthOf(x.id) * 18}px">${esc(x.name)}
            <span class="sub">#${x.id}</span></td>
          <td class="num">${x.quota === null ? '—' : esc(x.quota)}${carriedTag(x.quota_status, x.quota_carried_from, '编制')}</td>
          <td class="num">${esc(x.allocated)}</td>
          <td class="num">${x.quota === null ? '—' : esc(x.available)}</td>
          <td class="num">${esc(x.used)}</td>
          <td class="num">${x.quota === null ? '—' : (Number(x.hireable) < 0
              ? `<b style="color:var(--bad)">${esc(x.hireable)}</b>` : esc(x.hireable))}</td>
          <td>${over ? '<span class="tag bad">超编</span>'
               : noq ? '<span class="tag warn">未配编制</span>'
               : '<span class="tag ok">正常</span>'}</td>
        </tr>`;
      }).join('')}</tbody></table>
      <div class="kv">
        <span>超编组织 <b>${(r.body.over || []).length}</b></span>
        <span>未配编制的组织 <b>${(r.body.uncovered || []).length}</b>
          <span class="sub">（没额度就没有判据，占编再多也不会超编）</span></span>
      </div>
    </div>

    <div class="card">
      <h2>下达 / 调整编制</h2>
      <p class="note">
        下分是<b>分配</b>，不是复制：子项之和超过父项额度会被库里拒绝。
        调编<b>追加版本</b>而不就地改——就地改会让「上个月超编」的事实随额度调高一起消失。
      </p>
      <div class="form">
        <label>组织<select id="hcOrg">${rows.map(x =>
          `<option value="${x.id}">${'&nbsp;'.repeat(depthOf(x.id) * 3)}${esc(x.name)}</option>`).join('')}</select></label>
        <label>期间<input id="hcPeriod" value="${esc(r.body.period)}"></label>
        <label>额度<input id="hcQuota" type="number" min="0" value="3"></label>
        <label>依据<input id="hcReason" value="季度复核后调整" size="16"></label>
        <button id="hcSet">下达</button>
      </div>
    </div>`;

  $('#hcSet').onclick = () => {
    const q = new URLSearchParams({
      org: $('#hcOrg').value,
      period: $('#hcPeriod').value.trim(),
      quota: $('#hcQuota').value,
      reason: $('#hcReason').value.trim(),
    });
    $('#hcSet').disabled = true;
    post('/api/headcount/set?' + q, '编制已下达（新增一个版本）', $('#hcSet'));
  };
}


const BASIS_CN = { begin: '期初', end: '期末', avg_daily: '期内日均', na: '不适用' };

async function viewReport() {
  // ★ 原来写死 org = 30：库里组织只有 1–13，30 压根不存在，点开必 403
  //   「无权操作对象 30（维度 cost_org）」—— 全系统唯一一个"点开必报错"的页面。
  //   period 也写死 2026-03，而种子数据在 2026-06。改成集团根 + 有数的期间。
  const org = 1, period = '2026-06';
  const r = await call(`/api/report?org=${org}&period=${period}`);
  if (r.status !== 200) return fail(r);
  const { panel, crosscheck, has_data } = r.body;
  const bad = crosscheck.filter(x => !x.ok);
  const log = (await call('/api/report/export/log')).body || [];

  $('#view').innerHTML = `
    <div class="card">
      <h2>组织 #${r.body.org_id} · ${esc(r.body.period)}
        <button id="expRpt" style="float:right">导出 CSV</button></h2>
      <p class="note">
        一个指标只有一份实现；比率类必须给分母，时点类必须给基准——
        <b>三个基准都是合法答案，混用才是错的</b>。
      </p>
      ${has_data ? '' : `<p class="note" style="color:var(--bad)">
        <b>这一期没有数据。</b>下面那一排 0 <b>不是 0，是没有数据</b>——
        期间写错时报表函数不会报错，它会给出一份看得很过去的零。</p>`}
      <table><thead><tr><th>指标</th><th>值</th><th>单位</th><th>时点基准</th><th>口径已登记</th></tr></thead>
        <tbody>${panel.map(x => `<tr>
          <td>${esc(x.name)}<div class="sub">${esc(x.metric)}</div></td>
          <td class="num"><b>${esc(x.value)}</b></td>
          <td>${esc(x.unit)}</td>
          <td><span class="tag ${x.basis === 'na' ? '' : 'warn'}">${esc(BASIS_CN[x.basis] || x.basis)}</span></td>
          <td>${x.registered ? '<span class="tag ok">已登记</span>'
                             : '<span class="tag bad">未登记</span>'}</td>
        </tr>`).join('')}</tbody></table>
    </div>

    <div class="card">
      <h2>三路径交叉核对</h2>
      <p class="note">
        同一个总量，三条互不相同的算法：A 从根组织一次算 · B 叶子分别算再相加 · C 不过组织直接加明细。
        <b>三者必须相等</b>——差一条，就说明某条路径上漏了过滤条件，而那种漏只表现为"两个报表对不上"。
      </p>
      <table><thead><tr><th>指标</th><th>A 子树</th><th>B 分组</th><th>C 明细</th><th></th></tr></thead>
        <tbody>${crosscheck.map(x => `<tr>
          <td>${esc(x.metric)}</td>
          <td class="num">${esc(x.path_a)}</td>
          <td class="num">${esc(x.path_b)}</td>
          <td class="num">${esc(x.path_c)}</td>
          <td><span class="tag ${x.ok ? 'ok' : 'bad'}">${x.ok ? '一致' : '不一致'}</span></td>
        </tr>`).join('')}</tbody></table>
      <div class="kv"><span>不一致 <b>${bad.length}</b></span>
        <span class="sub">${bad.length ? '有路径漏了过滤条件' : '三条路径给出同一个数'}</span></div>
    </div>

    <div class="card">
      <h2>导出留痕</h2>
      <p class="note">
        导出的数<b>就是上面这一份</b>（同一个函数），并留下"谁、哪一期、多少行、内容摘要"。
        <b>被拒的导出不留痕</b>——审计表里混进尝试记录，这一列就不可信了。
      </p>
      <table><thead><tr><th>谁</th><th>组织/期间</th><th>行数</th><th>字节</th><th>摘要</th><th>时间</th></tr></thead>
        <tbody>${log.length ? log.map(x => `<tr>
          <td>${esc(x.exported_by)}</td>
          <td>#${x.org_id} · ${esc(x.period)}</td>
          <td class="num">${x.row_count}</td>
          <td class="num">${x.bytes}</td>
          <td class="sub">${esc(x.sha12)}…</td>
          <td class="sub">${esc(String(x.exported_at).replace('T',' ').slice(0,19))}</td>
        </tr>`).join('') : '<tr><td colspan="6" class="sub">还没有人导过</td></tr>'}</tbody></table>
    </div>`;

  // ★ 导出走 fetch + Blob：凭据在 Authorization 头里，<a href> 带不上它。
  const btn = $('#expRpt');
  if (btn) btn.onclick = () => downloadCsv(
    `/api/report/export.csv?org=${org}&period=${period}`,
    `report_org${org}_${period}.csv`);

  // ---- 多期趋势（146）：单期快照只回答"这个月多少"，不回答"在涨还是在跌" ----
  {
    const months = [];
    const baseD = new Date(period + '-01T00:00:00Z');
    for (let i = 5; i >= 0; i--) {
      const d = new Date(baseD); d.setUTCMonth(d.getUTCMonth() - i);
      months.push(d.toISOString().slice(0, 7));
    }
    const tr = await call(`/api/report/trend?org=${org}`
      + `&from=${months[0]}&to=${months[months.length - 1]}`);
    if (tr.status === 200) {
      const T = tr.body.rows || [];
      const num = (v) => Number(v || 0);
      const maxG = Math.max(...T.map(x => (x.has_data ? num(x.gross) : 0)), 1);
      const money = (n) => num(n).toLocaleString('zh-CN', { maximumFractionDigits: 0 });
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <h2>多期趋势 <span class="sub" style="font-weight:400">
          ${months[0]} ~ ${months[months.length - 1]} · ${T.filter(x => x.has_data).length} 期有数据</span></h2>
        <p class="note">
          单期快照只回答"这个月多少"，不回答"在涨还是在跌"。
          <b>没有数据的月份也出行</b>（灰色、值为 0）：直接跳过会把"没算过"画成
          "掉到 0 又涨回来"，而那条曲线比没有更误导。
          环比 <b>NULL = 上月没数据</b>（算不出），<b>0 = 持平</b> —— 两者不能混。
        </p>
        <table class="stack"><thead><tr>
          <th style="width:96px">期间</th>
          <th class="num" style="width:76px">人数</th>
          <th class="num" style="width:110px">应发合计</th>
          <th style="width:150px">规模</th>
          <th class="num" style="width:110px">环比</th>
          <th class="num" style="width:110px">实发合计</th>
          <th class="num" style="width:104px">社保</th>
          <th class="num" style="width:104px">个税</th>
        </tr></thead><tbody>
          ${T.map(x => {
            const g = x.has_data ? num(x.gross) : 0;
            const w = Math.round(g / maxG * 100);
            const mom = x.gross_mom === null || x.gross_mom === undefined ? null : num(x.gross_mom);
            const pct = x.gross_mom_pct === null || x.gross_mom_pct === undefined ? null : Number(x.gross_mom_pct);
            return `<tr style="${x.has_data ? '' : 'opacity:.55'}">
              <td><b>${esc(x.period)}</b>${x.has_data ? '' : '<div class="sub">无数据</div>'}</td>
              <td class="num" data-label="人数">${x.has_data ? x.headcount : '—'}</td>
              <td class="num" data-label="应发合计">${money(x.gross)}</td>
              <td data-label="规模"><div style="height:10px;border-radius:3px;background:var(--line);overflow:hidden">
                <div style="height:100%;width:${x.has_data ? w : 0}%;background:var(--primary)"></div></div></td>
              <td class="num" data-label="环比">${mom === null
                ? '<span class="sub">—</span>'
                : `<b style="color:${mom > 0 ? 'var(--bad,#b4261d)' : (mom < 0 ? 'var(--ok,#137333)' : 'inherit')}">
                     ${mom > 0 ? '+' : ''}${money(mom)}</b>
                   <div class="sub">${pct === null ? '' : (pct > 0 ? '+' : '') + pct.toFixed(1) + '%'}</div>`}</td>
              <td class="num" data-label="实发合计">${money(x.net)}</td>
              <td class="num sub" data-label="社保">${money(x.si_employee)}</td>
              <td class="num sub" data-label="个税">${money(x.tax)}</td>
            </tr>`;
          }).join('') || '<tr><td colspan="8" class="sub">这段时间没有薪酬数据</td></tr>'}
        </tbody></table>
        ${tr.body.kpi ? `<div class="kv" style="margin-top:10px">
          <span>有数据 <b>${tr.body.kpi.months_with_data
            ?? tr.body.kpi.months ?? T.filter(x => x.has_data).length}</b> 期</span>
          <span>月均应发 <b>${money(tr.body.kpi.avg_gross)}</b></span>
          ${tr.body.kpi.peak ? `<span>最高 <b>${esc(tr.body.kpi.peak.period)}</b>
            ${money(tr.body.kpi.peak.gross)}</span>` : ''}
          ${tr.body.kpi.trough ? `<span>最低 <b>${esc(tr.body.kpi.trough.period)}</b>
            ${money(tr.body.kpi.trough.gross)}</span>` : ''}
        </div>` : ''}`;
      document.querySelector('#view').appendChild(card);
    }
  }
}


const SEV_CN = { high: '需当天处理', medium: '需本周处理', low: '观察' };

// 详情不另开页签：点一行展开在下面。另开页签会把"名单 → 某个人"这条动线拆成两跳。

let empDetailId = Number(new URLSearchParams(location.search).get('emp')) || null;

// ============================================================================
// 组织架构：部门 / 岗位两页，顶部一个滑动分段器切换
// ----------------------------------------------------------------------------
// 数据只有两份（/api/org/tree、/api/positions），差别只在布局：
//   部门 · 树形图  层级与编制（横向 org chart，可折叠、可缩放、可拖动）
//   部门 · 关系网  归属关系（径向图，点节点看人）
//   部门 · 清单    一行一个部门、四列数（编制 / 在编 / 缺编 / 含下级）
//   岗位 · 卡片    按部门分组、一岗一卡、空岗虚线
//   岗位 · 网络    部门 → 岗位 的径向图
//
// ★ "每个帐套自己一套架构"不需要额外逻辑：一帐套一库，org_unit 天然只属于
//   当前帐套。需要的是**不缓存** —— 每次进页面重新取数，切帐套后不会看到
//   上一个帐套的树。所以这里没有 TREE_CACHE，ORGST 每次都被覆盖。
// ============================================================================
const ORG_KIND = { group: '集团', region: '区域', dept: '部门' };
const ORG_HUE = { group: '#1d4ed8', region: '#0ea5e9', dept: '#6366f1' };

// 朝向是"看法"，不是数据：记在本机（有人习惯竖排，有人习惯横排），
// 不进库也不跟帐套走 —— 同一个帐套换个显示器还该是同一个偏好。
const orgOriPref = () => {
  try { return localStorage.getItem('aihr.org.ori') === 'h' ? 'h' : 'v'; } catch { return 'v'; }
};
const ORGST = { rows: [], ps: [], scale: 1, collapsed: new Set(), period: '', ori: orgOriPref(),
  // 手机两层默认用 showStores 记"用户点了展开"。只有一个状态就够了：
  // 折回去的判据始终是"showStores 为假 + 是手机"，不另存一份副本，
  // 免得两份状态走岔（那种 bug 的表现是"按钮说收起了但店还在"）。
  showStores: false };

const orgColor = (k) => ORG_HUE[k] || '#6366f1';
const orgShort = (s, n = 13) => {
  const t = String(s ?? '');
  return t.length > n ? t.slice(0, n) + '…' : t;
};
/** 头像圈里的字：中文取后两字（"张晓明" → "晓明"），西文取首字母 */
const orgInitials = (name) => {
  const s = String(name || '').trim();
  if (!s) return '?';
  // 27px 的圈里放不下两个中文字：中文取末字（"张晓明" → "明"），西文取首字母
  return /[\u4e00-\u9fa5]/.test(s) ? s.slice(-1) : s.slice(0, 1).toUpperCase();
};
const orgHueOf = (s) => {
  let h = 0;
  for (const ch of String(s)) h = (h * 31 + ch.codePointAt(0)) % 360;
  return `hsl(${h}, 56%, 48%)`;
};
const orgGapTxt = (gap) => gap === null ? '<span class="sub">未定编</span>'
  : gap > 0 ? `<b style="color:var(--warn)">缺 ${gap}</b>`
  : gap < 0 ? `<b style="color:var(--bad)">超 ${-gap}</b>`
  : '<span class="sub">满编</span>';

async function viewOrg() {
  const sub = (hashSub() || 'tree').trim();
  const page = sub.startsWith('pos') ? 'pos' : 'dept';
  const mode = page === 'pos'
    ? (sub === 'posnet' ? 'posnet' : 'pos')
    : (['graph', 'list'].includes(sub) ? sub : 'tree');

  // ★ 两个接口并行取：串行时"按岗位"要等两次往返，慢到截图工具会在渲染前
  //   拍下"加载中…"（而数据其实马上就到）。
  const [r, pr] = await Promise.all([call('/api/org/tree'), call('/api/positions')]);
  if (r.status !== 200) return fail(r);
  const rows = r.body.rows || [];
  const ps = (pr.status === 200 ? pr.body.rows : []) || [];

  ORGST.rows = rows; ORGST.ps = ps; ORGST.period = r.body.period || '';
  ORGST.scale = 1; ORGST.centered = false;
  orgTwoLayerDefault();     // 手机首次进入只画两层（集团 + 区域），见函数上方说明
  // ?ori=h 可以覆盖本机偏好：贴链接、截图、培训时"这一屏长什么样"能复现
  const qOri = new URLSearchParams(location.search).get('ori');
  if (qOri === 'h' || qOri === 'v') ORGST.ori = qOri;

  const depts = rows.filter(x => x.kind !== 'group');
  const people = rows.find(x => x.depth === 0)?.subtree ?? 0;
  const quotaSum = depts.reduce((a, x) => a + (x.quota || 0), 0);
  const gapSum = depts.reduce((a, x) => a + Math.max(0, x.gap || 0), 0);
  const noQuota = depts.filter(x => x.quota === null).length;

  const subBtns = page === 'dept'
    ? [['tree', '树形图'], ['graph', '关系网'], ['list', '清单']]
    : [['pos', '岗位卡片'], ['posnet', '岗位网络']];

  const head = `
    <div class="card">
      <div class="org-head">
        <div class="seg" id="orgSeg" style="--n:2;--i:${page === 'pos' ? 1 : 0}">
          <div class="thumb"></div>
          <button data-page="dept" class="${page === 'dept' ? 'on' : ''}">部门架构<span class="cnt">${depts.length}</span></button>
          <button data-page="pos" class="${page === 'pos' ? 'on' : ''}">岗位架构<span class="cnt">${ps.length}</span></button>
        </div>
        <div class="subseg" id="orgSub">
          ${subBtns.map(([k, n]) => `<button data-sub="${k}" class="${mode === k ? 'on' : ''}">${n}</button>`).join('')}
        </div>
        <span style="flex:1"></span>
        <div class="kv" style="margin:0">
          <span>在册 <b>${people}</b> 人</span>
          <span>定编 <b>${quotaSum || '—'}</b></span>
          <span>${gapSum ? `缺编 <b style="color:var(--warn)">${gapSum}</b>` : '编制 <b>状态正常</b>'}</span>
          <span>期间 <b>${esc(r.body.period)}</b></span>
          ${page === 'dept' ? `<button class="ghost" id="orgAddBtn"${
            ME && ME.can_org_write === false
              ? ' disabled title="需要建帐写权限：组织结构是帐套级结构，普通 HR 只能看"'
              : ''}>＋ 新增部门</button>` : ''}
        </div>
      </div>
      ${page === 'dept' ? `<div id="orgAddBox" hidden
          style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">
        <div class="form">
          <label>上级
            <select id="orgNewParent">
              ${rows.map(x => `<option value="${x.id}" ${x.parent_id === null ? 'selected' : ''}>${
                '　'.repeat(x.depth)}${esc(x.name)}</option>`).join('')}
            </select>
          </label>
          <label>名称<input id="orgNewName" placeholder="如：望京店 / 销售部" style="width:200px"></label>
          <label>类型<select id="orgNewKind">
            <option value="dept">部门</option><option value="region">区域</option></select></label>
          <button id="orgAddSave">添加</button>
          <span class="sub" style="align-self:center">加完直接进树；定编点节点卡片</span>
        </div>
        <p class="sub" style="margin:6px 0 0">新部门只落在<b>当前帐套</b>（一帐套一库），
          别的帐套看不到它 —— 这就是"各自帐套的组织架构"。</p>
      </div>` : ''}
    </div>`;

  let body = '';
  if (page === 'dept' && mode === 'graph') body = orgGraphCard(rows);
  else if (page === 'dept' && mode === 'list') body = orgListCard(rows, noQuota);
  else if (page === 'dept') body = orgTreeCard(rows, noQuota);
  else if (mode === 'posnet') body = orgPosNetCard(ps, rows);
  else body = orgPosCard(ps);

  $('#view').innerHTML = head + body;

  document.querySelectorAll('#orgSeg button').forEach(b => {
    b.onclick = () => {
      location.hash = b.dataset.page === 'pos' ? '#org/pos' : '#org/tree';
      viewOrg();
    };
  });
  document.querySelectorAll('#orgSub button').forEach(b => {
    b.onclick = () => { location.hash = '#org/' + b.dataset.sub; viewOrg(); };
  });

  if (page === 'dept' && mode === 'tree') { paintOrgTree(); bindZoom(); }
  else if (page === 'dept' && mode === 'graph') { bindRadial(); bindZoom(); }
  else if (page === 'pos' && mode === 'posnet') { bindRadial(); bindZoom(); }
  else if (page === 'dept') bindOrgList();
  bindOrgAdd();
}

      <span class="lgd"><i style="background:#6366f1"></i>部门</span>
      <span>缺编 = <b>编制 − 在编</b>，负数即超编；"未定编"是<b>没设</b>，不是 0。
      ${noQuota ? `当前 <b>${noQuota}</b> 个部门未定编。` : ''}
